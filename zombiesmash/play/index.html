// ============================================================
// 효과음: 소리 파일 없이 Web Audio로 합성. 공용 모듈 NcqSound의 context()·output("sfx")에 이어서
// 켬·끔·음량·화면 가려지면 멈춤이 그대로 적용돼요
// ============================================================
const SFX = (() => {
  let ctxRef = null, bus = null, noiseBuf = null;
  const last = {};
  function ready() {
    const S = window.NcqSound; if (!S) return null;
    const c = S.context(); if (!c || c.state !== 'running') return null;
    if (c !== ctxRef) {
      ctxRef = c; noiseBuf = null;
      const out = S.output('sfx'); if (!out) return null;
      bus = c.createDynamicsCompressor();   // 여러 소리가 겹쳐도 찢어지지 않게
      bus.threshold.value = -14; bus.ratio.value = 6; bus.attack.value = 0.002; bus.release.value = 0.12;
      bus.connect(out);
    }
    return c;
  }
  function gap(key, ms) { const n = performance.now(); if (last[key] && n - last[key] < ms) return false; last[key] = n; return true; }
  function noise(c) {
    if (!noiseBuf) { noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    return noiseBuf;
  }
  function env(c, peak, dur, delay, attack = 0.004) {
    const g = c.createGain(), t = c.currentTime + delay;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + attack + dur);
    g.connect(bus); return { g, t };
  }
  function tone(c, type, f0, f1, dur, vol, delay = 0) {
    const { g, t } = env(c, vol, dur, delay);
    const o = c.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    o.connect(g); o.start(t); o.stop(t + dur + 0.05);
  }
  function hiss(c, ftype, f0, f1, dur, vol, delay = 0, q = 0.8) {
    const { g, t } = env(c, vol, dur, delay);
    const s = c.createBufferSource(); s.buffer = noise(c); s.playbackRate.value = rand(0.8, 1.2);
    const f = c.createBiquadFilter(); f.type = ftype; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    s.connect(f); f.connect(g); s.start(t, rand(0, 0.5)); s.stop(t + dur + 0.05);
  }
  // 무기 속성별 맞는 소리
  const HIT = {
    blunt: (c, v) => { tone(c, 'sine', 150, 42, 0.2, 0.9 * v); hiss(c, 'lowpass', 2200, 260, 0.09, 0.7 * v); },            // 퍽 (묵직)
    cut:   (c, v) => { hiss(c, 'highpass', 2500, 7000, 0.11, 0.55 * v); tone(c, 'triangle', 1300, 380, 0.07, 0.25 * v); hiss(c, 'lowpass', 900, 200, 0.12, 0.4 * v, 0.03); },  // 서걱
    fire:  (c, v) => { tone(c, 'triangle', 2600, 1900, 0.05, 0.25 * v); hiss(c, 'bandpass', 700, 260, 0.4, 0.55 * v, 0.03, 0.6); },   // 쨍그랑 + 화르륵
    boom:  (c, v) => { tone(c, 'sine', 95, 28, 0.55, 1.0 * v); hiss(c, 'lowpass', 1600, 70, 0.6, 0.9 * v); },               // 쾅
    ice:   (c, v) => { tone(c, 'sine', 1700, 2600, 0.12, 0.25 * v); hiss(c, 'highpass', 5000, 9000, 0.14, 0.3 * v); },      // 쩡
    elec:  (c, v) => { tone(c, 'sawtooth', 110, 80, 0.26, 0.3 * v); hiss(c, 'bandpass', 3000, 1200, 0.22, 0.35 * v, 0, 2); },  // 지직
  };
  const play = fn => { const c = ready(); if (c) try { fn(c); } catch (e) {} };
  return {
    swing(el) { play(c => { if (!gap('sw', 40)) return; if (['blunt', 'cut', 'elec'].includes(el)) hiss(c, 'bandpass', 600, 2400, 0.13, 0.25, 0, 1.2); else hiss(c, 'bandpass', 900, 1500, 0.16, 0.12, 0, 1.5); }); },
    hit(el, kind, primary) {
      play(c => {
        if (!gap('hit' + el + primary, primary ? 20 : 45)) return;
        const v = primary ? 1 : 0.45;
        if (kind === 'resist' && primary) {   // 튕김: 둔한 쇳소리
          tone(c, 'square', 520, 480, 0.06, 0.12); tone(c, 'square', 790, 760, 0.05, 0.08, 0.01); hiss(c, 'lowpass', 600, 300, 0.05, 0.25);
          return;
        }
        HIT[el](c, kind === 'resist' ? v * 0.5 : v);
        if (kind === 'weak' && primary) {     // 약점: 아래로 꽝 + 금 가는 소리
          tone(c, 'sine', 75, 32, 0.35, 1.0); hiss(c, 'highpass', 1800, 900, 0.18, 0.5, 0.02); tone(c, 'triangle', 880, 1320, 0.12, 0.18, 0.06);
        }
      });
    },
    kill(el) {
      play(c => {
        if (!gap('kill', 35)) return;
        hiss(c, 'lowpass', 1300, 180, 0.16, 0.55);           // 철퍽
        if (el === 'ice') { for (let k = 0; k < 4; k++) tone(c, 'sine', rand(2200, 4200), rand(1800, 3000), 0.09, 0.12, k * 0.025); }
        if (el === 'blunt') tone(c, 'sine', 110, 40, 0.16, 0.5);
      });
    },
    crumble() { play(c => { for (let k = 0; k < 6; k++) tone(c, 'square', rand(300, 700), rand(150, 300), 0.04, 0.08, k * 0.035); }); },   // 와르르
    combo(n) { play(c => { const f = 520 * Math.pow(1.122, n); tone(c, 'triangle', f, f, 0.1, 0.18); tone(c, 'triangle', f * 1.5, f * 1.5, 0.12, 0.12, 0.05); }); },
    link() { play(c => { tone(c, 'sawtooth', 220, 880, 0.25, 0.2); hiss(c, 'highpass', 1500, 6000, 0.3, 0.3); }); },   // 연계
    refund() { play(c => { tone(c, 'sine', 880, 880, 0.08, 0.25); tone(c, 'sine', 1320, 1320, 0.12, 0.22, 0.07); }); },
    select() { play(c => { if (gap('sel', 60)) tone(c, 'triangle', 660, 640, 0.04, 0.12); }); },
    hurt() { play(c => { if (gap('hurt', 70)) { tone(c, 'sine', 120, 60, 0.18, 0.6); hiss(c, 'lowpass', 700, 200, 0.12, 0.35); } }); },
    clear() { play(c => { [523, 659, 784, 1047].forEach((f, i) => tone(c, 'triangle', f, f, 0.16, 0.2, i * 0.08)); }); },
    thunder() { play(c => { if (!gap('thunder', 300)) return; hiss(c, 'lowpass', 900, 60, 1.3, 0.9); tone(c, 'sine', 55, 28, 1.1, 0.7, 0.05); hiss(c, 'highpass', 2500, 1200, 0.12, 0.5); }); },
    lose() { play(c => { [392, 330, 262].forEach((f, i) => tone(c, 'triangle', f, f * 0.97, 0.25, 0.2, i * 0.16)); }); },
  };
})();

// 화면 후처리: 빛 번짐(블룸) + 색 보정(ACES) + 채도 + 가장자리 어둡게
// 장면을 HDR로 그린 뒤 밝은 부분만 뽑아 흐리게 퍼뜨려 더해요. WebGL2가 안 되는 기기는 끄고 바로 그려요
// ============================================================
const FX = (() => {
  if (!renderer.capabilities.isWebGL2) return null;
  const mk = (samples) => new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples, depthBuffer: samples > 0 });
  const main = mk(4), h1 = mk(0), h2 = mk(0), q1 = mk(0), q2 = mk(0);
  const qs = new THREE.Scene(), qc = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2)); quad.frustumCulled = false; qs.add(quad);
  const VS = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
  const sm = (uniforms, fs) => new THREE.ShaderMaterial({ uniforms, vertexShader: VS, fragmentShader: fs, depthTest: false, depthWrite: false, toneMapped: false });
  const bright = sm({ t: { value: null }, th: { value: 0.9 } }, `uniform sampler2D t; uniform float th; varying vec2 vUv;
    void main(){ vec3 c = texture2D(t, vUv).rgb; float l = dot(c, vec3(0.2126, 0.7152, 0.0722)); gl_FragColor = vec4(c * smoothstep(th, th + 0.6, l), 1.0); }`);
  const blur = sm({ t: { value: null }, dir: { value: new THREE.Vector2() } }, `uniform sampler2D t; uniform vec2 dir; varying vec2 vUv;
    void main(){ vec3 s = texture2D(t, vUv).rgb * 0.227027;
      s += (texture2D(t, vUv + dir * 1.3846).rgb + texture2D(t, vUv - dir * 1.3846).rgb) * 0.316216;
      s += (texture2D(t, vUv + dir * 3.2308).rgb + texture2D(t, vUv - dir * 3.2308).rgb) * 0.070270;
      gl_FragColor = vec4(s, 1.0); }`);
  const comp = sm({ tMain: { value: main.texture }, tB1: { value: h1.texture }, tB2: { value: q2.texture }, strength: { value: 0.9 }, exposure: { value: 1 } },
    `uniform sampler2D tMain, tB1, tB2; uniform float strength, exposure; varying vec2 vUv;
    vec3 RRTAndODTFit(vec3 v){ vec3 a = v * (v + 0.0245786) - 0.000090537; vec3 b = v * (0.983729 * v + 0.4329510) + 0.238081; return a / b; }
    vec3 aces(vec3 c){
      const mat3 I = mat3(vec3(0.59719, 0.07600, 0.02840), vec3(0.35458, 0.90834, 0.13383), vec3(0.04823, 0.01566, 0.83777));
      const mat3 O = mat3(vec3(1.60475, -0.10208, -0.00327), vec3(-0.53108, 1.10813, -0.07276), vec3(-0.07367, -0.00605, 1.07602));
      c *= exposure / 0.6; c = I * c; c = RRTAndODTFit(c); c = O * c; return clamp(c, 0.0, 1.0); }
    vec3 toSRGB(vec3 c){ return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(vec3(0.0031308), c)); }
    void main(){
      vec3 c = texture2D(tMain, vUv).rgb + (texture2D(tB1, vUv).rgb * 0.55 + texture2D(tB2, vUv).rgb * 0.8) * strength;
      c = aces(c);
      float l = dot(c, vec3(0.2126, 0.7152, 0.0722)); c = max(mix(vec3(l), c, 1.15), 0.0);   // 채도 조금 올림
      vec2 d = vUv - 0.5; c *= 1.0 - dot(d, d) * 0.55;                                         // 가장자리 어둡게
      gl_FragColor = vec4(toSRGB(c), 1.0); }`);
  const pass = (mat, target) => { quad.material = mat; renderer.setRenderTarget(target); renderer.render(qs, qc); };
  let hw = 1, hh = 1, qw = 1, qh = 1;
  return {
    setSize(w, h) {
      main.setSize(w, h); hw = Math.max(1, w >> 1); hh = Math.max(1, h >> 1); qw = Math.max(1, w >> 2); qh = Math.max(1, h >> 2);
      h1.setSize(hw, hh); h2.setSize(hw, hh); q1.setSize(qw, qh); q2.setSize(qw, qh);
    },
    render() {
      renderer.setRenderTarget(main); renderer.render(scene, camera);
      bright.uniforms.t.value = main.texture; pass(bright, h1);
      blur.uniforms.t.value = h1.texture; blur.uniforms.dir.value.set(1 / hw, 0); pass(blur, h2);
      blur.uniforms.t.value = h2.texture; blur.uniforms.dir.value.set(0, 1 / hh); pass(blur, h1);
      blur.uniforms.t.value = h1.texture; blur.uniforms.dir.value.set(2 / hw, 0); pass(blur, q1);   // 1/4 크기로 줄이며 넓게
      blur.uniforms.t.value = q1.texture; blur.uniforms.dir.value.set(0, 1 / qh); pass(blur, q2);
      comp.uniforms.exposure.value = exposure; pass(comp, null);
    },
  };
})();

    // 장 보스: 장마다 고유 패턴. 정육점 주인은 들고 있는 무기 속성들이 턴마다 차례로 약점이 됨
    const type = { 1: 'bigfat', 2: 'butcher', 3: 'firelord' }[ch];
    const bossHp = Math.round(CFG.rowHpBase * (1 + CFG.rowHpGrowth * (r - 1)) * 0.8 * hpMul * threatMul('bossHp'));
    slots[2] = minion();
    slots[3] = makeZombie(type, bossHp, 0, Math.round(ZT[type].atk * atkMul), type === 'butcher' ? { weakSeq: shuffle(myEls.slice()), weakMode: 'turn' } : {});
    slots[4] = minion();
    applyRowTraits(); return;
  }
  if (r === CFG.midRow) {
    // 중간 보스
    const type = { 1: 'mailman', 2: 'coldman', 3: 'tow' }[ch];
    const midHp = Math.round(CFG.rowHpBase * (1 + CFG.rowHpGrowth * (r - 1)) * 0.9 * hpMul * threatMul('eliteHp'));
    slots[1] = minion(); slots[5] = minion();
    slots[3] = makeZombie(type, midHp, 0, Math.round(ZT[type].atk * atkMul));
    if (type === 'coldman') slots[3].iceShield = true;

  }
  let count = r <= 3 ? randi(3, 4) : r <= 7 ? randi(5, 6) : 7;
  if (elite) count = r === 4 ? 4 : 6;
  const types = [];
  const holds = el => myEls.includes(el);
  const ownsWeapon = el => save.owned.includes(EL_WEAPON[el]);
  for (let i = 0; i < count; i++) {
    let t = pick(pool);
    if (elite && Math.random() < 0.5) { const sp = pool.filter(x => ZT[x].weak); if (sp.length) t = pick(sp); }

  if (r >= 4 && !elite && Math.random() < 0.6) {
    const want = [...new Set(pool)].filter(t => ZT[t].weak && ownsWeapon(ZT[t].weak) && !holds(ZT[t].weak));
    if (want.length) types[randi(0, types.length - 1)] = pick(want);
  }
  // 정예 줄: 가운데에 정예 좀비 (첫 약점은 도끼로 갑옷 벗기기, 도끼가 없으면 들고 있는 무기 중 하나)
  let eliteSeq = null;
  if (elite) {
    types[Math.floor(types.length / 2)] = 'brute';

    const rest = myEls.filter(e => e !== first);
    eliteSeq = [first, rest.length ? pick(rest) : first];
  }
  const baseSum = types.reduce((s, t) => s + ZT[t].hp, 0);
  const target = CFG.rowHpBase * (1 + CFG.rowHpGrowth * (r - 1)) * (elite ? CFG.eliteHpMul * threatMul('eliteHp') : 1) * hpMul;
  const k = target / baseSum;
  const start = randi(0, CFG.slots - count);
  const goldIdx = !elite && Math.random() < CFG.goldChance ? randi(0, count - 1) : -1;
  types.forEach((t, i) => {
    slots[start + i] = makeZombie(t, Math.max(5, Math.round(ZT[t].hp * k)), 0, Math.max(1, Math.round(ZT[t].atk * atkMul)),
      { gold: i === goldIdx, ...(t === 'brute' ? { weakSeq: eliteSeq, weakMode: 'peel' } : {}) });
  });

}

// ------------------------------------------------------------ 좀비의 다음 행동

function effAtk(z, i) { let a = z.atk; for (const n of [i - 1, i + 1]) { const y = alive(n); if (y && y.type === 'flag') a += CFG.flagAtk; } return a; }

const emptySlots = () => { const e = []; for (let i = 0; i < CFG.slots; i++) if (!alive(i)) e.push(i); return e; };

// ============================================================
// 무기 사용과 피해 처리

const STEP = 0.13;

function weaponDamage(w) {

// 탭 한 번 = 골라 둔 무기로 한 번 때림

  // 상태 연계 (먼저 건 상태 + 맞는 무기)
  const link = linkOf(w, tz);
  const crit = Math.random() < CFG.critChance + (has('rabbit') ? 0.1 : 0) || link === '산산조각 연계!';
  const amt = base * primaryMul(w) * (crit ? CFG.critMul : 1);
  const P = { slot: target, amt, el: W.el, depth: 0, primary: true, crit, w: w.id };
  const tier = wTier(w.id), fin = isFinal(w);
  if (w.id === 'kick' && wCost(w) === 0) run.freeKick = true;
  const aliveIdx = () => slots.map((z, i) => i).filter(i => alive(i));
  // 기름 장갑: 불붙은 좀비를 치면 양옆에 작은 폭발
  if (has('glove') && tz.burn) for (const n of [target - 1, target + 1]) q.push({ slot: n, amt: 8, el: 'boom', depth: 1 });

  if (w.id === 'bat') {
    // Lv3: 한 칸 더 굴러감, Lv7·진화: 줄 끝까지, 최종: 끝에서 튕겨 돌아오며 두 번씩 치고 넘어뜨림
    const dir = nextAliveFrom(target, 1) >= 0 ? 1 : -1;
    P.bowl = { dir, amt: base * (w.evo ? 0.6 : 0.5), extra: (brA(w) ? 1 : 0) + (has('chain') ? 1 : 0) + (tier >= 1 ? 1 : 0), evo: w.evo || tier >= 2, bounce: fin, stun: fin };
    if (fin) P.stun = 1;
    q.push(P);
  } else if (w.id === 'axe') {
    // Lv3: 관통 +1칸, Lv7·진화: 줄 전체, 최종: 줄 전체를 두 번 베고 상처
    q.push(P);
    if (fin) { P.wound = true; for (let pass = 0; pass < 2; pass++) for (const i of aliveIdx()) if (pass || i !== target) q.push({ slot: i, amt: base * 0.7, el: 'cut', depth: pass * CFG.slots + Math.abs(i - target), wound: true }); }
    else if (w.evo || tier >= 2) { for (let i = 0; i < CFG.slots; i++) if (i !== target && alive(i)) q.push({ slot: i, amt: base * (w.evo ? 0.7 : 0.6), el: 'cut', depth: Math.abs(i - target) }); }
    else { const n = (brA(w) ? 2 : 1) + tier; for (let i = 1; i <= n; i++) q.push({ slot: target + i, amt: base * 0.6, el: 'cut', depth: i }); }
  } else if (w.id === 'molotov') {
    // Lv3: 양옆 불, 최종: 줄 전체 불 (화상은 최대 체력 %)
    P.ignite = true; q.push(P);
    const rad = fin ? CFG.slots : (tier >= 1 ? 1 : 0) + (brA(w) ? 1 : 0);
    for (let k = 1; k <= rad; k++) for (const n of [target - k, target + k]) if (alive(n)) q.push({ slot: n, amt: fin ? base * 0.4 : 0, el: 'fire', depth: k, ignite: true });
    if (link === '대폭발!') { P.bigBoom = true; for (const n of [target - 1, target + 1]) q.push({ slot: n, amt: CFG.oilBlastDmg, el: 'boom', depth: 1, ignite: true }); }
  } else if (w.id === 'grenade') {
    const shrapnel = link === '불꽃 파편!';   // 불붙은 좀비를 터뜨리면 불붙은 파편이 한 칸 더 멀리, 맞은 좀비는 모두 불붙음
    // Lv3: 폭발 범위 +1칸, Lv7: 2개, 진화: 3개, 최종: 3개 + 파편 (겹친 좀비는 여러 번 맞음)
    const blast = (s, d) => {
      q.push({ ...P, slot: s, depth: d, primary: d === 0, ignite: shrapnel, shred: fin });
      const rad = 1 + (tier >= 1 ? 1 : 0) + (brA(w) ? 1 : 0) + (shrapnel ? 1 : 0);
      for (let k = 1; k <= rad; k++) for (const n of [s - k, s + k]) q.push({ slot: n, amt: W.splash * (base / W.dmg), el: 'boom', depth: d, ignite: shrapnel, shred: fin });
    };
    blast(target, 0);
    const extra = w.evo ? 2 : tier >= 2 ? 1 : 0;
    const others = shuffle(aliveIdx().filter(i => i !== target));
    for (let k = 0; k < extra; k++) { const s = others.length ? others[k % others.length] : target; blast(s, k + 1); weaponFx(w, s, true); }
  } else if (w.id === 'freezer') {
    // Lv3: 양옆 1턴, Lv7: 얼리는 턴 +1, 최종: 줄 전체 얼림
    P.freeze = W.freeze + (brB(w) ? 1 : 0) + (tier >= 2 ? 1 : 0); q.push(P);
    const rad = fin ? CFG.slots : (tier >= 1 ? 1 : 0) + (brA(w) ? 1 : 0);
    for (let k = 1; k <= rad; k++) for (const n of [target - k, target + k]) if (alive(n)) q.push({ slot: n, amt: fin ? base * 0.5 : 0, el: 'ice', depth: k, freeze: fin ? P.freeze : 1 });
  } else if (w.id === 'baton' && fin) {
    // 최종 낙뢰: 고른 좀비에서 붙어 있는 모두에게 옮겨 가고, 번개 2줄기가 무작위 좀비에 더 떨어짐. 맞으면 감전 (1턴 못 움직임, 전기 피해 +25%씩)
    P.zap = true; P.stun = 1; q.push(P);
    for (let i = 0; i < CFG.slots; i++) if (i !== target && alive(i)) q.push({ slot: i, amt: base * (link ? 1 : 0.8), el: 'elec', depth: Math.abs(i - target), arc: i + (i < target ? 1 : -1), zap: true, stun: 1 });
    shuffle(aliveIdx()).slice(0, 2).forEach((s, k) => { q.push({ slot: s, amt: base, el: 'elec', depth: CFG.slots + k, zap: true, stun: 1 }); at(hitBase + (CFG.slots + k) * STEP, () => { const z = slots[s]; if (z) addBolt(slotX(s), zTop(z)); }); });
  } else if (w.id === 'baton' && link) {
    // 젖은 좀비에 전기: 줄 전체로 번개
    q.push(P);
    for (let i = 0; i < CFG.slots; i++) if (i !== target && alive(i)) q.push({ slot: i, amt: base * CFG.wetShockMul, el: 'elec', depth: Math.abs(i - target), arc: i + (i < target ? 1 : -1) });
  } else if (w.id === 'baton') {
    q.push(P);
    const maxJ = w.evo || has('overload') || wTier(w.id) >= 2 ? 99 : (brA(w) ? 3 : 2) + (wTier(w.id) >= 1 ? 1 : 0);
    const ok = z => w.evo || z.wet || z.type === 'armor';
    const visited = new Set([target]);
    let frontier = [target];
    for (let j = 1; j <= maxJ && frontier.length; j++) {
      const next = [];
      for (const s of frontier) for (const n of [s - 1, s + 1]) {
        const z = alive(n);
        if (z && !visited.has(n) && ok(z)) { visited.add(n); next.push(n); q.push({ slot: n, amt: base, el: 'elec', depth: j, arc: s }); }
      }
      frontier = next;
    }
  }
  else if (w.id === 'kick') {
    // Lv3: 2연타, Lv7: 3연타 (갈래 A +1), 진화: 양옆도, 최종: 3연타 + 마지막에 날려 보내 옆 좀비와 부딪힘
    q.push(P);
    const hits = (fin ? 3 : 1 + tier) + (brA(w) ? 1 : 0);
    for (let k = 1; k < hits; k++) q.push({ slot: target, amt: base * 0.5, el: 'blunt', depth: k });
    if (w.evo) for (const n of [target - 1, target + 1]) q.push({ slot: n, amt: base * 0.7, el: 'blunt', depth: 1 });
    if (fin) { const d = nextAliveFrom(target, 1) >= 0 ? 1 : -1, n = nextAliveFrom(target, d); if (n >= 0) { q.push({ slot: target, amt: base * 0.5, el: 'blunt', depth: hits, knock: d }); q.push({ slot: n, amt: base * 0.8, el: 'blunt', depth: hits + 1, stun: 1 }); } }
  }
  else q.push(P);
  if (crit) for (const n of [target - 1, target + 1]) q.push({ slot: n, amt: CFG.critSplash, el: W.el, depth: 1 });

  weaponFx(w, target);
  SFX.swing(W.el);
  const tx = slotX(target), ttop = zTop(tz);
  if (combo > 0) at(hitBase, () => { addText(tx + 0.35, ttop + 1.05, `${combo + 1}콤보`, '#7fd3ff', 1.0 + combo * 0.1); SFX.combo(combo); });
  if (link && !save.codex.links.includes(link)) save.codex.links.push(link);
  if (link === '대폭발!' || link === '불꽃 파편!') save.prog.fireLinks = (save.prog.fireLinks || 0) + 1;   // 요리사 해금 조건
  if (link) at(hitBase, () => {
    addText(tx, ttop + 1.8, link, '#ffb347', 1.5); SFX.link(); buzz('heavy');
    hitStopUntil = performance.now() + 200; shake = Math.max(shake, 0.25); punch = Math.max(punch, 0.5); whiteFlash = Math.max(whiteFlash, 0.15);
    if (P.bigBoom) boomParticles(tx, 0.6, 1.6);
    if (link === '불꽃 파편!') for (let k = 0; k < 40; k++) addParticle(tx, 0.6, 0.2, rand(-6, 6), rand(1, 5), rand(-1, 3), rand(0.04, 0.09), pick([0xff9a3d, 0xffcf3d, 0xff5a1f]), rand(0.4, 0.9), -6);
  });
  processQueue(q, ctx);

  // 행동 끝: 불붙음 피해. 최종 불바다는 최대 체력 %로, 오래 탈수록 커짐 (1턴 3% → 5턴 15%, 보스는 절반)
  const burnQ = [];
  const bd = has('hotter') ? CFG.burnDmgHot : CFG.burnDmg, pctBurn = finalIn('molotov');
  slots.forEach((z, i) => { if (z && !z.dead && z.burn) burnQ.push({ slot: i, amt: bd + (pctBurn ? z.maxHp * 0.03 * Math.min(5, z.burnT || 1) * (isBoss(z) ? 0.5 : 1) : 0), el: 'fire', depth: ctx.maxDepth + 1, tick: true }); });
  processQueue(burnQ, ctx);
  run.stats.bestAction = Math.max(run.stats.bestAction || 0, ctx.dmg || 0);   // 한 번에 준 피해 (시험 장 결과에 보여 줌)

  if (ctx.kills >= 3) {
    const t = ctx.firstKillT != null ? ctx.firstKillT : gt;
    const k = ctx.kills;
    at(t - gt, () => { timeScale = 0.3; slowUntilReal = performance.now() + 700; showBig(`${k}마리 연쇄!`); });
  }
  lockUntil = gt + hitBase + (ctx.maxDepth + 1) * STEP + 0.4;
  run.stats.maxChain = Math.max(run.stats.maxChain, ctx.kills);
  // 약점으로 처치하면 행동을 돌려받음 (턴당 최대 maxRefund번)
  if (ctx.weakKill && run.refunds < maxRefund()) {
    run.refunds++; run.actionsLeft++;
    at(hitBase + 0.15, () => { addText(tx, ttop + 0.4, '행동 +1', '#7be07b', 1.3); SFX.refund(); updateHUD(); });
  }
  hitBase = 0;
  afterAction();
  return true;
}

function processQueue(q, ctx) {
  let guard = 0;
  while (q.length && guard++ < 600) {
    const h = q.shift();
    const z = alive(h.slot);
    if (z) applyHit(z, h, q, ctx);
  }
}

function applyHit(z, h, q, ctx) {
  const el = h.el;
  let amt = h.amt;
  // 약점 2배·튕김 절반·상태 배율·방패 좀비 옆 절반
  const M = dmgMul(el, z, h.slot);
  const blocked = M.blocked && amt > 0;
  const weak = M.weak && amt > 0 && !blocked, resist = M.resist && amt > 0 && !blocked, guarded = M.guarded && amt > 0;
  // 냉동 창고 좀비: 불에 맞으면 얼음 방패가 녹고 2턴 동안 그대로 맞음
  let special = null;
  const hp0 = z.hp;   // 체력바: 이 타격으로 깎인 만큼만 보여 줄 때 빼요 (보여 주는 순서가 계산 순서와 달라도 늘 줄기만)
  if (z.iceShield && el === 'fire' && amt > 0) { z.iceShield = false; z.shieldT = 2; special = '얼음 녹음!'; }
  // 거대 뚱보: 부푼 동안 불에 맞으면 김이 빠져 터지지 않고 크게 다침
  if (z.type === 'bigfat' && z.swelling && el === 'fire' && amt > 0) { z.swelling = false; z.deflated = true; z.hp -= Math.round(z.maxHp * 0.12); special = '김 빠짐!'; }
  amt *= M.m;
  amt = blocked ? 0 : Math.max(resist ? 1 : 0, Math.round(amt));
  if (blocked && h.primary) special = '불이 안 통함';
  if (M.iced && h.primary && amt > 0) special = '얼음에 막힘 (불로 녹이기)';
  const hpBefore = z.hp;
  z.hp -= amt;
  ctx.dmg = (ctx.dmg || 0) + amt; run.stats.maxHit = Math.max(run.stats.maxHit || 0, amt);
  if (amt > 0) {   // 최종 형태가 남기는 약화 (다음 맞을 때부터 적용)
    if (h.shred) z.shred = Math.min(5, (z.shred || 0) + 1);
    if (h.wound) z.wound = Math.min(3, (z.wound || 0) + 1);
    if (h.zap) z.zap = Math.min(4, (z.zap || 0) + 1);
    if (h.stun && z.hp > 0) z.stun = Math.max(z.stun || 0, h.stun);
  }
  // 최종 절대영도: 얼린 좀비를 타격으로 치면 얼음이 깨지며 최대 체력 15% (보스 7%), 붙어 있는 얼린 좀비도 같이 깨짐
  if (z.frozen > 0 && finalIn('freezer') && (el === 'blunt' || h.iceBreak) && !h.tick && z.hp > 0) {
    z.frozen = 0;
    q.push({ slot: h.slot, amt: z.maxHp * (isBoss(z) ? 0.07 : 0.15), el: 'ice', depth: h.depth + 1, iceShatter: true });
    for (const n of [h.slot - 1, h.slot + 1]) { const y = alive(n); if (y && y.frozen > 0) q.push({ slot: n, amt: 0, el: 'blunt', depth: h.depth + 1, iceBreak: true }); }
  }
  z.lastWeak = weak;
  if (h.primary && weak && z.hp <= 0) ctx.weakKill = true;
  // 약점이 바뀌는 좀비: 정예는 첫 약점을 맞으면 갑옷이 벗겨지고 다음 약점으로, 보스는 맞을 때마다 다음 약점으로
  let stageMsg = null;
  if (weak && !h.tick && z.hp > 0 && z.weakSeq) {
    if (z.weakMode === 'peel' && z.stage === 0) { z.stage = 1; z.weak = z.weakSeq[1]; stageMsg = '갑옷 벗겨짐!'; }
    else if (z.weakMode === 'cycle' && z.weakSeq.length > 1) { z.stage = (z.stage + 1) % z.weakSeq.length; z.weak = z.weakSeq[z.stage]; stageMsg = '약점이 바뀜!'; }
  }
  // 맞을 때 반응: 크게 맞으면 팔·머리가 떨어져 나감
  const limb = amt > 0 && !h.tick && z.hp > 0 && (weak || amt >= hpBefore * CFG.limbHit || amt >= z.maxHp * CFG.limbHit);
  const overkill = z.hp < 0 ? -z.hp : 0;
  const d = h.depth;
  ctx.maxDepth = Math.max(ctx.maxDepth, d);
  if (h.ignite && !z.wet && !ZT[z.type].fireproof) { if (!z.burn) z.burnT = 1; z.burn = true; }
  if (el === 'boom' && has('ember') && !z.wet && !ZT[z.type].fireproof) z.burn = true;
  if (h.freeze) {
    // 폭염이면 1턴만, 눈이면 +1턴 (털모자 +1턴 더)
    const f = curW() === 'heat' ? 1 : h.freeze + (curW() === 'snow' ? 1 + (has('earmuff') ? 1 : 0) : 0);
    z.frozen = Math.max(z.frozen, f);
    if (has('coolant')) { z.wet = true; z.burn = false; }   // 냉각수: 얼리면 젖음
  }
  if (el === 'cut' && has('halve') && z.hp > 0 && z.hp <= z.maxHp * 0.3 && !isBoss(z)) z.hp = 0;
  if (h.crit) z.crit = true;
  if (h.bowl) z.knockDir = h.bowl.dir;

  const slot = h.slot, lost = hp0 - z.hp;
  // 배율 표시: 주 대상은 이유(🎯약점×2 · 🛢️기름×2)와 합친 배율(×4)을 크게, 옆으로 번진 피해는 숫자 옆에 작게
  const mulParts = h.crit ? [...M.parts, { ic: '💥', nm: '산산조각', m: CFG.critMul }] : M.parts;
  const showMul = amt > 0 && !h.tick && h.primary && mulParts.length > 0;
  at(hitBase + d * STEP, () => {
    const x = slotX(slot), top = zTop(z), F = FEEL[el];
    const big = h.primary || h.bowl;
    z.hitFlash = 1; z.recoil = (h.primary ? 1 : 0.6) * (weak ? 1.6 : resist ? 0.35 : 1) * F.kb; z.shownHp = Math.max(0, z.shownHp - lost);
    if (amt > 0) addText(x + rand(-0.1, 0.1), top + 0.35, String(amt), weak ? '#ffd34d' : resist ? '#9a9a9a' : EL_COLOR[el],
      h.tick ? 0.8 : weak && h.primary ? 1.9 : h.crit ? 1.6 : resist ? 0.85 : 1.15);
    if (showMul) mulPop(x, top, mulParts);
    else if (amt > 0 && !h.tick && M.m >= 1.5) addText(x + 0.3, top + 0.5, fmtMul(M.m), M.m >= 2 ? '#ff6b6b' : '#ffb347', 0.85);
    if (h.crit) { if (!showMul) addText(x, top + (weak ? 1.15 : 0.75), '산산조각!', '#ffd34d', 1.2); whiteFlash = Math.max(whiteFlash, 0.12); }
    // 약점 타격: 길게 멈추고, 크게 흔들고, 카메라가 확 들어감
    if (weak && !h.tick) {
      if (!showMul) addText(x, top + 0.75, '약점!', '#ff4d4d', h.primary ? 1.6 : 1.0);
      hitParticles(el, x, top * 0.55, h.primary ? 34 : 16);
      flashLight.color.set(EL_COLOR[el]); flashLight.position.set(x, top * 0.6, 0.9); flashLight.intensity = h.primary ? 28 : 12;
      if (h.primary) { punch = Math.max(punch, 0.45); whiteFlash = Math.max(whiteFlash, 0.1); }
    }
    if (guarded && h.primary && !showMul) addText(x - 0.3, top + 0.55, '🛡 막힘', '#d8c8a0', 0.75);
    if (special) addText(x, top + (showMul ? 2.15 : 1.0), special, '#9fe0ff', 1.2);
    // 오답: 튕김 (작은 회색 불똥, 둔한 멈춤)
    if (resist && h.primary) {
      if (!showMul) addText(x, top + 0.75, '튕김', '#bbbbbb', 0.8);
      for (let k = 0; k < 12; k++) addParticle(x + rand(-0.15, 0.15), top * 0.6, 0.35, rand(-2, 2), rand(0.5, 2.5), rand(0.5, 2), rand(0.02, 0.04), 0xdddddd, rand(0.15, 0.3), -9);
    }
    // 무기별 손맛 (멈춤·흔들림·카메라). 약점은 더 크게, 튕김은 작게
    if (h.primary) hitStopUntil = Math.max(hitStopUntil, performance.now() + (weak ? Math.min(190, F.stop * 2) : h.crit ? Math.max(130, F.stop) : resist ? 25 : F.stop));
    if (big) {
      shake = Math.max(shake, weak ? F.shake * 2.2 + 0.05 : h.crit ? Math.max(0.14, F.shake) : resist ? 0.025 : F.shake);
      if (!resist) punch = Math.max(punch, F.punch);
    }
    if (h.primary && el === 'cut' && !resist) addSlash(x, top * 0.6, weak ? 1.1 : 0.7, 0.18);
    if (h.arc != null) addArc(h.arc, slot);
    if (!resist || !h.primary) hitParticles(el, x, top * 0.55, h.primary ? 16 : 10);
    if (el === 'boom') { shake = Math.max(shake, 0.12); boomParticles(x, 0.6, h.bigBoom ? 1.4 : 0.6); }
    if (amt > 0) {
      SFX.hit(el, weak ? 'weak' : resist ? 'resist' : 'normal', !!h.primary);
      if (h.primary) buzz(weak ? 'heavy' : resist ? 'light' : 'medium');
    }
    if (limb) loseLimb(z, weak, h.bowl ? h.bowl.dir : (x >= 0 ? 1 : -1));
    if (stageMsg) {
      addText(x, top + 1.1, stageMsg, '#ff8a3d', 1.3);
      if (z.weakMode === 'peel') { z.armorOff = true; z.view && z.view.armorMeshes.forEach(m => flingMesh(m, rand(-2, 2), rand(3, 5), rand(0.5, 2.5))); }
    }
  });

  // 방망이: 맞은 좀비가 옆 좀비를 넘어뜨리고, 넘어진 좀비가 죽으면 계속 굴러감
  if (h.bowl) {
    const died = z.hp <= 0;
    const go = h.primary || died || h.bowl.extra > 0 || h.bowl.evo;
    if (h.bowl.stun && z.hp > 0) z.stun = Math.max(z.stun || 0, 1);
    if (go) {
      let n = nextAliveFrom(slot, h.bowl.dir), bb = h.bowl;
      if (n < 0 && bb.bounce && !bb.back) { bb = { ...bb, dir: -bb.dir, back: true }; n = nextAliveFrom(slot, bb.dir); if (n < 0 && z.hp > 0) n = slot; }
      if (n >= 0) q.push({ slot: n, amt: h.bowl.amt, el: 'blunt', depth: d + 1, bowl: { ...bb, extra: h.primary || died ? h.bowl.extra : h.bowl.extra - 1 } });
    }
  }
  if (z.hp <= 0) killZombie(z, slot, el, d, overkill, q, ctx);
}

function killZombie(z, slot, el, d, overkill, q, ctx) {
  const tt = hitBase + d * STEP;
  z.dead = true; z.deathEl = el; z.deathAt = gt + tt;
  ctx.kills++;
  if (ctx.firstKillT == null) ctx.firstKillT = z.deathAt;
  run.stats.kills++;
  const nd = d + 1, adj = [slot - 1, slot + 1];
  if (z.frozen > 0) {
    adj.forEach(n => q.push({ slot: n, amt: (has('glass') ? CFG.freezeDeathDmgGlass : CFG.freezeDeathDmg) * (curW() === 'snow' ? 2 : 1), el: 'ice', depth: nd }));
    if (evolved('freezer')) adj.forEach(n => { const y = alive(n); if (y && y.frozen > 0) q.push({ slot: n, amt: isBoss(y) ? 60 : 9999, el: 'ice', depth: nd }); });
  }
  // 뚱보: 죽으면 양옆 피해. 불로 죽이면 부풀다 크게 터짐
  const fatBurst = z.type === 'fat' && el === 'fire';
  if (z.type === 'fat') adj.forEach(n => q.push({ slot: n, amt: fatBurst ? CFG.fatBurstDmg : CFG.fatDeathDmg, el: 'boom', depth: nd }));
  if (fatBurst) at(tt, () => addText(slotX(slot), zTop(z) + 0.9, '펑!', '#ff9a3d', 1.6));
  if (z.type === 'bone' && el === 'blunt') at(tt, () => { addText(slotX(slot), zTop(z) + 0.9, '와르르!', '#f0e6c8', 1.5); SFX.crumble(); });
  if (z.burn && z.oil) adj.forEach(n => q.push({ slot: n, amt: 0, el: 'fire', depth: nd, ignite: true }));
  if (z.wet && has('battery')) adj.forEach(n => q.push({ slot: n, amt: 12, el: 'elec', depth: nd, arc: slot }));   // 건전지 묶음
  if (z.burn && has('cookoff')) adj.forEach(n => q.push({ slot: n, amt: CFG.cookoffDmg, el: 'boom', depth: nd }));
  if (z.burn && evolved('molotov')) adj.forEach(n => q.push({ slot: n, amt: CFG.napalmDmg, el: 'boom', depth: nd }));
  if (el === 'boom' && has('chainboom')) adj.forEach(n => q.push({ slot: n, amt: CFG.chainBoomDmg, el: 'boom', depth: nd }));
  if (el === 'blunt' && has('heavy') && overkill > 0) q.push({ slot: alive(slot + 1) ? slot + 1 : slot - 1, amt: overkill, el: 'blunt', depth: nd });
  if (z.lastWeak || isBoss(z)) save.codex.z[z.type] = (save.codex.z[z.type] || 0) + 1;   // 도감: 약점 처치 수 (보스는 처치 수)
  if (z.lastWeak) run.stats.weakKills++;
  if (el === 'fire') save.prog.fireKills = (save.prog.fireKills || 0) + 1;   // 소방관 해금 조건
  if (BOSS_ITEM[z.type] && unlockItem(BOSS_ITEM[z.type])) at(tt + 0.4, () => addText(slotX(slot), zTop(z) + 1.4, `🔓 ${itemName(BOSS_ITEM[z.type])}`, '#ffd34d', 1.2));
  if (z.gold) { run.luck++; at(tt, () => addText(slotX(slot), zTop(z) + 0.9, '황금 좀비! 다음 선택 희귀 이상', '#ffd34d', 1.1)); }
  if (el === 'elec') { at(tt, () => { z.elecT = 0.32; }); at(tt + 0.32, () => spawnDeath(z, slot, el)); }
  else at(tt, () => spawnDeath(z, slot, fatBurst ? 'boom' : el));
}

function afterAction() {
  planIntents(); updateHUD();
  at(lockUntil - gt, () => {
    if (aliveCount() === 0) return rowCleared();
    planIntents();
    if (run.actionsLeft <= 0 && !run.weapons.some(w => wCost(w) === 0 && canUse(w))) zombieTurn();
    else if (!run.weapons.some(canUse)) { setMsg('쓸 수 있는 무기가 없어 차례를 넘깁니다'); lockUntil = gt + 0.6; at(0.6, zombieTurn); }
    else { setMsg(weaponMsg()); updateHUD(); }
  });
}
function endTurn() {
  if (!run || run.state !== 'battle' || gt < lockUntil) return;
  zombieTurn();
}

function zombieTurn() {
  run.state = 'enemy'; updateHUD(); setMsg('좀비 차례');
  let delay = 0.15;
  slots.forEach((z, i) => {
    if (!z || z.dead) return;
    if (z.frozen > 0) { z.frozen--; at(delay, () => addText(slotX(i), zTop(z) + 0.5, '🧊', '#8fe3ff', 1.0)); return; }
    if (z.stun > 0) { z.stun--; at(delay, () => addText(slotX(i), zTop(z) + 0.5, '💫', '#ffe38a', 1.0)); return; }
    const it = z.intent && z.intent.kind !== 'frozen' && z.intent.kind !== 'stun' ? z.intent : { kind: 'atk', hits: ZT[z.type].hits || 1 };
    z.age++;
    const say = (t, c = '#ffb070') => addText(slotX(i), zTop(z) + 0.6, t, c, 1.0);
    const selfDestruct = () => { z.hp = 0; const q = [], ctx = { kills: 0, maxDepth: 0, firstKillT: null }; hitBase = 0; killZombie(z, i, 'boom', 0, 0, q, ctx); processQueue(q, ctx); };
    if (it.kind === 'swell') {   // 뚱보: 부풀기 (다음 차례에 터짐)
      z.swelling = true;
      at(delay, () => { say('부풀어 오름!'); SFX.hit('fire', 'normal', false); });
      delay += 0.2; return;
    }
    if (it.kind === 'burst') {   // 뚱보: 터져서 나와 양옆에 피해. 일반 뚱보는 죽고, 거대 뚱보는 다시 줄어듦
      at(delay, () => {
        if (z.dead) return;
        hurtPlayer(it.dmg, slotX(i), zTop(z) * 0.6); say('펑!', '#ff9a3d'); boomParticles(slotX(i), zTop(z) * 0.5, 1.2);
        if (it.boss) z.swelling = false; else selfDestruct();
      });
      delay += 0.35; return;
    }
    if (it.kind === 'fizzle') { z.deflated = false; at(delay, () => say('푸쉬쉬…', '#cfe3ff')); delay += 0.2; return; }
    if (it.kind === 'tick') { z.timer--; at(delay, () => say('똑딱', '#ffd34d')); delay += 0.15; return; }
    if (it.kind === 'bomb') { at(delay, () => { if (z.dead) return; hurtPlayer(it.dmg, slotX(i), 1); say('소포 펑!', '#ff9a3d'); selfDestruct(); }); delay += 0.35; return; }
    if (it.kind === 'summon') {   // 거대 뚱보: 빈칸 두 곳에 부하
      at(delay, () => { shuffle(emptySlots()).slice(0, 2).forEach(e => spawnAt(e, 'normal', Math.round(30 * Math.pow(CFG.chapterHpMul, run.chapter - 1)), Math.round(3 * chAtkMul()))); say('부하를 불렀다!'); });
      delay += 0.3; return;
    }
    if (it.kind === 'parcel') {   // 우체부: 빈칸에 소포 폭탄 (2턴 뒤 터짐)
      at(delay, () => { const e = emptySlots(); if (!e.length) { hurtPlayer(effAtk(z, i), slotX(i), zTop(z) * 0.6); return; }
        const p = spawnAt(pick(e), 'parcel', Math.round(14 * Math.pow(CFG.chapterHpMul, run.chapter - 1)), 0); p.timer = 2; say('소포 배달!'); });
      delay += 0.3; return;
    }
    if (it.kind === 'pull') {     // 견인차: 가장 먼 좀비를 끌어와 옆자리와 바꿈
      at(delay, () => {
        let far = -1; for (let k = 0; k < CFG.slots; k++) if (k !== i && alive(k) && (far < 0 || Math.abs(k - i) > Math.abs(far - i))) far = k;
        if (far < 0 || Math.abs(far - i) <= 1) { hurtPlayer(effAtk(z, i), slotX(i), zTop(z) * 0.6); return; }
        const dest = i + Math.sign(far - i); [slots[far], slots[dest]] = [slots[dest], slots[far]]; say('끌어당김!', '#ffd34d'); planIntents();
      });
      delay += 0.4; return;
    }
    if (it.kind === 'oil') {      // 불 좀비: 모든 좀비에게 기름
      at(delay, () => { slots.forEach(y => { if (y && !y.dead && y !== z) { y.oil = true; refreshBaseColors(y); } }); say('기름을 뿌렸다!', '#c8a060'); });
      delay += 0.3; return;
    }
    if (it.kind === 'sea') {      // 불 좀비: 불바다 (기름 묻은 좀비 수만큼 나에게 피해, 기름 묻은 좀비는 불붙음). 비가 오면 꺼짐
      at(delay, () => {
        if (curW() === 'rain') { say('비에 불이 꺼짐', '#9fd8ff'); return; }
        hurtPlayer(CFG.seaDmg * (oiledCount() + 1), 0, 1.2); say('불바다!', '#ff6a2a'); boomParticles(0, 0.3, 1.6);
        slots.forEach(y => { if (y && !y.dead && y.oil && !y.wet && !ZT[y.type].fireproof) y.burn = true; });
      });
      delay += 0.4; return;
    }
    const hits = it.hits || 1;   // 돌진 좀비는 두 번 덮침. 피해는 그 순간 깃발 좀비 옆인지로 다시 셈
    for (let k = 0; k < hits; k++) {
      at(delay, () => { if (z.dead) return; z.lunge = 1; hurtPlayer(effAtk(z, i), slotX(i), zTop(z) * 0.6); });
      delay += hits > 1 ? 0.22 : 0.18;
    }
  });
  // 젖은 좀비: 옆 좀비에 물이 튐 (불이 꺼지고 전기 2배)
  const splash = [];
  slots.forEach((z, i) => { if (z && !z.dead && z.type === 'wet') [i - 1, i + 1].forEach(n => { const y = alive(n); if (y && !y.wet && !isBoss(y) && !splash.includes(n)) splash.push(n); }); });
  if (splash.length) { at(delay, () => splash.forEach(n => { const y = alive(n); if (y) { y.wet = true; y.burn = false; addText(slotX(n), zTop(y) + 0.5, '물 튐', '#6fb6ff', 0.7); } })); delay += 0.2; }
  // 불이 옆으로 번짐
  slots.forEach(z => { if (z && !z.dead) z.burnT = z.burn ? (z.burnT || 1) + 1 : 0; });   // 불붙은 턴 수 (불바다 % 화상)
  const spreads = [];
  slots.forEach((z, i) => {
    if (!z || z.dead || !z.burn) return;
    const c = [i - 1, i + 1].filter(n => { const y = alive(n); return y && !y.burn && !y.wet && !spreads.includes(n); });
    if (curW() === 'heat') spreads.push(...c);   // 폭염: 양옆으로 다 번짐
    else if (c.length) spreads.push(pick(c));
  });
  if (spreads.length) { at(delay, () => spreads.forEach(n => { const y = alive(n); if (y) { y.burn = true; addText(slotX(n), zTop(y) + 0.5, '불이 번짐', '#ff9a3d', 0.7); } })); delay += 0.2; }
  run.turnInRow++;
  // 냉동 창고 좀비: 녹은 얼음 방패가 2턴 뒤 다시 얼어붙음 / 정육점 주인: 턴마다 약점이 바뀜
  slots.forEach((z, i) => {
    if (!z || z.dead) return;
    if (z.type === 'coldman' && !z.iceShield && --z.shieldT <= 0) { z.iceShield = true; at(delay, () => addText(slotX(i), zTop(z) + 0.6, '다시 얼어붙음', '#9fe0ff', 1.0)); }
    if (z.weakMode === 'turn' && z.weakSeq.length > 1) { z.stage = (z.stage + 1) % z.weakSeq.length; z.weak = z.weakSeq[z.stage]; at(delay, () => addText(slotX(i), zTop(z) + 0.9, '약점이 바뀜!', '#ff8a3d', 1.0)); }
  });
  // 뇌우: 벼락 2번 (좀비 15 / 나 6). 피뢰침이 있으면 나를 치지 않고 좀비에게 2배
  if (curW() === 'storm') {
    for (let k = 0; k < 2; k++) {
      at(delay, () => {
        const cand = []; for (let i = 0; i < CFG.slots; i++) if (alive(i)) cand.push(i);
        if (!has('rod')) cand.push(-1);
        if (!cand.length) return;
        const s = pick(cand);
        whiteFlash = Math.max(whiteFlash, 0.35); SFX.thunder(); buzz('heavy');
        if (s === -1) { addBolt(0, 1.2); hurtPlayer(6, 0, 1.6); addText(0, 2.2, '벼락!', '#fff176', 1.3); return; }
        addBolt(slotX(s), zTop(slots[s]));
        const q = [{ slot: s, amt: 15 * (has('rod') ? 2 : 1), el: 'elec', depth: 0 }], ctx = { kills: 0, maxDepth: 0, firstKillT: null };
        hitBase = 0; processQueue(q, ctx);
      });
      delay += 0.45;
    }
  }
  lockUntil = gt + delay + 0.3;
  at(delay + 0.3, () => {
    if (run.hp <= 0) return playerDown();
    if (aliveCount() === 0) return rowCleared();   // 뚱보가 터지거나 벼락으로 다 죽었을 때
    applyWeatherToRow();
    run.state = 'battle';
    run.actionsLeft = turnActions(); run.refunds = 0; run.freeKick = false;
    planIntents(); setMsg(weaponMsg()); updateHUD();
  });
}

function rowCleared() {
  const r = run.row;
  run.state = 'cleared';
  const oneTurn = run.turnInRow === 0;
  const coins = Math.round((10 + 5 * r) * Math.pow(1.2, run.chapter - 1) * (oneTurn ? 1.5 : 1));
  run.coins += coins; run.stats.rowsCleared = r;
  if (oneTurn) { showBig('한 번에 정리! 코인 +50%'); run.stats.oneTurn++; }
  addText(0, 1.9, `+${coins} 코인`, '#ffd34d', 1.4);
  SFX.clear(); buzz('success');
  updateHUD();
  if (r === CFG.rows) return at(1.0, () => endRun(true));
  const picks = 1;
  const chain = (n) => n <= 0 ? afterChoices(r) : showChoices(() => chain(n - 1), picks - n + 1, picks);
  at(0.9, () => chain(picks));
}
function afterChoices(r) {
  if (CFG.eliteRows.includes(r)) showRelicChoice('정예 보상', () => showRest(nextRow));   // 정예: 잡동사니 3택 1 → 쉼터
  else if (r === CFG.midRow) showRelicChoice('중간 보스 보상', nextRow);                  // 중간 보스: 잡동사니 3택 1
  else nextRow();
}

function nextRow() {
  run.row++;
  run.actionsLeft = turnActions();
  run.refunds = 0; run.combo = 0; run.lastW = null; run.ammo = {}; run.freeKick = false;   // 화염병·냉동탄 개수는 줄마다 다시 참
  if (run.row > 1 && has('medkit')) run.hp = Math.min(run.maxHp, run.hp + 6);
  run.state = 'enter';   // 좀비가 걸어와 설 때까지는 못 침
  const seenBefore = { ...save.codex.seen };
  withRowRandom(() => genRow(run.row));   // 오늘의 도전은 줄 구성도 날짜로 정해짐
  // 날씨: 바뀌면 크게 알림, 돌풍은 줄마다 방향을 정함
  const w = curW(), prevW = run.row > 1 ? run.weather[run.row - 1] : null;
  run.windDir = Math.random() < 0.5 ? -1 : 1;
  applyWeatherToRow(); setWeatherLook(w);
  planIntents();
  hideOverlay();
  // 처음 보는 좀비 (일반 좀비는 소개하지 않음)
  const fresh = [...new Set(slots.filter(z => z && !seenBefore[z.type] && z.type !== 'normal').map(z => z.type))];
  run.enter = { fresh, newWx: w !== prevW && w !== 'clear' ? w : null };
  const t = enterRow();
  setMsg(''); updateHUD();
  at(t, rowReady);
}
// 줄 등장: 좀비들이 뒤쪽 멀리서 엇갈려 걸어와 자기 자리에 섬. 걸리는 시간(초)을 돌려줌
function enterRow() {
  let end = 0;
  slots.forEach(z => {
    if (!z) return;
    const d = rand(0, CFG.enterStagger);
    z.enterT0 = gt + d; z.spawnT = -99; setFade(z, 0);
    end = Math.max(end, d + CFG.enterTime);
  });
  return end;
}
// 등장 중에 화면을 누르면 바로 자리에 세움
function skipEnter() {
  if (!run || run.state !== 'enter') return;
  slots.forEach(z => { if (z && z.enterT0 != null) z.enterT0 = Math.min(z.enterT0, gt - CFG.enterTime * 0.8); });
  at(CFG.enterTime * 0.2, rowReady);
}
// 좀비 몸을 흐리게(0)~또렷하게(1). 얼음처럼 원래 반투명한 것은 그 비율대로
function setFade(z, a) {
  if (!z.view) return;
  z.view.group.traverse(o => {
    const m = o.material; if (!m || o === z.view.ice) return;
    if (!o.userData.op0) o.userData.op0 = { t: m.transparent, o: m.opacity };
    const want = o.userData.op0.t || a < 1;
    if (m.transparent !== want) { m.transparent = want; m.needsUpdate = true; }
    m.opacity = o.userData.op0.o * a;
  });
}
// 다 걸어온 뒤: 처음 보는 좀비가 있으면 소개하고, 날씨·보스를 알리고 싸움 시작
function rowReady() {
  if (!run || run.state !== 'enter') return;
  slots.forEach(z => { if (z && z.enterT0 != null) { z.enterT0 = null; setFade(z, 1); } });
  const { fresh, newWx } = run.enter;
  const begin = () => {
    if (!run) return;
    run.state = 'battle';
    camTo(CAM_POS, CAM_LOOK);
    if (newWx) at(0.1, () => showBig(`${WEATHER[newWx].icon} ${WEATHER[newWx].name}`));
    const bz = slots.find(z => z && isBoss(z));
    if (bz && !fresh.includes(bz.type)) at(newWx ? 0.8 : 0.1, () => showBig(`${ZT[bz.type].boss === 'mid' ? '중간 보스' : '보스'}: ${ZT[bz.type].name}`));
    setMsg(bz ? ZT[bz.type].desc || '보스 줄입니다' : CFG.eliteRows.includes(run.row) ? '정예 줄입니다 · 정예는 약점이 두 단계예요' : run.easyRow ? '새 무기를 시험해 보세요!' : weaponMsg());
    // 약점 좀비를 처음 만났을 때 한 번 알려 줌
    if (!save.seenWeak && slots.some(z => z && z.weak)) { save.seenWeak = true; persist(); setMsg('🎯 표시가 그 좀비의 약점 무기예요. 그 무기로 치면 2배!'); }
    updateHUD();
  };
  if (fresh.length) showIntro(fresh.slice(), begin); else begin();
}
// 신규 좀비 소개: 카메라가 그 좀비에게 다가가고 NEW 창을 띄움. 누르면 다음 좀비, 다 보면 싸움 시작
function showIntro(types, done) {
  const type = types.shift(), z = slots.find(y => y && y.type === type);
  if (!z) return types.length ? showIntro(types, done) : done();
  run.state = 'intro'; updateHUD();
  const T = ZT[type], i = slots.indexOf(z), x = slotX(i), h = zTop(z);
  camTo(new THREE.Vector3(x * 0.8, h * 0.7 + 0.45, h * 1.5 + 2.3), new THREE.Vector3(x, h * 0.55, 0), 5);
  const ic = el => WEAPONS[EL_WEAPON[el]].icon, wn = el => WEAPONS[EL_WEAPON[el]].name;
  let weak;
  if (z.weakMode === 'peel') weak = `약점 ${ic(z.weakSeq[0])} → ${ic(z.weakSeq[1])}`;
  else if (z.weakMode === 'turn') weak = `약점이 바뀌어요 ${z.weakSeq.map(ic).join(' ')}`;
  else if (z.weak) weak = `약점 ${ic(z.weak)} ${wn(z.weak)} · 2배`;
  else weak = '약점 없음';
  if (T.fireproof) weak += ' · 🔥 안 통함';
  const kind = T.boss ? (T.boss === 'mid' ? '중간 보스' : '보스') : type === 'brute' ? '정예' : '새 좀비';
  const el = $('intro');
  el.innerHTML = `<div class="introCard"><div class="newTag">NEW</div><div class="iKind">${kind}</div><div class="iName">${T.name}</div>
    <div class="iDesc">${T.desc || ''}</div><div class="iWeak">${weak}</div><div class="iTap">눌러서 계속</div></div>`;
  el.classList.remove('hidden'); $('app').classList.add('intro');
  SFX.link(); buzz('medium');
  const t0 = performance.now();
  el.onpointerdown = () => {

function traitPool() { return TRAITS.filter(t => save.itemsOpen.includes(t.id) && !run.traits.includes(t.id) &&(!t.pair || inRun(t.pair)) && (!t.req || inRun(t.req))); }
// 선택지 등급: 낮은 등급은 조금 오르고, 높은 등급은 동작이 바뀌거나(갈래) 무기가 달라짐(진화)
// w: 기본 무게. 뒤 줄로 갈수록 희귀·전설이 조금씩 잘 나오고, 위협 단계가 오르면 덜 나옴
const RARITY = [
  { id: 'common',   name: '일반', w: 62 },
  { id: 'uncommon', name: '고급', w: 27 },
  { id: 'rare',     name: '희귀', w: 5,  perRow: 0.25 },
  { id: 'legend',   name: '전설', w: 0.6, perRow: 0.08 },
];
const RIDX = Object.fromEntries(RARITY.map((r, i) => [r.id, i]));
// 잡동사니 등급
const TRAIT_RARITY = {
  common:   ['medkit', 'vest', 'oiler', 'rain', 'crate', 'icebox', 'raincoat', 'shades', 'earmuff'],
  uncommon: ['whetstone', 'grip', 'hotter', 'glass', 'chain', 'rabbit', 'fuse', 'wraps', 'coolant', 'rod', 'glove'],
  rare:     ['heavy', 'halve', 'chainboom', 'overload', 'cookoff', 'ember', 'battery', 'belt', 'anatomy'],
  legend:   ['spare'],
};
const traitRarity = id => Object.keys(TRAIT_RARITY).find(k => TRAIT_RARITY[k].includes(id)) || 'uncommon';
const AD_REROLLS = 2;   // 판마다 광고 다시 뽑기 (희귀 이상 1장 확정). 광고 제거를 사도 횟수는 같음
const newWeapon = id => ({ id, evo: false, branch: null, bonus: 0, ammoPlus: 0 });

// 지금 뽑을 수 있는 카드 전부 (무기 카드는 run.weapons의 칸 번호 idx로 가리킴)
function cardPool(o = {}) {
  const P = [];
  run.weapons.forEach((w, i) => {
    const W = WEAPONS[w.id];
    // weight: 같은 등급 안에서 뽑힐 무게 (잡동사니가 종류가 많아 무기 카드가 묻히지 않게 무기 카드를 무겁게)
    P.push({ kind: 'dmg', idx: i, amt: 0.06, rarity: 'common', weight: 4 });
    P.push({ kind: 'dmg', idx: i, amt: 0.15, rarity: 'uncommon', weight: 4 });
    if (W.ammo) { P.push({ kind: 'ammo', idx: i, amt: 1, rarity: 'common', weight: 2 }); P.push({ kind: 'ammo', idx: i, amt: 2, rarity: 'uncommon', weight: 2 }); }
    if (!w.branch && BRANCH[w.id]) for (const br of ['a', 'b']) P.push({ kind: 'branch', idx: i, br, rarity: 'rare', weight: 3 });
    // 진화(전설): 갈래를 고르고, 무기고에서 영구 Lv5 이상으로 올린 무기만. 짝 잡동사니가 있으면 3배 잘 나옴
    if (!w.evo && w.branch && permLvl(w.id) >= CFG.evoLevel) P.push({ kind: 'evo', idx: i, rarity: 'legend', weight: run.traits.includes(W.evo.trait) ? 18 : 6 });
  });
  if (!o.weaponOnly) {
    // 새 무기: 로비에서 장착한 무기 중 아직 안 고른 것만
    for (const id of run.loadout) if (id && !inRun(id)) P.push({ kind: 'weapon', id, rarity: 'uncommon', weight: 4 });
    for (const t of traitPool()) P.push({ kind: 'trait', id: t.id, rarity: traitRarity(t.id), weight: t.pair ? 1.5 : 1 });
    if (run.hp < run.maxHp) P.push({ kind: 'heal', amt: 15, rarity: 'common' });
    P.push({ kind: 'maxhp', amt: 6, rarity: 'common' });
  }
  return P;
}
// 등급 하나 뽑기 (min: 이 등급 이상만)
function rollRarity(min = 0) {
  const down = Math.max(0.5, 1 - 0.05 * (run.threat || 0));
  // 희귀 이상 확정(정예 보상·광고 다시 뽑기)일 때는 전설을 더 아껴서 한 판에 한 번 안팎만 보이게
  const ws = RARITY.map((r, k) => k < min ? 0 : (r.w + (r.perRow || 0) * run.row) * (k >= 2 ? down : 1) * (k === 3 && min >= 2 ? 0.3 : 1));
  let x = Math.random() * ws.reduce((a, b) => a + b), k = 0;
  while (k < ws.length - 1 && x > ws[k]) { x -= ws[k]; k++; }
  return k;
}
const cardKey = c => `${c.kind}:${c.idx ?? ''}:${c.id || ''}`;   // 같은 무기의 같은 종류 카드는 한 번에 하나만
function weightedPick(arr) { let x = Math.random() * arr.reduce((s, c) => s + (c.weight || 1), 0); for (const c of arr) { x -= c.weight || 1; if (x <= 0) return c; } return arr[arr.length - 1]; }
// 3장 뽑기. o.min: 첫 장 최소 등급, o.minAll: 모든 장 최소 등급, o.weaponOnly: 무기 카드만
function rollChoices(o = {}) {
  const out = [];
  // 판의 첫 선택(1줄 돌파)은 장착한 무기 중 새 무기 카드만 (발차기만 들고 시작하니까)
  if (!run.firstPickDone && !o.weaponOnly) {
    run.firstPickDone = true;
    shuffle(run.loadout.filter(id => id && !inRun(id))).slice(0, 3).forEach(id => out.push({ kind: 'weapon', id, rarity: 'uncommon' }));
  }
  const pool = cardPool(o);
  while (out.length < 3) {
    const k = rollRarity(Math.max(o.minAll || 0, out.length === 0 ? o.min || 0 : 0));
    let cand = [];
    for (let d = 0; d < RARITY.length && !cand.length; d++)   // 그 등급 카드가 없으면 한 단계씩 내려가며, 그다음 올라가며 찾음
      for (const kk of [k - d, k + d]) if (!cand.length && kk >= (o.minAll || 0) && kk < RARITY.length)
        cand = pool.filter(c => RIDX[c.rarity] === kk && !out.some(x => cardKey(x) === cardKey(c)));
    if (!cand.length) break;
    out.push(weightedPick(cand));
  }
  return shuffle(out);
}
function opt(i, icon, t1, t2, tag, cls = '') {
  return `<div class="opt ${cls}" data-i="${i}"><div class="ic">${icon}</div><div class="tx"><div class="t1">${t1}<span class="tag">${tag}</span></div><div class="t2">${t2}</div></div></div>`;
}
// 잡동사니 설명: 효과 · 태그 · 짝 무기
function itemLine(t) {
  return t.desc + (t.tags.length ? ' · ' + t.tags.map(g => TAG_ICON[g] + TAG_NAME[g]).join(' ') : '') + (t.pair ? ` · 있으면 ${WEAPONS[t.pair].name} 진화(전설) 카드가 3배 잘 나와요` : '');
}
const pctTxt = v => `+${Math.round(v * 100)}%`;
function gainItem(id) { if (!run.traits.includes(id)) run.traits.push(id); run.stats.picks.push('trait:' + id); if (!save.codex.items.includes(id)) save.codex.items.push(id); }
function choiceHTML(c, i) {
  const R = RARITY[RIDX[c.rarity]], cls = 'r-' + c.rarity, tag = R.name;
  const w = c.idx != null ? run.weapons[c.idx] : null, W = w ? WEAPONS[w.id] : null;
  if (c.kind === 'trait') { const t = TRAITS.find(x => x.id === c.id); return opt(i, t.icon, t.name, itemLine(t), tag, cls); }
  if (c.kind === 'weapon') {
    const NW = WEAPONS[c.id], full = run.weapons.length >= CFG.maxWeaponSlots;
    return opt(i, NW.icon, `새 무기: ${NW.name}`, NW.desc + weakNote(c.id) + (full ? ' · 무기 칸이 가득 차서 하나와 바꿔요' : ' · 장착한 무기를 이번 판에서 쓸 수 있게 돼요'), tag, cls);
  }
  if (c.kind === 'dmg') return opt(i, W.icon, `${wName(w)} 피해 ${pctTxt(c.amt)}`, `이 무기 피해 ${pctTxt(w.bonus)} → ${pctTxt(w.bonus + c.amt)}`, tag, cls);
  if (c.kind === 'ammo') return opt(i, W.icon, `${W.name} 개수 +${c.amt}`, `줄마다 쓸 수 있는 개수 ${ammoMax(w)} → ${ammoMax(w) + c.amt}`, tag, cls);
  if (c.kind === 'branch') { const B = BRANCH[w.id][c.br]; return opt(i, W.icon, `${wName(w)} 갈래: ${B[0]}`, `${B[1]} · 갈래는 무기마다 하나 (고르면 다른 쪽은 안 나와요) · ${permLvl(w.id) >= CFG.evoLevel ? '갈래를 고르면 진화(전설) 카드가 나올 수 있어요' : `무기고에서 Lv${CFG.evoLevel}로 올리면 갈래 뒤에 진화(전설) 카드가 나와요`}`, tag, cls); }
  if (c.kind === 'evo') return permLvl(w.id) >= CFG.maxPermLevel ? opt(i, W.icon, `최종! ${W.name} → ${W.final.name}`, `${W.final.desc} · 피해 1.5배`, tag, cls)
    : opt(i, W.icon, `진화! ${W.name} → ${W.evo.name}`, `${W.evo.desc} · 피해 1.5배`, tag, cls);
  if (c.kind === 'heal') return opt(i, '🩹', `구급약: 체력 +${c.amt}`, `지금 ${run.hp} / ${run.maxHp}`, tag, cls);
  return opt(i, '🍫', `단백질 바: 최대 체력 +${c.amt}`, `최대 체력 ${run.maxHp} → ${run.maxHp + c.amt} (체력도 같이 +${c.amt})`, tag, cls);
}
// 3택 1 창 (o.title·o.sub: 제목, o.min·o.minAll·o.weaponOnly: rollChoices로)
function showChoices(done, k, n, o = {}) {
  run.state = 'choice';
  const first = Object.assign({}, o, run.luck ? { min: Math.max(o.min || 0, RIDX.rare) } : {});
  if (run.luck) run.luck--;   // 황금 좀비: 다음 선택 희귀 이상 1장
  const choices = rollChoices(first);
  if (!choices.length) return done();
  const canAd = !run.daily && adOk('REROLL');   // 오늘의·주간 도전은 같은 조건이라 광고 다시 뽑기 없음
  const render = () => {
    showPanel(`
      <h2>${o.title || `${run.row}번째 줄 돌파${n > 1 ? ` (${k}/${n})` : ''}`}</h2><p>${o.sub || '하나를 고르세요'}</p>
      ${run.weather && run.row < CFG.rows ? `<p>다음 줄 날씨: ${WEATHER[run.weather[run.row + 1]].icon} ${WEATHER[run.weather[run.row + 1]].name} · ${WEATHER[run.weather[run.row + 1]].desc}</p>` : ''}

      if (run.rerollsLeft <= 0) return;
      e.currentTarget.disabled = true;
      if (!(await rewardAd('REROLL'))) { e.currentTarget.disabled = false; return; }
      run.rerollsLeft--; run.ads.reroll++;
      choices.splice(0, choices.length, ...rollChoices(Object.assign({}, o, { min: Math.max(o.min || 0, RIDX.rare) }))); render();

}
// 정예·중간 보스 보상: 희귀 이상만
function showRelicChoice(title, done) { showChoices(done, 1, 1, { title, sub: '희귀 이상 카드 중 하나를 고르세요', minAll: RIDX.rare }); }
function applyChoice(c, done) {
  const w = c.idx != null ? run.weapons[c.idx] : null;
  run.stats.picks.push(`${c.rarity}:${c.kind}:${c.id || (w && w.id) || ''}`);
  if (c.kind === 'trait') gainItem(c.id);
  else if (c.kind === 'dmg') w.bonus += c.amt;
  else if (c.kind === 'ammo') w.ammoPlus += c.amt;

  else if (c.kind === 'maxhp') { run.maxHp += c.amt; run.hp += c.amt; }
  else if (c.kind === 'evo') {
    w.evo = true; run.evolvedOnce = true; run.easyNext = true;
    if (!save.evolved.includes(w.id)) { save.evolved.push(w.id); persist(); }
    showBig(isFinal(w) ? `최종! ${WEAPONS[w.id].final.name}` : `진화! ${WEAPONS[w.id].evo.name}`);
  } else if (c.kind === 'weapon') {   // 새 무기 (칸이 가득이면 하나와 바꿈)
    run.easyNext = true;
    if (run.weapons.length >= CFG.maxWeaponSlots) {
      showPanel(`
        <h2>바꿀 무기를 고르세요</h2>
        <p>${WEAPONS[c.id].icon} ${WEAPONS[c.id].name}을(를) 받는 대신 하나를 버려요 (버린 무기의 강화도 사라져요)</p>
        <div class="opts">${run.weapons.map((x, i) => opt(i, WEAPONS[x.id].icon, `${wName(x)} ${pctTxt(x.bonus)}${x.branch ? ' · ' + BRANCH[x.id][x.branch][0] : ''}`, WEAPONS[x.id].desc, '버리기')).join('')}</div>`);
      document.querySelectorAll('.opt').forEach(el => el.onclick = () => { run.weapons[+el.dataset.i] = newWeapon(c.id); updateHUD(); done(); });
      return;
    }
    run.weapons.push(newWeapon(c.id));
  }
  if (c.rarity === 'legend' || c.rarity === 'rare') buzz('success');
  updateHUD(); done();
}

// 다음 목표 (판 결과 화면 리본에 첫 줄)
function goalLines() {
  const lines = [];
  const nextUnlock = CHAPTERS.findIndex(c => c && c.unlock && !save.owned.includes(c.unlock));
  if (nextUnlock > 0) lines.push(`${CHAPTERS[nextUnlock].name} 클리어 → 새 무기 ${WEAPONS[CHAPTERS[nextUnlock].unlock].icon} ${WEAPONS[CHAPTERS[nextUnlock].unlock].name}`);
  if (save.maxChapter < CFG.chapters && !save.cleared.includes(save.maxChapter)) lines.push(`${CHAPTERS[save.maxChapter].name} 클리어 → ${CHAPTERS[save.maxChapter + 1].name} 열림`);
  if (save.cleared.includes(CFG.chapters) && save.threatUnlocked < THREATS.length - 1) lines.push(`${CHAPTERS[CFG.chapters].name}를 위협 ${save.threatUnlocked}단계로 클리어 → 위협 ${save.threatUnlocked + 1}단계`);
  const cheapest = ownedIds().filter(id => permLvl(id) < CFG.maxPermLevel).map(id => ({ id, c: lvlCost(permLvl(id)) })).sort((a, b) => a.c - b.c)[0];
  if (upgradesOpen() && cheapest) lines.push(`${WEAPONS[cheapest.id].name} 영구 강화까지 ${Math.max(0, cheapest.c - save.coins)} 코인`);

  if (run.test) {   // 시험 장: 저장·보상 없이 결과만

    showResult(win, [], { icon: '🧪', title: '시험 장 돌파 줄', value: run.stats.rowsCleared, sub: `한 번에 준 최대 피해 ${Math.round(run.stats.bestAction || 0).toLocaleString()} · 한 방 최대 ${Math.round(run.stats.maxHit || 0).toLocaleString()}` });

    return;

  if (!run.daily) {

      if (ch < CFG.chapters) { save.maxChapter = Math.max(save.maxChapter, ch + 1); lobbyCh = ch + 1; unlocks.push({ icon: '🗺️', kind: '새 장', label: CHAPTERS[ch + 1].name }); }
    }
    // 위협 단계: 마지막 장을 깨면 다음 단계가 열림, 최고 기록
    if (ch === CFG.chapters && !run.daily) {
      const next = Math.min(THREATS.length - 1, run.threat + 1);
      if (next > save.threatUnlocked) { save.threatUnlocked = next; unlocks.push({ icon: '☠️', kind: '위협 단계', label: `${next}단계 열림` }); }

    }

  if (run.threat) run.coins = Math.round(run.coins * (1 + 0.1 * run.threat));   // 위협 단계마다 코인 +10%
  unlocks.push(...run.newUnlocks);   // 보스 첫 처치로 열린 잡동사니 (생존자 해금은 비활성화)
  // 도전 점수: 돌파 줄 ×100 + 처치 ×5 + 남은 체력 (+클리어 500)
  let score = null;
  const pts = run.stats.rowsCleared * 100 + run.stats.kills * 5 + run.hp + (win ? 500 : 0);
  if (run.daily && run.daily.weekly) {   // 주간 도전: 여러 번 해도 되고 최고 점수를 남김, 그 주 첫 클리어 보상
    const prev = save.weekly && save.weekly.key === run.daily.key ? save.weekly : { best: 0, cleared: false, plays: 0 };
    const firstClear = win && !prev.cleared;
    if (firstClear) { run.coins += WEEKLY_CLEAR_COINS; unlocks.push({ icon: '🏅', kind: '주간 첫 클리어', label: `코인 +${WEEKLY_CLEAR_COINS}` }); }
    save.weekly = { key: run.daily.key, best: Math.max(prev.best, pts), cleared: prev.cleared || win, plays: prev.plays + 1 };
    score = { icon: '🏆', title: '주간 도전 점수', value: pts, sub: `이번 주 최고 ${save.weekly.best}` };

    save.daily = { key: run.daily.key, score: pts, best: Math.max(pts, save.daily && save.daily.key === run.daily.key ? save.daily.best || 0 : 0) };
    score = { icon: '📅', title: '오늘의 도전 점수', value: pts, sub: '내일 새 도전이 열려요' };
  }
  persist();
  showResult(win, unlocks, score);
  console.log('[ZS] run end', JSON.stringify({ chapter: ch, win, rows: run.stats.rowsCleared, kills: run.stats.kills, maxChain: run.stats.maxChain, dmgTaken: run.stats.dmgTaken, weapons: run.weapons, picks: run.stats.picks, ads: run.ads }));
}

// 기기의 뒤로가기 (구글플레이·토스): 피드백 창 → 설정 → 로비의 다른 탭 순으로 닫고, 닫을 게 없으면 false (빌드가 종료를 물음)

// ------------------------------------------------------------ 판 결과
function showResult(win, unlocks, score) {
  const r = run, ch = r.chapter, earned = r.coins;
  let done = false;
  const finish = async mul => {
    if (done) return; done = true;
    save.coins += earned * mul; persist();   // 지급·저장을 먼저 하고 광고
    await runEndAd(); showLobby('go');
  };
  const goal = goalLines()[0];
  const cards = [{ icon: '💰', kind: '코인', label: `+${earned}`, sub: r.threat ? `위협 ${r.threat} +${r.threat * 10}%` : '' }, ...unlocks];
  showScreen('', `
    <div class="resArt ${win ? 'win' : ''}"><img src="${dioramaPic(ch)}" alt=""></div>
    <div class="resTitle ${win ? '' : 'lose'}">${win ? '장 클리어!' : '도전 종료'}</div>
    <div class="resSub">${CHAPTERS[ch].name} · ${r.stats.rowsCleared} / ${CFG.rows}줄 돌파${r.threat ? ` · ☠️ 위협 ${r.threat}` : ''}</div>
    <div class="box sec stat3"><div><small>처치</small><b>🎯 ${r.stats.kills}</b></div><div><small>최대 연쇄</small><b>🔗 ${r.stats.maxChain}</b></div><div><small>약점 처치</small><b>💀 ${r.stats.weakKills}</b></div></div>
    ${score ? `<div class="box sec scoreBox"><span class="ri">${score.icon}</span><div><small>${score.title}</small><b>${score.value.toLocaleString()}</b><small>${score.sub}</small></div></div>` : ''}
    <div class="rewards">${cards.map(c => `<div class="rw"><div class="rwI">${c.pic ? `<img src="${c.pic}" alt="">` : c.icon}</div><small>${c.kind}</small><b>${c.label}</b>${c.sub ? `<small>${c.sub}</small>` : ''}</div>`).join('')}</div>
    ${goal ? `<div class="goalRib"><small>다음 목표</small>${goal}</div>` : ''}`,
    `<div class="resBtns">
      ${earned > 0 && adOk('DOUBLE_COINS') ? `<button class="bigGo green" id="bDouble"><small>${save.noAds ? '🎁 바로' : '📺 광고 보고'}</small>2배</button>` : ''}
      <button class="bigGo gray" id="bTake" data-ncq-main="보상 받기"><small>코인 +${earned}</small>받기</button>
    </div>`);
  if (win) { SFX.clear(); }
  if ($('bDouble')) $('bDouble').onclick = async e => {
    e.currentTarget.disabled = true;
    if (!(await rewardAd('DOUBLE_COINS'))) { e.currentTarget.disabled = false; return; }
    run.ads.double++; finish(2);
  };
  $('bTake').onclick = () => finish(1);
}

// ------------------------------------------------------------ 로비 (아래 메뉴 5칸: 상점·무기고·출격·도감·도전)
let lobbyTab = 'go', lobbyCh = null, codexSeg = 'z', chalSeg = 'daily', armSel = null;
const NAV = [['shop', '🏪', '상점'], ['armory', '🪓', '무기고'], ['go', '⚔️', '출격'], ['codex', '📖', '도감'], ['challenge', '🏆', '도전']];
const upgradesOpen = () => save.cleared.includes(1) || Object.keys(save.levels).length > 0;   // 1장을 깨면 영구 강화
const dailyOpen = () => save.cleared.includes(2) || !!save.daily;                               // 2장을 깨면 오늘의 도전
const dailyDone = () => save.daily && save.daily.key === todayKey();
const codexClaimable = () => CODEX_Z.some(t => (save.codex.z[t] || 0) >= CODEX_GOAL && !save.codex.claimed[t]);
const canUpgradeAny = () => upgradesOpen() && ownedIds().some(w => permLvl(w) < CFG.maxPermLevel && save.coins >= lvlCost(permLvl(w)));
const crateReady = () => lockedItems().length > 0 && save.coins >= CRATE_COST;
const CHALLENGE_ON = false;   // 오늘의·주간 도전: 비활성화 (아래 메뉴 '도전' 칸은 잠김으로 보임)
// 메뉴 위 빨간 점: 받을 보상·할 수 있는 것이 있을 때
function navDot(id) {
  if (id === 'codex') return codexClaimable();
  if (id === 'challenge') return CHALLENGE_ON && ((dailyOpen() && !dailyDone()) || weeklyCanPlay());
  if (id === 'armory') return canUpgradeAny();
  if (id === 'shop') return crateReady();
  return false;
}
function showLobby(tab) {
  if (typeof tab === 'string') lobbyTab = tab;
  if (lobbyTab === 'challenge' && !CHALLENGE_ON) lobbyTab = 'go';
  run = null; clearRow(); updateHUD(); setMsg('');
  if (lobbyCh == null || lobbyCh > CFG.chapters) lobbyCh = Math.min(save.maxChapter, CFG.chapters);
  if (lookCh !== lobbyCh) { applyChapterLook(lobbyCh); darkFlash = 1; }   // 장을 넘기면 잠깐 어두워졌다가 그 장의 거리가 나타남
  setWeatherLook('clear');
  setLobbyScene(lobbyCh);
  const T = { shop: lbShop, armory: lbArmory, go: lbGo, codex: lbCodex, challenge: lbChallenge }[lobbyTab]();
  showScreen(`
    <div class="lbTop">
      <div class="logo">좀비<b>스매시</b></div>
      <div class="avatar">🧢</div>
      <div class="money">${coinIc}<span>${save.coins.toLocaleString()}</span><button class="plus" id="bPlus" aria-label="상점">+</button></div>
      <button class="gear" id="bGearL" aria-label="설정">⚙️</button>
      <div class="verTag">${APP_VERSION}</div>
    </div>`, T.html,
    `<div class="lbNav">${NAV.map(([id, ic, nm]) => `<button class="nav ${id === lobbyTab ? 'on' : ''} ${id === 'go' ? 'main' : ''}" data-nav="${id}" ${id === 'go' && lobbyTab !== 'go' ? 'data-ncq-main="출격 메뉴"' : ''} ${id === 'challenge' && !CHALLENGE_ON ? 'disabled style="opacity:.4;filter:grayscale(1);cursor:default"' : ''}><span class="ni">${ic}</span>${nm}${navDot(id) ? '<i class="dot"></i>' : ''}</button>`).join('')}</div>`);
  document.querySelectorAll('[data-nav]:not([disabled])').forEach(b => b.onclick = () => showLobby(b.dataset.nav));
  $('bPlus').onclick = () => showLobby('shop');
  $('bGearL').onclick = openSettings;
  T.bind();
  // 출격 화면은 바탕을 비워 뒤의 3D 거리가 보이게 (잠긴 장은 어둡게)
  $('screen').classList.toggle('go3d', lobbyTab === 'go');
  $('screen').classList.toggle('dim', lobbyTab === 'go' && lobbyCh > save.maxChapter);
  if (lobbyTab === 'go') { fitGo(); requestAnimationFrame(refitGo); }
}
// 로비 거리: 장 보스가 거리 안쪽에 서 있고, 카메라는 거리를 천천히 둘러봄 (update에서 움직임)
let lobbyBoss = null, lobbyBossCh = 0, darkFlash = 0;
function setLobbyScene(ch) {
  if (lobbyBoss && lobbyBossCh === ch) return;
  clearLobbyScene();
  lobbyBoss = zombieModel(CH_BOSS[ch]); lobbyBoss.position.set(0.5, 0, -4.5); scene.add(lobbyBoss); lobbyBossCh = ch;
}
function clearLobbyScene() { if (lobbyBoss) { disposeObj(lobbyBoss); lobbyBoss = null; lobbyBossCh = 0; } }
// 화면 크기·안전 영역·배너가 바뀌면 다시 맞춤
const refitGo = () => { if (!run && lobbyTab === 'go' && !$('screen').classList.contains('hidden')) fitGo(); };
window.addEventListener('resize', refitGo);
if (window.NcqSafe && NcqSafe.onChange) NcqSafe.onChange(refitGo);

// ---- 출격: 장 카드를 좌우로 넘겨 고르고 출격 (메인 버튼)
const sideBtn = (id, icon, label, sub, locked, dot) => `<button class="sb ${locked ? 'lock' : ''}" id="${id}"><span class="si">${icon}</span><span class="sl">${label}</span>${sub ? `<span class="sub">${sub}</span>` : ''}${dot ? '<i class="dot"></i>' : ''}</button>`;
function lbGo() {
  const ch = lobbyCh, open = ch <= save.maxChapter;
  const best = save.best[ch] || (save.cleared.includes(ch) ? CFG.rows : 0), pct = Math.round(100 * best / CFG.rows);
  const st = save.stars[ch] || (save.cleared.includes(ch) ? [1, 0, 0] : [0, 0, 0]);
  const wx = [...new Set(CHAPTER_WEATHER[ch])];
  const tMax = save.threatUnlocked || 0; save.threatSel = Math.min(save.threatSel || 0, tMax); const t = save.threatSel;
  const showNoAds = NcqIap.can('REMOVE_ADS') && !save.noAds;
  return {
    html: `
    <div class="sideR">
      ${sideBtn('bCrateS', '🎁', '잡동사니<br>꾸러미', lockedItems().length ? `💰${CRATE_COST}` : '다 열림', false, crateReady())}
      ${showNoAds ? sideBtn('bNoAdS', '🚫', '광고<br>제거', '', false, false) : ''}
      ${TEST_FINAL ? sideBtn('bTest', '🧪', '최종 무기<br>시험', '', false, false) : ''}
    </div>
    <div class="goWrap" id="goWrap">
      <div class="goSpace"></div>
      <div class="chapRow">
        <button class="arrow l" id="bPrev" ${ch <= 1 ? 'disabled' : ''} aria-label="앞 장">${CHEV_L}</button>
        <div class="chapCard" id="chapCard">
          <div class="chapHead"><span class="chapNo">${ch}장</span><span class="chapName">${CHAPTERS[ch].name.replace(/^\d+장 /, '')}</span></div>
          ${open ? '' : `<div class="lockLine">🔒 ${ch - 1}장을 깨면 열려요</div>`}
          <div class="best">최고 기록 ${best} / ${CFG.rows}줄</div>
          <div class="pbar"><i style="width:${pct}%"></i><span>${pct}%</span></div>
          <div class="stars">${st.map(v => `<span class="${v ? 'on' : ''}">★</span>`).join('')}</div>
          <div class="chapInfo"><div class="bossPill">보스: <b>${ZT[CH_BOSS[ch]].name}</b></div><div class="wxIcons">${wx.map(w => `<div><span>${WEATHER[w].icon}</span>${WEATHER[w].name}</div>`).join('')}</div></div>
        </div>
        <button class="arrow r" id="bNext" ${ch >= CFG.chapters ? 'disabled' : ''} aria-label="다음 장">${CHEV_R}</button>
      </div>
      ${tMax ?`<div class="threat" title="${THREATS.slice(1, t + 1).map((x, i) => `${i + 1}. ${x.desc}`).join('\n') || '추가 규칙 없음'}"><button id="tDown" ${t <= 0 ? 'disabled' : ''}>−</button><span>☠️ 위협 단계 ${t}</span><button id="tUp" ${t >= tMax ? 'disabled' : ''}>+</button>${t ? `<small>코인 +${t * 10}%</small>` : ''}</div>`
        : '<div class="threat off">☠️ 위협 단계 · 3장을 깨면 열려요</div>'}
      <button class="bigGo go" id="bGo" ${open ? 'data-ncq-main="출격"' : 'disabled'}><span class="gi">⚔️</span>출격</button>
    </div>`,
    bind() {
      const go = c => { if (c < 1 || c > CFG.chapters) return; lobbyCh = c; showLobby(); };
      $('bPrev').onclick = () => go(lobbyCh - 1); $('bNext').onclick = () => go(lobbyCh + 1);
      // 카드나 뒤의 거리를 옆으로 밀어 넘기기
      const area = $('goWrap'); let sx = null;
      area.addEventListener('pointerdown', e => { sx = e.clientX; });
      area.addEventListener('pointerup', e => { if (sx == null) return; const dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 40) go(lobbyCh + (dx < 0 ? 1 : -1)); });
      if ($('tDown')) { $('tDown').onclick = () => { save.threatSel = Math.max(0, t - 1); persist(); showLobby(); }; $('tUp').onclick = () => { save.threatSel = Math.min(tMax, t + 1); persist(); showLobby(); }; }
      $('bGo').onclick = () => { if (open) startRun(lobbyCh, save.threatSel || 0); };
      $('bCrateS').onclick = () => showLobby('shop');
      if ($('bNoAdS')) $('bNoAdS').onclick = () => showLobby('shop');
      if ($('bTest')) $('bTest').onclick = () => startRun(lobbyCh, 0, null, true);
    },
  };
}
// 출격 화면이 작은 휴대폰에서 넘치면 장 그림부터 줄여서 출격 버튼이 스크롤 없이 보이게
function fitGo() {
  const main = $('lbMain'), wrap = $('goWrap'), pic = $('chapPic'); if (!main || !wrap || !pic) return;
  pic.style.height = '';
  const over = wrap.scrollHeight - main.clientHeight;
  if (over > 0) pic.style.height = Math.max(parseFloat(getComputedStyle($('app')).fontSize) * 5, pic.clientHeight - over - 2) + 'px';
}

// ---- 무기고: 장착 칸 4개(첫 칸은 늘 발차기)와 무기 하나를 크게 보고 장착·영구 강화 (강화는 1장 클리어 뒤)
// 장착한 무기만 판 안 선택지에 나오고, 진화(전설) 카드는 영구 Lv5부터 나옴
function lbArmory() {
  fixEquip();
  if (!armSel || !WEAPON_IDS.includes(armSel)) armSel = 'kick';
  const id = armSel, W = WEAPONS[id], own = owns(id), L = permLvl(id), max = L >= CFG.maxPermLevel, cost = lvlCost(L);
  const dmg = lv => Math.round(W.dmg * (1 + CFG.permLevelMul * (lv - 1)));
  const B = BRANCH[id], pair = TRAITS.find(x => x.id === W.evo.trait);
  const unlockCh = CHAPTERS.findIndex(c => c && c.unlock === id);
  const eqIdx = save.equip.indexOf(id), freeIdx = save.equip.indexOf(null), evoOpen = L >= CFG.evoLevel;
  const canEquip = own && !W.fixed && eqIdx < 0;
  let up, eq = '';
  if (!own) up = `<button class="bigGo" disabled>🔒 ${unlockCh}장을 깨면 열려요</button>`;
  else if (!upgradesOpen()) up = '<button class="bigGo" disabled><small>1장을 깨면 열려요</small>🔒 강화</button>';
  else if (max) up = '<button class="bigGo gray" disabled>MAX</button>';
  else up = `<button class="bigGo" id="bUp" ${save.coins < cost ? 'disabled' : ''}>강화 <span class="cost">${coinIc}${cost}</span></button>`;
  if (own) {
    if (W.fixed) eq = '<button class="bigGo gray" disabled><small>첫 칸 고정</small>늘 장착</button>';
    else if (eqIdx >= 0) eq = '<button class="bigGo gray" id="bUnequip"><small>선택지에 안 나와요</small>빼기</button>';
    else if (freeIdx >= 0) eq = '<button class="bigGo green" id="bEquip"><small>선택지에 나와요</small>장착</button>';
    else eq = '<button class="bigGo green" disabled><small>칸이 가득 · 하나를 빼요</small>장착</button>';
  }
  const weak = weakTargets(W.el);
  const slotHtml = save.equip.map((w, i) => w
    ? `<button class="ldSlot ${WEAPONS[w].fixed ? 'fix' : ''}" data-slot="${i}"><img src="${weaponPic(w)}" alt=""><span class="n">${WEAPONS[w].name}</span><span class="s">${WEAPONS[w].fixed ? '기본 무기' : `Lv ${permLvl(w)}`}</span></button>`
    : `<button class="ldSlot emp" data-slot="${i}"><span class="ph">+</span><span class="s">${canEquip ? '눌러서 장착' : '빈 칸'}</span></button>`).join('');
  return {
    html: `
    <div class="banner">무기고</div>
    <div class="box sec"><div class="boxT">장착 무기 ${save.equip.filter(Boolean).length} / ${CFG.maxWeaponSlots}</div>
      <div class="loadout">${slotHtml}</div></div>
    <div class="showcase"><div class="glow"></div><div class="ped"></div><img class="${own ? '' : 'sil'}" src="${weaponPic(id)}" alt=""></div>
    <div class="wPlate"><b>${W.name}</b><span>${own ? `Lv ${L} / ${CFG.maxPermLevel} · 피해 ${dmg(L)}${eqIdx >= 0 ? ' · 장착 중' : ''}` : '잠김'}</span></div>
    <div class="two sec">
      <div class="box"><div class="boxT">다음 레벨</div>
        ${max ? '<div class="bigNum">MAX</div>' : `<div class="bigNum">${dmg(L)} → <b>${dmg(L + 1)}</b></div>`}
        <div class="small">피해 · 레벨마다 +${Math.round(CFG.permLevelMul * 100)}%</div>
        ${!max && L + 1 === CFG.evoLevel ? `<div class="small" style="color:#ffe38a">Lv${CFG.evoLevel}: 진화 카드가 열려요</div>` : ''}
        <div class="pbar"><i style="width:${100 * L / CFG.maxPermLevel}%"></i><span>Lv ${L} / ${CFG.maxPermLevel}</span></div></div>
      <div class="box"><div class="boxT">판 안 강화 미리보기</div>
        <div class="small">희귀 카드 · 갈래</div><div class="brs"><span>🅰️ ${B.a[0]}</span><span>🅱️ ${B.b[0]}</span></div>
        <div class="small">전설 카드 · 진화 (갈래 뒤 · Lv${CFG.evoLevel}부터)</div><div class="evoL ${evoOpen ? '' : 'lock'}">${evoOpen ? '✨' : '🔒'} ${W.evo.name}<small>${evoOpen ? `${pair.icon} ${pair.name} 있으면 3배 잘 나옴` : ''}</small></div><div class="evoL ${L >= CFG.maxPermLevel ? '' : 'lock'}">${L >= CFG.maxPermLevel ? '👑' : '🔒'} ${W.final.name}<small>Lv${CFG.maxPermLevel}</small></div></div>
    </div>
    <div class="weakLine">${weak.length ? `🎯 약점으로 삼는 좀비: <b>${weak.join(' · ')}</b>` : '약점으로 삼는 좀비 없음'}</div>
    <div class="armBtns">${eq}${up}</div>
    <div class="wGrid sec">${WEAPON_IDS.map(w => { const o = owns(w);
      return `<button class="wTile ${w === id ? 'on' : ''} ${o ? '' : 'lock'}" data-w="${w}">${save.equip.includes(w) ? '<span class="eq">장착</span>' : ''}<img src="${weaponPic(w)}" alt=""><span class="n">${WEAPONS[w].name}</span><span class="l">${o ? `Lv ${permLvl(w)}` : '🔒'}</span>${o && upgradesOpen() && permLvl(w) < CFG.maxPermLevel && save.coins >= lvlCost(permLvl(w)) ? '<i class="dot"></i>' : ''}</button>`; }).join('')}</div>`,
    bind() {
      const scr = $('screen');
      scr.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { armSel = b.dataset.w; showLobby(); });
      const equipAt = i => { save.equip[i] = id; persist(); notice = `🎒 ${W.name} 장착 · 판 안 선택지에 나와요`; SFX.select(); showLobby(); };
      // 칸 누르기: 무기가 있으면 그 무기를 보고, 빈 칸이면 지금 보는 무기를 거기에 장착
      scr.querySelectorAll('[data-slot]').forEach(b => b.onclick = () => {
        const i = +b.dataset.slot, cur = save.equip[i];
        if (cur) { armSel = cur; showLobby(); } else if (canEquip) equipAt(i);
      });
      if ($('bEquip')) $('bEquip').onclick = () => equipAt(freeIdx);
      if ($('bUnequip')) $('bUnequip').onclick = () => { save.equip[eqIdx] = null; persist(); notice = `${W.name} 뺌 · 판 안 선택지에 안 나와요`; showLobby(); };
      if ($('bUp')) $('bUp').onclick = () => {
        if (save.coins < cost || max) return;
        save.coins -= cost; save.levels[id] = L + 1; persist();
        notice = `⬆ ${W.name} Lv ${L + 1} · 피해 ${dmg(L + 1)}${L + 1 === CFG.evoLevel ? ' · ✨ 진화 카드 열림' : ''}`; SFX.clear(); buzz('success');
        showLobby();
      };
    },
  };
}

// ---- 도감
const CODEX_GOAL = 30, CODEX_REWARD = 50;   // 좀비마다 약점 처치 30마리를 채우면 코인 50 + 잡동사니 하나
const CODEX_Z = Object.keys(ZT).filter(t => ZT[t].short);                 // 약점이 있는 일반 좀비
const CODEX_B = Object.keys(ZT).filter(t => ZT[t].boss && t !== 'boss');  // 중간 보스·장 보스
function codexPct() {
  const c = save.codex, total = CODEX_Z.length + CODEX_B.length + TRAITS.length + COMBOS.length;
  const got = CODEX_Z.filter(t => (c.z[t] || 0) >= CODEX_GOAL).length + CODEX_B.filter(t => c.z[t]).length + c.items.length + c.links.length;
  return Math.round(100 * got / total);
}
const LINK_NAME = { '🧊→🏏': '산산조각 연계!', '🛢️→🔥': '대폭발!', '💧→⚡': '감전 연쇄!', '🔥→💣': '불꽃 파편!' };
function lbCodex() {
  const c = save.codex, zDone = CODEX_Z.filter(t => (c.z[t] || 0) >= CODEX_GOAL).length;
  const unk = (name = '미발견') => `<div class="zCard unk"><div class="zn">???</div><div class="zpw"><span class="q">?</span></div><div class="unkL">${name}</div></div>`;
  let body = '';
  if (codexSeg === 'z') body = `<div class="zGrid">${CODEX_Z.map(t => {

const weekIndex = () => { const d = new Date(); return Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(2024, 0, 1)) / 86400000 / 7); };

  return { key, seed, rule, ch: 1 + Math.floor(R() * CFG.chapters), surv: survs[Math.floor(R() * survs.length)], weapon: weapons[Math.floor(R() * weapons.length)], threat: 3 };
}
function weeklyCanPlay() { return weeklyOpen() && !(save.weekly && save.weekly.key === weeklySetup().key); }

function updateHUD() {
  const inRun = !!run;

  $('traits').innerHTML = tagChips + run.traits.map(id => { const t = TRAITS.find(t => t.id === id); return `<span class="chip" title="${t.name}: ${t.desc}">${t.icon}</span>`; }).join('');
  const total = turnActions();

    + (run.combo > 0 ? `<span class="cb">${run.combo + 1}콤보 +${Math.round(comboStep() * run.combo * 100)}%</span>` : '')
    + (inc > 0 || hid ? `<span class="inc">좀비 차례 -${inc}${hid ? ' +❓' : ''}</span>` : '');
  $('endTurn').disabled = run.state !== 'battle';

    const best = run.state === 'battle' || run.state === 'enemy' ? slots.reduce((m, z, i) => (z && !z.dead ? Math.max(m, predictHit(w, z, i).mul) : m), 0) : 0;
    html += `<div class="card el-${W.el} ${on ? 'now' : ''} ${w.evo ? 'evo' : ''} ${canUse(w) ? '' : 'off'}" data-w="${idx}">

  hand.querySelectorAll('[data-w]').forEach(el => el.onpointerdown = () => {

function slotAtScreen(e) {
  const r = cv.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  const half = Math.abs(project(slotX(1), 0, 0).x - project(slotX(0), 0, 0).x) / 2;
  let best = -1, bd = 1e9;
  for (let i = 0; i < CFG.slots; i++) {
    const z = alive(i);
    const top = z ? zTop(z) + 0.2 : 1.2;
    const a = project(slotX(i), 0, 0), b = project(slotX(i), top, 0);
    if (py < b.y - 10 || py > a.y + 20) continue;
    const d = Math.abs(px - a.x);
    if (d < half * (z && ZT[z.type].big ? 1.3 : 1) && d < bd) { bd = d; best = i; }
  }
  return best;
}
cv.addEventListener('pointermove', e => { hoverSlot = slotAtScreen(e); });
cv.addEventListener('pointerleave', () => { hoverSlot = -1; });
cv.addEventListener('pointerdown', e => {
  if (run && run.state === 'enter') return skipEnter();   // 걸어오는 중에 누르면 바로 자리에 세움
  if (!run || run.state !== 'battle' || gt < lockUntil) return;
  const s = slotAtScreen(e);
  if (s < 0 || !alive(s)) return;
  const w = curWeapon();
  if (!canUse(w)) { setMsg(run.actionsLeft < wCost(w) ? `행동이 모자라요 (${wName(w)}는 행동 ${wCost(w)})` : `${wName(w)}는 이번 줄에 다 썼어요`); SFX.select(); return; }
  useWeapon(s);
});

// 지금 무기가 맞힐 칸 (마우스를 올렸을 때 미리보기)
function previewSlots(target) {
  const w = curWeapon();
  if (WEAPONS[w.id].motion === 'throw' && curW() === 'wind') { target += run.windDir; if (!alive(target)) return []; }   // 돌풍: 밀려 떨어질 칸
  const out = new Set([target]);
  const add = s => { if (s >= 0 && s < CFG.slots) out.add(s); };
  if (w.id === 'bat') { const n = nextAliveFrom(target, nextAliveFrom(target, 1) >= 0 ? 1 : -1); add(n); }
  if (w.id === 'axe') { if (w.evo) for (let i = 0; i < CFG.slots; i++) add(i); else for (let i = 1; i <= (brA(w) ? 2 : 1); i++) add(target + i); }
  if (w.id === 'grenade') { const rad = brA(w) ? 2 : 1; for (let k = 1; k <= rad; k++) { add(target - k); add(target + k); } }
  if ((w.id === 'molotov' || w.id === 'freezer') && brA(w)) { add(target - 1); add(target + 1); }

  hand() { return run.weapons.map((w, j) => ({ k: j, id: w.id, ok: canUse(w), el: WEAPONS[w.id].el, hits: slots.map((z, i) => (z && !z.dead ? predictHit(w, z, i).dmg : 0)) })); }, regen() { genRow(run.row); updateHUD(); },
  put(i, type, hp, opts) { if (slots[i]) removeView(slots[i]); slots[i] = makeZombie(type, hp, 0, 3, opts || {}); return slots[i]; },
  clear() { clearRow(); },
  card(c) { applyChoice(c, () => { hideOverlay(); run.state = 'battle'; }); },   // 시험용: 카드 하나 바로 적용
  roll(o) { return rollChoices(o || {}); },
  weather(w) { for (let r = 1; r <= CFG.rows; r++) run.weather[r] = w; setWeatherLook(w); applyWeatherToRow(); planIntents(); updateHUD(); },
  relic() { showRelicChoice('시험', () => { hideOverlay(); run.state = 'battle'; }); },
  gain(id) { gainItem(id); updateHUD(); },
  predict(k, i) { return predictHit(run.weapons[k], slots[i], i); },
  // 그리기 시간 재기 (ms/장): 후처리 켬·끔 비교
  bench(n = 30) {
    const gl = renderer.getContext(), px = new Uint8Array(4);
    const time = fn => { fn(); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); const t = performance.now(); for (let i = 0; i < n; i++) fn(); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); return +((performance.now() - t) / n).toFixed(2); };
    return { fx: FX ? time(() => FX.render()) : null, plain: time(() => { renderer.setRenderTarget(null); renderer.render(scene, camera); }) };
  },
  // 자동 시험용: 화면 갱신 없이 게임 시간을 sec초 앞으로 돌림 (창이 가려져 브라우저가 화면 갱신을 늦출 때)
  advance(sec) {
    const step = 1 / 30;
    for (let t = 0; t < sec; t += step) {
      timeScale = 1; hitStopUntil = 0; gt += step;
      const due = scheduled.filter(s => s.t <= gt); scheduled = scheduled.filter(s => s.t > gt);
      due.sort((a, b) => a.t - b.t).forEach(s => s.fn());
      update(step, step);
    }
  } };

showLobby();
