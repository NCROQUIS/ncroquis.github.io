<!doctype html>
<html>
<head>
  <script src="./ncq/safe.js"></script>
  <meta charset="utf-8"><style id="ncq-no-zoom">*{touch-action:manipulation}</style><script src="ncq-flags.js"></script><script src="ncq-ads.js"></script><script src="ncq-iap.js"></script><script src="ncq-feedback.js"></script><script src="ncq-share.js"></script><script src="ncq-auth.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#f8f5eb">
  <title>맞짱 바둑 · Baduk Duel</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./assets/match-ui/chrome.css">
  <link rel="stylesheet" href="./omok.css">
  <link rel="stylesheet" href="./style.css">
  <script src="./ncq/save.js"></script>
  <script src="./ncq/sound.js"></script>
  <script src="./ncq/auth-sdk.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <svg class="board-grid-definitions" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="nav-ranking" viewBox="0 0 24 24">
        <path d="M7 3h10v5a5 5 0 0 1-10 0V3Zm0 2H3v2a4 4 0 0 0 4 4m10-6h4v2a4 4 0 0 1-4 4m-5 2v6m-4 2h8m-6-2h4"
              fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="nav-play" viewBox="0 0 24 24">
        <circle cx="8.5" cy="9" r="5.5" fill="currentColor"/>
        <circle cx="16" cy="15" r="5.5" fill="currentColor" fill-opacity=".55" stroke="#faf8f4" stroke-width="1.3"/>
      </symbol>
      <symbol id="nav-records" viewBox="0 0 24 24">
        <path d="M7 3h13v16H7zM4 6v16h13M10 7h7m-7 4h7m-7 4h4"
              fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="nav-friends" viewBox="0 0 24 24">
        <circle cx="9" cy="7" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M3 19v-2a6 6 0 0 1 12 0v2H3Zm13-15a3 3 0 0 1 0 6m1 3a5 5 0 0 1 4 5v1h-3"
              fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
        <path d="M9.5 3h5l.5 2.5 1.3.8 2.5-.8 2.5 4.3-2 1.7v1l2 1.7-2.5 4.3-2.5-.8-1.3.8-.5 2.5h-5l-.5-2.5-1.3-.8-2.5.8-2.5-4.3 2-1.7v-1l-2-1.7 2.5-4.3 2.5.8 1.3-.8z"/>
        <circle cx="12" cy="12" r="2.8"/>
      </symbol>
      <symbol id="records-person" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2z"/>
      </symbol>
      <symbol id="records-star" viewBox="0 0 24 24">
        <path d="m12 3 2.8 5.7 6.3.9-4.6 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2-4.6-4.4 6.3-.9z"/>
      </symbol>
      <symbol id="records-back-icon" viewBox="0 0 24 24"><path d="M20 12H4m7-7-7 7 7 7"/></symbol>
      <symbol id="records-share-icon" viewBox="0 0 24 24">
        <path d="M12 15V3M7.5 7.5 12 3l4.5 4.5M7 10H4v11h16V10h-3"/>
      </symbol>
      <symbol id="result-loss-icon" viewBox="0 0 24 24">
        <path d="M12 3 4 6v5a10 10 0 0 0 8 10 10 10 0 0 0 8-10V6l-8-3Zm0 5v7m-3-3 3 3 3-3"
              fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="result-draw-icon" viewBox="0 0 24 24">
        <path d="M6 9h12M6 15h12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
      <path id="board-line-path" vector-effect="non-scaling-stroke" d="M.5 .5H14.5V14.5H.5Z
        M.5 1.5H14.5 M.5 2.5H14.5 M.5 3.5H14.5 M.5 4.5H14.5 M.5 5.5H14.5
        M.5 6.5H14.5 M.5 7.5H14.5 M.5 8.5H14.5 M.5 9.5H14.5 M.5 10.5H14.5
        M.5 11.5H14.5 M.5 12.5H14.5 M.5 13.5H14.5
        M1.5 .5V14.5 M2.5 .5V14.5 M3.5 .5V14.5 M4.5 .5V14.5 M5.5 .5V14.5
        M6.5 .5V14.5 M7.5 .5V14.5 M8.5 .5V14.5 M9.5 .5V14.5 M10.5 .5V14.5
        M11.5 .5V14.5 M12.5 .5V14.5 M13.5 .5V14.5"/>
      <g id="board-engraving">
        <use class="board-line-highlight" href="#board-line-path" x=".033" y=".033"/>
        <use href="#board-line-path"/>
      </g>
    </defs>
  </svg>

  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="mark" aria-hidden="true"></span><span data-i18n="title"></span></div>
      <div class="header-tools">
        <span class="lobby-wallet"><span class="shop-coin" aria-hidden="true"></span><strong id="coins">0</strong></span>
        <button id="open-skins" class="shop-button" data-i18n="skins"></button>
        <button id="show-options" class="quiet" data-i18n-attr="aria-label:settings"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#settings-icon"/></svg></button>
      </div>
    </header>
    <main>
      <section id="lobby" class="lobby">
        <button id="open-missions" class="mission-shortcut">
          <span class="mission-shortcut-icon" aria-hidden="true">🎁</span>
          <span class="mission-shortcut-content"><strong data-i18n="dailyMissions"></strong><small id="mission-summary"></small></span>
          <span class="chevron" aria-hidden="true">›</span>
        </button>
        <div class="baduk-hero">
          <div class="hero-heading"><h1 data-i18n="quickTitle"></h1><p data-i18n="quickSubtitle"></p></div>
          <div id="hero-board" class="hero-board" data-board-style="wood" data-stone-style="reference" aria-hidden="true"><div class="mini-grid"></div></div>
          <div class="hero-rules"><span data-i18n="nineBoard"></span><span data-i18n="timeRule"></span><span data-i18n="komiRule"></span></div>
        </div>
        <button id="resume-game" class="secondary" hidden data-i18n="resumeGame"></button>
        <div class="lobby-bottom">
          <button id="player-profile" class="player-card"><span class="player-avatar"><svg viewBox="0 0 24 24"><use href="#records-person"/></svg></span><span class="player-summary"><strong id="profile-name"></strong><small id="profile-record"></small></span><span class="chevron" aria-hidden="true">›</span></button>
          <button id="quick-play" class="primary" data-ncq-main="빠른 대국" data-i18n="quickPlay"></button>
          <div class="lobby-secondary"><button id="open-practice" class="secondary" data-i18n="practice"></button><button id="open-tutorial" class="secondary" data-i18n="learn"></button></div>
        </div>
      </section>
      <section id="records-page" class="page" hidden><div class="page-heading"><h1 data-i18n="myRecords"></h1><small data-i18n="recordsHint"></small></div><div id="records-list" class="scroll-list"></div></section>
      <section id="rankings-page" class="page" hidden><div class="page-heading"><h1 data-i18n="rankings"></h1><small data-i18n="rankingsHint"></small></div><div id="rankings-list" class="scroll-list"></div><button id="refresh-rankings" class="primary" data-ncq-main="랭킹 새로고침" data-i18n="refresh"></button></section>
      <section id="match" class="match baduk-match" hidden data-playing>
        <div class="baduk-match-heading"><button id="match-home" class="match-art-action" data-i18n-attr="aria-label:back">‹</button><strong id="match-title"></strong><button id="match-help" class="match-art-action" data-i18n-attr="aria-label:rules">?</button></div>
        <div id="top-player" class="match-player match-art-panel"><span class="match-avatar match-art-avatar"><svg viewBox="0 0 24 24"><use href="#records-person"/></svg></span><span class="match-identity"><strong class="name"></strong><span class="seat"><i class="stone"></i><span class="color"></span></span></span><i class="match-art-divider"></i><div class="match-art-gauge"><span class="player-clock"></span><small class="captures"></small></div></div>
        <div class="board-slot"><div id="board" class="board selectable" data-board-style="wood" data-stone-style="reference" data-grid-style="engraved"><div id="board-grid" class="board-grid" role="grid" data-i18n-attr="aria-label:boardLabel"></div></div></div>
        <div id="bottom-player" class="match-player match-art-panel"><span class="match-avatar match-art-avatar"><svg viewBox="0 0 24 24"><use href="#records-person"/></svg></span><span class="match-identity"><strong class="name"></strong><span class="seat"><i class="stone"></i><span class="color"></span></span></span><i class="match-art-divider"></i><div class="match-art-gauge"><span class="player-clock"></span><small class="captures"></small></div></div>
        <div class="baduk-controls">
          <p id="match-message" class="baduk-status" role="status" aria-live="polite"></p>
          <div id="scoring-summary" class="score-strip" hidden></div>
          <div id="play-controls" class="baduk-action-row"><button id="pass" class="match-art-action" data-i18n="pass"></button><button id="place" class="match-art-gauge" data-active="true" data-ncq-main="착수 확인" data-i18n="place" disabled></button><button id="resign" class="match-art-action" data-i18n="resign"></button></div>
          <div id="score-controls" class="baduk-action-row" hidden><button id="resume-play" class="match-art-action" data-i18n="morePlay"></button><button id="confirm-score" class="match-art-gauge" data-active="true" data-ncq-main="계가 확인" data-i18n="confirmScore"></button></div>
          <div id="review-controls" hidden><div class="replay-toolbar"><button data-step="first" class="match-art-action" data-i18n-attr="aria-label:first">|‹</button><button data-step="previous" class="match-art-action" data-i18n-attr="aria-label:previous">‹</button><span id="review-step"></span><button data-step="next" class="match-art-action" data-i18n-attr="aria-label:next">›</button><button data-step="last" class="match-art-action" data-i18n-attr="aria-label:last">›|</button><button id="move-numbers" class="match-art-action" aria-pressed="false" data-i18n="numbers"></button></div><div class="review-bottom"><button id="share-record" class="match-art-action" data-i18n="share"></button><button id="rematch" class="match-art-gauge" data-active="true" data-ncq-main="다시 두기" data-i18n="rematch"></button><button id="review-home" class="match-art-action" data-i18n="lobby"></button></div></div>
        </div>
      </section>
    </main>
    <nav id="navigation" class="lobby-nav" data-i18n-attr="aria-label:navigation"><button data-page="rankings" aria-current="false"><svg viewBox="0 0 24 24"><use href="#nav-ranking"/></svg><span data-i18n="rankings"></span></button><button data-page="lobby" aria-current="page"><svg viewBox="0 0 24 24"><use href="#nav-play"/></svg><span data-i18n="play"></span></button><button data-page="records" aria-current="false"><svg viewBox="0 0 24 24"><use href="#nav-records"/></svg><span data-i18n="records"></span></button></nav>
  </div>
  <dialog id="practice-dialog" class="baduk-dialog"><form method="dialog"><div class="dialog-heading"><h2 data-i18n="practice"></h2><button class="quiet" data-i18n-attr="aria-label:close">✕</button></div></form><label class="option-row"><span data-i18n="opponent"></span><select id="practice-mode"><option value="ai" data-i18n="aiOpponent"></option><option value="local" data-i18n="localOpponent"></option></select></label><label class="option-row"><span data-i18n="difficulty"></span><select id="difficulty"><option value="0" data-i18n="level0"></option><option value="1" data-i18n="level1"></option><option value="2" data-i18n="level2"></option><option value="3" data-i18n="level3"></option></select></label><label class="option-row"><span data-i18n="myColor"></span><select id="my-color"><option value="1" data-i18n="black"></option><option value="2" data-i18n="white"></option></select></label><button id="start-practice" class="primary" data-ncq-main="연습 시작" data-i18n="start"></button></dialog>
  <dialog id="options" class="baduk-dialog"><form method="dialog"><div class="dialog-heading"><h2 data-i18n="settings"></h2><button class="quiet" data-i18n-attr="aria-label:close">✕</button></div></form><label class="option-row"><span data-i18n="language"></span><select id="language"></select></label><label class="option-row"><span data-i18n="sound"></span><input id="sound" type="checkbox"></label><label class="option-row"><span data-i18n="helpers"></span><input id="helpers" type="checkbox"></label><label class="option-row"><span data-i18n="nickname"></span><input id="nickname" maxlength="18" autocomplete="nickname"></label><button id="save-options" class="primary" data-ncq-main="설정 저장" data-i18n="save"></button><button id="send-feedback" class="secondary" hidden data-i18n="feedback"></button><small id="app-version" class="version"></small></dialog>
  <dialog id="skins-dialog" class="baduk-dialog"><form method="dialog"><div class="dialog-heading"><h2 data-i18n="skins"></h2><button class="quiet" data-i18n-attr="aria-label:close">✕</button></div></form><div id="skins-list" class="skins-list"></div><p id="skin-message" role="status"></p></dialog>
  <dialog id="missions-dialog" class="baduk-dialog"><form method="dialog"><div class="dialog-heading"><h2 data-i18n="dailyMissions"></h2><button class="quiet" data-i18n-attr="aria-label:close">✕</button></div></form><p id="mission-progress"></p><div id="missions-list"></div></dialog>
  <dialog id="confirm-dialog" class="baduk-dialog"><h2 id="confirm-title"></h2><p id="confirm-text"></p><div class="dialog-actions"><button id="confirm-no" class="secondary" data-i18n="cancel"></button><button id="confirm-yes" class="primary" data-ncq-main="확인" data-i18n="confirm"></button></div></dialog>
  <dialog id="result" class="baduk-dialog result-dialog"><div class="result-stones" aria-hidden="true"><i class="stone black"></i><i class="stone white"></i></div><h2 id="result-title"></h2><p id="result-subtitle"></p><div id="result-score"></div><button id="open-review" class="primary" data-ncq-main="복기 보기" data-i18n="review"></button></dialog>
  <dialog id="matching" class="baduk-dialog"><div class="matching-stones" aria-hidden="true"><i class="stone black"></i><i class="stone white"></i></div><h2 data-i18n="matching"></h2><p id="matching-message"></p><button id="cancel-match" class="secondary" data-ncq-main="매칭 취소" data-i18n="cancel"></button></dialog>
  <dialog id="tutorial-dialog" class="baduk-dialog tutorial-dialog"><form method="dialog"><div class="dialog-heading"><h2 data-i18n="learn"></h2><button class="quiet" data-i18n-attr="aria-label:close">✕</button></div></form><p id="tutorial-title"></p><div id="tutorial-board" class="tutorial-board" role="group" data-i18n-attr="aria-label:tutorialBoard"></div><p id="tutorial-message" role="status"></p><button id="tutorial-next" class="primary" data-ncq-main="입문 다음 단계" data-i18n="next"></button></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
