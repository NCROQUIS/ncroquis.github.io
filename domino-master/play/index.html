<title>도미노 마스터</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:#062b17;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:#fff}
body{display:flex;align-items:center;justify-content:center}
#app{position:relative;width:min(100vw,calc(100dvh * 9 / 16));aspect-ratio:9/16;container-type:size;overflow:hidden;
  background:radial-gradient(ellipse 75% 55% at 50% 45%,#0fb35a 0%,#079246 38%,#056b33 75%,#04512a 100%)}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;
  background-image:radial-gradient(rgba(0,0,0,.35) 1px,transparent 1px);background-size:3px 3px}
.abs{position:absolute}
/* 상단 */
#top{left:0;right:0;top:0;height:21cqw;z-index:5}
.circBtn{position:absolute;top:2.5cqw;width:11cqw;height:11cqw;border-radius:50%;background:rgba(0,40,18,.55);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s}
.circBtn:active{transform:scale(.9)}
.circBtn svg{width:6.6cqw;height:6.6cqw;fill:#fff}
#btnHome{left:2.5cqw}#btnSet{right:2.5cqw}
.score{position:absolute;top:2cqw;width:20cqw;text-align:center;font-weight:700}
.score .lb{font-size:4cqw;opacity:.95}.score .v{font-size:5.6cqw;line-height:1.15}
#scP{left:17.5cqw}#scA{right:17.5cqw}
#target{position:absolute;top:2cqw;left:50%;transform:translateX(-50%);text-align:center;font-weight:800}
#target .t{font-size:6.2cqw;color:#ffe94a;line-height:1.05;text-shadow:0 .3cqw .6cqw rgba(0,0,0,.25)}
#target .r{font-size:3.4cqw;font-weight:700}
#oppHand{left:10cqw;right:10cqw;top:13.5cqw;height:6cqw;display:flex;justify-content:center;gap:1cqw;overflow:hidden}
#oppHand .back{flex:0 0 auto;height:9cqw;border-radius:1.6cqw;background:linear-gradient(180deg,#fff 0%,#eceff1 60%,#d9dde0 100%);box-shadow:0 .4cqw .8cqw rgba(0,0,0,.3)}
#oppHand.reveal{height:16cqw;overflow:visible;z-index:6}
#oppHand.reveal svg{height:14cqw;width:auto;flex:0 0 auto;filter:drop-shadow(0 .4cqw .6cqw rgba(0,0,0,.35))}
#topLine{left:10cqw;right:10cqw;top:19.5cqw;height:.3cqw;background:rgba(255,255,255,.85)}
#bone{left:2.8cqw;top:20.5cqw;width:9cqw;height:13cqw;border-radius:2cqw;background:rgba(0,40,18,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;z-index:4;transition:transform .15s}
#bone svg{width:6.4cqw;height:6cqw}
#bone b{font-size:4cqw;line-height:1.1}
#bone.pulse{animation:pulse 1s infinite;box-shadow:0 0 0 .6cqw #ffe94a}
#bone.empty{opacity:.45}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.avatar{width:12cqw;height:12cqw;border-radius:50%;overflow:hidden;border:.6cqw solid rgba(255,255,255,.85);box-shadow:0 .5cqw 1cqw rgba(0,0,0,.35);background:#2bb7d6;transition:box-shadow .2s}
.avatar.active{box-shadow:0 0 0 .8cqw #ffe94a,0 .5cqw 1cqw rgba(0,0,0,.35)}
#avA{right:2.5cqw;top:21cqw}
#avP{left:2.5cqw;top:121cqw;width:13cqw;height:13cqw;background:#2a3b46;z-index:3}
#avA.think::after{content:"";}
/* 보드 */
#board{left:2cqw;right:2cqw;top:35cqw;height:80cqw}
.tile{position:absolute;transition:left .38s cubic-bezier(.2,.8,.3,1),top .38s cubic-bezier(.2,.8,.3,1),width .38s,height .38s;filter:drop-shadow(0 .35cqw .5cqw rgba(0,0,0,.35))}
.tile svg{width:100%;height:100%;display:block}
.tile.new{animation:land .4s ease-out}
@keyframes land{0%{filter:drop-shadow(0 2cqw 2cqw rgba(0,0,0,.4))}100%{}}
.ghost{position:absolute;border:.6cqw dashed #ffe94a;border-radius:1.5cqw;background:rgba(255,233,74,.22);cursor:pointer;animation:gl 1s infinite;z-index:3}
@keyframes gl{0%,100%{opacity:.6}50%{opacity:1}}
/* 메시지 바 */
#msgBar{left:0;right:0;top:122cqw;height:11cqw;display:flex;align-items:center;justify-content:center;
  border-top:.25cqw solid rgba(255,255,255,.35);border-bottom:.25cqw solid rgba(255,255,255,.25);
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.12) 20%,rgba(0,0,0,.12) 80%,transparent)}
#msg{font-size:5.2cqw;font-weight:600;text-align:center;padding:0 16cqw;text-shadow:0 .3cqw .6cqw rgba(0,0,0,.3)}
#drawBtn{position:absolute;right:3cqw;top:50%;transform:translateY(-50%);display:none;background:#ffe94a;color:#3a2c00;border:none;font-weight:800;font-size:3.6cqw;padding:1.8cqw 3cqw;border-radius:5cqw;cursor:pointer;box-shadow:0 .5cqw 0 #b8a020}
#drawBtn.show{display:block}
#hand{left:0;right:0;top:135cqw;bottom:0;background:rgba(0,0,0,.14);border-top:.3cqw solid rgba(255,255,255,.85);display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:1.6cqw;padding:2cqw 3cqw}
.htile{width:var(--hw,13cqw);aspect-ratio:1/2;cursor:pointer;transition:transform .18s,filter .18s;filter:drop-shadow(0 .5cqw .6cqw rgba(0,0,0,.4))}
.htile svg{width:100%;height:100%;display:block}
.htile.ok{transform:translateY(-1.6cqw)}
.htile.ok svg rect.bg{stroke:#ffe94a;stroke-width:5}
.htile.no{filter:brightness(.55) drop-shadow(0 .5cqw .6cqw rgba(0,0,0,.4))}
.htile.sel{transform:translateY(-4cqw) scale(1.05)}
.htile.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-1.2cqw)}75%{transform:translateX(1.2cqw)}}
/* 모달 */
.modal{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:20}
.modal.show{display:flex}
.card{width:78cqw;background:linear-gradient(180deg,#fff,#eef3f0);color:#16351f;border-radius:5cqw;padding:7cqw 6cqw 6cqw;text-align:center;box-shadow:0 2cqw 6cqw rgba(0,0,0,.45);animation:pop .3s ease-out}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.card h2{font-size:8cqw;margin-bottom:2cqw}
.card p{font-size:4.2cqw;line-height:1.5;color:#35523f}
.card .big{font-size:10cqw;font-weight:800;color:#0b8a43;margin:2cqw 0}
.btn{display:block;width:100%;margin-top:3.5cqw;border:none;border-radius:4cqw;padding:3.6cqw;font-size:4.8cqw;font-weight:800;cursor:pointer;background:#10a653;color:#fff;box-shadow:0 1cqw 0 #097236}
.btn.sub{background:#dfe7e2;color:#24432f;box-shadow:0 1cqw 0 #b7c4bc}
.btn:active{transform:translateY(.6cqw);box-shadow:none}
.row{display:flex;gap:2cqw;margin-top:2.5cqw}
.opt{flex:1;border:.5cqw solid #cdd9d2;background:#fff;border-radius:3cqw;padding:2.6cqw 0;font-size:4.2cqw;font-weight:700;color:#35523f;cursor:pointer}
.opt.on{border-color:#10a653;background:#e2f6ea;color:#0b7a3b}
.lbl{font-size:3.8cqw;font-weight:700;text-align:left;margin-top:4cqw;color:#4d6957}
/* 타이틀 */
#title{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse 80% 60% at 50% 40%,#13c264,#06783a 70%,#04512a)}
#title h1{font-size:13cqw;font-weight:900;letter-spacing:-.3cqw;text-shadow:0 1.2cqw 0 rgba(0,0,0,.2);margin-top:4cqw}
#title .sub{font-size:4.2cqw;opacity:.9;margin-top:1cqw}
#title .logo{display:flex;gap:3cqw;transform:rotate(-8deg)}
#title .logo svg{width:17cqw;height:34cqw;filter:drop-shadow(0 1.2cqw 1cqw rgba(0,0,0,.35))}
#title .logo svg:nth-child(2){transform:translateY(-4cqw) rotate(12deg)}
#title .panel{width:76cqw;margin-top:8cqw}
#title .lbl{color:#e6ffef}
#title .opt{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.35)}
#title .opt.on{background:#fff;color:#0b7a3b;border-color:#fff}
#title .btn{font-size:6cqw;padding:4.5cqw;background:#ffe94a;color:#3a2c00;box-shadow:0 1.2cqw 0 #b8a020;margin-top:7cqw}
.toast{position:absolute;left:50%;top:70cqw;transform:translate(-50%,-50%);background:rgba(0,0,0,.72);padding:3cqw 6cqw;border-radius:6cqw;font-size:4.6cqw;font-weight:700;z-index:15;pointer-events:none;opacity:0;transition:opacity .25s}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div id="top" class="abs">
    <button class="circBtn" id="btnHome" aria-label="홈"><svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg></button>
    <div class="score" id="scP"><div class="lb">당신</div><div class="v" id="scPv">0</div></div>
    <div id="target"><div class="t" id="tgt">100</div><div class="r" id="rnd">라운드 1</div></div>
    <div class="score" id="scA"><div class="lb">상대</div><div class="v" id="scAv">0</div></div>
    <button class="circBtn" id="btnSet" aria-label="설정"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.3 7.3 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.3 7.3 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.3 7.3 0 0 0 1.7 1L11 21h4l.4-2.9a7.3 7.3 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button>

  <div id="oppHand" class="abs"></div>
  <div id="topLine" class="abs"></div>
  <div id="bone" class="abs" title="더미"><svg viewBox="0 0 40 36"><g transform="rotate(-14 14 20)"><rect x="4" y="6" width="13" height="26" rx="2.5" fill="#fff"/><line x1="6" y1="19" x2="15" y2="19" stroke="#999"/><circle cx="8" cy="10" r="1.6"/><circle cx="13" cy="15" r="1.6"/><circle cx="8" cy="24" r="1.6"/><circle cx="13" cy="28" r="1.6"/></g><g transform="rotate(6 26 18)"><rect x="17" y="3" width="13" height="26" rx="2.5" fill="#fff"/><line x1="19" y1="16" x2="28" y2="16" stroke="#999"/><circle cx="23.5" cy="9.5" r="1.6"/><circle cx="20.5" cy="21" r="1.6"/><circle cx="26.5" cy="25" r="1.6"/></g><g transform="rotate(20 33 18)"><rect x="27" y="5" width="11" height="24" rx="2.5" fill="#f4f4f4"/></g></svg><b id="boneN">14</b></div>

  <div id="board" class="abs"></div>
  <div id="msgBar" class="abs"><div id="msg">당신 차례입니다</div><button id="drawBtn">가져오기</button></div>
  <div id="avP" class="abs avatar"></div>
  <div id="hand" class="abs"></div>
  <div class="toast" id="toast"></div>

  <div class="modal" id="mRound"><div class="card">
    <h2 id="mrT">라운드 승리!</h2><p id="mrD"></p><div class="big" id="mrS">+0</div><p id="mrTot"></p>
    <button class="btn" id="mrBtn">다음 라운드</button>
  </div></div>

  <div class="modal" id="mSet"><div class="card">
    <h2>설정</h2>
    <div class="lbl">상대 난이도</div>
    <div class="row" id="setDiff"><button class="opt" data-v="easy">쉬움</button><button class="opt" data-v="normal">보통</button></div>
    <div class="lbl">효과음</div>
    <div class="row" id="setSnd"><button class="opt" data-v="1">켜기</button><button class="opt" data-v="0">끄기</button></div>
    <button class="btn" id="setClose">계속하기</button>
    <button class="btn sub" id="setNew">새 게임</button>
  </div></div>

  <div class="modal" id="mHome"><div class="card">
    <h2>처음 화면으로</h2><p>진행 중인 게임은 사라져요.<br>나가시겠어요?</p>
    <button class="btn" id="homeYes">나가기</button><button class="btn sub" id="homeNo">계속하기</button>
  </div></div>

  <div id="title">
    <div class="logo" id="logo"></div>
    <h1>도미노 마스터</h1>
    <div class="sub">클래식 드로우 도미노</div>
    <div class="panel">
      <div class="lbl">목표 점수</div>
      <div class="row" id="tTarget"><button class="opt" data-v="100">100</button><button class="opt" data-v="150">150</button><button class="opt" data-v="200">200</button></div>
      <div class="lbl">상대 난이도</div>
      <div class="row" id="tDiff"><button class="opt" data-v="easy">쉬움</button><button class="opt" data-v="normal">보통</button></div>
      <button class="btn" id="btnStart">게임 시작</button>
    </div>
  </div>
</div>
