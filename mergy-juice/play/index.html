<!doctype html><html lang="ko"><head><meta charset="utf-8"><script src="ncq-flags.js"></script><script src="ncq-ads.js"></script><script src="ncq-iap.js"></script><script src="ncq-feedback.js"></script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#125f5c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="description" content="해변에서 즐기는 주스 머지 게임. 조준하고 던지고 합쳐보세요."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png"><title>Juicy Merge · 주시 머지</title><link rel="stylesheet" href="style.css"></head><body><main id="app" class="options-hidden"><div id="playfield"><canvas id="game" tabindex="-1" width="720" height="1280" aria-label="주스를 위로 던져 같은 주스와 합성하는 게임"></canvas><header><div class="header-actions"><button id="optionsToggle" class="round options-toggle" type="button" aria-controls="physicsControls sizeControls" aria-expanded="false" aria-label="조절 옵션 보이기" title="조절 옵션 보이기"><span aria-hidden="true">☷</span></button><button id="collectionReset" class="round collection-reset" type="button" aria-label="주스 콜렉션 초기화" title="주스 콜렉션 초기화">↺</button><button id="settings" class="round" aria-label="설정">☰</button></div></header><section id="physicsControls" class="physics-controls" aria-label="충돌 효과 설정"><label for="rebound">반발 <output id="reboundValue" for="rebound">5%</output><input id="rebound" type="range" min="0" max="100" step="1" value="5"></label><label for="slide">미끄러짐 <output id="slideValue" for="slide">4%</output><input id="slide" type="range" min="0" max="100" step="1" value="4"></label><label for="shake">흔들림 <output id="shakeValue" for="shake">15%</output><input id="shake" type="range" min="0" max="100" step="1" value="15"></label><label for="knockback">튕겨나감 <output id="knockbackValue" for="knockback">8%</output><input id="knockback" type="range" min="0" max="100" step="1" value="8"></label><label for="snap">머지 스냅 <output id="snapValue" for="snap">4%</output><input id="snap" type="range" min="0" max="100" step="1" value="4"></label></section><div id="sizeControls" class="size-controls"><label for="collisionHeight">충돌 높이 <output id="collisionHeightValue">38%</output><input id="collisionHeight" type="range" min="5" max="100" value="38"></label><label for="collisionWidth">충돌 너비 <output id="collisionWidthValue">96%</output><input id="collisionWidth" type="range" min="5" max="100" value="96"></label><label for="objectScale">오브젝트 크기 <output id="objectScaleValue">83%</output><input id="objectScale" type="range" min="20" max="100" value="83"></label><label for="moveSpeed">이동 속도 <output id="moveSpeedValue">103%</output><input id="moveSpeed" type="range" min="20" max="200" value="103"></label><label for="placedPush">놓인 주스 밀림 <output id="placedPushValue" for="placedPush">20%</output><input id="placedPush" type="range" min="0" max="100" step="1" value="20"></label></div><section class="mission"><canvas class="mission-art" aria-hidden="true"></canvas><div class="mission-icon">✦</div><div class="mission-info"><div class="mission-top"><span id="stage">MISSION 01</span><span id="best">BEST 0</span></div><strong id="missionText">햇살을 담은 첫 한 잔</strong><div class="progress"><div id="fill"></div></div><div class="mission-bottom"><span id="goal">주스를 합쳐 300점 달성</span><b id="score">0 / 300</b></div></div><div id="missionComplete" role="status" aria-atomic="true"></div></section><div id="toast" role="status">같은 주스끼리 만나면 한 단계 UP!</div><div class="table-label">FRESHLY SQUEEZED, HAPPILY MERGED</div><div class="launch-label">SLIDE LEFT / RIGHT <span>·</span> RELEASE · STRAIGHT AHEAD</div><footer><div class="next"><small>NEXT</small><canvas id="next" width="90" height="100"></canvas></div><div class="evolution"><div><small>JUICE COLLECTION</small><span id="collection">3 / 11 DISCOVERED</span></div><div id="tiers"></div></div><button id="swap" aria-label="다음 주스와 교환">⇄<small>교환</small></button></footer><div id="comboBanner" role="status" aria-atomic="true"></div></div><div id="overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><canvas class="popup-art" aria-hidden="true"></canvas><button id="dialogClose" class="dialog-close" aria-label="닫기"></button><h2 id="dialogTitle">잠깐, 쉬어가기</h2><p id="dialogText">주스를 드래그해 방향을 정하고 손을 놓으면 던져집니다. 같은 주스를 만나면 더 멋진 주스로 변해요.</p><figure id="discoveryReward" hidden>
