<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta property="og:title" content="맞짱 바둑">
<title>맞짱 바둑</title>
<style>
  body { font: 1rem system-ui, sans-serif; max-width: 32rem; margin: 4rem auto; padding: 0 1.25rem; color-scheme: light dark; }
  a { display: inline-block; padding: .65em 0; }
</style>
<main>
    <h1>맞짱 바둑</h1>

    <p id="notice" role="status"></p>
</main>
<script>
  (function () {
    var ua = navigator.userAgent;
    var platform = (navigator.userAgentData || {}).platform || "";
    var ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var android = /Android/i.test(platform + " " + ua);
    var params = new URLSearchParams(location.search);
    var source = params.get("ncq_source");
    var ids = {googleplay: "android", appstore: "ios", toss: "toss", kakaopay: "kakaopay"};
    var target = Object.prototype.hasOwnProperty.call(ids, source) ? document.getElementById(ids[source]) : null;
    // Prefer the originating app, then the device store, then another public store.
    // An iPhone may open Google Play's listing when App Store is not public yet.
    target = target || (ios ? document.getElementById("ios") : android ? document.getElementById("android") : null)
      || document.getElementById("android") || document.getElementById("ios") || document.getElementById("toss")
      || document.getElementById("kakaopay");
    if (target) {
      document.querySelectorAll("a").forEach(function (link) {
        link.parentElement.hidden = link !== target;
      });
    }
    var notice = document.getElementById("notice");
    var english = !/^ko/i.test(navigator.language || "");
    notice.textContent = !target
      ? (english ? "A public app link is not available yet. Open the game from its app."
        : "공개된 앱 연결 주소가 아직 없어요. 이용 중인 앱에서 게임을 열어 주세요.")
      : (english ? "Open the game in its app. If it does not open, tap the app button."
        : "앱에서 게임을 열어요. 자동으로 열리지 않으면 앱 버튼을 눌러 주세요.");
    if (target) location.replace(target.href);
  })();
</script>
