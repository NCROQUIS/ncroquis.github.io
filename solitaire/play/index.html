<!doctype html>
<html>
<head>
<script src="ncq/safe.js"></script>
<script src="ncq/sound.js"></script>
<script src="ncq/device.js"></script>
<script src="ncq/save.js"></script>
<meta charset="utf-8"><style id="ncq-no-zoom">*{touch-action:manipulation}</style><script src="ncq-flags.js"></script><script src="ncq-ads.js"></script><script src="ncq-iap.js"></script><script src="ncq-feedback.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d4a52">
<title data-i18n="title">Classic Solitaire</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/result.css">
</head>
<body>
<div id="app">
<div id="topbar">
  <div class="tb-side"></div>
  <header id="hud">
    <div class="stat"><span class="label" data-i18n="hud_moves">Moves</span><span id="moves" class="value">0</span></div>
    <div class="stat"><span class="label" data-i18n="hud_time">Time</span><span id="time" class="value">0:00</span></div>
    <div class="stat"><span class="label" data-i18n="hud_score">Score</span><span id="score" class="value">0</span></div>
  </header>
  <div class="tb-side tb-right">
    <button id="streak-chip" type="button" data-i18n-attr="aria-label:streak_aria"><span class="sc-label" data-i18n="streak_label">Streak</span><span id="streak-cups" class="sc-cups"></span></button>
  <button id="btn-settings" type="button" data-i18n-attr="aria-label:settings_aria"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6a.5.5 0 0 0 .1-.6l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.4 7.4 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 0-.5.4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.6L4.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.6l2 3.5c.1.2.4.3.6.2l2.5-1c.5.4 1.1.8 1.7 1l.4 2.6c0 .3.3.5.5.5h4c.3 0 .5-.2.5-.4l.4-2.7c.6-.2 1.2-.6 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.5a.5.5 0 0 0-.1-.6L19.4 13zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg></button>
  </div>
</div>


  <main id="table" data-i18n-attr="aria-label:table_aria" data-ncq-no-main></main>

  <footer id="toolbar">
    <button id="btn-new" class="tool" type="button"><span class="ico"><i class="plus">＋</i><i class="close">✕</i></span><span data-i18n="tool_game">Game</span></button>
    <button id="btn-auto" class="tool hidden" type="button"><span class="ico">⚡</span><span data-i18n="tool_auto">Auto</span></button>
    <button id="btn-wand" class="tool wand" type="button"><span class="ico"><img class="tool-img" src="Resource/ui/icon_wand.png" alt=""><b id="wand-badge" class="wand-badge">2</b></span><span data-i18n="tool_wand">Magic Wand</span></button>
    <button id="btn-hint" class="tool" type="button"><span class="ico"><img class="tool-img" src="Resource/ui/icon_hint.png" alt=""></span><span data-i18n="tool_hint">Hint</span></button>
    <button id="btn-undo" class="tool" type="button"><span class="ico"><img class="tool-img" src="Resource/ui/icon_undo.png" alt=""></span><span data-i18n="tool_undo">Undo</span></button>
  </footer>

  <div id="game-menu" class="hidden" role="menu" data-i18n-attr="aria-label:menu_aria">
    <button id="menu-deal" data-ncq-main="새로운 딜" class="menu-item" type="button" role="menuitem" style="--i:1">
      <span class="menu-ico"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="27" y="10" width="13" height="28" rx="2.5" transform="rotate(12 33 24)" fill="currentColor" opacity=".75"/><rect x="9" y="7" width="23" height="33" rx="3" fill="none" stroke="currentColor" stroke-width="3.2"/><rect x="13" y="11" width="15" height="25" rx="1.5" fill="currentColor"/><path d="M20.5 30.5c-4-3-6.5-5-6.5-7.6 0-1.9 1.5-3.4 3.3-3.4 1.3 0 2.5.7 3.2 1.9.7-1.2 1.9-1.9 3.2-1.9 1.8 0 3.3 1.5 3.3 3.4 0 2.6-2.5 4.6-6.5 7.6z" fill="#1f7a2c"/></svg></span>
      <span class="menu-label" data-i18n="menu_deal">New Deal</span>
    </button>
    <button id="menu-replay" class="menu-item" type="button" role="menuitem" style="--i:0">
      <span class="menu-ico"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M14.5 15.5A13 13 0 1 1 11 26" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/><path d="M6 10.5l11.5-.5-.8 11.6z" fill="currentColor"/></svg></span>
      <span class="menu-label" data-i18n="menu_replay">Replay</span>
    </button>
  </div>

  <div id="stuck" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="stuck-title">
    <div class="panel stuck-panel">
      <h2 id="stuck-title" data-i18n="stuck_title">No more moves</h2>
      <p id="stuck-sub"></p>
      <div class="stuck-actions stuck-main">
        <button id="stuck-wand" data-ncq-main="마법 지팡이 쓰기" class="stuck-btn primary hero" type="button"><img src="Resource/ui/icon_wand.png" alt=""><span data-i18n="stuck_use_wand">Use Magic Wand</span><b id="stuck-wand-badge" class="wand-badge">0</b></button>
        <button id="stuck-rewind" class="stuck-btn primary alt hero" type="button"><img src="Resource/ui/icon_undo.png" alt=""><span data-i18n="stuck_rewind">Rewind &amp; Continue</span><b class="wand-badge ad">AD</b></button>
      </div>
      <div class="stuck-sub-actions">
        <button id="stuck-replay" class="stuck-mini" type="button" data-i18n="stuck_replay">↻ Replay</button>
        <button id="stuck-new" class="stuck-mini" type="button" data-i18n="stuck_new">＋ New Game</button>
      </div>
      <button id="stuck-close" class="link" type="button" data-i18n="stuck_close">Keep looking at the board</button>
    </div>
  </div>

  <div id="streak-guard" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="guard-title">
    <div class="panel stuck-panel guard-panel">
      <img class="guard-cup" src="Resource/ui/icon_trophy.png" alt="">
      <h2 id="guard-title"></h2>
      <p class="pre-line" data-i18n="guard_text"></p>
      <div class="stuck-actions guard-actions">
        <button id="guard-rewind" data-ncq-main="되돌려서 이어 가기" class="stuck-btn primary" type="button"><img src="Resource/ui/icon_undo.png" alt=""><span data-i18n="stuck_rewind">Rewind &amp; Continue</span><b class="wand-badge ad">AD</b></button>
        <button id="guard-wand" class="stuck-btn primary alt" type="button"><img src="Resource/ui/icon_wand.png" alt=""><span data-i18n="guard_wand">Continue with Magic Wand</span><b id="guard-wand-badge" class="wand-badge">0</b></button>
      </div>
      <button id="guard-go" class="link danger" type="button"></button>
      <button id="guard-back" class="link" type="button" data-i18n="guard_back">Go back</button>
    </div>
  </div>

  <div id="wand-ad" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="panel wand-panel">
      <h2 data-i18n="wandad_title">Out of magic wands</h2>
      <p id="wand-ad-msg"></p>
      <p class="wand-desc" data-i18n="wandad_desc"></p>
      <button id="wand-ad-watch" type="button" data-ncq-main="광고 보고 받기"><span class="ad-tag">AD</span> <span data-i18n="wandad_watch">Watch ad to get</span></button>
      <button id="wand-ad-close" class="link" type="button" data-i18n="close">Close</button>
    </div>
  </div>

  <div id="toast" class="hidden"></div>
</div>
<script src="js/texts.js"></script>
<script src="js/i18n.js"></script>
<script src="js/store.js"></script>
<script src="js/seeds.js"></script>
<script src="js/deals.js"></script>
<script src="js/solver.js"></script>
<script src="js/analytics.js"></script>
<script src="js/settings.js"></script>
<script src="js/sound.js"></script>
<script src="js/celebrate.js"></script>
<script src="js/result.js"></script>
<script src="js/game.js"></script>

</body>
</html>
