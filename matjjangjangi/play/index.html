              <span id="match-intro-opponent-rank" class="match-intro-rank" hidden></span>
              <strong id="match-intro-opponent-name" class="match-intro-name"></strong>
              <span id="match-intro-opponent-rating" class="match-intro-rating" hidden></span>
            </article>
          </div>
          <div class="match-intro-estimate">
            <div id="match-intro-points" class="match-intro-points" hidden>
              <p data-i18n="matchIntroEstimate"></p>
              <div class="match-intro-deltas"><span id="match-intro-win"></span><span id="match-intro-loss"></span></div>
            </div>
          </div>
        </div>
        <button id="match-intro-close" class="match-intro-close" type="button" data-ncq-main="Close match intro" data-i18n="shopClose" autofocus></button>
      </div>
    </dialog>

    <dialog id="share">
      <form method="dialog">
        <h2 data-i18n="invite"></h2>
        <label for="share-url" data-i18n="copyManually"></label>
        <input id="share-url" readonly>
        <button class="secondary" data-ncq-main="Close invite" data-i18n="done"></button>
      </form>
    </dialog>
    <dialog id="record-share-dialog" class="record-dialog" aria-labelledby="record-share-title">
      <form method="dialog">
        <h2 id="record-share-title" data-i18n="recordShare"></h2>
        <div id="record-link-panel" hidden>
          <label for="record-link" data-i18n="recordPublicLink"></label>
          <input id="record-link" readonly>
          <button id="record-send-link" class="primary" type="button" data-ncq-main="Share record link" data-i18n="recordSendLink" hidden></button>
          <button id="record-copy-link" class="secondary" type="button" data-ncq-main="Copy record link" data-i18n="recordCopyLink"></button>
        </div>
        <p id="record-share-feedback" class="feedback" role="status" hidden></p>
        <button id="record-share-close" class="secondary" data-ncq-main="Close record sharing" data-i18n="done" autofocus></button>
      </form>
    </dialog>
    <dialog id="record-visibility-dialog" class="record-dialog" aria-labelledby="record-visibility-title">
      <form method="dialog">
        <h2 id="record-visibility-title" data-i18n="recordVisibilitySettings"></h2>
        <p id="record-visibility-feedback" class="feedback" role="status" hidden></p>
        <button id="record-visibility-toggle" class="primary" type="button" data-ncq-main="Change record visibility" hidden></button>
        <button id="record-visibility-close" class="secondary" data-ncq-main="Close record visibility settings" data-i18n="done" autofocus></button>
      </form>
    </dialog>
    <dialog id="bikjang-confirm" aria-labelledby="bikjang-confirm-title" aria-describedby="bikjang-confirm-message bikjang-confirm-clock">
      <form method="dialog">
        <h2 id="bikjang-confirm-title" data-i18n="jangiBikjangConfirmTitle"></h2>
        <p id="bikjang-confirm-message" data-i18n="jangiBikjangConfirmMessage"></p>
        <p id="bikjang-confirm-clock" data-i18n="jangiBikjangClockNotice"></p>
        <div class="leave-dialog-actions">
          <button id="bikjang-cancel" class="secondary" type="submit" value="cancel" data-i18n="jangiBikjangContinue" data-ncq-main="Choose another move" autofocus></button>
          <button id="bikjang-accept" class="primary" type="submit" value="accept" data-i18n="jangiBikjangAccept" data-ncq-main="Confirm bikjang draw"></button>
        </div>
      </form>
    </dialog>
    <dialog id="result" class="result" aria-labelledby="result-heading result-stone-color result-title">
      <form method="dialog">
        <h2 id="result-heading" data-i18n="result"></h2>
        <div class="result-hero">
          <div class="result-medal">
            <img class="result-laurel" src="./assets/match-ui/laurel.svg" alt="">
            <div id="result-badge" class="result-badge">
              <svg aria-hidden="true" viewBox="0 0 24 24"><use id="result-symbol"></use></svg>
              <span id="result-stone-color" class="sr-only"></span>
              <strong id="result-title"></strong>
            </div>
            <img class="result-laurel" src="./assets/match-ui/laurel.svg" alt="">
          </div>
          <div id="result-rating-change" class="result-rating-change" hidden>
            <span data-i18n="profileRating"></span>
            <strong id="rating-delta" class="rating-delta"></strong>
            <span id="rating-range"></span>
          </div>
        </div>
        <p id="result-reason" class="jangi-result-reason" hidden></p>
        <section id="result-rating" class="result-rating" aria-labelledby="result-meter-heading" hidden>
          <div class="result-rating-heading">
            <h3 id="result-meter-heading" data-i18n="promotionPoints"></h3>
            <strong id="result-rank"></strong>
          </div>
          <div id="result-promotion-meter" class="promotion-meter result-promotion-meter" role="img">
            <div class="promotion-meter-labels" aria-hidden="true">
              <span id="result-promotion-lower-label"></span><span id="result-promotion-upper-label"></span>
            </div>
            <div class="result-meter-values" aria-hidden="true">
              <span class="result-meter-value result-meter-value--previous">
                <span data-i18n="resultMeterPrevious"></span><strong id="result-promotion-previous"></strong>
              </span>
              <span class="result-meter-value result-meter-value--current">
                <span data-i18n="resultMeterCurrent"></span><strong id="result-promotion-value"></strong>
              </span>
            </div>
            <div class="promotion-meter-track" aria-hidden="true">
              <span class="result-meter-fill"></span>
              <span id="result-promotion-ripple"></span>
              <span class="result-meter-marker result-meter-marker--previous"></span>
              <span class="result-meter-marker result-meter-marker--current"></span>
            </div>
            <div class="promotion-meter-ticks" aria-hidden="true">
              <span id="result-promotion-lower"></span><span>0</span><span id="result-promotion-upper"></span>
            </div>
          </div>
        </section>
        <button id="result-confirm" class="primary" data-ncq-main="Review match" data-i18n="confirmProfile" autofocus></button>
      </form>
    </dialog>

    <dialog id="rank-celebration" class="match-intro rank-celebration" aria-labelledby="rank-celebration-heading" aria-describedby="rank-celebration-change">
      <div class="match-intro-layout">
        <div class="rank-celebration-content">
          <p class="rank-celebration-intro" data-i18n="rankCelebrationIntro" aria-hidden="true"></p>
          <p id="rank-celebration-change" class="rank-celebration-change">
            <span id="rank-celebration-before"></span> <span>→</span> <span id="rank-celebration-after"></span>
          </p>
          <div class="rank-celebration-effects" aria-hidden="true">
            <span class="rank-celebration-halo"></span>
            <span class="rank-celebration-laurel"></span><span class="rank-celebration-laurel right"></span>
            <i></i><i></i><i></i><i></i>
          </div>
          <div class="rank-celebration-plaque">
            <span class="rank-celebration-crown" aria-hidden="true"></span>
            <h2 id="rank-celebration-heading"></h2>
          </div>
        </div>
        <button class="match-intro-close" type="button" data-ncq-main="Dismiss promotion" data-i18n="rankCelebrationDismiss" autofocus></button>
      </div>
    </dialog>
  </div>
<template id="future-rule-picker">
        <button id="choose-rule" class="secondary choose-rule" type="button" aria-haspopup="dialog" aria-controls="rule-dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#settings-icon"/></svg>
          <span id="selected-rule"></span>
          <span class="chevron" aria-hidden="true"></span>
        </button>
    <dialog id="rule-dialog" class="rule-dialog" aria-labelledby="rule-heading">
      <form method="dialog">
        <h2 id="rule-heading" data-i18n="chooseRules"></h2>
        <button type="submit" value="renju" class="rule-option" data-ncq-main="Select Renju">
          <strong data-i18n="ruleRenju"></strong><small data-i18n="ruleRenjuHelp"></small>
        </button>
        <button type="submit" value="free" class="rule-option" data-ncq-main="Select freestyle">
          <strong data-i18n="ruleFree"></strong><small data-i18n="ruleFreeHelp"></small>
        </button>
        <button type="submit" value="taraguchi" class="rule-option" data-ncq-main="Select Taraguchi-10">
          <strong data-i18n="ruleTaraguchi"></strong><small data-i18n="ruleTaraguchiHelp"></small>
        </button>
        <button type="submit" value="" class="secondary" data-ncq-main="Close rules" data-i18n="cancel"></button>
      </form>
    </dialog>
</template>
<dialog id="jangi-formation" aria-labelledby="jangi-formation-title"><form id="jangi-formation-form">
<header class="jangi-formation-heading"><h2 id="jangi-formation-title" data-i18n="jangiFormation"></h2><span id="jangi-formation-clock" role="timer" hidden></span></header>
<div class="jangi-formation-content">
<p class="jangi-formation-hint" data-i18n="jangiFormationHint"></p>
<section id="jangi-opponent-formation" class="jangi-opponent-formation" aria-live="polite">
  <div class="jangi-formation-opponent-heading"><strong></strong><span class="jangi-formation-state"></span></div>
  <div class="jangi-formation-pieces" aria-hidden="true"></div>
</section>
<div class="jangi-formation-options" role="group" data-i18n-attr="aria-label:jangiFormationChoose">
<label class="jangi-formation-choice"><input type="radio" name="formation" value="2"><span class="jangi-formation-pieces" aria-hidden="true"></span><span class="jangi-formation-caption" data-i18n="jangiFormation2"></span></label>
<label class="jangi-formation-choice"><input type="radio" name="formation" value="1"><span class="jangi-formation-pieces" aria-hidden="true"></span><span class="jangi-formation-caption" data-i18n="jangiFormation1"></span></label>
<label class="jangi-formation-choice"><input type="radio" name="formation" value="0" checked><span class="jangi-formation-pieces" aria-hidden="true"></span><span class="jangi-formation-caption" data-i18n="jangiFormation0"></span></label>
<label class="jangi-formation-choice"><input type="radio" name="formation" value="3"><span class="jangi-formation-pieces" aria-hidden="true"></span><span class="jangi-formation-caption" data-i18n="jangiFormation3"></span></label>
</div></div>
<button class="primary" type="submit" data-ncq-main="Confirm Janggi formation" data-i18n="jangiFormationConfirm"></button></form></dialog>
</body>
</html>
