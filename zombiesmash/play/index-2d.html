<title>좀비 스매시 프로토타입</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #f2f2f2; user-select: none; }
  #app { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); overflow: hidden; background: #222; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hidden { display: none !important; }

  /* HUD */
  #top { position: absolute; left: 0; right: 0; top: 0; padding: .6em .8em; display: flex; flex-direction: column; gap: .35em; pointer-events: none; }
  #topRow { display: flex; justify-content: space-between; align-items: center; font-size: 1.1em; font-weight: 700; }
  #hpWrap { position: relative; height: 1.3em; background: #3a1d1d; border-radius: .65em; overflow: hidden; border: 2px solid #000; }
  #hpBar { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(#ff6b6b, #c0392b); transition: width .25s; }
  #hpText { position: absolute; inset: 0; text-align: center; font-size: .85em; line-height: 1.3em; font-weight: 700; text-shadow: 0 1px 2px #000; }
  #traits { display: flex; flex-wrap: wrap; gap: .25em; font-size: .7em; }
  .chip { background: rgba(0,0,0,.55); border: 1px solid #777; border-radius: .6em; padding: .1em .5em; }

  #msg { position: absolute; left: 0; right: 0; top: 56%; text-align: center; font-size: 1em; font-weight: 600;
    text-shadow: 0 2px 3px #000; pointer-events: none; padding: 0 1em; }
  #actions { position: absolute; left: 0; right: 0; top: 61.5%; display: flex; justify-content: center; gap: .4em; pointer-events: none; }
  .pip { width: 1.1em; height: 1.1em; border-radius: 50%; background: #ffd34d; border: 2px solid #000; }
  .pip.used { background: #444; }

  #bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 32%; padding: .6em .7em 1em; display: flex; flex-direction: column; gap: .6em; }
  #hand { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: .5em; }
  .card { background: linear-gradient(#3b4252, #2a2f3a); border: 3px solid #555; border-radius: .7em; padding: .4em .3em;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .15em; cursor: pointer; text-align: center; }
  .card.sel { border-color: #ffd34d; box-shadow: 0 0 .8em #ffd34d88; transform: translateY(-.3em); }
  .card .ic { font-size: 2.2em; line-height: 1.1; }
  .card .nm { font-size: .95em; font-weight: 700; }
  .card .ds { font-size: .62em; color: #c8c8c8; line-height: 1.25; }
  .card .lv { font-size: .7em; color: #ffd34d; }
  .card.empty { border-style: dashed; opacity: .35; cursor: default; }
  .el-blunt { border-color: #b0a090; } .el-cut { border-color: #9fd3ff; } .el-fire { border-color: #ff8a3d; }
  .el-ice { border-color: #8fe3ff; } .el-elec { border-color: #f5e663; } .el-boom { border-color: #ff5252; }
  .card.sel { border-color: #ffd34d !important; }

  button.btn { font: inherit; font-weight: 700; border: 3px solid #000; border-radius: .6em; padding: .55em 1em; cursor: pointer;
    background: #ffd34d; color: #222; font-size: 1em; }
  button.btn.gray { background: #8a8f99; }

  button.btn:disabled { opacity: .4; cursor: default; }

  /* Overlay */
  #overlay { position: absolute; inset: 0; background: rgba(0,0,0,.72); display: flex; align-items: center; justify-content: center; padding: 1em; }
  .panel { width: 100%; max-height: 100%; overflow-y: auto; background: #252a33; border: 3px solid #000; border-radius: 1em; padding: 1em;
    display: flex; flex-direction: column; gap: .7em; }
  .panel h2 { margin: 0; font-size: 1.4em; text-align: center; }
  .panel p { margin: 0; text-align: center; color: #ccc; font-size: .9em; }
  .opts { display: flex; flex-direction: column; gap: .5em; }
  .opt { display: flex; align-items: center; gap: .7em; background: #333a46; border: 3px solid #555; border-radius: .7em; padding: .6em .7em; cursor: pointer; }
  .opt:hover { border-color: #ffd34d; }
  .opt.on { border-color: #ffd34d; background: #4a4430; }
  .opt .ic { font-size: 2em; width: 1.4em; text-align: center; }
  .opt .tx { flex: 1; }
  .opt .t1 { font-weight: 700; }
  .opt .t2 { font-size: .8em; color: #c8c8c8; }
  .opt .tag { font-size: .7em; padding: .1em .45em; border-radius: .4em; background: #000; margin-left: .3em; }
  .row { display: flex; gap: .5em; justify-content: center; flex-wrap: wrap; }
  .lobbyTool { display: flex; align-items: center; gap: .6em; background: #333a46; border-radius: .6em; padding: .45em .6em; }
  .lobbyTool .ic { font-size: 1.7em; }
  .lobbyTool .tx { flex: 1; font-size: .9em; }

  .chapBtns { display: flex; gap: .5em; }
  .chapBtns button { flex: 1; }

<body>
<div id="app">
  <canvas id="cv" width="720" height="1280"></canvas>
  <div id="top">
    <div id="topRow"><span id="stageText"></span><span id="coinText"></span></div>

  <div id="actions"></div>

    <div id="hand"></div>

<script>
'use strict';
// ============================================================
// 밸런스 숫자 (전부 가정값, 여기서 조정)
// ============================================================
const CFG = {
  slots: 7,
  actionsPerTurn: 3,
  playerHP: 100,
  rows: 12,
  eliteRows: [4, 8],
  rowHpBase: 90,          // 줄 체력 총량 = 90 × (1 + rowHpGrowth × (줄-1)) × 장 배율
  rowHpGrowth: 0.25,
  eliteHpMul: 1.3,
  chapterHpMul: 1.22,     // 장마다 체력 22%
  chapterAtkMul: 1.08,    // 장마다 공격 8%
  burnDmg: 6, burnDmgHot: 9,
  freezeDeathDmg: 10, freezeDeathDmgGlass: 25,
  fatDeathDmg: 20,
  cookoffDmg: 15,
  chainBoomDmg: 10,
  chainJumps: 2,
  upgradeMul: 0.4, maxUpgrade: 3,
  levelMul: 0.08, maxLevel: 50,
  restHeal: 25,
  bossSummonEvery: 2,
  chapters: 3,
};

const TOOLS = {
  hammer:  { name: '망치',   el: 'blunt', icon: '🔨', dmg: 30, desc: '한 마리에 30 (타격)' },
  axe:     { name: '도끼',   el: 'cut',   icon: '🪓', dmg: 24, desc: '한 마리에 24 (절단)' },
  molotov: { name: '화염병', el: 'fire',  icon: '🔥', dmg: 15, desc: '한 마리에 15, 불붙음' },
  grenade: { name: '수류탄', el: 'boom',  icon: '💣', dmg: 20, splash: 10, desc: '한 마리에 20, 양옆에 10' },
  freezer: { name: '냉동탄', el: 'ice',   icon: '❄️', dmg: 8, freeze: 3, desc: '한 마리에 8, 3턴 얼림' },
  baton:   { name: '전기봉', el: 'elec',  icon: '⚡', dmg: 22, desc: '한 마리에 22, 젖은·갑옷 좀비로 옮겨 감' },
};
const EL_NAME = { blunt: '타격', cut: '절단', fire: '불', ice: '얼음', elec: '전기', boom: '폭발' };

const ZT = {
  normal: { name: '일반 좀비', hp: 30, atk: 3, skin: '#7fa36b', cloth: '#5a6b8c' },
  armor:  { name: '갑옷 좀비', hp: 40, armor: 20, atk: 4, skin: '#6f9a63', cloth: '#4d5560' },
  fat:    { name: '뚱보 좀비', hp: 60, atk: 5, skin: '#9bb06a', cloth: '#8c5a5a', wide: 1.4 },
  oil:    { name: '기름 좀비', hp: 35, atk: 3, skin: '#6c7a4a', cloth: '#2f2a22' },
  boss:   { name: '보스 좀비', hp: 0,  atk: 10, skin: '#8a6a9c', cloth: '#3a2030', big: 1.55 },
};

const TRAITS = [
  { id: 'heavy',     name: '묵직함',   icon: '🏋️', desc: '타격으로 처치하고 남은 피해가 옆 칸으로 넘어감' },
  { id: 'pierce',    name: '관통',     icon: '🗡️', desc: '절단이 대상 오른쪽 1칸까지 피해' },
  { id: 'halve',     name: '두 동강',  icon: '✂️', desc: '절단 후 체력 30% 이하인 좀비는 즉시 처치 (보스 제외)' },
  { id: 'cookoff',   name: '유폭',     icon: '💥', desc: '불붙은 좀비가 죽으면 양옆에 폭발 15' },
  { id: 'hotter',    name: '고열',     icon: '🌡️', desc: '불붙음 피해 6 → 9' },
  { id: 'glass',     name: '유리몸',   icon: '🧊', desc: '얼린 좀비가 죽을 때 양옆 피해 10 → 25', req: 'freezer' },
  { id: 'overload',  name: '과부하',   icon: '🔋', desc: '전기가 옮겨 가는 횟수 제한 없음', req: 'baton' },
  { id: 'chainboom', name: '연쇄 폭발', icon: '🎆', desc: '폭발로 죽은 좀비가 양옆에 폭발 10' },
  { id: 'ember',     name: '불씨',     icon: '🕯️', desc: '폭발을 맞은 좀비는 불붙음' },
  { id: 'spare',     name: '여유',     icon: '⏳', desc: '턴마다 행동 +1' },
  { id: 'oiler',     name: '기름칠',   icon: '🛢️', desc: '줄 시작 시 무작위 1마리에 기름 (불 피해 2배)' },
  { id: 'rain',      name: '소나기',   icon: '🌧️', desc: '줄 시작 시 무작위 2마리 젖음', req: 'baton' },
];

const CHAPTERS = [
  null,
  { name: '1장 주택가', types: ['normal', 'normal', 'armor'], unlock: 'freezer', bg: ['#3d5a80', '#98c1d9'], ground: '#4a4a3a' },
  { name: '2장 시장',   types: ['normal', 'armor', 'fat'],    unlock: 'baton',   bg: ['#6d4c41', '#d7a86e'], ground: '#5b4a3a' },
  { name: '3장 주유소', types: ['normal', 'armor', 'fat', 'oil', 'oil'], unlock: null, bg: ['#2b2d42', '#8d99ae'], ground: '#3a3a3a' },
];

// ============================================================
// 저장
// ============================================================
const SAVE_KEY = 'zombiesmash_proto_v1';
function defaultSave() {
  return { coins: 0, owned: ['hammer', 'axe', 'molotov', 'grenade'], levels: {}, maxChapter: 1, cleared: [] };
}
let save = defaultSave();
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.owned) save = Object.assign(defaultSave(), s); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
const lvl = id => save.levels[id] || 1;
const lvlCost = L => Math.round(50 * Math.pow(1.1, L - 1));

// ============================================================
// 유틸
// ============================================================
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
const $ = id => document.getElementById(id);

// ============================================================
// 화면 크기
// ============================================================
const app = $('app'), cv = $('cv'), cx = cv.getContext('2d');
const W = 720, H = 1280, GROUND = 660;
const slotX = i => 60 + i * 100;
function resize() {
  const w = Math.min(window.innerWidth, window.innerHeight * 9 / 16);
  app.style.width = w + 'px';
  app.style.height = (w * 16 / 9) + 'px';
  app.style.fontSize = (w / 36) + 'px';
}
window.addEventListener('resize', resize); resize();

// ============================================================
// 상태
// ============================================================
let run = null;          // 도전 상태
let slots = [];          // 칸 7개: 좀비 또는 null
let gt = 0;              // 게임 시간(슬로모션 적용)
let timeScale = 1, slowUntilReal = 0;
let lockUntil = 0;
let shake = 0, redFlash = 0, whiteFlash = 0;
let parts = [], particles = [], texts = [], scheduled = [], slashes = [];
let selectedTool = -1, hoverSlot = -1;
let bigText = null;
let zid = 0;

// ============================================================
// 좀비
// ============================================================
function makeZombie(type, hp, armor, atk) {
  return {
    id: ++zid, type, hp, maxHp: hp, armor: armor || 0, maxArmor: armor || 0, atk,
    burn: false, frozen: 0, wet: false, oil: type === 'oil',
    dead: false, deathAt: 0, deathEl: null, gone: false,
    phase: Math.random() * 6, hitFlash: 0, lunge: 0, spawnT: gt, shownHp: hp,
  };
}

function genRow(r) {
  const ch = run.chapter;
  const hpMul = Math.pow(CFG.chapterHpMul, ch - 1);
  const atkMul = Math.pow(CFG.chapterAtkMul, ch - 1);
  const pool = CHAPTERS[ch].types;
  const elite = CFG.eliteRows.includes(r);
  slots = new Array(CFG.slots).fill(null);

  if (r === CFG.rows) {
    const bossHp = Math.round(CFG.rowHpBase * (1 + CFG.rowHpGrowth * (r - 1)) * 0.75 * hpMul);
    slots[3] = makeZombie('boss', bossHp, 0, Math.round(ZT.boss.atk * atkMul));
    slots[2] = makeZombie('normal', Math.round(30 * hpMul), 0, Math.round(3 * atkMul));
    slots[4] = makeZombie('normal', Math.round(30 * hpMul), 0, Math.round(3 * atkMul));
    run.turnInRow = 0;
    applyRowTraits();
    return;
  }

  let count = r <= 3 ? randi(3, 4) : r <= 7 ? randi(5, 6) : 7;
  if (elite) count = r === 4 ? 4 : 6;
  const types = [];
  for (let i = 0; i < count; i++) {
    let t = pick(pool);
    if (elite && Math.random() < 0.5) t = pool.includes('fat') ? pick(['armor', 'fat']) : 'armor';
    types.push(t);
  }
  const baseSum = types.reduce((s, t) => s + ZT[t].hp + (ZT[t].armor || 0), 0);
  const target = CFG.rowHpBase * (1 + CFG.rowHpGrowth * (r - 1)) * (elite ? CFG.eliteHpMul : 1) * hpMul;
  const k = target / baseSum;
  const start = randi(0, CFG.slots - count);
  types.forEach((t, i) => {
    slots[start + i] = makeZombie(t, Math.max(5, Math.round(ZT[t].hp * k)), Math.round((ZT[t].armor || 0) * k), Math.max(1, Math.round(ZT[t].atk * atkMul)));
  });
  run.turnInRow = 0;
  applyRowTraits();
}

function applyRowTraits() {
  const alive = slots.filter(z => z && !z.dead && z.type !== 'boss');
  if (has('oiler') && alive.length) { const z = pick(alive.filter(z => !z.oil).length ? alive.filter(z => !z.oil) : alive); z.oil = true; }
  if (has('rain')) shuffle(alive.slice()).slice(0, 2).forEach(z => { z.wet = true; z.burn = false; });
}

const has = id => run && run.traits.includes(id);
const alive = i => slots[i] && !slots[i].dead ? slots[i] : null;
const aliveCount = () => slots.filter(z => z && !z.dead).length;

// ============================================================
// 피해 처리
// ============================================================
const STEP = 0.13; // 연쇄 한 단계 연출 간격(초)

function toolDamage(handItem) {
  const T = TOOLS[handItem.id];
  return T.dmg * (1 + CFG.levelMul * (lvl(handItem.id) - 1)) * (1 + CFG.upgradeMul * handItem.upg);
}

function useTool(handIdx, slot) {
  const item = run.hand[handIdx];
  const T = TOOLS[item.id];
  const base = toolDamage(item);
  const q = [];
  const ctx = { kills: 0, maxDepth: 0, firstKillT: null };
  const mult = base / T.dmg;

  if (T.el === 'elec') {
    // 전기: 대상에서 젖은·갑옷 좀비로 옮겨 감
    const maxJ = has('overload') ? 99 : CFG.chainJumps;
    const visited = new Set([slot]);
    let frontier = [slot];
    q.push({ slot, amt: base, el: 'elec', depth: 0, primary: true });
    for (let j = 1; j <= maxJ && frontier.length; j++) {
      const next = [];
      for (const s of frontier) for (const n of [s - 1, s + 1]) {
        const z = alive(n);
        if (z && !visited.has(n) && (z.wet || z.type === 'armor')) { visited.add(n); next.push(n); q.push({ slot: n, amt: base, el: 'elec', depth: j, arc: s }); }
      }
      frontier = next;
    }
  } else {
    q.push({ slot, amt: base, el: T.el, depth: 0, primary: true, ignite: T.el === 'fire', freeze: T.freeze || 0 });
    if (T.el === 'cut' && has('pierce')) q.push({ slot: slot + 1, amt: base, el: 'cut', depth: 1 });
    if (T.splash) for (const n of [slot - 1, slot + 1]) q.push({ slot: n, amt: T.splash * mult, el: 'boom', depth: 0 });
  }

  // 투사체/연출
  spawnToolFx(T.el, slot);
  processQueue(q, ctx);

  // 행동 끝: 불붙음 피해
  const burnQ = [];
  const bd = has('hotter') ? CFG.burnDmgHot : CFG.burnDmg;
  slots.forEach((z, i) => { if (z && !z.dead && z.burn) burnQ.push({ slot: i, amt: bd, el: 'fire', depth: ctx.maxDepth + 1, tick: true }); });
  processQueue(burnQ, ctx);

  // 슬로모션·연쇄 표시
  if (ctx.kills >= 3) {
    const t = ctx.firstKillT != null ? ctx.firstKillT : gt;
    at(t - gt, () => { timeScale = 0.3; slowUntilReal = performance.now() + 650; bigText = { text: `${ctx.kills}마리 연쇄!`, t: 0 }; });
  }
  lockUntil = gt + (ctx.maxDepth + 1) * STEP + 0.45;
  run.stats.maxChain = Math.max(run.stats.maxChain, ctx.kills);

  run.actionsLeft--;
  run.actionsUsedInRow++;
  afterAction();
}

function processQueue(q, ctx) {
  let guard = 0;
  while (q.length && guard++ < 500) {
    const h = q.shift();
    const z = alive(h.slot);
    if (!z) continue;
    applyHit(z, h, q, ctx);
  }
}

function applyHit(z, h, q, ctx) {
  const el = h.el;
  let amt = h.amt;
  if (el === 'cut' && (z.type === 'normal' || z.type === 'fat')) amt *= 1.5;
  if (el === 'blunt' && z.frozen > 0) amt *= 2;
  if (el === 'fire' && z.oil) amt *= 2;
  if (el === 'elec' && z.wet) amt *= 2;
  amt = Math.max(0, Math.round(amt));

  let toHp = amt;
  let armorHit = 0;
  if (z.armor > 0 && el !== 'fire' && el !== 'elec' && amt > 0) {
    const m = el === 'blunt' ? 2 : el === 'cut' ? 0.5 : 1;
    const ad = amt * m;
    if (ad >= z.armor) { toHp = Math.round(amt - z.armor / m); armorHit = z.armor; z.armor = 0; }
    else { z.armor = Math.round(z.armor - ad); armorHit = ad; toHp = 0; }
  }
  z.hp -= toHp;
  const overkill = z.hp < 0 ? -z.hp : 0;
  const d = h.depth;
  ctx.maxDepth = Math.max(ctx.maxDepth, d);

  // 상태
  if (h.ignite && !z.wet) z.burn = true;
  if (el === 'boom' && has('ember') && !z.wet) z.burn = true;
  if (h.freeze) z.frozen = Math.max(z.frozen, h.freeze);
  if (el === 'cut' && has('halve') && z.hp > 0 && z.hp <= z.maxHp * 0.3 && z.type !== 'boss') z.hp = 0;

  // 연출 예약
  const slot = h.slot;
  const shownAfter = Math.max(0, z.hp);
  at(d * STEP, () => {
    z.hitFlash = 1; z.shownHp = shownAfter;
    if (amt > 0) addText(slotX(slot) + rand(-14, 14), GROUND - zHeight(z) - 30, String(toHp > 0 ? toHp : armorHit), elColor(el), h.tick ? 0.8 : 1.1);
    if (h.arc != null) addArc(h.arc, slot);
    hitParticles(el, slotX(slot), GROUND - zHeight(z) * 0.55);
    if (el === 'boom') { shake = Math.max(shake, 8); boomParticles(slotX(slot), GROUND - 80, 0.6); }
  });

  if (z.hp <= 0) killZombie(z, slot, el, d, h, overkill, q, ctx);
}

function killZombie(z, slot, el, d, h, overkill, q, ctx) {
  z.dead = true; z.deathEl = el; z.deathAt = gt + d * STEP;
  ctx.kills++;
  if (ctx.firstKillT == null) ctx.firstKillT = z.deathAt;
  run.stats.kills++;
  const nd = d + 1;
  const adj = [slot - 1, slot + 1];
  if (z.frozen > 0) adj.forEach(n => q.push({ slot: n, amt: has('glass') ? CFG.freezeDeathDmgGlass : CFG.freezeDeathDmg, el: 'ice', depth: nd }));
  if (z.type === 'fat') adj.forEach(n => q.push({ slot: n, amt: CFG.fatDeathDmg, el: 'boom', depth: nd }));
  if (z.burn && z.oil) adj.forEach(n => q.push({ slot: n, amt: 0, el: 'fire', depth: nd, ignite: true }));
  if (z.burn && has('cookoff')) adj.forEach(n => q.push({ slot: n, amt: CFG.cookoffDmg, el: 'boom', depth: nd }));
  if (el === 'boom' && has('chainboom')) adj.forEach(n => q.push({ slot: n, amt: CFG.chainBoomDmg, el: 'boom', depth: nd }));
  if (el === 'blunt' && has('heavy') && overkill > 0) {
    const n = alive(slot + 1) ? slot + 1 : slot - 1;
    q.push({ slot: n, amt: overkill, el: 'blunt', depth: nd });
  }
  at(d * STEP, () => spawnDeath(z, slot, el));
}

function afterAction() {
  updateHUD();
  const checkT = lockUntil - gt;
  at(checkT, () => {
    if (aliveCount() === 0) return rowCleared();
    if (run.actionsLeft <= 0) zombieTurn();
    else setMsg('도구를 고르고 좀비를 누르세요');
  });
}

function endTurnEarly() {
  if (!run || run.state !== 'battle' || gt < lockUntil) return;
  zombieTurn();
}

function zombieTurn() {
  run.state = 'enemy';
  selectedTool = -1;
  updateHUD();
  setMsg('좀비 차례');
  let delay = 0.15;
  let total = 0;
  slots.forEach((z, i) => {
    if (!z || z.dead) return;
    if (z.frozen > 0) { z.frozen--; at(delay, () => addText(slotX(i), GROUND - zHeight(z) - 30, '얼어서 못 움직임', '#8fe3ff', 0.7)); return; }
    const dmg = z.atk;
    total += dmg;
    at(delay, () => { z.lunge = 1; run.hp = Math.max(0, run.hp - dmg); redFlash = 0.5; shake = Math.max(shake, 6); addText(slotX(i), GROUND - zHeight(z) * 0.5, '-' + dmg, '#ff5252', 1.1); updateHUD(); });
    delay += 0.18;
  });
  run.turnInRow++;
  run.stats.dmgTaken += total;
  // 보스 소환
  const boss = slots.find(z => z && !z.dead && z.type === 'boss');
  if (boss && run.turnInRow % CFG.bossSummonEvery === 0) {
    at(delay, () => {
      const empty = [];
      for (let i = 0; i < CFG.slots; i++) if (!alive(i)) empty.push(i);
      shuffle(empty).slice(0, 2).forEach(i => {
        const hpMul = Math.pow(CFG.chapterHpMul, run.chapter - 1);
        slots[i] = makeZombie('normal', Math.round(30 * hpMul), 0, Math.round(3 * Math.pow(CFG.chapterAtkMul, run.chapter - 1)));
      });
      setMsg('보스가 좀비를 불렀습니다');
    });
    delay += 0.3;
  }
  lockUntil = gt + delay + 0.3;
  at(delay + 0.3, () => {
    if (run.hp <= 0) return playerDown();
    run.state = 'battle';
    run.actionsLeft = CFG.actionsPerTurn + (has('spare') ? 1 : 0);
    setMsg('도구를 고르고 좀비를 누르세요');
    updateHUD();
  });
}

function rowCleared() {
  const r = run.row;
  run.state = 'cleared';
  selectedTool = -1;
  const oneTurn = run.turnInRow === 0;
  let coins = Math.round((10 + 5 * r) * Math.pow(1.2, run.chapter - 1) * (oneTurn ? 1.5 : 1));
  run.coins += coins;
  run.stats.rowsCleared = r;
  if (oneTurn) { bigText = { text: '한 번에 정리! 코인 +50%', t: 0 }; run.stats.oneTurn++; }
  addText(W / 2, 520, `+${coins} 코인`, '#ffd34d', 1.4);
  updateHUD();
  if (r === CFG.rows) return at(1.0, () => endRun(true));
  at(0.9, () => showChoices(() => {
    if (CFG.eliteRows.includes(r)) showRest(() => nextRow());
    else nextRow();
  }));
}

function nextRow() {
  run.row++;
  run.actionsLeft = CFG.actionsPerTurn + (has('spare') ? 1 : 0);
  run.actionsUsedInRow = 0;
  run.state = 'battle';
  genRow(run.row);
  hideOverlay();
  setMsg(run.row === CFG.rows ? '보스 줄입니다' : CFG.eliteRows.includes(run.row) ? '정예 줄입니다' : '도구를 고르고 좀비를 누르세요');
  updateHUD();
}

function playerDown() {
  run.state = 'over';
  updateHUD();
  const canRevive = !run.revived;
  showPanel(`
    <h2>쓰러졌습니다</h2>
    <p>${run.row}번째 줄에서 쓰러졌습니다.</p>
    <div class="row">
      ${canRevive ? '<button class="btn ad" id="bRevive">📺 광고 보고 부활 (체력 50%, 이 줄 처음부터)</button>' : ''}
      <button class="btn gray" id="bGiveUp">결과 보기</button>
    </div>`);
  if (canRevive) $('bRevive').onclick = () => {
    run.revived = true; run.ads.revive++;
    run.hp = Math.round(run.maxHp * 0.5);
    run.row--; nextRow();
  };
  $('bGiveUp').onclick = () => endRun(false);
}

// ============================================================
// 선택지
// ============================================================
function ownedNotInHand() { return save.owned.filter(id => !run.hand.some(h => h.id === id)); }
function traitPool() { return TRAITS.filter(t => !run.traits.includes(t.id) && (!t.req || save.owned.includes(t.req))); }

function rollChoices() {
  const out = [];
  let tries = 0;
  while (out.length < 3 && tries++ < 60) {
    const r = Math.random();
    let c = null;
    if (r < 0.4) { const p = traitPool().filter(t => !out.some(o => o.kind === 'trait' && o.id === t.id)); if (p.length) c = { kind: 'trait', id: pick(p).id }; }
    else if (r < 0.7) { const p = ownedNotInHand().filter(id => !out.some(o => o.kind === 'tool' && o.id === id)); if (p.length) c = { kind: 'tool', id: pick(p) }; }
    else { const p = run.hand.map((h, i) => i).filter(i => run.hand[i].upg < CFG.maxUpgrade && !out.some(o => o.kind === 'upg' && o.idx === i)); if (p.length) c = { kind: 'upg', idx: pick(p) }; }
    if (c) out.push(c);
  }
  return out;
}

function choiceHTML(c, i) {
  if (c.kind === 'trait') { const t = TRAITS.find(t => t.id === c.id); return opt(i, t.icon, t.name, t.desc, '특성'); }
  if (c.kind === 'tool') { const T = TOOLS[c.id]; return opt(i, T.icon, T.name + ` Lv.${lvl(c.id)}`, T.desc + (run.hand.length >= maxHand() ? ' · 손이 가득 차서 하나를 버립니다' : ''), '새 도구'); }
  const h = run.hand[c.idx]; const T = TOOLS[h.id];
  return opt(i, T.icon, `${T.name} 강화 ${h.upg} → ${h.upg + 1}`, `이번 도전 동안 피해 +40% (최대 3회)`, '강화');
}
function opt(i, icon, t1, t2, tag) {
  return `<div class="opt" data-i="${i}"><div class="ic">${icon}</div><div class="tx"><div class="t1">${t1}<span class="tag">${tag}</span></div><div class="t2">${t2}</div></div></div>`;
}
const maxHand = () => 4;

function showChoices(done) {
  run.state = 'choice';
  const choices = rollChoices();
  if (!choices.length) return done();
  const render = () => {
    showPanel(`
      <h2>${run.row}번째 줄 돌파</h2>
      <p>하나를 고르세요</p>
      <div class="opts">${choices.map(choiceHTML).join('')}</div>
      <div class="row"><button class="btn ad" id="bReroll" ${run.rerollsLeft <= 0 ? 'disabled' : ''}>📺 광고 보고 다시 뽑기 (${run.rerollsLeft}회 남음)</button></div>`);
    document.querySelectorAll('.opt').forEach(el => el.onclick = () => applyChoice(choices[+el.dataset.i], done));
    $('bReroll').onclick = () => { if (run.rerollsLeft <= 0) return; run.rerollsLeft--; run.ads.reroll++; choices.splice(0, 3, ...rollChoices()); render(); };
  };
  render();
}

function applyChoice(c, done) {
  run.stats.picks.push(c.kind === 'upg' ? 'upg:' + run.hand[c.idx].id : c.kind + ':' + c.id);
  if (c.kind === 'trait') {
    run.traits.push(c.id);
    if (c.id === 'spare') run.actionsLeft++;
    updateHUD(); return done();
  }
  if (c.kind === 'upg') { run.hand[c.idx].upg++; updateHUD(); return done(); }
  if (run.hand.length < maxHand()) { run.hand.push({ id: c.id, upg: 0 }); updateHUD(); return done(); }
  // 손이 가득 참: 버릴 도구 선택
  showPanel(`
    <h2>버릴 도구를 고르세요</h2>
    <p>${TOOLS[c.id].icon} ${TOOLS[c.id].name}을(를) 받는 대신 하나를 버립니다</p>
    <div class="opts">${run.hand.map((h, i) => opt(i, TOOLS[h.id].icon, TOOLS[h.id].name + (h.upg ? ` +${h.upg}` : ''), TOOLS[h.id].desc, '버리기')).join('')}</div>`);
  document.querySelectorAll('.opt').forEach(el => el.onclick = () => { run.hand[+el.dataset.i] = { id: c.id, upg: 0 }; updateHUD(); done(); });
}

function showRest(done) {
  run.state = 'rest';
  showPanel(`
    <h2>쉼터</h2>
    <p>정예 줄을 넘겼습니다. 하나를 고르세요</p>
    <div class="opts">
      ${opt(0, '❤️', `체력 ${CFG.restHeal} 회복`, `지금 ${run.hp} / ${run.maxHp}`, '회복')}
      ${opt(1, '🔧', '도구 강화 1회', '손에 든 도구 하나를 골라 피해 +40%', '강화')}
    </div>`);
  const els = document.querySelectorAll('.opt');
  els[0].onclick = () => { run.hp = Math.min(run.maxHp, run.hp + CFG.restHeal); updateHUD(); done(); };
  els[1].onclick = () => {
    const can = run.hand.map((h, i) => i).filter(i => run.hand[i].upg < CFG.maxUpgrade);
    if (!can.length) { run.hp = Math.min(run.maxHp, run.hp + CFG.restHeal); updateHUD(); return done(); }
    showPanel(`<h2>강화할 도구</h2><div class="opts">${can.map(i => opt(i, TOOLS[run.hand[i].id].icon, `${TOOLS[run.hand[i].id].name} 강화 ${run.hand[i].upg} → ${run.hand[i].upg + 1}`, TOOLS[run.hand[i].id].desc, '강화')).join('')}</div>`);
    document.querySelectorAll('.opt').forEach(el => el.onclick = () => { run.hand[+el.dataset.i].upg++; updateHUD(); done(); });
  };
}

// 도전 시작·종료, 로비
// ============================================================
function startRun(chapter, startTools) {
  run = {
    chapter, row: 0, hp: CFG.playerHP, maxHp: CFG.playerHP,
    hand: startTools.map(id => ({ id, upg: 0 })), traits: [],
    actionsLeft: CFG.actionsPerTurn, actionsUsedInRow: 0, turnInRow: 0,
    coins: 0, state: 'battle', revived: false, rerollsLeft: 2,
    ads: { revive: 0, reroll: 0, double: 0 },
    stats: { kills: 0, maxChain: 0, rowsCleared: 0, oneTurn: 0, dmgTaken: 0, picks: [] },
  };
  parts = []; particles = []; texts = [];
  nextRow();
}

function endRun(win) {
  run.state = 'over';
  let unlockMsg = '';
  const ch = run.chapter;
  if (win) {
    const bonus = Math.round(200 * Math.pow(1.2, ch - 1));
    run.coins += bonus;
    if (!save.cleared.includes(ch)) {
      save.cleared.push(ch);
      const u = CHAPTERS[ch].unlock;
      if (u && !save.owned.includes(u)) { save.owned.push(u); unlockMsg += `<p>🔓 새 도구: ${TOOLS[u].icon} ${TOOLS[u].name}</p>`; }
      if (ch < CFG.chapters) { save.maxChapter = Math.max(save.maxChapter, ch + 1); unlockMsg += `<p>🔓 ${CHAPTERS[ch + 1].name} 열림</p>`; }
    }
  }
  const earned = run.coins;
  const finish = (mul) => { save.coins += earned * mul; persist(); showLobby(); };
  showPanel(`
    <h2>${win ? '장 클리어!' : '도전 종료'}</h2>
    <p>${CHAPTERS[ch].name} · ${run.stats.rowsCleared} / ${CFG.rows}줄 돌파</p>
    <p>처치 ${run.stats.kills} · 최대 연쇄 ${run.stats.maxChain} · 한 번에 정리 ${run.stats.oneTurn}회</p>
    ${unlockMsg}
    <div class="coins">💰 +${earned} 코인</div>
    <div class="row">
      <button class="btn ad" id="bDouble">📺 광고 보고 2배 (+${earned * 2})</button>
      <button class="btn gray" id="bTake">그냥 받기</button>
    </div>`);
  $('bDouble').onclick = () => { run.ads.double++; finish(2); };
  $('bTake').onclick = () => finish(1);
  console.log('[ZS] run end', JSON.stringify({ chapter: ch, win, rows: run.stats.rowsCleared, kills: run.stats.kills, maxChain: run.stats.maxChain, dmgTaken: run.stats.dmgTaken, picks: run.stats.picks, ads: run.ads }));
}

function showLobby() {
  run = null; slots = new Array(CFG.slots).fill(null);
  selectedTool = -1;
  updateHUD();
  setMsg('');
  const chapBtns = [];
  for (let c = 1; c <= CFG.chapters; c++) {
    const open = c <= save.maxChapter;
    chapBtns.push(`<button class="btn ${open ? '' : 'gray'}" data-c="${c}" ${open ? '' : 'disabled'}>${open ? '' : '🔒 '}${CHAPTERS[c].name}${save.cleared.includes(c) ? ' ✔' : ''}</button>`);
  }
  const tools = Object.keys(TOOLS).map(id => {
    const T = TOOLS[id]; const owned = save.owned.includes(id); const L = lvl(id); const cost = lvlCost(L);
    if (!owned) {
      const ch = CHAPTERS.findIndex(c => c && c.unlock === id);
      return `<div class="lobbyTool" style="opacity:.45"><div class="ic">🔒</div><div class="tx"><b>${T.name}</b><br>${ch}장 클리어 시 해금</div></div>`;
    }
    return `<div class="lobbyTool"><div class="ic">${T.icon}</div><div class="tx"><b>${T.name} Lv.${L}</b> · 피해 ${Math.round(T.dmg * (1 + CFG.levelMul * (L - 1)))}<br><span style="color:#bbb">${T.desc}</span></div>
      <button class="btn" data-up="${id}" ${save.coins < cost || L >= CFG.maxLevel ? 'disabled' : ''}>⬆ ${cost}</button></div>`;
  }).join('');
  showPanel(`
    <h2>🧟 좀비 스매시</h2>
    <p>프로토타입 · 12줄을 넘기면 장 클리어</p>
    <div class="coins">💰 ${save.coins} 코인</div>
    <div class="chapBtns">${chapBtns.join('')}</div>
    <h2 style="font-size:1.05em;margin-top:.3em">도구 강화 (영구)</h2>
    ${tools}
    <div class="row"><button class="btn gray" id="bReset" style="font-size:.75em">저장 초기화</button></div>`);
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => pickStartTools(+b.dataset.c));
  document.querySelectorAll('[data-up]').forEach(b => b.onclick = () => {
    const id = b.dataset.up; const cost = lvlCost(lvl(id));
    if (save.coins < cost) return;
    save.coins -= cost; save.levels[id] = lvl(id) + 1; persist(); showLobby();
  });
  let resetArm = false;
  $('bReset').onclick = () => {
    if (!resetArm) { resetArm = true; $('bReset').textContent = '한 번 더 누르면 초기화'; return; }
    save = defaultSave(); persist(); showLobby();
  };
}

function pickStartTools(chapter) {
  const chosen = [];
  const render = () => {
    showPanel(`
      <h2>${CHAPTERS[chapter].name}</h2>
      <p>들고 갈 도구 2개를 고르세요. 나머지는 도전 중에 얻을 수 있습니다.</p>
      <div class="opts">${save.owned.map((id, i) => `<div class="opt ${chosen.includes(id) ? 'on' : ''}" data-id="${id}"><div class="ic">${TOOLS[id].icon}</div><div class="tx"><div class="t1">${TOOLS[id].name} Lv.${lvl(id)}</div><div class="t2">${TOOLS[id].desc}</div></div></div>`).join('')}</div>
      <div class="row"><button class="btn gray" id="bBack">뒤로</button><button class="btn" id="bGo" ${chosen.length === 2 ? '' : 'disabled'}>도전 시작</button></div>`);
    document.querySelectorAll('.opt').forEach(el => el.onclick = () => {
      const id = el.dataset.id; const k = chosen.indexOf(id);
      if (k >= 0) chosen.splice(k, 1); else { if (chosen.length >= 2) chosen.shift(); chosen.push(id); }
      render();
    });
    $('bBack').onclick = showLobby;
    $('bGo').onclick = () => { if (chosen.length === 2) startRun(chapter, chosen.slice()); };
  };
  render();
}

function showPanel(html) { $('panel').innerHTML = html; $('overlay').classList.remove('hidden'); }
function hideOverlay() { $('overlay').classList.add('hidden'); }
function setMsg(t) { $('msg').textContent = t; }

function updateHUD() {
  const inRun = !!run;
  $('top').style.visibility = inRun ? 'visible' : 'hidden';
  $('bottom').style.visibility = inRun ? 'visible' : 'hidden';
  $('actions').style.visibility = inRun ? 'visible' : 'hidden';
  if (!inRun) return;
  $('stageText').textContent = `${CHAPTERS[run.chapter].name} · ${run.row} / ${CFG.rows}줄`;
  $('coinText').textContent = `💰 ${run.coins}`;
  $('hpBar').style.width = (100 * run.hp / run.maxHp) + '%';
  $('hpText').textContent = `체력 ${run.hp} / ${run.maxHp}`;
  $('traits').innerHTML = run.traits.map(id => { const t = TRAITS.find(t => t.id === id); return `<span class="chip" title="${t.desc}">${t.icon} ${t.name}</span>`; }).join('');
  const total = CFG.actionsPerTurn + (has('spare') ? 1 : 0);
  $('actions').innerHTML = Array.from({ length: total }, (_, i) => `<div class="pip ${i < run.actionsLeft ? '' : 'used'}"></div>`).join('');
  const hand = $('hand');
  let html = '';
  for (let i = 0; i < maxHand(); i++) {
    const h = run.hand[i];
    if (!h) { html += `<div class="card empty"><div class="ds">빈 칸</div></div>`; continue; }
    const T = TOOLS[h.id];
    html += `<div class="card el-${T.el} ${selectedTool === i ? 'sel' : ''}" data-h="${i}">
      <div class="ic">${T.icon}</div><div class="nm">${T.name}${h.upg ? ` +${h.upg}` : ''}</div>
      <div class="lv">Lv.${lvl(h.id)} · ${EL_NAME[T.el]} ${Math.round(toolDamage(h))}</div>
      <div class="ds">${T.desc.replace(/^한 마리에 \d+(?: \(\S+\))?,? ?/, '')}</div></div>`;
  }
  hand.innerHTML = html;
  hand.querySelectorAll('[data-h]').forEach(el => el.onclick = () => {
    if (run.state !== 'battle') return;
    const i = +el.dataset.h;
    selectedTool = selectedTool === i ? -1 : i;
    setMsg(selectedTool >= 0 ? `${TOOLS[run.hand[i].id].name}: 좀비를 누르세요` : '도구를 고르고 좀비를 누르세요');
    updateHUD();
  });
  $('endTurn').disabled = run.state !== 'battle';
}
$('endTurn').onclick = endTurnEarly;

// 입력
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function slotAt(p) {
  if (p.y < 250 || p.y > GROUND + 40) return -1;
  const i = Math.round((p.x - 60) / 100);
  return i >= 0 && i < CFG.slots ? i : -1;
}
cv.addEventListener('pointermove', e => { hoverSlot = slotAt(toLogical(e)); });
cv.addEventListener('pointerleave', () => { hoverSlot = -1; });
cv.addEventListener('pointerdown', e => {
  if (!run || run.state !== 'battle' || gt < lockUntil) return;
  const s = slotAt(toLogical(e));
  if (s < 0) return;
  const z = alive(s);
  if (!z) return;
  if (selectedTool < 0) {
    const st = [z.armor > 0 ? `갑옷 ${z.armor}` : '', z.burn ? '불붙음' : '', z.frozen ? `얼림 ${z.frozen}턴` : '', z.wet ? '젖음' : '', z.oil ? '기름' : ''].filter(Boolean).join(' · ');
    setMsg(`${ZT[z.type].name} · 체력 ${z.hp} · 공격 ${z.atk}${st ? ' · ' + st : ''}`);
    return;
  }
  const idx = selectedTool;
  if (run.actionsLeft - 1 <= 0) selectedTool = -1;
  useTool(idx, s);
});

function previewSlots(handIdx, slot) {
  const T = TOOLS[run.hand[handIdx].id];
  const out = new Set([slot]);
  if (T.splash) { out.add(slot - 1); out.add(slot + 1); }
  if (T.el === 'cut' && has('pierce')) out.add(slot + 1);
  if (T.el === 'elec') {
    const maxJ = has('overload') ? 99 : CFG.chainJumps; let fr = [slot];
    for (let j = 1; j <= maxJ && fr.length; j++) { const nx = []; for (const s of fr) for (const n of [s - 1, s + 1]) { const z = alive(n); if (z && !out.has(n) && (z.wet || z.type === 'armor')) { out.add(n); nx.push(n); } } fr = nx; }
  }
  return [...out].filter(i => i >= 0 && i < CFG.slots);
}

// ============================================================
// 연출
// ============================================================
function at(delay, fn) { scheduled.push({ t: gt + Math.max(0, delay), fn }); }
function addText(x, y, text, color, size) { texts.push({ x, y, text, color, size: size || 1, life: 1.0, vy: -70 }); }
function elColor(el) { return { blunt: '#f0e0c8', cut: '#bfe6ff', fire: '#ff9a3d', ice: '#8fe3ff', elec: '#fff176', boom: '#ff6b6b' }[el]; }
function addArc(a, b) { slashes.push({ kind: 'arc', x1: slotX(a), x2: slotX(b), y: GROUND - 100, life: 0.35 }); }

function zHeight(z) { return 170 * (ZT[z.type].big || 1); }
function zWidth(z) { return 170 * (ZT[z.type].wide || 1) * (ZT[z.type].big || 1); }

// 좀비 조각 9개 (단위 좌표: x는 폭 기준, y는 키 기준, 바닥이 0)
const PARTS = [
  { k: 'legL',  x: -0.10, y: -0.38, w: 0.15, h: 0.38, c: 'cloth2' },
  { k: 'legR',  x:  0.10, y: -0.38, w: 0.15, h: 0.38, c: 'cloth2' },
  { k: 'body2', x:  0.00, y: -0.58, w: 0.42, h: 0.21, c: 'cloth' },
  { k: 'body1', x:  0.00, y: -0.80, w: 0.46, h: 0.23, c: 'cloth' },
  { k: 'armL',  x: -0.30, y: -0.80, w: 0.12, h: 0.26, c: 'skin' },
  { k: 'armR',  x:  0.30, y: -0.80, w: 0.12, h: 0.26, c: 'skin' },
  { k: 'handL', x: -0.30, y: -0.54, w: 0.12, h: 0.08, c: 'skin2' },
  { k: 'handR', x:  0.30, y: -0.54, w: 0.12, h: 0.08, c: 'skin2' },
  { k: 'head',  x:  0.00, y: -1.08, w: 0.34, h: 0.28, c: 'skin' },
];
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  r = Math.min(255, Math.max(0, Math.round(r * f))); g = Math.min(255, Math.max(0, Math.round(g * f))); b = Math.min(255, Math.max(0, Math.round(b * f)));
  return `rgb(${r},${g},${b})`;
}
function partColor(z, c) {
  const t = ZT[z.type];
  if (c === 'skin') return t.skin; if (c === 'skin2') return shade(t.skin, 0.8);
  if (c === 'cloth') return t.cloth; return shade(t.cloth, 0.75);
}

function drawZombie(z, i) {
  const t = ZT[z.type];
  const hgt = zHeight(z), wid = 170 * (t.wide || 1) * (t.big || 1), hu = 170 * (t.big || 1);
  const sway = Math.sin(gt * 2 + z.phase) * 0.04;
  const spawnK = Math.min(1, (gt - z.spawnT) / 0.25);
  const x = slotX(i), y = GROUND + (1 - spawnK) * 60 + z.lunge * 20;
  const sc = 1 + z.lunge * 0.12;
  cx.save();
  cx.translate(x, y);
  cx.scale(sc, sc);
  cx.rotate(z.frozen ? 0 : sway);
  cx.globalAlpha = spawnK;
  // 그림자
  cx.fillStyle = 'rgba(0,0,0,.35)'; cx.beginPath(); cx.ellipse(0, 0, wid * 0.3, 10, 0, 0, Math.PI * 2); cx.fill();
  for (const p of PARTS) {
    const pw = p.w * wid * (p.k.startsWith('arm') || p.k.startsWith('hand') ? 1 / (t.wide || 1) : 1);
    const px = p.x * wid, py = p.y * hu, ph = p.h * hu;
    let col = partColor(z, p.c);
    if (z.oil) col = p.c.startsWith('cloth') ? '#1f1c17' : col;
    cx.fillStyle = col;
    cx.fillRect(px - pw / 2, py, pw, ph);
    cx.strokeStyle = 'rgba(0,0,0,.6)'; cx.lineWidth = 2; cx.strokeRect(px - pw / 2, py, pw, ph);
  }
  // 얼굴
  const hy = -1.08 * hu;
  cx.fillStyle = z.type === 'boss' ? '#ff4040' : '#ffe14d';
  cx.fillRect(-0.09 * wid / (t.wide || 1) - 5, hy + 0.09 * hu, 10, 8);
  cx.fillRect(0.09 * wid / (t.wide || 1) - 5, hy + 0.09 * hu, 10, 8);
  cx.fillStyle = '#2a1a1a'; cx.fillRect(-12, hy + 0.19 * hu, 24, 6);
  // 갑옷
  if (z.armor > 0) {
    cx.fillStyle = '#9aa3ad'; cx.strokeStyle = '#333';
    const aw = 0.5 * wid; cx.fillRect(-aw / 2, -0.82 * hu, aw, 0.3 * hu); cx.strokeRect(-aw / 2, -0.82 * hu, aw, 0.3 * hu);
    cx.fillRect(-0.19 * wid, hy - 6, 0.38 * wid, 0.1 * hu); cx.strokeRect(-0.19 * wid, hy - 6, 0.38 * wid, 0.1 * hu);
    if (z.armor < z.maxArmor * 0.5) { cx.strokeStyle = '#222'; cx.beginPath(); cx.moveTo(-aw / 3, -0.8 * hu); cx.lineTo(0, -0.62 * hu); cx.lineTo(aw / 4, -0.75 * hu); cx.stroke(); }
  }
  // 기름 얼룩
  if (z.oil) { cx.fillStyle = 'rgba(20,15,5,.85)'; for (let k = 0; k < 4; k++) { cx.fillRect(-0.18 * wid + k * 0.11 * wid, -0.6 * hu, 6, 18 + (k % 2) * 14); } }
  // 상태 덮개
  if (z.wet) { cx.fillStyle = 'rgba(60,140,255,.28)'; cx.fillRect(-wid * 0.38, -1.1 * hu, wid * 0.76, 1.1 * hu); }
  if (z.frozen > 0) {
    cx.fillStyle = 'rgba(190,235,255,.55)'; cx.fillRect(-wid * 0.4, -1.12 * hu, wid * 0.8, 1.12 * hu);
    cx.strokeStyle = '#fff'; cx.lineWidth = 2; cx.strokeRect(-wid * 0.4, -1.12 * hu, wid * 0.8, 1.12 * hu);
  }
  if (z.hitFlash > 0) { cx.fillStyle = `rgba(255,255,255,${z.hitFlash * 0.7})`; cx.fillRect(-wid * 0.4, -1.12 * hu, wid * 0.8, 1.12 * hu); }
  cx.restore();

  // 불 파티클
  if (z.burn && Math.random() < 0.6) particles.push({ x: x + rand(-wid * 0.25, wid * 0.25), y: y - rand(0, hgt), vx: rand(-15, 15), vy: rand(-140, -60), life: rand(0.3, 0.6), max: 0.6, size: rand(6, 12), color: pick(['#ff9a3d', '#ffcf3d', '#ff5a1f']), grav: -50 });
  if (z.wet && Math.random() < 0.15) particles.push({ x: x + rand(-wid * 0.25, wid * 0.25), y: y - rand(hgt * 0.3, hgt), vx: 0, vy: 40, life: 0.5, max: 0.5, size: 4, color: '#6fb6ff', grav: 600 });

  // 체력바
  const bw = Math.min(90, wid * 0.55), by = y - hgt - 26;
  cx.fillStyle = '#000'; cx.fillRect(x - bw / 2 - 2, by - 2, bw + 4, 12);
  cx.fillStyle = '#3a1d1d'; cx.fillRect(x - bw / 2, by, bw, 8);
  cx.fillStyle = '#e74c3c'; cx.fillRect(x - bw / 2, by, bw * Math.max(0, z.shownHp) / z.maxHp, 8);
  if (z.maxArmor) { cx.fillStyle = '#aab4bf'; cx.fillRect(x - bw / 2, by - 7, bw * z.armor / z.maxArmor, 5); }
  // 공격력
  cx.font = 'bold 18px sans-serif'; cx.textAlign = 'center';
  cx.fillStyle = '#ffb3b3'; cx.fillText('⚔' + z.atk, x, by - 12);
}

function spawnDeath(z, slot, el) {
  const t = ZT[z.type];
  const wid = 170 * (t.wide || 1) * (t.big || 1), hu = 170 * (t.big || 1);
  const x0 = slotX(slot), y0 = GROUND;
  z.gone = true;
  const mk = (p) => {
    const pw = p.w * wid * (p.k.startsWith('arm') || p.k.startsWith('hand') ? 1 / (t.wide || 1) : 1), ph = p.h * hu;
    return { x: x0 + p.x * wid, y: y0 + p.y * hu + ph / 2, w: pw, h: ph, rot: 0, vr: 0, vx: 0, vy: 0, color: partColor(z, p.c), life: 2.6, max: 2.6, delay: 0, k: p.k };
  };
  const list = PARTS.map(mk);
  if (el === 'blunt') {
    // 맞은 반대쪽(뒤·위)으로 날아가 벽에 튕김
    const side = Math.random() < 0.5 ? -1 : 1;
    list.forEach(p => { p.vx = side * rand(250, 650) + rand(-150, 150); p.vy = rand(-1000, -550); p.vr = rand(-14, 14); });
    shake = Math.max(shake, 7);
  } else if (el === 'cut') {
    // 사선을 따라 둘로 갈라져 미끄러짐
    list.forEach(p => { const left = p.x < x0 || (p.x === x0 && p.y < y0 - hu * 0.6); p.vx = left ? rand(-260, -160) : rand(160, 260); p.vy = left ? rand(-260, -160) : rand(-60, 0); p.vr = left ? -3 : 2; });
    slashes.push({ kind: 'slash', x: x0, y: y0 - hu * 0.6, len: wid * 0.9, life: 0.3 });
  } else if (el === 'fire') {
    // 검게 변하며 재로 무너짐
    list.forEach(p => { p.color = '#1c1712'; p.vx = rand(-40, 40); p.vy = rand(-40, 20); p.vr = rand(-1, 1); p.life = p.max = 1.1; p.ash = true; });
    for (let k = 0; k < 40; k++) particles.push({ x: x0 + rand(-wid * 0.3, wid * 0.3), y: y0 - rand(0, hu), vx: rand(-30, 30), vy: rand(-90, -20), life: rand(0.8, 1.6), max: 1.6, size: rand(3, 7), color: pick(['#555', '#777', '#3a3a3a', '#ff7a1f']), grav: -20 });
  } else if (el === 'ice') {
    // 하얗게 굳은 뒤 잘게 깨져 흩어짐
    list.length = 0;
    for (let k = 0; k < 34; k++) list.push({ x: x0 + rand(-wid * 0.3, wid * 0.3), y: y0 - rand(0, hu), w: rand(8, 20), h: rand(8, 20), rot: rand(0, 6), vr: rand(-12, 12), vx: rand(-520, 520), vy: rand(-850, -250), color: pick(['#e8f7ff', '#bfe8ff', '#8fd3ff', '#ffffff']), life: 1.8, max: 1.8, delay: 0 });
    whiteFlash = Math.max(whiteFlash, 0.15);
  } else if (el === 'elec') {
    // 뼈대가 번쩍인 뒤 그 자리에 주저앉음
    slashes.push({ kind: 'skel', x: x0, y: y0, wid, hu, life: 0.32 });
    list.forEach(p => { p.delay = 0.3; p.color = shade(p.color.startsWith('#') ? p.color : '#666666', 0.55); p.vx = rand(-60, 60); p.vy = rand(-60, 30); p.vr = rand(-3, 3); });
  } else if (el === 'boom') {
    // 사방으로 흩어지고 화면이 흔들림
    list.forEach(p => { p.vx = rand(-900, 900); p.vy = rand(-1400, -600); p.vr = rand(-20, 20); });
    boomParticles(x0, y0 - hu * 0.5, 1.2);
    shake = Math.max(shake, 16);
  }
  parts.push(...list);
  // 피
  for (let k = 0; k < (el === 'ice' ? 0 : 14); k++) particles.push({ x: x0, y: y0 - hu * 0.6, vx: rand(-300, 300), vy: rand(-500, -100), life: rand(0.4, 0.9), max: 0.9, size: rand(4, 8), color: el === 'fire' ? '#3a3a3a' : '#6aa84f', grav: 1400 });
}

function boomParticles(x, y, k) {
  for (let i = 0; i < 26 * k; i++) {
    const a = rand(0, Math.PI * 2), s = rand(150, 650) * k;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 150, life: rand(0.3, 0.7), max: 0.7, size: rand(8, 20) * k, color: pick(['#ffdd57', '#ff9a3d', '#ff5a1f', '#fff3b0']), grav: 200 });
  }
}
function hitParticles(el, x, y) {
  const col = elColor(el);
  for (let i = 0; i < 10; i++) particles.push({ x, y, vx: rand(-260, 260), vy: rand(-320, 80), life: rand(0.2, 0.45), max: 0.45, size: rand(3, 7), color: col, grav: 600 });
}
function spawnToolFx(el, slot) {
  const x = slotX(slot), y = GROUND - 90;
  if (el === 'cut') slashes.push({ kind: 'slash', x, y: y - 20, len: 150, life: 0.22 });
  if (el === 'blunt') { slashes.push({ kind: 'ring', x, y: y - 20, r: 20, life: 0.25 }); }
  if (el === 'fire') particles.push(...Array.from({ length: 18 }, () => ({ x: x + rand(-30, 30), y: y + rand(-30, 30), vx: rand(-200, 200), vy: rand(-250, 50), life: 0.45, max: 0.45, size: rand(8, 16), color: pick(['#ff9a3d', '#ffcf3d']), grav: -100 })));
  if (el === 'ice') particles.push(...Array.from({ length: 16 }, () => ({ x: x + rand(-30, 30), y: y + rand(-40, 40), vx: rand(-150, 150), vy: rand(-150, 150), life: 0.5, max: 0.5, size: rand(4, 9), color: '#d8f4ff', grav: 0 })));
  if (el === 'elec') whiteFlash = Math.max(whiteFlash, 0.12);
}

// ============================================================
// 루프
// ============================================================
let lastReal = performance.now();
function frame(now) {
  let dtReal = Math.min(0.05, (now - lastReal) / 1000);
  lastReal = now;
  if (timeScale < 1 && now > slowUntilReal) timeScale = 1;
  const dt = dtReal * timeScale;
  gt += dt;

  // 예약 실행
  if (scheduled.length) {
    const due = scheduled.filter(s => s.t <= gt);
    scheduled = scheduled.filter(s => s.t > gt);
    due.sort((a, b) => a.t - b.t).forEach(s => s.fn());
  }
  update(dt, dtReal);
  draw();
  requestAnimationFrame(frame);
}

function update(dt, dtReal) {
  slots.forEach(z => { if (z) { z.hitFlash = Math.max(0, z.hitFlash - dt * 5); z.lunge = Math.max(0, z.lunge - dt * 4); } });
  // 조각 물리
  for (const p of parts) {
    if (p.delay > 0) { p.delay -= dt; continue; }
    p.vy += 1900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    const half = Math.max(p.w, p.h) / 2 * 0.6;
    if (p.y > GROUND + 30 - half) { p.y = GROUND + 30 - half; p.vy *= -0.32; p.vx *= 0.7; p.vr *= 0.6; }
    if (p.x < 10) { p.x = 10; p.vx = Math.abs(p.vx) * 0.6; }
    if (p.x > W - 10) { p.x = W - 10; p.vx = -Math.abs(p.vx) * 0.6; }
    p.life -= dt;
    if (p.ash && Math.random() < 0.25) particles.push({ x: p.x, y: p.y, vx: rand(-20, 20), vy: rand(-60, -20), life: 0.7, max: 0.7, size: rand(2, 5), color: '#666', grav: -10 });
  }
  parts = parts.filter(p => p.life > 0);
  for (const p of particles) { p.vy += (p.grav || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  if (particles.length > 900) particles.splice(0, particles.length - 900);
  for (const t of texts) { t.y += t.vy * dt; t.life -= dt; }
  texts = texts.filter(t => t.life > 0);
  for (const s of slashes) s.life -= dt;
  slashes = slashes.filter(s => s.life > 0);
  shake = Math.max(0, shake - dtReal * 40);
  redFlash = Math.max(0, redFlash - dtReal * 1.5);
  whiteFlash = Math.max(0, whiteFlash - dtReal * 1.2);
  if (bigText) { bigText.t += dtReal; if (bigText.t > 1.4) bigText = null; }
  // 죽은 좀비 칸 정리
  slots.forEach((z, i) => { if (z && z.dead && z.gone && !scheduled.length && gt > lockUntil) slots[i] = null; });
}

function draw() {
  cx.save();
  if (shake > 0) cx.translate(rand(-shake, shake), rand(-shake, shake));
  const ch = run ? CHAPTERS[run.chapter] : CHAPTERS[1];
  const g = cx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, ch.bg[0]); g.addColorStop(1, ch.bg[1]);
  cx.fillStyle = g; cx.fillRect(-20, -20, W + 40, GROUND + 20);
  // 원경 건물
  cx.fillStyle = 'rgba(0,0,0,.18)';
  for (let i = 0; i < 9; i++) { const bw = 70 + (i * 37) % 50, bh = 120 + (i * 71) % 160; cx.fillRect(i * 85 - 10, GROUND - bh - 30, bw, bh); }
  cx.fillStyle = ch.ground; cx.fillRect(-20, GROUND, W + 40, H - GROUND + 20);
  cx.fillStyle = 'rgba(255,255,255,.06)'; cx.fillRect(-20, GROUND, W + 40, 6);

  // 칸 표시와 미리보기
  const prev = run && run.state === 'battle' && selectedTool >= 0 && hoverSlot >= 0 && alive(hoverSlot) ? previewSlots(selectedTool, hoverSlot) : [];
  for (let i = 0; i < CFG.slots; i++) {
    cx.fillStyle = prev.includes(i) ? 'rgba(255,211,77,.45)' : 'rgba(0,0,0,.18)';
    cx.beginPath(); cx.ellipse(slotX(i), GROUND + 4, 44, 12, 0, 0, Math.PI * 2); cx.fill();
  }

  // 좀비
  slots.forEach((z, i) => { if (z && !z.gone) drawZombie(z, i); });

  // 조각
  for (const p of parts) {
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot);
    cx.globalAlpha = Math.min(1, p.life / 0.5);
    cx.fillStyle = p.color; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    cx.strokeStyle = 'rgba(0,0,0,.5)'; cx.lineWidth = 2; cx.strokeRect(-p.w / 2, -p.h / 2, p.w, p.h);
    cx.restore();
  }
  // 이펙트
  for (const s of slashes) {
    const a = Math.max(0, s.life / 0.3);
    cx.save(); cx.globalAlpha = Math.min(1, a);
    if (s.kind === 'slash') { cx.strokeStyle = '#fff'; cx.lineWidth = 6; cx.beginPath(); cx.moveTo(s.x - s.len / 2, s.y - s.len / 3); cx.lineTo(s.x + s.len / 2, s.y + s.len / 3); cx.stroke(); }
    if (s.kind === 'ring') { cx.strokeStyle = '#f0e0c8'; cx.lineWidth = 8; cx.beginPath(); cx.arc(s.x, s.y, s.r + (1 - a) * 70, 0, Math.PI * 2); cx.stroke(); }
    if (s.kind === 'arc') {
      cx.strokeStyle = '#fff176'; cx.lineWidth = 5; cx.beginPath(); cx.moveTo(s.x1, s.y);
      for (let k = 1; k <= 6; k++) cx.lineTo(s.x1 + (s.x2 - s.x1) * k / 6, s.y + (k < 6 ? rand(-22, 22) : 0)); cx.stroke();
    }
    if (s.kind === 'skel') {
      cx.strokeStyle = Math.random() < 0.5 ? '#fff' : '#fff176'; cx.lineWidth = 5;
      const { x, y, wid, hu } = s; cx.beginPath();
      cx.arc(x, y - 0.94 * hu, 0.12 * wid, 0, Math.PI * 2);
      cx.moveTo(x, y - 0.8 * hu); cx.lineTo(x, y - 0.38 * hu);
      cx.moveTo(x - 0.25 * wid, y - 0.75 * hu); cx.lineTo(x + 0.25 * wid, y - 0.75 * hu);
      cx.moveTo(x - 0.25 * wid, y - 0.75 * hu); cx.lineTo(x - 0.3 * wid, y - 0.48 * hu);
      cx.moveTo(x + 0.25 * wid, y - 0.75 * hu); cx.lineTo(x + 0.3 * wid, y - 0.48 * hu);
      cx.moveTo(x, y - 0.38 * hu); cx.lineTo(x - 0.1 * wid, y); cx.moveTo(x, y - 0.38 * hu); cx.lineTo(x + 0.1 * wid, y);
      for (let r = 0; r < 4; r++) { cx.moveTo(x - 0.15 * wid, y - (0.72 - r * 0.07) * hu); cx.lineTo(x + 0.15 * wid, y - (0.72 - r * 0.07) * hu); }
      cx.stroke();
    }
    cx.restore();
  }
  for (const p of particles) {
    cx.globalAlpha = Math.max(0, Math.min(1, p.life / (p.max || 0.5)));
    cx.fillStyle = p.color; cx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  cx.globalAlpha = 1;
  // 피해 숫자
  cx.textAlign = 'center';
  for (const t of texts) {
    cx.globalAlpha = Math.min(1, t.life * 2);
    cx.font = `900 ${Math.round(30 * t.size)}px sans-serif`;
    cx.lineWidth = 6; cx.strokeStyle = '#000'; cx.strokeText(t.text, t.x, t.y);
    cx.fillStyle = t.color; cx.fillText(t.text, t.x, t.y);
  }
  cx.globalAlpha = 1;
  cx.restore();

  if (redFlash > 0) { cx.fillStyle = `rgba(255,0,0,${redFlash * 0.35})`; cx.fillRect(0, 0, W, H); }
  if (whiteFlash > 0) { cx.fillStyle = `rgba(255,255,255,${whiteFlash * 2})`; cx.fillRect(0, 0, W, H); }
  if (timeScale < 1) { cx.fillStyle = 'rgba(0,0,30,.18)'; cx.fillRect(0, 0, W, H); }
  if (bigText) {
    const k = Math.min(1, bigText.t * 6), a = bigText.t > 1.1 ? 1 - (bigText.t - 1.1) / 0.3 : 1;
    cx.save(); cx.globalAlpha = Math.max(0, a); cx.translate(W / 2, 300); cx.scale(0.6 + 0.4 * k, 0.6 + 0.4 * k);
    cx.font = '900 64px sans-serif'; cx.textAlign = 'center'; cx.lineWidth = 10; cx.strokeStyle = '#000';
    cx.strokeText(bigText.text, 0, 0); cx.fillStyle = '#ffd34d'; cx.fillText(bigText.text, 0, 0);
    cx.restore();
  }
}

// 시작
showLobby();
requestAnimationFrame(frame);
</script>
