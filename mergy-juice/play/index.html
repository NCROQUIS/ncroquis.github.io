iv id="orders"></div><section id="physicsControls" class="physics-controls" aria-label="Collision effects" data-i18n-attr="aria-label:physics_label"><label for="rebound"><span data-i18n="phys_rebound">반발</span> <output id="reboundValue" for="rebound">5%</output><input id="rebound" type="range" min="0" max="100" step="1" value="5"></label><label for="slide"><span data-i18n="phys_slide">미끄러짐</span> <output id="slideValue" for="slide">4%</output><input id="slide" type="range" min="0" max="100" step="1" value="4"></label><label for="shake"><span data-i18n="phys_shake">흔들림</span> <output id="shakeValue" for="shake">15%</output><input id="shake" type="range" min="0" max="100" step="1" value="15"></label><label for="knockback"><span data-i18n="phys_knockback">튕겨나감</span> <output id="knockbackValue" for="knockback">8%</output><input id="knockback" type="range" min="0" max="100" step="1" value="8"></label><label for="snap"><span data-i18n="phys_snap">머지 스냅</span> <output id="snapValue" for="snap">4%</output><input id="snap" type="range" min="0" max="100" step="1" value="4"></label></section><div id="sizeControls" class="size-controls"><label for="collisionHeight"><span data-i18n="size_collisionHeight">충돌 높이</span> <output id="collisionHeightValue">38%</output><input id="collisionHeight" type="range" min="5" max="100" value="38"></label><label for="collisionWidth"><span data-i18n="size_collisionWidth">충돌 너비</span> <output id="collisionWidthValue">96%</output><input id="collisionWidth" type="range" min="5" max="100" value="96"></label><label for="objectScale"><span data-i18n="size_objectScale">오브젝트 크기</span> <output id="objectScaleValue">83%</output><input id="objectScale" type="range" min="20" max="100" value="83"></label><label for="moveSpeed"><span data-i18n="size_moveSpeed">이동 속도</span> <output id="moveSpeedValue">103%</output><input id="moveSpeed" type="range" min="20" max="200" value="103"></label><label for="placedPush"><span data-i18n="size_placedPush">놓인 주스 밀림</span>
