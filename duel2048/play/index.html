<!doctype html>
<html>
<head>
  <meta charset="utf-8" /><script src="ncq-flags.js"></script><script src="ncq-ads.js"></script><script src="ncq-iap.js"></script><script src="ncq-feedback.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#faf8ef" />
  <title>2048 Duel</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2212%22 fill=%22%23edc22e%22/%3E%3Ctext x=%2232%22 y=%2242%22 font-size=%2222%22 font-weight=%22800%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22%3E2048%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="title-row">
        <h1 class="logo">2048</h1>
        <div class="scores">
          <div class="score-box"><span class="label" data-i18n="score">Score</span><span id="score" class="value">0</span></div>
          <div class="score-box" id="bestBox"><span class="label" data-i18n="best">Best</span><span id="best" class="value">0</span><em class="new-tag">NEW</em></div>
        </div>
      </div>
      <button id="modeChip" class="mode-chip" type="button"></button>
      <div class="goal" id="goal" hidden>
        <span class="goal-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg></span>
        <div class="goal-body">
          <div class="goal-top"><span class="goal-label" data-i18n="goal_label">Today's Goal</span><span class="goal-stamps stamps" id="goalStamps" aria-hidden="true"></span><span class="goal-prog" id="goalProg"></span></div>
          <div class="goal-text" id="goalText"></div>
          <div class="goal-track"><div class="goal-fill" id="goalFill"></div></div>
        </div>
      </div>
    </header>

    <section id="duelBar" class="duel-bar" hidden>
      <div class="ghost" id="ghost" data-i18n-attr="aria-label:ghost_aria"></div>
      <div class="duel-info">
        <div class="duel-text"><span id="duelLabel" data-i18n="opponent">Rival</span><strong id="duelGap"></strong></div>
        <div class="duel-sub" id="duelSub"></div>
        <div class="duel-track"><div id="duelFill" class="duel-fill"></div></div>
      </div>
    </section>

    <main class="board-wrap">
      <div id="board" class="board" data-i18n-attr="aria-label:board_aria">
        <div class="grid" id="grid"></div>
        <div class="tiles" id="tiles"></div>
        <div class="hint" id="hint" hidden><span class="hand">↔</span><span data-i18n="hint">Swipe to merge matching numbers</span></div>
        <div class="over-veil" id="overVeil" hidden><b data-i18n="over">Game Over</b></div>
      </div>
    </main>

    <nav class="actions">
      <!-- NCQ_ADS_UNDO 보상형 광고로 되돌리기 1회 -->
      <button id="undoBtn" class="act" type="button"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></span><span data-i18n="undo">Undo</span><em class="ad-tag">AD</em></button>
      <button id="newBtn" class="act" type="button"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></span><span data-i18n="new_game">New Game</span></button>
      <button id="rankBtn" class="act" type="button"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg></span><span data-i18n="ranking">Ranking</span></button>
      <button id="setBtn" class="act" type="button"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></span><span data-i18n="settings">Settings</span></button>
    </nav>
    <div id="testPanel" class="test-panel" hidden></div>
  </div>

  <!-- 결과 / 모드 선택 / 랭킹 / 설정 -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card" id="sheetCard"></div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
