<!DOCTYPE html>
<html lang="ko">
<head><script id="ncq-authored-motion" src="ncq-motion.js?v=10dd8b3eaad1"></script>
<meta charset="utf-8"><style id="ncq-text-scale">:where(html){font-size:16px}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}</style><style id="ncq-no-zoom">*{touch-action:manipulation}</style><script src="ncq-flags.js"></script><script src="ncq-ads.js"></script><script src="ncq-iap.js"></script><script src="ncq-feedback.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>도미노 마스터</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:#062b17;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:#fff}
body{display:flex;align-items:center;justify-content:center}
#app{position:relative;width:min(100vw,calc(100dvh * 9 / 16));aspect-ratio:9/16;container-type:size;overflow:hidden;
  background:radial-gradient(ellipse 75% 55% at 50% 45%,#0fb35a 0%,#079246 38%,#056b33 75%,#04512a 100%)}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;
  background-image:radial-gradient(rgba(0,0,0,.35) 1px,transparent 1px);background-size:3px 3px}
.abs{position:absolute}
/* 상단 */
#top{left:0;right:0;top:0;height:16cqw;z-index:14;background:linear-gradient(180deg,#05552c,#06632f);box-shadow:0 .6cqw 1.2cqw rgba(0,0,0,.25)}   /* 상단 UI 블록: 패가 이 아래에서 나오고 들어감 */
.circBtn{position:absolute;top:2.5cqw;width:11cqw;height:11cqw;border-radius:50%;background:rgba(0,40,18,.55);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s}
.circBtn:active{transform:scale(.9)}
.circBtn svg{width:6.6cqw;height:6.6cqw;fill:#fff}
#btnHome{left:2.5cqw}#btnSet{right:2.5cqw}
.score{position:absolute;top:2cqw;width:20cqw;text-align:center;font-weight:700}
.score .lb{font-size:4cqw;opacity:.95}.score .v{font-size:5.6cqw;line-height:1.15}
#scP{left:17.5cqw}#scA{right:17.5cqw}
#target{position:absolute;top:2cqw;left:50%;transform:translateX(-50%);text-align:center;font-weight:800}
#target .t{font-size:6.2cqw;color:#ffe94a;line-height:1.05;text-shadow:0 .3cqw .6cqw rgba(0,0,0,.25)}
#target .r{font-size:3.4cqw;font-weight:700}
/* 상대 자리 (위·왼쪽·오른쪽) */
.seat .backs{position:absolute;display:flex;z-index:4}
.seat .back{transition:width .35s ease,height .35s ease,margin .35s ease,opacity .25s;flex:0 0 auto;border-radius:1.6cqw;background:var(--skin-back);box-shadow:0 .4cqw .8cqw rgba(0,0,0,.3)}
.seat .avatar{position:absolute;z-index:4;width:10.8cqw;height:10.8cqw}   /* 상대 프로필은 내 것의 90% */
.seat .tag{position:absolute;z-index:5;width:15cqw;text-align:center;font-size:3.2cqw;font-weight:800;line-height:1.25;text-shadow:0 .3cqw .5cqw rgba(0,0,0,.4)}
.seat .tag b{display:block;font-size:4.4cqw;color:#ffe94a}
/* 위 상대 패: 선 아래로 걸쳐 아랫부분(두께 포함)만 보이게 */
.seat-top .backs{left:10cqw;right:10cqw;top:16.3cqw;height:7.6cqw;justify-content:center;align-items:flex-end;gap:1cqw;overflow:hidden;padding-bottom:1.8cqw}
.seat-top .back{height:10.8cqw;box-shadow:0 .9cqw 0 var(--skin-back-side),0 1.3cqw 1cqw rgba(0,0,0,.28)}
.seat-top .backs.reveal{height:16cqw;overflow:visible;z-index:6;align-items:flex-start;padding-bottom:0}
.seat-top .avatar{right:2.5cqw;top:15.6cqw;z-index:15!important}
.seat-top .avatar.active{z-index:15!important}   /* 차례일 때도 블록 위 */   /* 상단 UI 블록 경계에 걸쳐 블록 위에 그려짐 */
.seat-top .tag{right:-.1cqw;z-index:16;top:26.7cqw;width:17cqw;white-space:nowrap}
.seat-top .tag b{display:inline;font-size:3.8cqw;margin-left:1cqw}
.seat-left .avatar{left:1.5cqw;top:37.5cqw}.seat-right .avatar{right:1.5cqw;top:37.5cqw}
.seat-left .tag{left:-.6cqw;top:48.9cqw}.seat-right .tag{right:-.6cqw;top:48.9cqw}
.seat-left .backs,.seat-right .backs{top:57.5cqw;width:10.8cqw;flex-direction:column;gap:1cqw}
/* 양옆 상대 패: 화면 바깥쪽으로 절반쯤 잘려 보이게 */
.seat-left .backs{left:-5.4cqw}.seat-right .backs{right:-5.4cqw}
.seat-left .back,.seat-right .back{width:10.8cqw;height:5.4cqw;background:var(--skin-back-h);box-shadow:0 .9cqw 0 var(--skin-back-side),0 1.3cqw 1cqw rgba(0,0,0,.28)}
.seat .backs.reveal svg{flex:0 0 auto;filter:drop-shadow(0 .4cqw .6cqw rgba(0,0,0,.35))}
.seat-left .backs.reveal svg+svg,.seat-right .backs.reveal svg+svg{margin-top:-1.2cqw}
#topLine{left:0;right:0;top:16cqw;height:.3cqw;background:rgba(255,255,255,.85);z-index:14}
#bone{left:2.8cqw;top:18cqw;width:9cqw;height:13cqw;border-radius:2cqw;background:rgba(0,40,18,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;z-index:4;transition:transform .15s}
#bone svg{width:6.4cqw;height:6cqw}
#bone b{font-size:4cqw;line-height:1.1}
#bone.pulse{box-shadow:0 0 0 .8cqw #ffe94a;animation:glow 1s infinite}
@keyframes glow{50%{box-shadow:0 0 0 .8cqw #ffe94a,0 0 3cqw 1cqw rgba(255,233,74,.6)}}
#bone.empty{opacity:.45}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.avatar{width:12cqw;height:12cqw;border-radius:50%;overflow:hidden;border:.6cqw solid rgba(255,255,255,.85);box-shadow:0 .5cqw 1cqw rgba(0,0,0,.35);background:#2bb7d6;transition:box-shadow .2s}
.avatar{transition:box-shadow .2s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.avatar.active{box-shadow:0 0 0 .8cqw #ffe94a,0 .5cqw 1cqw rgba(0,0,0,.35);transform:scale(1.2);z-index:6!important}
#avP{left:2.5cqw;top:121cqw;width:13cqw;height:13cqw;background:#2a3b46;z-index:3}
/* 보드 */
#board{left:2cqw;right:2cqw;top:32cqw;height:83cqw;z-index:1}   /* 패 z-index가 보드 안에서만 쓰이게 */
#app.sides #board{left:14cqw;right:14cqw}
.tile{position:absolute;transition:left .38s cubic-bezier(.2,.8,.3,1),top .38s cubic-bezier(.2,.8,.3,1),width .38s,height .38s;filter:drop-shadow(0 .35cqw .5cqw rgba(0,0,0,.35))}
.tile svg{width:100%;height:100%;display:block}
.tile.new{animation:land .5s cubic-bezier(.3,.7,.4,1)}
.tile.fly{z-index:950!important}   /* 날아오는 동안만 맨 위, 닿기 직전 제 순서로 */
/* 집어 든 상태(크고 그림자 멀리) → 내려와 살짝 눌리며 바닥에 닿음 */
/* 살짝 떠 있던 패가 부드럽게 내려앉음 (내 패·상대 패 동일) */
@keyframes land{0%{transform:scale(1.12);filter:drop-shadow(0 3.5cqw 2.6cqw rgba(0,0,0,.4))}
  72%{transform:scale(1.01);filter:drop-shadow(0 .6cqw .8cqw rgba(0,0,0,.42))}
  86%{transform:scale(.985);filter:drop-shadow(0 .2cqw .3cqw rgba(0,0,0,.5))}
  100%{transform:scale(1);filter:drop-shadow(0 .35cqw .5cqw rgba(0,0,0,.35))}}
.tile.new.soft{animation:soft .32s cubic-bezier(.3,.7,.4,1)}
@keyframes soft{0%{transform:scale(1.06);filter:drop-shadow(0 1.6cqw 1.4cqw rgba(0,0,0,.38))}
  75%{transform:scale(.99);filter:drop-shadow(0 .2cqw .3cqw rgba(0,0,0,.48))}
  100%{transform:scale(1);filter:drop-shadow(0 .35cqw .5cqw rgba(0,0,0,.35))}}
.ripple{position:absolute;border-radius:2cqw;border:.7cqw solid rgba(255,255,255,.55);pointer-events:none;animation:ripple .45s ease-out forwards;z-index:0}
@keyframes ripple{0%{opacity:.6;transform:scale(.97)}100%{opacity:0;transform:scale(1.18)}}
.ghost.hot{background:rgba(255,233,74,.5);border-style:solid;animation:none;opacity:1;transform:scale(1.06)}
.dragTile{position:absolute;left:0;top:0;width:0;height:0;z-index:20;pointer-events:none;will-change:transform}
.dragTile .dti{position:absolute;left:0;top:0;transform:translate(-50%,-50%);
  transition:transform .45s cubic-bezier(.33,.9,.4,1.08),width .45s cubic-bezier(.33,.9,.4,1),height .45s cubic-bezier(.33,.9,.4,1),filter .3s;
  filter:drop-shadow(0 4.5cqw 3cqw rgba(0,0,0,.42))}
.dragTile .dti.snap{filter:drop-shadow(0 2.4cqw 1.8cqw rgba(0,0,0,.4))}
.dragTile .dti svg{width:100%;height:100%;display:block}
.dragTile.back{transition:transform .26s cubic-bezier(.3,.7,.4,1)}
.dragTile.back .dti{filter:drop-shadow(0 .5cqw .6cqw rgba(0,0,0,.4))}
.htile.lifted{opacity:.22;transform:none!important}
.ghost{position:absolute;border:.6cqw dashed #ffe94a;border-radius:1.5cqw;background:rgba(255,233,74,.22);cursor:pointer;animation:gl 1s infinite;z-index:900}
@keyframes gl{0%,100%{opacity:.6}50%{opacity:1}}
/* 메시지 바 */
#msgBar{left:0;right:0;top:122cqw;height:11cqw;display:flex;align-items:center;justify-content:center;
  border-top:.25cqw solid rgba(255,255,255,.35);border-bottom:.25cqw solid rgba(255,255,255,.25);
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.12) 20%,rgba(0,0,0,.12) 80%,transparent)}
#msg{font-size:5.2cqw;font-weight:600;text-align:center;padding:0 16cqw;text-shadow:0 .3cqw .6cqw rgba(0,0,0,.3)}
/* 더미 선택 팝업 */
#mDraw{background:rgba(0,0,0,.45);z-index:18}   /* 타이머(19)는 더미 팝업 위, 설정·결과 창(20) 아래 */
.drawBox{width:94cqw;animation:pop .28s ease-out}
.drawTitle{text-align:center;font-size:5.4cqw;font-weight:800;margin-bottom:2.6cqw;text-shadow:0 .4cqw .8cqw rgba(0,0,0,.5)}
.drawTitle small{display:block;font-size:3.6cqw;font-weight:600;opacity:.85;margin-top:.6cqw}
.wood{border-radius:6cqw;padding:2.4cqw;
  background:linear-gradient(135deg,#c97a45,#8a4522 30%,#b9693a 55%,#7a3a1c 80%,#a85a30);
  box-shadow:0 2cqw 5cqw rgba(0,0,0,.6),inset 0 .4cqw .4cqw rgba(255,210,170,.35)}
.slots{border-radius:4.4cqw;padding:4cqw 3cqw;display:grid;grid-template-columns:repeat(7,1fr);gap:3cqw 2cqw;
  background:repeating-linear-gradient(176deg,rgba(255,255,255,.025) 0 .5cqw,transparent .5cqw 2.2cqw),
    repeating-linear-gradient(181deg,rgba(0,0,0,.18) 0 .3cqw,transparent .3cqw 3.4cqw),
    linear-gradient(180deg,#2a1c15,#1a110c 60%,#22160f);
  box-shadow:inset 0 1cqw 2cqw rgba(0,0,0,.7),inset 0 0 0 .4cqw rgba(0,0,0,.4)}
.slot{aspect-ratio:1/2;perspective:60cqw}
.slots{--d:2.2cqw;--hw:5cqw;--hh:10cqw}
.slot{filter:drop-shadow(0 1.2cqw 1.2cqw rgba(0,0,0,.5))}
/* 3D 두께: 앞·뒷면과 같은 둥근 판을 두께 방향으로 여러 겹 쌓음 (--d = 두께) */
.ly{position:absolute;inset:.6% 1.4%;background:linear-gradient(180deg,var(--skin-side-a),var(--skin-side-b))}
.dt .ly{border-radius:1.6cqw}.aiTile .ly{border-radius:2cqw}
/* 옆으로 섰을 때 겹 사이가 비어 보이지 않게 좌우 옆면 판을 덧댐 */
.sd{position:absolute;left:50%;top:7%;height:86%;width:var(--d);margin-left:calc(var(--d) / -2);background:linear-gradient(90deg,var(--skin-side-b),var(--skin-side-a) 50%,var(--skin-side-b))}
.sd.r{transform:rotateY(90deg) translateZ(calc(var(--hw) * .972))}
.sd.l{transform:rotateY(-90deg) translateZ(calc(var(--hw) * .972))}
.dt{position:relative;width:100%;height:100%;cursor:pointer;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.1,.3,1),opacity .3s,translate .3s;
  transform:rotateX(16deg)}
.dt:hover{translate:0 -.8cqw}
.dt .f{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:1.6cqw;transform:translateZ(calc(var(--d) / 2))}
.dt .back{background:var(--skin-back)}
.dt .face{transform:rotateY(180deg) translateZ(calc(var(--d) / 2));overflow:hidden}
.dt .face svg{width:100%;height:100%;display:block}
.dt.flipped{transform:rotateX(16deg) rotateY(180deg)}
.dt.taken{opacity:0;translate:0 12cqw}
 /* 차례 타이머 (30초) */
#timer{position:absolute;left:0;top:0;width:8cqw;height:8cqw;z-index:19;display:none;pointer-events:none;border-radius:50%;
  background:linear-gradient(180deg,#ffd76a,#d79a1c);padding:.7cqw;box-shadow:0 .5cqw 1cqw rgba(0,0,0,.4)}
#timer .pie{width:100%;height:100%;border-radius:50%;background:conic-gradient(#6b3b22 0 var(--used,0deg),var(--tc,#3fd13f) 0);
  box-shadow:inset 0 .5cqw .6cqw rgba(255,255,255,.45),inset 0 -.4cqw .6cqw rgba(0,0,0,.25)}
#timer b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3.2cqw;font-weight:900;color:#fff;text-shadow:0 .2cqw .3cqw rgba(0,0,0,.7)}
#timer.pop{animation:tpop .28s cubic-bezier(.3,1.4,.5,1)}
@keyframes tpop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#timer.warn{animation:tw .5s infinite alternate}
@keyframes tw{to{transform:scale(1.15)}}
.resulting #msgBar,.resulting #avP{opacity:0;transition:opacity .2s}
.resulting #hand{border-top-color:transparent;background:transparent}
.htile.wait{filter:brightness(.6) saturate(.7) drop-shadow(0 .5cqw .6cqw rgba(0,0,0,.4));cursor:default}   /* 상대 차례: 내 패 어둡게 */
.resulting .seat .avatar,.resulting .seat .tag{opacity:0;transition:opacity .2s}
.tav{position:absolute;left:0;top:0;transform-origin:0 0;z-index:3}
.tav.win{box-shadow:0 0 0 .8cqw #ffe94a,0 .5cqw 1cqw rgba(0,0,0,.35)}
.tally{position:absolute;inset:0;z-index:8;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.1) 40%,rgba(0,0,0,.35))}
.rhead{position:absolute;left:14cqw;right:14cqw;top:17cqw;z-index:2;text-align:center;animation:pop .35s ease-out}
.rhead b{display:block;font-size:9cqw;font-weight:900;color:#fff;text-shadow:0 .6cqw 0 rgba(0,0,0,.35)}
.rhead.good b{color:#ffe94a;text-shadow:0 .6cqw 0 #8a5a00,0 0 3cqw rgba(255,233,74,.5)}
.rhead small{display:block;margin-top:1cqw;font-size:3.4cqw;font-weight:600;opacity:.9;line-height:1.35}
.rfoot{position:absolute;left:8cqw;right:8cqw;top:139cqw;z-index:2;text-align:center;pointer-events:auto;animation:fadeIn .35s}
.rtot{font-size:3.6cqw;font-weight:700;margin-bottom:3cqw;text-shadow:0 .3cqw .5cqw rgba(0,0,0,.45)}
.rfoot .rbtn{margin-top:0;background:#ffe94a;color:#3a2c00;box-shadow:0 1cqw 0 #b8a020;font-size:5.4cqw}
.ttile{position:absolute;left:0;top:0;transform-origin:0 0;filter:drop-shadow(0 .5cqw .6cqw rgba(0,0,0,.4))}
.ttile svg{width:100%;height:100%;display:block}
.tname{position:absolute;left:0;right:0;text-align:center;font-size:3.6cqw;font-weight:800;text-shadow:0 .3cqw .5cqw rgba(0,0,0,.45);animation:fadeIn .4s}
.tname.win{color:#ffe94a}
.tempty{position:absolute;left:0;right:0;text-align:center;font-size:3.6cqw;font-weight:700;opacity:.8;animation:fadeIn .4s}
.tcount{position:absolute;left:0;right:0;text-align:center;line-height:1.1;transition:transform .06s;font-size:6cqw;font-weight:900;color:#ffe94a;text-shadow:0 .4cqw 0 #7a5200,0 .8cqw 1.2cqw rgba(0,0,0,.45);animation:fadeIn .3s;transition:opacity .2s}
.tcount.gone{opacity:.25}
@keyframes fadeIn{from{opacity:0;transform:translateY(1.5cqw)}}
.tfly{position:absolute;left:0;top:0;z-index:16;pointer-events:none;font-size:7cqw;font-weight:900;color:#ffe94a;white-space:nowrap;
  text-shadow:0 .4cqw 0 #7a5200,0 0 2cqw rgba(255,233,74,.8)}
.spark{position:absolute;z-index:17;pointer-events:none;width:0;height:0}
.spark i{position:absolute;left:-.9cqw;top:-.9cqw;width:1.8cqw;height:1.8cqw;border-radius:50%;background:radial-gradient(#fff,#ffe94a 60%,transparent 70%);
  animation:spk .65s ease-out forwards}
@keyframes spk{0%{transform:rotate(var(--a)) translateX(0) scale(1.3);opacity:1}100%{transform:rotate(var(--a)) translateX(var(--d)) scale(.2);opacity:0}}
.spark i.ring{left:-6cqw;top:-6cqw;width:12cqw;height:12cqw;background:none;border:.7cqw solid #fff6b0;animation:ring .5s ease-out forwards}
@keyframes ring{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.4);opacity:0}}
.bump{animation:bump .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.55);color:#ffe94a}100%{transform:scale(1)}}
#scPv,#scAv,.seat .tag b{display:inline-block}
.aiTile{position:absolute;left:0;top:0;z-index:20;pointer-events:none;transform-origin:50% 50%;perspective:60cqw;filter:drop-shadow(0 2.5cqw 2cqw rgba(0,0,0,.4))}
.aiTile.go{transition:transform .45s cubic-bezier(.3,.8,.35,1)}
.aiTile .flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.1,.3,1);transform:rotateX(14deg)}
.aiTile.open .flip{transform:rotateX(14deg) rotateY(180deg)}
.aiTile .f{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:2cqw;transform:translateZ(calc(var(--d) / 2))}
.aiTile .back{background:var(--skin-back)}
.aiTile .face{transform:rotateY(180deg) translateZ(calc(var(--d) / 2))}
.aiTile .face svg{width:100%;height:100%;display:block}
.tgroup{position:absolute;left:5cqw;right:5cqw;border-radius:3.5cqw;background:rgba(0,0,0,.2);border:.3cqw solid rgba(255,255,255,.12);animation:fadeIn .35s}
.tgroup.win{background:rgba(255,233,74,.14);border-color:rgba(255,233,74,.55)}
.glv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.glv.pop{z-index:2;filter:drop-shadow(0 1.2cqw 1.2cqw rgba(0,0,0,.5))}
.glv.ai{z-index:20;filter:drop-shadow(0 2.5cqw 2cqw rgba(0,0,0,.4))}
#mDraw.gl .dt>*{visibility:hidden}
#mDraw.gl .slot{filter:none}
.seat-top .back.out{width:0!important;margin-left:-1cqw;opacity:0}
.seat-left .back.out,.seat-right .back.out{height:0!important;margin-top:-1cqw;opacity:0}
.seat .back.hold{visibility:hidden}
.emo{position:absolute;z-index:22;pointer-events:none;font-size:9cqw;line-height:1;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif;
  filter:drop-shadow(0 .6cqw .6cqw rgba(0,0,0,.35));animation:emo 1.9s ease-out forwards}
