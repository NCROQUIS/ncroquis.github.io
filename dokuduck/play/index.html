<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><style id="ncq-text-scale">:where(html){font-size:16px}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}</style><style id="ncq-no-zoom">*{touch-action:manipulation}</style><script src="ncq-flags.js"></script><script src="ncq-ads.js"></script><script src="ncq-iap.js"></script><script src="ncq-feedback.js"></script>
<script src="ncq/safe.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#DDF1EC">
<title>dokuduck</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- 홈 -->
  <section id="scr-home" class="scr" hidden>
    <header class="topbar">
      <button class="chip" id="btn-streak" type="button" aria-label="연속 플레이"><span class="ic" data-ic="ic_flame"></span><b id="streak-n">0</b>일</button>
      <span class="grow"></span>
      <button class="iconbtn" id="btn-home-settings" type="button" aria-label="설정"><span class="ic" data-ic="ic_gear"></span></button>
    </header>
    <div class="home-hero">
      <div class="logo" id="logo"></div>
      <div class="pond">
        <svg class="ripple" viewBox="0 0 300 90" aria-hidden="true"><path d="M22 46 C40 14 250 8 280 44 C296 74 60 88 26 62 C18 56 18 52 22 46Z"/><path class="r2" pathLength="1" d="M70 48 C92 30 210 28 232 46"/><path class="r2" pathLength="1" d="M96 62 C130 70 180 70 208 60"/></svg>
        <img class="hero-duck" id="hero-duck" alt="도쿠">
      </div>
      <p class="tagline">색마다 한 마리, 줄마다 한 마리.<br>오리가 숨은 자리를 찾아 주세요.</p>
    </div>
    <div class="home-actions">
      <button class="btn big primary" id="btn-play" type="button" data-ncq-main><span id="play-label">레벨 1</span><small id="play-sub"></small></button>
      <button class="btn sub" id="btn-daily" type="button"><span class="ic" data-ic="ic_calendar"></span><span id="daily-label">오늘의 퍼즐</span><small id="daily-sub"></small></button>
    </div>
  </section>

  <!-- 인게임 -->
  <section id="scr-game" class="scr" data-ncq-no-main hidden>
    <header class="topbar">
      <button class="iconbtn" id="btn-back" type="button" aria-label="홈으로"><span class="ic" data-ic="ic_back"></span></button>
      <div class="scorebox">
        <div class="sb"><span id="g-level-label">레벨</span><b id="g-level">1</b></div>
        <div class="sb"><span>점수</span><b id="g-score">0</b></div>
      </div>
      <button class="iconbtn" id="btn-game-settings" type="button" aria-label="설정"><span class="ic" data-ic="ic_gear"></span></button>
    </header>
    <div class="hearts-row" id="hearts-row"><span class="badge" id="g-badge" hidden>깊은연못</span><div class="hearts pill" id="g-hearts" aria-label="하트"></div></div>
    <div class="colors-row" id="colors-row"><div class="colors pill" id="g-colors" aria-label="색깔별 진행"></div></div>
    <button class="rules" id="btn-rules" type="button" aria-label="규칙 보기">
      <span class="rule" data-rule="color"><svg class="rb" aria-hidden="true"><rect/></svg><span class="rg" id="rg-color"></span><em>색깔당 오리<br>1마리</em></span>
      <span class="rule" data-rule="line"><svg class="rb" aria-hidden="true"><rect/></svg><span class="rg" id="rg-line"></span><em>행과 열마다<br>오리 1마리</em></span>
      <span class="rule" data-rule="adj"><svg class="rb" aria-hidden="true"><rect/></svg><span class="rg" id="rg-adj"></span><em>오리 인접<br>불가</em></span>
    </button>
    <div class="guide" id="guide" hidden><img id="guide-duck" alt=""><p id="guide-text"></p><button class="btn small" id="guide-ok" type="button" hidden>알겠어요</button></div>
    <div class="board-holder" id="board-holder">
      <div class="board" id="board">
        <svg class="regions" id="regions" aria-hidden="true"></svg>
        <div class="dim" id="dim" aria-hidden="true"><svg id="dim-svg"></svg></div>
        <div class="cells" id="cells"></div>
        <div class="fx" id="fx"></div>
      </div>
    </div>
    <p class="status" id="status"></p>
    <div class="hintbar" id="hintbar" hidden>
      <img id="hint-duck" alt="">
      <p id="hint-text"></p>
      <div class="row"><button class="btn small ghost" id="hint-more" type="button" hidden>자세히</button><button class="btn small primary" id="hint-apply" type="button">확인</button></div>
    </div>
    <div class="draftbar" id="draftbar" hidden>
      <p>낙서연필로 오리와 X를 가볍게 그려 보세요. 확정하면 한꺼번에 확인해요.</p>
      <div class="row"><button class="btn small ghost" id="draft-cancel" type="button">취소</button><button class="btn small primary" id="draft-apply" type="button">확정</button></div>
    </div>
    <nav class="tools" id="tools">
      <button class="tool" data-tool="hint" type="button"><span class="ic" data-ic="ic_bulb"></span><em>도쿠힌트</em><b class="cnt"></b></button>
      <button class="tool" data-tool="locate" type="button"><span class="ic" data-ic="ic_find"></span><em>오리찾기</em><b class="cnt"></b></button>
      <button class="tool" data-tool="frog" type="button"><span class="ic" data-ic="ic_frog"></span><em>개굴점프</em><b class="cnt"></b></button>
      <button class="tool" data-tool="draft" type="button"><span class="ic" data-ic="ic_pencil"></span><em>낙서연필</em><b class="cnt"></b></button>
    </nav>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
</div>

<script src="js/art.js"></script>
<script src="js/bank.js"></script>
<script src="js/engine.js"></script>
<script src="js/game.js"></script>
</body>
</html>
