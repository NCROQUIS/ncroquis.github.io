<!DOCTYPE html>
<html lang="ko">
<head>
<script src="ncq/safe.js"></script>
<meta charset="utf-8"><style id="ncq-no-zoom">*{touch-action:manipulation}</style><script src="ncq-flags.js"></script><script src="ncq-ads.js"></script><script src="ncq-iap.js"></script><script src="ncq-feedback.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>해골 갈아끼우기</title>
<style>
:root{
  --white:#FFFFFF; --navy:#1C2238; --navy2:#262D47; --navy3:#323A5A;
  --burg:#8A2F45; --mint:#7FD3B2; --amber:#F5A03A; --amber2:#F8C46A;
  --ink:#1C2238; --text:#F4F1EA; --dim:#9AA3C2;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;background:#0F1322;font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--text)}
#app{position:relative;max-width:440px;height:100dvh;margin:0 auto;background:var(--navy);overflow:hidden;display:flex;flex-direction:column}
.screen{position:absolute;top:var(--ncq-top,0px);right:var(--ncq-right,0px);bottom:0;left:var(--ncq-left,0px);display:none;flex-direction:column}
.screen.on{display:flex}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{background:var(--amber);color:var(--ink);font-weight:800;border:3px solid var(--ink);border-radius:12px;padding:10px 16px;box-shadow:0 4px 0 var(--ink);transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.mint{background:var(--mint)} .btn.burg{background:var(--burg);color:var(--white)} .btn.white{background:var(--white)} .btn.gray{background:#5B6385;color:var(--white)}
.btn:disabled{filter:grayscale(1) brightness(.7);cursor:default}

/* ---------- battle ---------- */
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#cv{display:block;width:100%;height:100%}
.hudTop{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:6px;align-items:center;pointer-events:none}
.pill{background:rgba(28,34,56,.85);border:2px solid var(--ink);border-radius:999px;padding:3px 10px 3px 6px;font-weight:800;font-size:13px;display:flex;align-items:center;gap:5px;color:var(--white)}
.ico{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);display:inline-block}
.ico.gold{background:var(--amber)} .ico.skull{background:var(--white)}
.chapTitle{position:absolute;left:0;right:0;top:40px;text-align:center;pointer-events:none}
.chapTitle b{font-size:18px;color:var(--white);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;letter-spacing:1px}
.prog{width:56%;height:8px;margin:4px auto 0;background:var(--ink);border-radius:6px;overflow:hidden;border:2px solid var(--ink)}
.prog i{display:block;height:100%;background:var(--amber);width:0}
#speedBtn{position:absolute;left:8px;bottom:8px;background:var(--burg);color:var(--white);font-weight:900;border:2px solid var(--ink);border-radius:8px;padding:4px 9px;font-size:14px}
#skillBtn{position:absolute;right:10px;bottom:10px;width:70px;height:70px;border-radius:16px;border:3px solid var(--ink);background:#5B6385;color:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 4px 0 var(--ink);filter:grayscale(.6)}
#skillBtn.ready{background:var(--amber);color:var(--ink);filter:none;animation:pulse 1s infinite}
#skillBtn .ki{font-size:26px;line-height:1}#skillBtn .kn{font-size:10px;font-weight:900}
@keyframes pulse{50%{transform:scale(1.06)}}
#quitBtn{position:absolute;right:calc(8px + var(--ncq-toss-right,0px));top:8px;background:var(--navy);border:2px solid var(--ink);border-radius:8px;width:30px;height:30px;color:var(--white);font-weight:900}
#evBar{position:absolute;left:0;right:0;bottom:0;background:var(--navy);border-top:3px solid var(--ink);padding:8px;display:none}
#evBar.on{display:block}
#evBar .t{font-weight:900;margin-bottom:6px;font-size:15px}
#evBar .row{display:flex;gap:6px}
#evBar .row .btn{flex:1;font-size:13px;padding:8px 4px;line-height:1.25}

.panel{flex:0 0 auto;padding-bottom:calc(8px + var(--ncq-bottom,0px));background:var(--navy);padding:8px;display:flex;flex-direction:column;gap:6px;overflow:hidden;border-top:3px solid var(--ink)}
.bars{display:flex;gap:6px}
.bar{flex:1;height:20px;background:#0E1222;border:2px solid #0B0E1A;border-radius:6px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;transition:width .12s}
.bar span{position:absolute;inset:0;text-align:center;font-size:11px;font-weight:800;line-height:16px;color:var(--white);text-shadow:0 1px 0 #000}
.bar.exp i{background:var(--mint)} .bar.exp span{padding-left:28px} .bar.hp i{background:#D24A5C} .bar.arm i{background:#5C8FD6}
.bar .tag{font-style:normal;position:absolute;left:3px;top:1px;font-size:9px;font-weight:900;background:var(--mint);color:var(--ink);border-radius:3px;padding:0 3px;line-height:14px;z-index:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.st{background:var(--navy2);border-radius:6px;padding:4px 8px;display:flex;align-items:center;gap:7px}
.st .sic{width:22px;height:22px;flex:0 0 22px}
.st small{display:block;font-size:10px;color:var(--dim);line-height:1.1}
.st b{font-size:14px;line-height:1.15}
.st b.up{color:#7EF0A5}
.perkRow{background:var(--navy2);border-radius:6px;min-height:42px;padding:4px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start}
.pchip{width:30px;height:30px;border-radius:7px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:15px;position:relative}
.pchip.c{background:#5B6385}.pchip.l{background:var(--amber)}.pchip.m{background:var(--burg)}
.pchip em{position:absolute;right:-3px;bottom:-4px;font-style:normal;font-size:9px;font-weight:900;background:var(--white);color:var(--ink);border-radius:4px;padding:0 2px;border:1px solid var(--ink)}

/* ---------- modal ---------- */
.modal{position:absolute;inset:0;background:rgba(10,12,22,.82);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.on{display:flex}
.ribbon{background:var(--amber);color:var(--ink);font-weight:900;font-size:20px;border:3px solid var(--ink);border-radius:8px;padding:4px 26px;box-shadow:0 4px 0 var(--ink);margin-bottom:6px}
.ribbon.burg{background:var(--burg);color:var(--white)} .ribbon.mint{background:var(--mint)}
.msub{font-weight:800;margin-bottom:12px;font-size:15px}
.cards{width:100%;display:flex;flex-direction:column;gap:10px}
.card{position:relative;background:var(--navy2);border:3px solid var(--ink);border-radius:10px;padding:16px 10px 10px 64px;text-align:left;min-height:66px;box-shadow:0 4px 0 #0B0E1A}
.card:active{transform:translateY(2px)}
.card .rar{position:absolute;left:58px;top:-11px;font-size:11px;font-weight:900;padding:1px 10px;border-radius:5px;border:2px solid var(--ink)}
.card .rar.c{background:#5B6385;color:var(--white)}.card .rar.l{background:var(--amber);color:var(--ink)}.card .rar.m{background:var(--burg);color:var(--white)}
.card .pic{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:10px;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:24px}
.card .pic.c{background:#5B6385}.card .pic.l{background:var(--amber)}.card .pic.m{background:var(--burg)}
.card .nm{font-weight:900;font-size:14px;margin-bottom:2px}
.card .ds{font-size:13px;color:#DDE2F2;line-height:1.35}
.card .ds b{color:#7EF0A5}
.card .new{position:absolute;right:8px;top:6px;font-size:10px;font-weight:900;color:var(--ink);background:var(--mint);border-radius:4px;padding:0 4px}
.mfoot{margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700}
.statStrip{position:absolute;top:10px;left:8px;right:8px;display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--dim)}
.statStrip div{text-align:center;flex:1}
.statStrip b{display:block;color:var(--white);font-size:12px}
.res{background:var(--navy2);border:3px solid var(--ink);border-radius:12px;padding:16px;width:100%;text-align:center}
.res .big{font-size:30px;font-weight:900;margin:6px 0}
.res .line{display:flex;justify-content:space-between;padding:6px 4px;border-bottom:1px dashed #3A4268;font-weight:700}

/* ---------- lobby ---------- */
#lobby{background:#2E6B57}
.ltop{display:flex;align-items:center;gap:8px;padding:8px calc(8px + var(--ncq-toss-right,0px)) 8px 8px;background:var(--navy);border-bottom:3px solid var(--ink)}
.ltop .avatar{width:36px;height:36px;border-radius:8px;border:2px solid var(--amber);background:var(--amber2);overflow:hidden}
.ltop .pw{font-weight:900;color:var(--amber);font-size:18px;display:flex;align-items:center;gap:4px}
.ltop .sp{flex:1}
.lbody{flex:1;position:relative;overflow-y:auto}
.tab{display:none;padding:12px;min-height:100%}
.tab.on{display:block}
.nav{display:flex;background:var(--navy);border-top:3px solid var(--ink);flex:none;padding-bottom:var(--ncq-bottom,0px)}
.nav button{flex:1;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--dim);position:relative}
.nav button .ni{font-size:22px;line-height:1}
.nav button.on{background:var(--navy3);color:var(--white)}
.nav button .dot{position:absolute;top:4px;right:22%;width:9px;height:9px;border-radius:50%;background:#E5484D;border:2px solid var(--ink);display:none}
.nav button .dot.on{display:block}

.chapWrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:12px}
.chapName{font-size:22px;font-weight:900;color:var(--white);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill}
.chapCard{display:flex;align-items:center;gap:10px}
.chapCard .arrow{width:36px;height:36px;font-size:20px;font-weight:900;color:var(--white);background:rgba(0,0,0,.25);border-radius:8px}
.chapCard .arrow:disabled{opacity:.25}
#chapCv{width:220px;height:170px;border:3px solid var(--ink);border-radius:12px;background:var(--amber)}
.chapInfo{font-size:13px;font-weight:700;color:#DFF5EC;text-align:center;line-height:1.5}
#startBtn{font-size:26px;padding:12px 56px;margin-top:6px}
.tip{background:rgba(28,34,56,.7);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.5;color:#DDE2F2;margin-top:14px;width:100%}

.eqWrap{display:grid;grid-template-columns:76px 1fr 76px;gap:8px;align-items:center}
.slotCol{display:flex;flex-direction:column;gap:8px}
.slot{background:var(--navy2);border:3px solid var(--ink);border-radius:10px;height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative}
.slot .si{font-size:24px;line-height:1}
.slot .sn{font-size:10px;font-weight:800;color:var(--dim)}
.slot .lv{position:absolute;left:4px;top:3px;font-size:10px;font-weight:900;color:var(--amber)}
.slot.sel{border-color:var(--amber)}
.slot .up{position:absolute;right:3px;top:2px;font-size:12px;color:#7EF0A5;font-weight:900;display:none}
.slot .up.on{display:block}
#heroCv{width:100%;height:auto;aspect-ratio:520/480;background:#F6D8A5;border:3px solid var(--ink);border-radius:12px}
.eqStats{display:flex;justify-content:center;gap:6px;margin-top:8px}
.eqStats div{background:var(--navy);border-radius:6px;padding:3px 8px;font-size:12px;font-weight:800}
.detail{background:var(--navy);border:3px solid var(--ink);border-radius:12px;padding:12px;margin-top:10px}
.detail h4{font-size:15px;margin-bottom:4px}
.detail p{font-size:12px;color:var(--dim);line-height:1.5}
.detail .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}

.heads{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hcard{background:var(--navy2);border:3px solid var(--ink);border-radius:10px;padding:6px;text-align:center;position:relative}
.hcard canvas{width:100%;height:84px;background:#F6D8A5;border-radius:6px;display:block}
.hcard .hn{font-size:12px;font-weight:900;margin-top:4px}
.hcard .hb{font-size:10px;color:#7EF0A5;font-weight:700;min-height:39px;line-height:1.3}
.hcard .hc{font-size:11px;font-weight:900;margin-top:3px}
.hcard.eq{border-color:var(--amber)}
.hcard.lock canvas{filter:grayscale(.7) brightness(.6)}
.hcard .badge{position:absolute;left:4px;top:4px;font-size:9px;font-weight:900;background:var(--amber);color:var(--ink);border-radius:4px;padding:0 4px}

.talents{display:flex;flex-direction:column;gap:8px}
.tal{background:var(--navy2);border:3px solid var(--ink);border-radius:10px;padding:10px;display:flex;align-items:center;gap:10px}
.tal .ti{width:42px;height:42px;border-radius:10px;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--mint)}
.tal .tt{flex:1}
.tal .tt b{display:block;font-size:14px}
.tal .tt small{font-size:12px;color:var(--dim)}
.tal .btn{font-size:12px;padding:6px 10px;min-width:84px}
.secT{font-weight:900;font-size:16px;margin:4px 0 8px;color:var(--white)}
#setModal{padding-top:calc(16px + var(--ncq-top,0px));padding-bottom:calc(16px + var(--ncq-bottom,0px))}
#toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:var(--ink);color:var(--white);padding:10px 16px;border-radius:10px;font-weight:800;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">

<!-- ================= LOBBY ================= -->
<div id="lobby" class="screen on">
  <div class="ltop">
    <canvas class="avatar" id="avCv" width="72" height="72"></canvas>
    <div class="pw">⚔ <span id="lPow">0</span></div>
    <div class="sp"></div>
    <div class="pill"><span class="ico gold"></span><span id="lGold">0</span></div>
    <button id="setBtn" aria-label="설정" style="width:34px;height:34px;border-radius:8px;border:2px solid var(--ink);background:var(--navy3);font-size:17px">⚙️</button>
  </div>
  <div class="lbody">
    <!-- battle tab -->
    <div class="tab on" id="tab-battle">
      <div class="chapWrap">
        <div class="chapName" id="chapName">챕터 1</div>
        <div class="chapCard">
          <button class="arrow" id="chPrev">◀</button>
          <canvas id="chapCv" width="440" height="340"></canvas>
          <button class="arrow" id="chNext">▶</button>
        </div>
        <div class="chapInfo" id="chapInfo"></div>
        <button class="btn" id="startBtn" data-ncq-main="시작 버튼">시작</button>
        <div class="tip" id="lobbyTip"></div>
      </div>
    </div>
    <!-- equip tab -->
    <div class="tab" id="tab-equip">
      <div class="eqWrap">
        <div class="slotCol" id="slotL"></div>
        <div>
          <canvas id="heroCv" width="520" height="480"></canvas>
          <div class="eqStats" id="eqStats"></div>
        </div>
        <div class="slotCol" id="slotR"></div>
      </div>
      <div class="detail" id="eqDetail"></div>
      <div class="detail" id="skillBox"></div>
    </div>
    <!-- heads tab -->
    <div class="tab" id="tab-heads">
      <canvas id="wardCv" width="520" height="300" style="width:100%;height:auto;aspect-ratio:520/300;max-height:200px;object-fit:contain;background:#F6D8A5;border:3px solid var(--ink);border-radius:12px;display:block;margin-bottom:10px"></canvas>
      <div class="secT">💀 머리</div>
      <div class="heads" id="headGrid"></div>
      <div class="secT" style="margin-top:14px">👘 옷</div>
      <div class="heads" id="outfitGrid"></div>
      <div class="tip">머리와 옷은 따로 갈아 끼워요. 한 번 사면 계속 갖고 있고, 지금 착용한 것의 효과만 적용돼요. 장비 탭의 투구·갑옷 <b>부위 강화</b>는 무엇을 착용하든 그대로 남아요.</div>
    </div>
    <!-- talent tab -->
    <div class="tab" id="tab-talent">
      <div class="secT">특성 · 영구 성장</div>
      <div class="talents" id="talList"></div>
      <div class="tip">특성은 모든 도전의 출발 능력치를 올려요. 도전 중에 고른 퍼크는 그 판에만 적용돼요.</div>
    </div>
  </div>
  <div class="nav">
    <button data-tab="equip"><span class="ni">🗡️</span>장비<span class="dot" id="dotEq"></span></button>
    <button data-tab="heads"><span class="ni">💀</span>옷장<span class="dot" id="dotHd"></span></button>
    <button data-tab="battle" class="on"><span class="ni">⚔️</span>전투</button>
    <button data-tab="talent"><span class="ni">✨</span>특성<span class="dot" id="dotTl"></span></button>
  </div>
</div>

<!-- ================= BATTLE ================= -->
<div id="battle" class="screen" data-ncq-no-main>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="hudTop">
      <div class="pill"><span class="ico skull"></span><span id="bKills">0</span></div>
      <div class="pill"><span class="ico gold"></span><span id="bGold">0</span></div>
    </div>
    <div class="chapTitle"><b id="bChap">챕터 1</b><div class="prog"><i id="bProg"></i></div></div>
    <button id="quitBtn">✕</button>
    <button id="speedBtn">x1</button>
    <button id="skillBtn" style="display:none"></button>
    <div id="evBar"><div class="t" id="evTitle"></div><div class="row" id="evRow"></div></div>
  </div>
  <div class="panel">
    <div class="bars">
      <div class="bar exp"><em class="tag">EXP</em><i id="xpI"></i><span id="xpT">0/6</span></div>
      <div class="bar hp"><i id="hpI"></i><span id="hpT">100/100</span></div>
      <div class="bar arm" id="armBar"><i id="arI"></i><span id="arT">0/0</span></div>
    </div>
    <div class="stats" id="statGrid"></div>
    <div class="perkRow" id="perkRow"></div>
  </div>

  <div class="modal" id="pickModal">
    <div class="statStrip" id="pickStrip"></div>
    <div class="ribbon">레벨 업!</div>
    <div class="msub">새 퍼크를 선택하세요</div>
    <div class="cards" id="pickCards"></div>
    <div class="mfoot"><button class="btn mint" id="rerollBtn" style="padding:8px 26px">새로고침 🎲</button><span id="rerollT">남은 횟수 : 1/1</span></div>
  </div>

  <div class="modal" id="choiceModal">
    <div class="ribbon" id="chRib">수호 천사</div>
    <div class="msub" id="chSub"></div>
    <div class="cards" id="chCards"></div>
  </div>

  <div class="modal" id="resModal">
    <div class="ribbon" id="resRib">승리!</div>
    <div class="res">
      <div id="resMsg" style="font-weight:800"></div>
      <div class="big" id="resGold">+0</div>
      <div class="line"><span>처치</span><span id="resKills">0</span></div>
      <div class="line"><span>도달</span><span id="resWave">0</span></div>
      <div class="line"><span>고른 퍼크</span><span id="resLv">1</span></div>
      <div class="line" style="border:0"><span>빌드</span><span id="resPerks">0</span></div>
      <button class="btn" id="resOk" data-ncq-main="로비로 버튼" style="margin-top:14px;width:100%;font-size:18px">로비로</button>
    </div>
  </div>
</div>

<div class="modal" id="setModal">
  <div class="ribbon mint">설정</div>
  <div class="res" style="display:flex;flex-direction:column;gap:10px">
    <button class="btn white" id="fbBtn">💬 피드백 보내기</button>
    <button class="btn gray" id="resetBtn2" style="font-size:13px">데이터 초기화</button>
    <button class="btn" id="setClose" data-ncq-main="닫기 버튼">닫기</button>
    <div id="appVersion" style="font-size:11px;color:var(--dim);text-align:right">dev</div>
  </div>
</div>
