html,body{padding:0}
body{box-sizing:border-box;padding:var(--ncq-top) var(--ncq-right) var(--ncq-bottom) var(--ncq-left)}

<body>
<style>
/* Layout: 세로 화면 전체가 3D 당구대. 위는 점수판, 아래는 당점·큐 시점, 오른쪽 레일은 파워, 왼쪽 레일은 미세 조준 */
:root{
  --ink:#eef3f8;
  --ink-dim:#a6b6c8;
  --panel:rgba(10,16,24,.84);
  --panel-2:#121b27;
  --line:rgba(160,190,220,.2);
  --chalk:#4fb3ff;
  --chalk-deep:#1f6fb8;
  --warn:#ff6a5e;
  --gold:#ffcf4a;
  --bg:#0b0f14;
  --wood:#5b3520;
  --ball-w:#f4f1e8;
  --ball-y:#f3c22c;
  --ball-r:#c81f29;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-ui:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --f-disp:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --dock-h:118px;
  --hud-h:66px;
  --ad-h:60px;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-ui);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#app{position:relative;height:calc(100% - var(--ad-h));width:min(100%,calc(100vh*.62));margin:0 auto;overflow:hidden;background:var(--bg)}
#adBanner{height:var(--ad-h);width:min(100%,calc(100vh*.62));margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:.04em;color:var(--ink-dim);background:#10161f;border-bottom:1px dashed var(--line)}
#adFull{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:#070a0f;text-align:center}
#adKind{font-family:var(--f-disp);font-size:30px}
#adCount{font-family:var(--f-num);font-size:72px;font-weight:700;line-height:1;color:var(--chalk);font-variant-numeric:tabular-nums}
#adNote{margin:0;font-size:14px;color:var(--ink-dim)}
#adFull button{min-width:180px;padding:13px;font-size:15px}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:var(--f-ui);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px;font-size:14px;font-weight:500;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
button.primary{background:var(--chalk-deep);border-color:var(--chalk);font-weight:700}
button:active{transform:translateY(1px)}
button.sm{padding:5px 8px;font-size:12px}
.lbl{font-size:11px;color:var(--ink-dim);letter-spacing:.06em}

/* 공 글리프 */
.b{--c:#888;display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--c);box-shadow:inset -3px -4px 6px rgba(0,0,0,.38),inset 3px 3px 5px rgba(255,255,255,.28);flex:none}
.b.w{--c:var(--ball-w)}.b.y{--c:var(--ball-y)}.b.r{--c:var(--ball-r)}

/* 로비 */
.screen{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column}
#lobby{justify-content:space-between;padding-block:clamp(20px,5vh,44px) clamp(16px,3vh,28px);background:linear-gradient(180deg,rgba(11,15,20,.9) 0,rgba(11,15,20,.28) 30%,rgba(11,15,20,.12) 50%,rgba(11,15,20,.92) 84%)}
.rankbox{position:absolute;top:calc(clamp(20px,5vh,44px) + 48px);right:max(16px,env(safe-area-inset-right,0px));padding:5px 6px;background:var(--panel);border:1px solid var(--line);border-radius:4px}
.rankbox table{border-collapse:collapse;font-variant-numeric:tabular-nums}
.rankbox th,.rankbox td{padding:2px 4px;text-align:right;white-space:nowrap}
.rankbox thead th{font-size:11px;font-weight:500;color:var(--ink-dim)}
.rankbox thead th:first-child{font-family:var(--f-num);font-size:13px;font-weight:700;letter-spacing:.03em;color:var(--chalk);text-align:left}
.rankbox tbody th{font-size:12px;font-weight:700;text-align:left}
.rankbox td{font-family:var(--f-num);font-size:16px;font-weight:600;line-height:1.15}
.brand .trio{display:flex;gap:6px;margin-bottom:10px}
.brand .trio .b{width:26px;height:26px}
.brand h1{width:max-content;font-family:var(--f-disp);font-weight:400;font-size:clamp(70px,min(15vh,22vw),112px);line-height:.92;margin:0;letter-spacing:-.01em;text-shadow:0 4px 0 rgba(0,0,0,.45)}
.brand p{width:max-content;margin:10px 0 0;font-family:var(--f-disp);font-size:18px;color:var(--ink-dim);letter-spacing:.04em;white-space:nowrap;text-wrap:balance;line-height:1.3}
.slabs{display:flex;flex-direction:column;gap:10px}
#lobby.sheeted .lpick{visibility:hidden}
.slab{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:12px;text-align:left;padding:clamp(8px,1.4vh,13px) 16px;background:var(--panel);border:1px solid var(--line);border-radius:4px}
.slab b{display:block;font-family:var(--f-num);font-size:clamp(34px,5.4vh,46px);font-weight:700;line-height:1;letter-spacing:.01em}
.slab small{display:block;margin-top:4px;font-size:13px;font-weight:400;color:var(--ink-dim)}
.slab .chalk{position:relative;flex:none;width:44px;height:44px;border-radius:8px;background:linear-gradient(145deg,#7cc8ff,#2c7fca);box-shadow:inset 0 -3px 6px rgba(0,0,0,.28),0 2px 6px rgba(0,0,0,.3)}
.slab .chalk::after{content:"";position:absolute;left:50%;top:50%;width:11px;height:11px;margin:-6px 0 0 -8px;border:solid #fff;border-width:3.5px 3.5px 0 0;border-radius:1px;transform:rotate(45deg)}
.slab.online{border-color:rgba(79,179,255,.5)}

/* 시트 */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;max-height:86%;display:flex;flex-direction:column;background:var(--panel-2);border-top:4px solid var(--wood);box-shadow:0 -10px 30px rgba(0,0,0,.45);animation:rise .32s cubic-bezier(.2,.85,.25,1)}
@keyframes rise{from{transform:translateY(100%)}to{transform:none}}
#sheet.out{animation:sink .23s ease-in forwards}
@keyframes sink{to{transform:translateY(100%)}}
#goSettings{position:absolute;z-index:1;top:clamp(20px,5vh,44px);right:max(16px,env(safe-area-inset-right,0px));width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:10px}
.rules-card{animation:rise .3s cubic-bezier(.2,.85,.25,1)}
.sheet-head{display:flex;align-items:center;gap:10px;padding-block:12px 8px}
.sheet-head h2{margin:0;font-family:var(--f-num);font-size:30px;font-weight:700;line-height:1}
.sheet-head h2 span{font-family:var(--f-ui);font-size:14px;font-weight:500;color:var(--ink-dim);margin-left:8px}
#sheetBack{width:38px;height:38px;padding:0;font-size:18px;flex:none}
.step{overflow-y:auto;touch-action:pan-y;padding-block:0 18px;min-height:0}
.row-btn{display:grid;grid-template-columns:82px 1fr;align-items:center;column-gap:12px;width:100%;padding:14px 2px;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;text-align:left}
.row-btn:last-child{border-bottom:0}
/* 파란 ▶ = 누르면 바로 시작, 파란 > = 다음 화면으로 */
.row-btn .go.play::after,.slab .chalk.play::after{width:0;height:0;margin:-9px 0 0 -5px;border-style:solid;border-color:transparent transparent transparent #fff;border-width:9px 0 9px 15px;border-radius:0;transform:none}
.row-btn .go{position:relative;width:44px;height:44px;border-radius:8px;background:linear-gradient(145deg,#7cc8ff,#2c7fca);box-shadow:inset 0 -3px 6px rgba(0,0,0,.28),0 2px 6px rgba(0,0,0,.3)}
.row-btn .go::after{content:"";position:absolute;left:50%;top:50%;width:11px;height:11px;margin:-6px 0 0 -8px;border:solid #fff;border-width:3.5px 3.5px 0 0;border-radius:1px;transform:rotate(45deg)}
.sq{height:44px;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 10px;border-radius:8px;font-size:13px;font-weight:700;white-space:nowrap}
.stars.sq{font-size:13px;letter-spacing:0;background:#1a2533;border:1px solid var(--line)}
.row-btn b{display:block;font-family:var(--f-disp);font-weight:400;font-size:30px;line-height:1.1}
.row-btn small{display:block;margin-top:3px;color:var(--ink-dim);font-size:13px;font-weight:400;line-height:1.4}
.glyph{display:flex;flex-wrap:wrap;gap:3px;width:78px;align-items:center}
.glyph .b{width:22px;height:22px}
.glyph.rack{position:relative;display:block;width:62px;height:58px}
.glyph.rack .b{position:absolute;width:12px;height:12px;box-shadow:inset -1.5px -2px 3px rgba(0,0,0,.4)}
.mode-box{padding:14px 2px;border-bottom:1px solid var(--line)}
.mode-box b{display:block;font-family:var(--f-disp);font-weight:400;font-size:26px;line-height:1.1}
.mode-box small{display:block;margin:3px 0 10px;color:var(--ink-dim);font-size:13px}
.lv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lv button{display:flex;align-items:center;justify-content:center;gap:10px;height:66px;padding:0 6px;color:#fff;border:0;border-radius:8px;background:linear-gradient(145deg,#4aa6f0,#1f66b0);box-shadow:inset 0 -3px 6px rgba(0,0,0,.25),0 2px 6px rgba(0,0,0,.3)}
.lv button>span{display:flex;flex-direction:column;align-items:flex-start;gap:7px}
.lv b{font-family:var(--f-disp);font-size:25px;font-weight:400;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.lv .ply{flex:none;width:0;height:0;border-style:solid;border-color:transparent transparent transparent #fff;border-width:9px 0 9px 14px}
.pips{display:flex;gap:4px}
.pips i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3)}
.pips i.on{background:#ffd76a}
.lv button:active,.mnode:active,.row-btn:active .go{transform:scale(.94)}
.stars{font-size:14px;color:var(--gold);letter-spacing:1px;white-space:nowrap}
.stars .off{color:rgba(255,207,74,.28)}

/* 매칭 */
#matching{justify-content:space-between;padding-block:clamp(24px,6vh,52px) clamp(16px,3vh,28px);background:rgba(8,12,17,.8);z-index:7}
.m-tag{font-family:var(--f-num);font-size:18px;font-weight:600;color:var(--chalk);letter-spacing:.04em}
#mHead{margin:6px 0 0;font-family:var(--f-disp);font-weight:400;font-size:34px;line-height:1.15;text-wrap:balance}
#mClock{font-family:var(--f-num);font-size:30px;font-weight:600;color:var(--ink-dim);font-variant-numeric:tabular-nums;margin-top:4px}
.m-vs{display:flex;flex-direction:column;gap:10px}
.m-plate{display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:12px;padding:14px;background:var(--panel-2);border:1px solid var(--line);border-radius:4px}
.m-plate .b{width:34px;height:34px}
.m-plate b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-plate small{display:block;font-size:13px;color:var(--ink-dim);margin-top:2px}
.m-plate>div{min-width:0}
.m-plate.wait{border-style:dashed}
.m-plate.wait .b{--c:#2b3746;animation:pulse 1.2s ease-in-out infinite}
.m-pic{display:grid;place-items:center;width:40px;height:40px}
.m-pic.q{border-radius:50%;background:#16202b;border:2px dashed rgba(160,190,220,.55);font-family:var(--f-num);font-size:23px;font-weight:700;color:var(--ink-dim)}
.m-plate.wait .m-pic.q{animation:pulse 1.2s ease-in-out infinite}
.m-plate .badge{font-family:var(--f-num);font-size:15px;font-weight:700;padding:2px 8px;border-radius:3px;background:var(--chalk-deep);letter-spacing:.04em}
.m-plate .badge.bot{background:#6a4a12;color:var(--gold)}
@keyframes pulse{50%{opacity:.35}}
.m-x{font-family:var(--f-num);font-weight:700;font-size:22px;color:var(--ink-dim);text-align:center;line-height:1}
.m-foot{display:flex;flex-direction:column;gap:8px}
.m-foot p{margin:0 0 4px;font-size:13px;line-height:1.5;color:var(--ink-dim)}

/* 결과 */
#result{justify-content:center;background:rgba(8,12,17,.78);z-index:8}
.r-tag{font-family:var(--f-num);font-size:18px;font-weight:600;color:var(--ink-dim);letter-spacing:.04em}
#rMain{font-family:var(--f-disp);font-size:clamp(60px,min(15vh,24vw),104px);line-height:1;margin:6px 0 4px;text-shadow:0 4px 0 rgba(0,0,0,.45)}
#rMain.sm{font-size:clamp(40px,min(10vh,14vw),68px)}
.tmo{display:inline-flex;vertical-align:-2px;margin-left:4px;color:var(--warn)}
#rMain.win{color:var(--gold)}#rMain.lose{color:var(--warn)}
#rWhy{font-size:15px;color:var(--ink);line-height:1.5}
#rScore{font-family:var(--f-num);font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:8px}
#rStars{font-size:36px;color:var(--gold);letter-spacing:4px;margin-top:6px}
#rStars .off{color:rgba(255,207,74,.25)}
#rNote{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:7px 12px;border-radius:6px;background:rgba(255,207,74,.12);color:var(--gold);font-size:14px;line-height:1.4;animation:starIn .3s 1.15s both}
#rRk{margin-top:8px;font-size:15px}
#rRk b{font-family:var(--f-num);font-size:26px}
#rRk .up{color:var(--gold)}#rRk .down{color:var(--warn)}
.r-acts{display:flex;flex-direction:column;gap:8px;margin-top:26px}
.r-acts button{padding:13px;font-size:15px}

/* 인게임 HUD */
#hud{position:absolute;left:0;right:0;top:0;z-index:2;padding-block:8px 6px;background:linear-gradient(180deg,rgba(11,15,20,.92) 60%,rgba(11,15,20,0))}
#hudPlayers{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:stretch}
.pl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:7px;padding:6px 8px;background:var(--panel);border:1px solid var(--line);border-radius:4px}
.pl.on{border-color:var(--chalk);box-shadow:inset 0 0 0 1px var(--chalk)}
/* 프로필 아이콘 + 오른쪽 아래 작은 공(내 수구 색·포켓볼 그룹) */
.pl .pav{position:relative;width:30px;height:30px;flex:none}
.pl .pav .pic{display:block;width:30px;height:30px}
.pl .pav .b{position:absolute;right:-4px;bottom:-3px;width:13px;height:13px;box-shadow:0 0 0 2px var(--panel)}
.pl .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.pl .sc{font-family:var(--f-num);font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.beads{position:relative;height:10px;margin-top:3px}
.beads::before{content:"";position:absolute;left:0;right:0;top:4.5px;height:1px;background:rgba(160,190,220,.35)}
.beads i{position:absolute;top:0;width:10px;height:10px;border-radius:50%;background:#2d3a4a;transition:left .28s ease-out,background .2s}
.beads i.on{background:var(--gold)}
.dots{display:flex;gap:2px;margin-top:3px;height:10px}
.dots i{width:9px;height:9px;border-radius:50%;background:#2d3a4a}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:48px}
.mid .rule{font-family:var(--f-disp);font-size:15px;line-height:1.2}
.mid .inn{font-family:var(--f-num);font-size:15px;font-weight:600;color:var(--ink-dim);line-height:1.1}
#clockBar{height:6px;margin-top:6px;border-radius:3px;background:rgba(160,190,220,.16);overflow:hidden;transition:opacity .15s}
#clockBar.held{opacity:.4}
#clockFill{display:block;height:100%;background:var(--chalk);transform-origin:left center}
#clockFill.low{background:var(--warn)}
#hudSolo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;background:var(--panel);border:1px solid var(--line);border-radius:4px}
.solo-tag{font-family:var(--f-num);font-size:14px;font-weight:600;color:var(--chalk);letter-spacing:.03em;line-height:1.15}
.solo-title{font-family:var(--f-disp);font-size:18px;line-height:1.2}
.solo-goal{font-size:12px;color:var(--ink-dim);line-height:1.35}
.solo-r{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.solo-tries{font-family:var(--f-num);font-size:16px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}

#toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.9);z-index:3;font-family:var(--f-disp);font-size:58px;color:var(--gold);text-shadow:0 3px 0 #7a4b00,0 0 24px rgba(0,0,0,.6);opacity:0;transition:opacity .2s,transform .25s;pointer-events:none;white-space:nowrap}
#toast.long.show{transform:translateY(-50%)}
#toast.long{left:0;right:0;width:auto;transform:translateY(-50%) scale(.9);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:clamp(17px,5vw,22px);line-height:1.3;white-space:normal;word-break:keep-all;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast.bad{color:var(--warn);text-shadow:0 3px 0 #6b0f0a,0 0 24px rgba(0,0,0,.6)}
#banner{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);z-index:3;text-align:center;font-family:var(--f-disp);font-size:26px;padding:8px 0;background:rgba(8,12,17,.72);opacity:0;pointer-events:none;transition:opacity .18s}
#banner.show{opacity:1}

/* 레일 위 조작 */
#powerwrap{position:absolute;z-index:2;bottom:calc(var(--dock-h) + 12px);height:min(46%,340px);transition:opacity .15s}
#powerwrap{right:max(5px,env(safe-area-inset-right,0px));width:38px;display:flex;flex-direction:column;align-items:center;gap:3px}
#powerVal{font-family:var(--f-num);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;background:var(--panel);padding:2px 5px;border-radius:3px;min-width:30px;text-align:center}
#power{position:relative;flex:1;width:100%;border-radius:5px;background:var(--panel);border:1px solid var(--line);overflow:hidden;touch-action:none;cursor:ns-resize}
#powerFill{position:absolute;left:0;right:0;top:0;height:0;background:linear-gradient(180deg,#4fb3ff,#ffcf4a 70%,#ff5a4e)}
#power .grip{position:absolute;left:7px;right:7px;top:7px;height:9px;border-radius:4px;background:var(--ink);opacity:.85;pointer-events:none}
#power::after{content:"";position:absolute;left:50%;top:34px;width:9px;height:9px;margin-left:-5px;border-right:2px solid rgba(238,243,248,.55);border-bottom:2px solid rgba(238,243,248,.55);transform:rotate(45deg);pointer-events:none}
#powerMark{position:absolute;left:0;right:0;height:4px;margin-top:-2px;background:var(--gold);box-shadow:0 0 0 1px rgba(0,0,0,.5);pointer-events:none}
.idle{opacity:.38;pointer-events:none}
#placeBar{grid-column:2;grid-row:1;display:flex;align-items:center;justify-content:center;z-index:1}
#placeBar button{padding:12px 18px;font-size:15px;white-space:nowrap}

/* 하단 도크 */
#dock{position:absolute;left:0;right:0;bottom:0;z-index:2;display:grid;grid-template-columns:86px minmax(0,1fr) 96px;gap:8px;padding-block:6px 10px;transition:opacity .15s}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:4px}
.cell.spin{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 4px 3px}
#pad{position:relative;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#fff 0,#f1ede2 45%,#c9c3b4 100%);box-shadow:inset 0 -5px 10px rgba(0,0,0,.25);cursor:crosshair;touch-action:none}
#padZoom .grid,#pad .grid{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:
  linear-gradient(rgba(0,0,0,.16),rgba(0,0,0,.16)) 50% 0/1px 100% no-repeat,
  linear-gradient(90deg,rgba(0,0,0,.16),rgba(0,0,0,.16)) 0 50%/100% 1px no-repeat,
  repeating-linear-gradient(rgba(0,0,0,.18) 0 1px,transparent 1px 12.5%) 50% 0/6px 100% no-repeat,
  repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 1px,transparent 1px 12.5%) 0 50%/100% 6px no-repeat,
  radial-gradient(circle,transparent calc(25% - 1px),rgba(0,0,0,.11) 25%,transparent calc(25% + 1px),transparent calc(50% - 1px),rgba(0,0,0,.11) 50%,transparent calc(50% + 1px),transparent calc(75% - 1px),rgba(0,0,0,.11) 75%,transparent calc(75% + 1px))}
.padTgt{position:absolute;width:26%;height:26%;margin:-13% 0 0 -13%;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 0 2px rgba(0,0,0,.35);pointer-events:none;animation:tutGlow 1s ease-in-out infinite}
#padZoom .padTgt{width:16%;height:16%;margin:-8% 0 0 -8%}
#elevMark{position:absolute;width:4px;height:22px;margin:-11px 0 0 -2px;background:var(--gold);border-radius:2px;pointer-events:none;z-index:1}
#elevCell{position:relative}
#dot{position:absolute;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border-radius:50%;background:var(--chalk);border:2px solid #0b3c66;box-shadow:0 0 0 3px rgba(79,179,255,.3);pointer-events:none}
#spinRead{background:none;border:0;padding:0 2px;font-family:var(--f-ui);font-size:11px;color:var(--ink-dim);white-space:nowrap;line-height:1.5}
#pip{position:relative;overflow:hidden;grid-column:2;grid-row:1;border:1px solid var(--line);border-radius:4px;min-height:98px;background:transparent;touch-action:none;cursor:ew-resize}
#fineTicks{position:absolute;left:0;right:0;bottom:0;height:26px;pointer-events:none;background-image:linear-gradient(90deg,rgba(238,243,248,.95) 0 2px,transparent 2px),repeating-linear-gradient(90deg,rgba(238,243,248,.6) 0 1px,transparent 1px 7px),linear-gradient(180deg,transparent,rgba(8,12,17,.42));background-size:35px 18px,35px 11px,100% 100%;background-repeat:repeat-x,repeat-x,no-repeat;background-position:0 center,0 center,0 0;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 13%,#000 87%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 13%,#000 87%,transparent 100%)}
#menuBtn{position:absolute;z-index:2;right:max(6px,env(safe-area-inset-right,0px));top:calc(var(--hud-h) + 8px);width:38px;height:38px;padding:0;display:flex;align-items:center;justify-content:center}
.cell.ctl{display:flex;flex-direction:column;justify-content:center;gap:12px;padding:7px 8px}
.ctl-l{display:flex;justify-content:space-between;align-items:baseline}
#elevVal{font-family:var(--f-num);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
#elev{width:100%;margin:0;accent-color:var(--chalk);touch-action:none}

/* 메뉴 */
#menu{position:absolute;inset:0;z-index:9;background:rgba(8,12,17,.66);display:flex;align-items:flex-end}
.menu-card{width:100%;background:var(--panel-2);border-top:4px solid var(--wood);padding-block:14px 16px;display:flex;flex-direction:column;gap:12px}
.menu-card h2{margin:0;font-family:var(--f-disp);font-weight:400;font-size:22px}
.menu-card .row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.menu-card select{background:#1a2533;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 8px;font-family:var(--f-ui);font-size:14px}
.menu-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menu-acts button{padding:12px}
#menuQuit.arm{background:#6b1f19;border-color:var(--warn)}
#padZoom{position:absolute;z-index:5;left:50%;width:min(62%,230px);aspect-ratio:1;margin-left:calc(min(62%,230px)/-2);border-radius:50%;background:radial-gradient(circle at 38% 32%,#fff 0,#f1ede2 45%,#c9c3b4 100%);box-shadow:inset 0 -14px 28px rgba(0,0,0,.25),0 10px 34px rgba(0,0,0,.6);pointer-events:none}
#dotZoom{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--chalk);border:3px solid #0b3c66;box-shadow:0 0 0 6px rgba(79,179,255,.3)}
.rank-open{display:block;width:100%;padding:5px 8px;font-size:12px;font-weight:700}
.pc-btns{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:5px}
#profCard{display:flex;align-items:center;gap:7px;padding:2px 2px 6px;margin-bottom:4px;border-bottom:1px solid var(--line);cursor:pointer}
#profPic .pic,.pic{display:inline-flex;flex:none;line-height:0}
.pc-txt{display:flex;flex-direction:column;min-width:0;flex:1}
.pc-txt b{font-size:14px;font-weight:700;max-width:10.5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-txt small{font-size:11px;color:var(--gold)}
.pc-edit{font-size:13px;color:var(--ink-dim)}
#achs,#profile{position:absolute;inset:0;z-index:11;display:flex;align-items:flex-end;background:rgba(8,12,17,.72)}
.pf-head{display:flex;gap:12px;align-items:center}
.pf-name{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pf-name label{font-size:12px;color:var(--ink-dim)}
.pf-row{display:flex;gap:6px}
