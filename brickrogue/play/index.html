.tnode{position:absolute;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;border:2px solid;background:#0b0d1f;display:flex;align-items:center;justify-content:center;font-size:22px;padding:0;box-sizing:border-box}
.tnode .tl{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:900;padding:1px 6px;border-radius:6px;color:#05060f;white-space:nowrap}
.tnode .tn{position:absolute;top:58px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;white-space:nowrap;color:#c9cdf0}
.tnode.lock{filter:grayscale(.6) brightness(.45)}
.tnode{z-index:1}.tnode .tn{background:rgba(8,10,26,.92);padding:1px 6px;border-radius:6px}
.tnode.sel{box-shadow:0 0 0 3px #fff,0 0 18px currentColor}
.lvpanel{border:1.5px solid #2a3570;border-radius:14px;background:#0a0d1e;padding:9px 12px;margin-bottom:2px;animation:fadeUp .3s both}
.lvrow{display:flex;align-items:center;gap:8px}
.lvb{font-size:13px;font-weight:900;color:#3dc3ff;white-space:nowrap}.lvb.dim{color:#4d5380}
.lvbar{position:relative;flex:1;height:18px;border-radius:9px;background:#161a36;overflow:hidden}
.lvbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#2a8de0,#6fd8ff);box-shadow:0 0 10px #3dc3ff;border-radius:9px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.lvbar span{position:relative;display:block;text-align:center;font-size:11px;font-weight:800;line-height:18px;color:#fff;text-shadow:0 1px 2px #000}
.lvhint{font-size:11.5px;color:#aab1e6;margin-top:6px}
.lpill{font-size:14px;font-weight:900;color:#ff8a3d;border:1.5px solid #ff8a3d;border-radius:999px;padding:3px 12px;box-shadow:0 0 10px rgba(255,138,61,.35)}
.lcoin,.lorb{position:absolute;left:0;top:0;width:24px;height:24px;margin:-7px 0 0 -7px;pointer-events:none;z-index:9}
.lcoin{border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6d0,#ffc94d 45%,#d98a10);box-shadow:0 0 12px #ffb13d,inset 0 0 0 2px rgba(150,80,0,.5)}
.lorb{width:30px;height:30px;margin:-10px 0 0 -10px}
.lvsvg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 0 4px #3dc3ff) drop-shadow(0 0 8px rgba(61,195,255,.6))}
.tdetail{border:1.5px solid;border-radius:14px;padding:12px;background:#0a0d1e;position:absolute;left:14px;right:14px;bottom:10px}
.tpages{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:8px -14px 0;padding:2px 14px 4px;touch-action:pan-x}
.tpages::-webkit-scrollbar{display:none}
.tpages{cursor:grab;scroll-behavior:auto}.tpages.drag{cursor:grabbing}.tpages.drag .tpg{pointer-events:none}
.tpg{flex:0 0 auto;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:800;border-color:#2a3570;background:#0b0e24;color:#aab1e6}
.tpg.on{border-color:#ff8a3d;color:#fff;background:#2a1508;box-shadow:0 0 10px rgba(255,138,61,.45)}
.tpg.lk{color:#4d5380}
.tempty{height:330px}
.tghost i{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:2px dashed #23284a}
.tmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;color:#7d84b8;line-height:1.7}
.tmsg b{color:#dfe4ff}
#tray{position:absolute;left:8px;right:8px;top:752px;height:62px;display:none;gap:5px;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;scrollbar-width:none;align-items:center;padding:0 4px;box-sizing:border-box;border-radius:12px;background:rgba(255,255,255,.025);border:1px solid #1c2142;scroll-behavior:smooth}
#tray::-webkit-scrollbar{display:none}
.trayEmpty{flex:1;text-align:center;font-size:11px;color:#4d5380}
.tile{flex:0 0 40px;height:50px;border-radius:9px;position:relative;display:flex;align-items:center;justify-content:center;border:1.5px solid;box-sizing:border-box;cursor:pointer;transition:opacity .15s}
.tile .ic{width:30px;height:30px;border-radius:50%;background:#0b0d1f;border:1.5px solid;display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1}
.tile .lv{position:absolute;top:-1px;right:-1px;font-size:9px;font-weight:800;padding:1px 4px;border-radius:0 8px 0 6px;color:#05060f}
.tile.pending{opacity:0}
.tile.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.35)}100%{transform:scale(1)}}
#tip{position:absolute;display:none;width:176px;pointer-events:none;z-index:5}
#tip .box{background:rgba(10,12,28,.97);border:1.5px solid;border-radius:10px;padding:9px 11px;font-size:12px;line-height:1.5;box-sizing:border-box}
#tip .h{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px}
#tip .h .lvb{margin-left:auto;font-size:10px;padding:1px 6px;border-radius:6px;color:#05060f}
#tip .sl{font-size:11px;opacity:.85}
#tip .v{color:#e8ecff;margin-top:3px}
#tip .g{color:#7d84b8;font-size:11px;margin-top:2px}
#tip .ar{position:absolute;bottom:-6px;width:11px;height:11px;background:rgba(10,12,28,.97);border-right:1.5px solid;border-bottom:1.5px solid;transform:rotate(45deg)}
</style>
</head>
