<html lang="ko">
<head>
<meta charset="utf-8"><style id="ncq-text-scale">:where(html){font-size:16px}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}</style><style id="ncq-no-zoom">*{touch-action:manipulation}</style><script src="ncq-flags.js"></script><script src="ncq-ads.js"></script><script src="ncq-iap.js"></script><script src="ncq-feedback.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>좀비 스매시 프로토타입</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #f2f2f2; user-select: none; }
  #app { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); overflow: hidden; background: #222; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hidden { display: none !important; }

  /* HUD */
  #top { position: absolute; left: 0; right: 0; top: 0; padding: .6em .8em; display: flex; flex-direction: column; gap: .35em; pointer-events: none; }
  #topRow { display: flex; justify-content: space-between; align-items: center; font-size: 1.1em; font-weight: 700; }
  #hpWrap { position: relative; height: 1.3em; background: #3a1d1d; border-radius: .65em; overflow: hidden; border: 2px solid #000; }
  #hpBar { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(#ff6b6b, #c0392b); transition: width .25s; }
  #hpText { position: absolute; inset: 0; text-align: center; font-size: .85em; line-height: 1.3em; font-weight: 700; text-shadow: 0 1px 2px #000; }
  #traits { display: flex; flex-wrap: wrap; gap: .25em; font-size: .7em; }
  .chip { background: rgba(0,0,0,.55); border: 1px solid #777; border-radius: .6em; padding: .1em .5em; }

  #msg { position: absolute; left: 0; right: 0; top: 56%; text-align: center; font-size: 1em; font-weight: 600;
    text-shadow: 0 2px 3px #000; pointer-events: none; padding: 0 1em; }
  #actions { position: absolute; left: 0; right: 0; top: 61.5%; display: flex; justify-content: center; gap: .4em; pointer-events: none; }
  .pip { width: 1.1em; height: 1.1em; border-radius: 50%; background: #ffd34d; border: 2px solid #000; }
  .pip.used { background: #444; }

  #bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 32%; padding: .6em .7em 1em; display: flex; flex-direction: column; gap: .6em; }
  #hand { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: .5em; }
  .card { background: linear-gradient(#3b4252, #2a2f3a); border: 3px solid #555; border-radius: .7em; padding: .4em .3em;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .15em; cursor: pointer; text-align: center; }
  .card.sel { border-color: #ffd34d; box-shadow: 0 0 .8em #ffd34d88; transform: translateY(-.3em); }
  .card .ic { font-size: 2.2em; line-height: 1.1; }
  .card .nm { font-size: .95em; font-weight: 700; }
  .card .ds { font-size: .62em; color: #c8c8c8; line-height: 1.25; }
  .card .lv { font-size: .7em; color: #ffd34d; }
  .card.empty { border-style: dashed; opacity: .35; cursor: default; }
  .el-blunt { border-color: #b0a090; } .el-cut { border-color: #9fd3ff; } .el-fire { border-color: #ff8a3d; }
  .el-ice { border-color: #8fe3ff; } .el-elec { border-color: #f5e663; } .el-boom { border-color: #ff5252; }
  .card.sel { border-color: #ffd34d !important; }

  button.btn { font: inherit; font-weight: 700; border: 3px solid #000; border-radius: .6em; padding: .55em 1em; cursor: pointer;
    background: #ffd34d; color: #222; font-size: 1em; }
  button.btn.gray { background: #8a8f99; }
  button.btn.ad { background: #7be07b; }
  button.btn:disabled { opacity: .4; cursor: default; }
  #endTurn { align-self: stretch; }

  /* Overlay */
  #overlay { position: absolute; inset: 0; background: rgba(0,0,0,.72); display: flex; align-items: center; justify-content: center; padding: 1em; }
  .panel { width: 100%; max-height: 100%; overflow-y: auto; background: #252a33; border: 3px solid #000; border-radius: 1em; padding: 1em;
    display: flex; flex-direction: column; gap: .7em; }
  .panel h2 { margin: 0; font-size: 1.4em; text-align: center; }
  .panel p { margin: 0; text-align: center; color: #ccc; font-size: .9em; }
  .opts { display: flex; flex-direction: column; gap: .5em; }
  .opt { display: flex; align-items: center; gap: .7em; background: #333a46; border: 3px solid #555; border-radius: .7em; padding: .6em .7em; cursor: pointer; }
  .opt:hover { border-color: #ffd34d; }
  .opt.on { border-color: #ffd34d; background: #4a4430; }
  .opt .ic { font-size: 2em; width: 1.4em; text-align: center; }
  .opt .tx { flex: 1; }
  .opt .t1 { font-weight: 700; }
  .opt .t2 { font-size: .8em; color: #c8c8c8; }
  .opt .tag { font-size: .7em; padding: .1em .45em; border-radius: .4em; background: #000; margin-left: .3em; }
  .row { display: flex; gap: .5em; justify-content: center; flex-wrap: wrap; }
  .lobbyTool { display: flex; align-items: center; gap: .6em; background: #333a46; border-radius: .6em; padding: .45em .6em; }
  .lobbyTool .ic { font-size: 1.7em; }
  .lobbyTool .tx { flex: 1; font-size: .9em; }
  .coins { text-align: center; font-size: 1.15em; font-weight: 700; color: #ffd34d; }
  .chapBtns { display: flex; gap: .5em; }
  .chapBtns button { flex: 1; }
</style>
</head>

  <div id="bottom">

    <button class="btn gray" id="endTurn">턴 넘기기</button>
  </div>
  <div id="overlay" class="hidden"><div class="panel" id="panel"></div></div>
</div>
