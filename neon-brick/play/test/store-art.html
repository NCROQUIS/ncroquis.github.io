<!doctype html><meta charset="utf-8">
<!-- Store art generator: ?kind=icon|feature|thumb&w=..&h=.. draws an original neon-brick key art on one canvas. -->
<link rel="stylesheet" href="../fonts/fonts.css">
<style>html,body{margin:0;background:#07060f}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
const q = new URLSearchParams(location.search), kind = q.get("kind") || "icon", W = +q.get("w") || 512, H = +q.get("h") || 512;
const cv = document.getElementById("c"); cv.width = W; cv.height = H; const g = cv.getContext("2d");
const COL = ["#ff3dcb", "#2ef6ff", "#ffe14d", "#b6ff3d", "#a66bff", "#ff8a3d"];
function bg() {
  const gr = g.createRadialGradient(W * .5, H * .45, 0, W * .5, H * .5, Math.max(W, H) * .75);
  gr.addColorStop(0, "#1a1033"); gr.addColorStop(1, "#05040b"); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.globalAlpha = .12; g.strokeStyle = "#2ef6ff"; g.lineWidth = 1; const s = Math.max(W, H) / 16;
  g.beginPath(); for (let x = 0; x < W; x += s) { g.moveTo(x, 0); g.lineTo(x, H); } for (let y = 0; y < H; y += s) { g.moveTo(0, y); g.lineTo(W, y); } g.stroke(); g.globalAlpha = 1;
}
function brick(x, y, s, col, hp) {
  g.save(); g.shadowColor = col; g.shadowBlur = s * .35; g.strokeStyle = col; g.lineWidth = s * .08;
  const r = s * .16; g.beginPath(); g.roundRect(x, y, s, s, r); g.stroke(); g.shadowBlur = s * .15; g.stroke();
  g.fillStyle = col + "22"; g.fill();
  if (hp) { g.shadowBlur = s * .2; g.fillStyle = col; g.font = `700 ${s * .46}px "Chakra Petch"`; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(hp, x + s / 2, y + s * .54); }
  g.restore();
}
function ball(x, y, r, trail) {
  g.save(); g.lineCap = "round";
  for (let i = 0; i < trail.length - 1; i++) { g.globalAlpha = .15 + .5 * i / trail.length; g.strokeStyle = "#fff"; g.lineWidth = r * 1.4 * (i / trail.length); g.beginPath(); g.moveTo(...trail[i]); g.lineTo(...trail[i + 1]); g.stroke(); }
  g.globalAlpha = 1; g.shadowColor = "#fff"; g.shadowBlur = r * 3; g.fillStyle = "#fff"; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.restore();
}
function burst(x, y, s) {
  g.save(); g.lineCap = "round";
  for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2, c = COL[i % COL.length]; g.strokeStyle = c; g.shadowColor = c; g.shadowBlur = s * .3; g.lineWidth = s * .05;
    g.beginPath(); g.moveTo(x + Math.cos(a) * s * .35, y + Math.sin(a) * s * .35); g.lineTo(x + Math.cos(a) * s * .75, y + Math.sin(a) * s * .75); g.stroke(); }
  g.restore();
}
function title(x, y, size, align = "center") {
  g.save(); g.textAlign = align; g.textBaseline = "middle";
  g.font = `400 ${size}px Monoton`; g.shadowColor = "#2ef6ff"; g.shadowBlur = size * .35; g.fillStyle = "#c9fbff"; g.fillText("NEON", x, y - size * .55);
  g.shadowColor = "#ff3dcb"; g.fillStyle = "#ffd1f3"; g.fillText("BRICK", x, y + size * .55);
  g.font = `600 ${size * .3}px "IBM Plex Sans KR"`; g.shadowBlur = size * .15; g.shadowColor = "#ffe14d"; g.fillStyle = "#fff2b0";
  g.fillText("네온 브릭", x, y + size * 1.45); g.restore();
}
function bricksWall(x0, y0, s, cols, rows, seed) {
  let k = seed;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { k = (k * 9301 + 49297) % 233280; if (k / 233280 < .22) continue;
    brick(x0 + c * s * 1.15, y0 + r * s * 1.15, s, COL[(r + c * 2 + seed) % COL.length], 5 + (k % 40)); }
}
Promise.all(['400 40px Monoton', '700 40px "Chakra Petch"', '600 40px "IBM Plex Sans KR"'].map(f => document.fonts.load(f, "NEON BRICK 네온 브릭 0123456789"))).then(() => {
  bg();
  if (kind === "icon") {
    const s = W * .26, gap = s * 1.12, x0 = W / 2 - gap * 1.5 + (gap - s) / 2, y0 = H * .14;
    [[0, 0, "#ff3dcb"], [1, 0, "#2ef6ff"], [2, 0, "#ffe14d"], [0, 1, "#a66bff"], [2, 1, "#b6ff3d"]].forEach(([c, r, col]) => brick(x0 + c * gap, y0 + r * gap, s, col));
    burst(x0 + gap * 1 + s / 2, y0 + gap + s / 2, s * 1.1);
    ball(W * .5, H * .8, W * .055, [[W * .2, H * .98], [W * .32, H * .9], [W * .42, H * .84], [W * .5, H * .8]]);
  } else {
    const s = H * .13; bricksWall(W * .52, H * .12, s, Math.floor(W * .44 / (s * 1.15)), 4, 7);
    burst(W * .52 + s * 1.15 * 2 + s / 2, H * .12 + s * 1.15 * 2 + s / 2, s * 1.2);
    ball(W * .62, H * .72, H * .03, [[W * .55, H * .98], [W * .58, H * .86], [W * .62, H * .72]]);
    ball(W * .7, H * .8, H * .025, [[W * .66, H * .98], [W * .68, H * .9], [W * .7, H * .8]]);
    title(W * .26, H * .4, H * .17);
  }
  document.title = "done";
});
</script>
