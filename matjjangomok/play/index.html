<!doctype html>
<html>
<head>
  <script src="./ncq/safe.js"></script>
  <meta charset="utf-8"><script src="ncq-flags.js"></script><script src="ncq-ads.js"></script><script src="ncq-iap.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f5eb">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./assets/match-ui/chrome.css">
  <link rel="stylesheet" href="./style.css?v=de46422cd34f">
  <script type="module" src="./app.js?v=de46422cd34f"></script>
</head>
<body>
  <svg class="board-grid-definitions" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="nav-ranking" viewBox="0 0 24 24">
        <path d="M7 3h10v5a5 5 0 0 1-10 0V3Zm0 2H3v2a4 4 0 0 0 4 4m10-6h4v2a4 4 0 0 1-4 4m-5 2v6m-4 2h8m-6-2h4"
              fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="nav-play" viewBox="0 0 24 24">
        <circle cx="8.5" cy="9" r="5.5" fill="currentColor"/>
        <circle cx="16" cy="15" r="5.5" fill="currentColor" fill-opacity=".55" stroke="#faf8f4" stroke-width="1.3"/>
      </symbol>
      <symbol id="nav-records" viewBox="0 0 24 24">
        <path d="M7 3h13v16H7zM4 6v16h13M10 7h7m-7 4h7m-7 4h4"
              fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <path id="board-line-path" vector-effect="non-scaling-stroke" d="M.5 .5H14.5V14.5H.5Z
        M.5 1.5H14.5 M.5 2.5H14.5 M.5 3.5H14.5 M.5 4.5H14.5 M.5 5.5H14.5
        M.5 6.5H14.5 M.5 7.5H14.5 M.5 8.5H14.5 M.5 9.5H14.5 M.5 10.5H14.5
        M.5 11.5H14.5 M.5 12.5H14.5 M.5 13.5H14.5
        M1.5 .5V14.5 M2.5 .5V14.5 M3.5 .5V14.5 M4.5 .5V14.5 M5.5 .5V14.5
        M6.5 .5V14.5 M7.5 .5V14.5 M8.5 .5V14.5 M9.5 .5V14.5 M10.5 .5V14.5
        M11.5 .5V14.5 M12.5 .5V14.5 M13.5 .5V14.5"/>
      <g id="board-engraving">
        <use class="board-line-highlight" href="#board-line-path" x=".033" y=".033"/>
        <use href="#board-line-path"/>
      </g>
    </defs>
  </svg>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <span><span data-i18n="title">Omok Duel</span> <small id="app-version" class="version"></small></span>
      </div>
      <div class="header-tools">
        <button id="show-options" class="quiet" type="button" data-i18n="options"></button>
        <label for="language" class="sr-only" data-i18n="language"></label>
        <select id="language"></select>
      </div>
    </header>

    <main>
      <section id="lobby" class="lobby">
        <button id="show-tournament" class="tournament-card" type="button" hidden>
          <svg class="tournament-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#nav-ranking"/></svg>
          <span><strong data-i18n="weeklyTournament"></strong><small data-i18n="tournamentSummary"></small></span>
          <span class="chevron" aria-hidden="true"></span>
        </button>
        <div class="list-heading">
          <div class="list-heading-title">
            <h1 id="lobby-heading" tabindex="-1" data-i18n="liveGames"></h1>
            <span id="live-count" class="list-count" hidden></span>
          </div>
          <button id="refresh-lobby" class="quiet refresh-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4v5h-5m5 0a8 8 0 0 0-14-2M4 20v-5h5m-5 0a8 8 0 0 0 14 2"
                 fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span data-i18n="refreshLobby"></span>
          </button>
        </div>
        <div class="list-body">
          <p id="live-message" class="list-message"></p>
          <ul id="live-games" class="entry-list"></ul>
        </div>
        <div id="player-card" class="player-card">
          <div class="player-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2z"/></svg>
            <img id="player-photo" alt="" referrerpolicy="no-referrer" hidden>
          </div>
          <div class="player-summary">
            <div class="player-name-line"><span class="player-info-label" data-i18n="playerInfo"></span><strong id="lobby-player-name"></strong></div>
            <div id="player-career" class="player-career" hidden>
              <strong id="player-rating"></strong>
              <span id="player-record"></span>
              <span id="player-next-rank" hidden></span>
            </div>
          </div>
        </div>
        <div class="lobby-actions">
          <button id="start" class="primary" type="button" data-ncq-main="Start" data-i18n="start"></button>
        </div>
      </section>

      <section id="tournament" class="lobby" hidden>
        <div class="list-heading">
          <h1 id="tournament-title" tabindex="-1" data-i18n="weeklyTournament"></h1>
          <p id="tournament-dates" class="version" hidden></p>
        </div>
        <div class="list-body">
          <p id="rank-empty" class="list-message"></p>
          <ol id="standings" class="entry-list"></ol>
        </div>
        <div class="lobby-actions">
          <button id="join-tournament" class="primary" type="button" data-i18n="joinTournament" hidden></button>
        </div>
      </section>

      <section id="records" class="lobby" hidden>
        <div class="list-heading"><h1 tabindex="-1" id="records-heading" data-i18n="myRecords"></h1></div>
        <div class="list-body">
          <p id="records-empty" class="list-message" data-i18n="noRecords"></p>
          <ul id="record-list" class="entry-list"></ul>
        </div>
      </section>

      <section id="match" class="match" hidden>
        <div id="room-bar" class="room-bar">
          <div><span id="room-label" class="eyebrow"></span> <strong id="room-id"></strong></div>
          <button id="leave" type="button" class="quiet"></button>
        </div>
        <div class="match-status">
          <div>
            <h1 id="status" tabindex="-1" aria-live="polite"></h1>
            <p id="round"></p>
          </div>
          <span class="mode-chip" id="mode"></span>
        </div>
        <div id="opponent-panel" class="match-art-panel match-player" hidden>
          <div class="match-art-avatar match-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2z"/></svg>
          </div>
          <div class="match-identity">
            <strong data-i18n="opponent"></strong>
            <span class="seat"><span id="opponent-stone" class="stone" role="img"></span><span id="opponent-rank" hidden></span></span>
          </div>
          <span class="match-art-divider" aria-hidden="true"></span>
          <div id="opponent-timer" class="match-art-gauge">
            <svg id="opponent-gauge" aria-hidden="true">
              <defs><path id="opponent-gauge-outline" pathLength="100" fill="none"
                          stroke="currentColor" stroke-width="3" stroke-linecap="round"/></defs>
              <use class="match-art-gauge-track" href="#opponent-gauge-outline"/>
              <use id="opponent-progress" class="match-art-gauge-progress" href="#opponent-gauge-outline"/>
            </svg>
            <span id="opponent-turn"></span>
            <span id="opponent-divider" class="gauge-divider" aria-hidden="true"></span>
            <span id="opponent-clock" class="player-clock" role="timer"></span>
          </div>
        </div>
        <div class="board-slot">
          <div id="board" class="board" role="grid" data-i18n-attr="aria-label:board">
            <div id="board-grid" class="board-grid" role="rowgroup">
              <svg class="board-lines" viewBox="0 0 15 15" preserveAspectRatio="none" aria-hidden="true" focusable="false">
                <use href="#board-engraving"/>
              </svg>
            </div>
            <svg id="last-move-marker" viewBox="0 0 24 24" aria-hidden="true" hidden>
              <use href="./assets/match-ui/icons.svg#last-move"/>
            </svg>
          </div>
        </div>
        <div id="own-panel" class="match-art-panel match-player" hidden>
          <div class="match-art-avatar match-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2z"/></svg>
            <img id="match-player-photo" alt="" referrerpolicy="no-referrer" hidden>
          </div>
          <div class="match-identity">
            <strong id="own-nickname"></strong>
            <span class="seat"><span id="own-stone" class="stone" role="img"></span><span id="own-rank" hidden></span></span>
          </div>
          <span class="match-art-divider" aria-hidden="true"></span>
          <button id="place" class="match-art-gauge" type="button" data-ncq-main="Place stone">
            <svg id="place-gauge" aria-hidden="true">
              <defs><path id="place-gauge-outline" pathLength="100" fill="none"
                          stroke="currentColor" stroke-width="3" stroke-linecap="round"/></defs>
              <use class="match-art-gauge-track" href="#place-gauge-outline"/>
              <use id="own-progress" class="match-art-gauge-progress" href="#place-gauge-outline"/>
            </svg>
            <span data-i18n="placeStone"></span>
            <span id="place-divider" class="gauge-divider" aria-hidden="true"></span>
            <span id="own-clock" class="player-clock" role="timer"></span>
          </button>
        </div>
        <div id="live-actions" class="live-actions" hidden>
          <p id="turn-announcement" class="sr-only" role="status"></p>
          <button id="leave-match" class="match-art-action" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="./assets/match-ui/icons.svg#resign"/></svg>
            <span data-i18n="leave"></span>
          </button>
        </div>
        <div id="review" class="review" hidden>
          <div class="review-controls" role="group" data-i18n-attr="aria-label:review">
            <button type="button" data-step="first" data-i18n-attr="aria-label:firstMove">⏮</button>
            <button type="button" data-step="previous" data-i18n-attr="aria-label:previousMove">‹</button>
            <output id="move-count" aria-live="polite"></output>
            <button type="button" data-step="next" data-i18n-attr="aria-label:nextMove">›</button>
            <button type="button" data-step="last" data-i18n-attr="aria-label:lastMove">⏭</button>
          </div>
          <button id="rematch" class="primary" type="button" data-ncq-main="Rematch"></button>
        </div>
        <div id="player-bar" class="player-bar">
          <div class="player">
            <span class="stone black" role="img" data-i18n-attr="aria-label:black"></span>
            <span id="black-player-label" class="player-name"></span>
          </div>
          <div class="player">
            <span class="stone white" role="img" data-i18n-attr="aria-label:white"></span>
            <span id="white-player-label" class="player-name"></span>
          </div>
          <button id="invite" class="primary" type="button" data-ncq-main="Copy invite" data-i18n="invite"></button>
        </div>
        <p id="match-error" class="feedback" role="status" hidden></p>
      </section>
    </main>
    <p id="lobby-error" class="feedback" role="status" hidden></p>
    <nav id="lobby-nav" class="lobby-nav" data-i18n-attr="aria-label:lobbyNavigation">
      <button id="show-rankings" type="button" aria-controls="tournament">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#nav-ranking"/></svg>
        <span data-i18n="rankings"></span>
      </button>
      <button id="show-lobby" type="button" aria-controls="lobby" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#nav-play"/></svg>
        <span data-i18n="playTab"></span>
      </button>
      <button id="show-records" type="button" aria-controls="records">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#nav-records"/></svg>
        <span data-i18n="records"></span>
      </button>
    </nav>

    <dialog id="options" aria-labelledby="options-title">
      <form method="dialog">
        <h2 id="options-title" tabindex="-1" data-i18n="options" autofocus></h2>
        <div class="appearance-preview-panel">
          <div id="appearance-preview" class="board appearance-preview" aria-hidden="true">
            <div class="board-grid appearance-preview-grid">
              <svg class="board-lines" viewBox="0 0 15 15" preserveAspectRatio="none" focusable="false">
                <use href="#board-engraving"/>
              </svg>
              <span class="cell star" data-stone="0" style="grid-area: 4 / 4"></span>
              <span class="cell star" data-stone="0" style="grid-area: 4 / 12"></span>
              <span class="cell star" data-stone="0" style="grid-area: 12 / 4"></span>
              <span class="cell star" data-stone="0" style="grid-area: 12 / 12"></span>
              <span class="cell" data-stone="1" style="grid-area: 7 / 7"><span class="stone black"></span></span>
              <span class="cell" data-stone="1" style="grid-area: 8 / 6"><span class="stone black"></span></span>
              <span class="cell" data-stone="1" style="grid-area: 8 / 8"><span class="stone black"></span></span>
              <span class="cell" data-stone="1" style="grid-area: 9 / 9"><span class="stone black"></span></span>
              <span class="cell" data-stone="2" style="grid-area: 7 / 8"><span class="stone white"></span></span>
              <span class="cell" data-stone="2" style="grid-area: 8 / 7"><span class="stone white"></span></span>
              <span class="cell" data-stone="2" style="grid-area: 8 / 9"><span class="stone white"></span></span>
              <span class="cell" data-stone="2" style="grid-area: 9 / 8"><span class="stone white"></span></span>
            </div>
          </div>
          <div class="appearance-preview-controls">
            <h3 data-i18n="appearancePreview"></h3>
            <fieldset class="appearance-group grid-choices">
              <legend data-i18n="gridStyle"></legend>
              <label class="grid-choice">
                <input type="radio" name="grid" value="engraved"><span data-i18n="engravedGrid"></span>
              </label>
              <label class="grid-choice">
                <input type="radio" name="grid" value="soft"><span data-i18n="softGrid"></span>
              </label>
            </fieldset>
          </div>
        </div>
        <div class="options-settings">
          <fieldset class="appearance-group">
            <legend data-i18n="stoneStyle"></legend>
            <div class="appearance-choices">
              <label class="appearance-choice">
                <span class="stone-sample" data-stone-style="reference" aria-hidden="true"><span class="stone black"></span><span class="stone white"></span></span>
                <input type="radio" name="stones" value="reference"><span data-i18n="referenceStones"></span>
              </label>
              <label class="appearance-choice">
                <span class="stone-sample" data-stone-style="classic" aria-hidden="true"><span class="stone black"></span><span class="stone white"></span></span>
                <input type="radio" name="stones" value="classic"><span data-i18n="classicStyle"></span>
              </label>
              <label class="appearance-choice">
                <span class="stone-sample" data-stone-style="glossy" aria-hidden="true"><span class="stone black"></span><span class="stone white"></span></span>
                <input type="radio" name="stones" value="glossy"><span data-i18n="glossyStones"></span>
              </label>
              <label class="appearance-choice">
                <span class="stone-sample" data-stone-style="gilded" aria-hidden="true"><span class="stone black"></span><span class="stone white"></span></span>
                <input type="radio" name="stones" value="gilded"><span data-i18n="gildedStones"></span>
              </label>
            </div>
          </fieldset>
          <fieldset class="appearance-group">
            <legend data-i18n="boardStyle"></legend>
            <div class="appearance-choices">
              <label class="appearance-choice">
                <span class="board-sample" data-board-style="reference" aria-hidden="true">
                  <svg class="board-lines" viewBox="0 0 15 15" focusable="false"><use href="#board-engraving"/></svg>
                </span>
                <input type="radio" name="board" value="reference"><span data-i18n="referenceBoard"></span>
              </label>
              <label class="appearance-choice">
                <span class="board-sample" data-board-style="classic" aria-hidden="true">
                  <svg class="board-lines" viewBox="0 0 15 15" focusable="false"><use href="#board-engraving"/></svg>
                </span>
                <input type="radio" name="board" value="classic"><span data-i18n="classicStyle"></span>
              </label>
              <label class="appearance-choice">
                <span class="board-sample" data-board-style="wood" aria-hidden="true">
                  <svg class="board-lines" viewBox="0 0 15 15" focusable="false"><use href="#board-engraving"/></svg>
                </span>
                <input type="radio" name="board" value="wood"><span data-i18n="woodBoard"></span>
              </label>
              <label class="appearance-choice">
                <span class="board-sample" data-board-style="gilded" aria-hidden="true">
                  <svg class="board-lines" viewBox="0 0 15 15" focusable="false"><use href="#board-engraving"/></svg>
                </span>
                <input type="radio" name="board" value="gilded"><span data-i18n="gildedBoard"></span>
              </label>
            </div>
          </fieldset>
          <label class="stone-sound-setting">
            <span data-i18n="stoneSound"></span>
            <input id="stone-sound" type="checkbox" checked>
          </label>
          <label class="nickname-field">
            <span data-i18n="nickname"></span>
            <input id="nickname" type="text" maxlength="20" autocomplete="nickname">
          </label>
        </div>
        <button class="primary" data-ncq-main="Close options" data-i18n="done"></button>
      </form>
    </dialog>

    <dialog id="matchmaking" class="matchmaking" aria-labelledby="queue-title">
      <div class="queue-mark" aria-hidden="true"><span class="stone black"></span><span class="stone white"></span></div>
      <h2 id="queue-title" data-i18n="matching"></h2>
      <p id="queue-status"></p>
      <button id="cancel-match" class="secondary" type="button" data-ncq-main="Cancel matchmaking" data-i18n="cancel" autofocus></button>
    </dialog>

    <dialog id="share">
      <form method="dialog">
        <h2 data-i18n="invite"></h2>
        <label for="share-url" data-i18n="copyManually"></label>
        <input id="share-url" readonly>
        <button class="secondary" data-ncq-main="Close invite" data-i18n="done"></button>
      </form>
    </dialog>
    <dialog id="result" class="result" aria-labelledby="result-title">
      <form method="dialog">
        <p class="eyebrow" data-i18n="result"></p>
        <div id="result-badge" class="result-badge" aria-hidden="true"></div>
        <h2 id="result-title"></h2>
        <p id="result-summary"></p>
        <div id="result-rating" class="result-rating" hidden>
          <span id="result-rank"></span>
          <strong id="rating-range"></strong>
          <span id="rating-delta" class="rating-delta"></span>
        </div>
        <button class="primary" data-ncq-main="Review match" data-i18n="reviewMatch" autofocus></button>
      </form>
    </dialog>
  </div>
</body>
</html>
