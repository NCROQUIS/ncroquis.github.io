<!doctype html>
<html>
<head>
  <meta charset="utf-8"><script src="ncq-flags.js"></script><script src="ncq-ads.js"></script><script src="ncq-iap.js"></script><script src="ncq-feedback.js"></script>
  <!-- 화면 안전 영역 (공용 모듈 NcqSafe, 킥오프가 관리해요): 상태 바·내비게이션 바·토스 메뉴 줄·배너 자리를 --ncq-top 등으로 -->
  <script src="ncq/safe.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2f8a5b" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2f8a5b" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Classic Klondike solitaire to enjoy anytime. One-tap moves, unlimited undo and a Daily Challenge." data-i18n-attr="content:doc_desc">
  <title data-i18n="doc_title">Pocket Solitaire — Classic Klondike Card Game</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a84ff'/%3E%3Crect x='17' y='11' width='30' height='42' rx='5' fill='%23fff'/%3E%3Ctext x='32' y='40' font-size='22' text-anchor='middle' fill='%23ff3b30' font-family='-apple-system,sans-serif'%3E%E2%99%A5%EF%B8%8E%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <!-- 게임 파일을 한꺼번에 불러와요 (하나씩 차례로 기다리지 않게) -->
  <link rel="modulepreload" href="src/main.js">
  <link rel="modulepreload" href="ncq/lang.js">
  <link rel="modulepreload" href="src/ads.js">
  <link rel="modulepreload" href="src/analytics.js">
  <link rel="modulepreload" href="src/cardart.js">
  <link rel="modulepreload" href="src/config.js">
  <link rel="modulepreload" href="src/easy-seeds.js">
  <link rel="modulepreload" href="src/engine.js">
  <link rel="modulepreload" href="src/freecell-seeds.js">
  <link rel="modulepreload" href="src/freecell.js">
  <link rel="modulepreload" href="src/haptics.js">
  <link rel="modulepreload" href="src/i18n.js">
  <link rel="modulepreload" href="src/iap.js">
  <link rel="modulepreload" href="src/metrics.js">
  <link rel="modulepreload" href="src/platform.js">
  <link rel="modulepreload" href="src/progress.js">
  <link rel="modulepreload" href="src/rules.js">
  <link rel="modulepreload" href="src/search.js">
  <link rel="modulepreload" href="src/solver.js">
  <link rel="modulepreload" href="src/sound.js">
  <link rel="modulepreload" href="src/spider-seeds.js">
  <link rel="modulepreload" href="src/spider.js">
  <link rel="modulepreload" href="src/storage.js">
  <link rel="modulepreload" href="src/texts.js">
</head>
<body>
  <!-- 아이콘 (SF Symbols 느낌의 선 아이콘) -->
  <svg width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <defs>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.2" class="fill"/></symbol>
      <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3Z"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.6" class="fill"/><circle cx="12" cy="12" r="1.6" class="fill"/><circle cx="18.5" cy="12" r="1.6" class="fill"/></symbol>
      <symbol id="i-recycle" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.5h-4.5"/></symbol>
      <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3c.6 4.2 2.6 6.4 7 7-4.4.6-6.4 2.8-7 7-.6-4.2-2.6-6.4-7-7 4.4-.6 6.4-2.8 7-7Z" class="fill"/><path d="M19 15.5c.2 1.6 1 2.4 2.5 2.5-1.5.2-2.3 1-2.5 2.5-.2-1.5-1-2.3-2.5-2.5 1.5-.1 2.3-.9 2.5-2.5Z" class="fill"/></symbol>
      <symbol id="i-chevron-l" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
      <symbol id="i-chevron-r" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.3 2.4 3.4 5.2 3.4 8.5s-1.1 6.1-3.4 8.5c-2.3-2.4-3.4-5.2-3.4-8.5s1.1-6.1 3.4-8.5Z"/></symbol>
    </defs>
  </svg>

  <!-- 게임 화면은 카드를 누르는 화면이라 메인 버튼이 없어요 (화면 시험·빌드 확인용 표시) -->
  <div id="app" data-ncq-no-main>
    <header class="topbar">
      <div class="stat"><span class="label" data-i18n="time">Time</span><span id="time">0:00</span></div>
      <div class="title" id="mode-title"></div>
      <div class="stat right"><span class="label" data-i18n="score">Score</span><span id="score">0</span></div>
    </header>

    <main id="board" aria-label="Card table" data-i18n-attr="aria-label:board_label">
      <!-- 카드 자리(slot)는 게임 종류에 맞춰 src/main.js가 만들어요 -->
      <button class="auto-btn" id="auto-btn" hidden><svg><use href="#i-sparkle"/></svg><span data-i18n="auto_complete">Auto-complete</span></button>
    </main>

    <div class="ad-banner" id="ad-banner" aria-hidden="true"><span data-i18n="ad_spot">Ad</span></div>

    <nav class="toolbar">
      <button data-act="new"><svg><use href="#i-plus"/></svg><span data-i18n="new_game">New Game</span></button>
      <button data-act="daily"><svg><use href="#i-calendar"/></svg><span data-i18n="daily_short">Daily</span></button>
      <button data-act="hint"><svg><use href="#i-bulb"/></svg><span data-i18n="hint">Hint</span></button>
      <button data-act="undo"><svg><use href="#i-undo"/></svg><span data-i18n="undo">Undo</span></button>
      <button data-act="menu"><svg><use href="#i-more"/></svg><span data-i18n="menu">Menu</span></button>
    </nav>
  </div>

  <!-- 시작 화면 (src/main.js가 버튼과 카드를 채워요) -->
  <section class="home" id="home" hidden aria-label="Start screen" data-i18n-attr="aria-label:home_label">
    <div class="home-cards" aria-hidden="true"></div>
    <h1 data-i18n="app_name">Pocket Solitaire</h1>
    <p class="home-sub" data-i18n="home_sub">Classic · Spider · FreeCell</p>
    <div class="home-level" id="home-level"></div>
    <div class="home-actions" id="home-actions"></div>
    <p class="home-rating" id="home-rating"></p>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="modal" id="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="grabber" aria-hidden="true"></div>
      <div id="modal-body"></div>
      <!-- 메인 버튼 줄: 내용이 길어도 창 아래에 늘 보여요 (src/main.js showModal이 옮겨 와요) -->
      <div class="sheet-foot" id="modal-foot"></div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
