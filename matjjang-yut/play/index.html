<!doctype html>
<html>
<head><script id="ncq-authored-motion" src="ncq-motion.js?v=10dd8b3eaad1"></script>
  <script src="./ncq/safe.js"></script>
  <script src="./ncq/display.js"></script>
  <script src="./ncq/motion.js"></script>
  <script src="./ncq/viewport.js"></script>
  <script src="./ncq/sound.js"></script>
  <script src="./ncq/save.js"></script>
  <script src="./ncq/popup.js"></script>
  <meta charset="UTF-8"><style id="ncq-text-scale">:where(html){font-size:16px}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}</style><style id="ncq-no-zoom">*{touch-action:manipulation}</style><script src="ncq-flags.js"></script><script src="ncq-popup.js"></script><script src="ncq-ads.js"></script><script src="ncq-iap.js"></script><script src="ncq-feedback.js"></script><script src="ncq-auth.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#faf3e6">
  <meta name="description" content="A tactile local two-player Yutnori game. Gather, throw, and race your pieces home.">
  <title>맞짱 윷놀이 · Yut Duel</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./src/styles.css">
  <link rel="stylesheet" href="./src/throw-settings.css">
  <link rel="stylesheet" href="./src/move-targets.css">
  <link rel="stylesheet" href="./src/throw-result.css">
  <link rel="stylesheet" href="./src/teams.css">
  <link rel="stylesheet" href="./src/online.css">
  <link rel="stylesheet" href="./src/economy.css">
  <script type="module" src="./src/app.mjs"></script>
</head>
<body>
  <main class="lobby-shell" id="lobby" aria-labelledby="lobby-title">
    <div class="lobby-toolbar header-actions">
      <button class="wallet-balance" data-wallet type="button"><i class="yeopjeon-icon" aria-hidden="true"></i><span data-i18n="yeopjeon"></span><strong data-wallet-coins>—</strong></button>
      <button class="icon-button" id="lobby-sound-button" data-sound-toggle data-i18n-attr="aria-label:sound" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path class="sound-waves" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg></button>
      <button class="icon-button" id="lobby-settings-button" data-settings-open data-i18n-attr="aria-label:settings" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m9 3-1 3-3 1-2 3 2 2-1 3 2 3 3-1 2 3h3l1-3 3-1 2-3-2-2 1-3-2-3-3 1-2-3H9Z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <h1 class="lobby-title" id="lobby-title" data-i18n-attr="aria-label:title"><span data-i18n="lobbyTitleTop"></span><span data-i18n="lobbyTitleBottom"></span></h1>
    <div class="lobby-illustration" aria-hidden="true"><img src="./assets/lobby-background.webp" width="941" height="1672" alt="" fetchpriority="high" draggable="false"></div>
    <div class="lobby-modes" role="group" data-i18n-attr="aria-label:gameModes">
      <button class="mode-button" id="duel-button" type="button"><span data-i18n="modeDuel"></span><span class="duel-payoff"><span data-i18n="duelWin"></span><span aria-hidden="true"> · </span><span data-i18n="duelLoss"></span></span></button>
      <button class="mode-button" type="button" disabled data-i18n="modeTeams"></button>
      <button class="mode-button" type="button" disabled data-i18n="modeThree"></button>
      <button class="mode-button" id="together-button" type="button" data-i18n="playTogether" data-ncq-main="play together"></button>
    </div>
  </main>
  <main class="game-shell" id="app" hidden>
    <div class="game-top">
      <header class="game-header">
        <div class="brand"><button class="icon-button back-button" id="back-to-lobby" data-i18n-attr="aria-label:quitGame" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></button><h1 data-i18n="title"></h1><span class="mode" data-i18n="mode"></span></div>
        <div class="header-actions"><button class="icon-button" id="sound-button" data-i18n-attr="aria-label:sound" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path class="sound-waves" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg></button><button class="icon-button" id="settings-button" data-i18n-attr="aria-label:settings" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m9 3-1 3-3 1-2 3 2 2-1 3 2 3 3-1 2 3h3l1-3 3-1 2-3-2-2 1-3-2-3-3 1-2-3H9Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      </header>
      <div class="match-economy" id="match-economy" hidden><span class="duel-payoff"><span data-i18n="duelWin"></span><span aria-hidden="true"> · </span><span data-i18n="duelLoss"></span></span><button class="wallet-balance" data-wallet type="button"><i class="yeopjeon-icon" aria-hidden="true"></i><strong data-wallet-coins>—</strong></button></div>
    </div>
    <div class="game-stage">
      <div class="team-row upper-teams"></div>
      <section class="play-area" id="play-area" aria-label="Yutnori board">
        <canvas id="board" role="img"></canvas>
        <div class="opening-title" id="opening-title" data-i18n="openingTitle" hidden></div>
        <div class="first-player-reveal" id="first-player-reveal" role="status" aria-live="polite" aria-atomic="true" aria-hidden="true" hidden>
          <div class="first-player-card" data-player="0">
            <span class="avatar reveal-avatar" aria-hidden="true"><span class="hair"></span><span class="face"></span><span class="robe"></span></span>
            <strong class="first-player-name" id="first-player-name"></strong>
            <div class="first-player-seal"><span class="reveal-laurel" aria-hidden="true"><i></i><i></i><i></i><i></i></span><strong class="first-player-label" data-i18n="firstPlayer"></strong><span class="reveal-laurel right" aria-hidden="true"><i></i><i></i><i></i><i></i></span></div>
          </div>
        </div>
      </section>
      <div class="team-row lower-teams"></div>
      <div class="result-lanes" id="pending-results" role="group" data-i18n-attr="aria-label:pendingResults">
      </div>
      <div class="opening-scores" id="opening-scores" data-i18n-attr="aria-label:openingTitle" role="group" hidden>
      </div>
    </div>
    <footer class="game-controls">
      <p class="game-status" id="game-status" aria-live="polite"></p>
      <button type="button" class="main-button" id="main-button" data-ncq-main="game action"><span class="button-sticks" aria-hidden="true"><i></i><i></i></span><span id="main-label"></span><span id="turn-countdown" hidden aria-hidden="true"></span></button>
    </footer>
  </main>
  <div class="throw-result" id="throw-result" hidden aria-hidden="true"><strong class="result-name"></strong></div>
  <dialog id="matching-dialog" aria-labelledby="matching-title" data-ncq-no-main>
    <header class="dialog-header"><h2 id="matching-title" data-i18n="matchingTitle"></h2><button class="close-button" data-close data-i18n-attr="aria-label:close" type="button">×</button></header>
    <div class="dialog-body"><p id="matching-status" aria-live="polite" data-i18n="matchingWait"></p><p class="matching-hint" data-i18n="matchingBotHint"></p><div class="dialog-actions"><button class="secondary-button" data-close type="button" data-i18n="cancel"></button><button class="secondary-button filled" id="retry-matching" type="button" data-i18n="retry" data-ncq-main="retry matchmaking" hidden></button></div></div>
  </dialog>
  <dialog id="team-setup-dialog" aria-labelledby="team-setup-title">
    <header class="dialog-header"><h2 id="team-setup-title" data-i18n="playTogether"></h2><button class="close-button" data-close data-i18n-attr="aria-label:close" type="button">×</button></header>
    <div class="team-setup-body"><div id="setup-teams"></div><button class="secondary-button" id="add-team" type="button"><span aria-hidden="true">＋</span> <span data-i18n="addTeam"></span></button></div>
    <footer class="team-setup-footer"><p id="setup-format" aria-live="polite"></p><button class="main-button" id="start-together" data-i18n="startTogether" data-ncq-main="start local teams" type="button"></button></footer>
  </dialog>
  <dialog id="settings-dialog" aria-labelledby="settings-title" data-ncq-no-main>
    <header class="dialog-header"><h2 id="settings-title" data-i18n="settings"></h2><button class="close-button" data-close data-i18n-attr="aria-label:close" type="button">×</button></header>
    <div class="dialog-body">
      <p class="local-note" data-i18n="localNote"></p>
      <label class="setting-row"><span data-i18n="sound"></span><input id="sound-setting" type="checkbox" role="switch"></label>
      <label class="language-row"><span id="language-label"></span><select id="language-select"></select></label>
      <details><summary data-i18n="rules"></summary><ol class="rules-list"><li data-i18n="teamOpeningRule"></li><li data-i18n="teamRule"></li><li data-i18n="rule2"></li><li data-i18n="rule3"></li><li data-i18n="rule4"></li></ol></details>
      <button class="secondary-button" id="new-game-button" data-i18n="newGame" type="button"></button>
      <button class="secondary-button" id="feedback-button" data-i18n="feedback" type="button" hidden></button>
      <section class="account-panel" aria-labelledby="account-id-label"><label id="account-id-label" for="account-id" data-i18n="accountId"></label><div class="account-id-row"><input id="account-id" readonly data-ncq-selectable><button class="secondary-button" id="copy-account-id" type="button" data-i18n="copyId" disabled></button></div><p id="account-status" aria-live="polite"></p></section>
      <p class="save-note" data-i18n="saved"></p><span class="app-version" id="app-version"></span>
    </div>
  </dialog>
  <dialog id="restart-dialog" aria-labelledby="restart-title">
    <header class="dialog-header"><h2 id="restart-title" data-i18n="newGame"></h2><button class="close-button" data-close data-i18n-attr="aria-label:close" type="button">×</button></header>
    <div class="dialog-body"><p id="restart-detail" data-i18n="newConfirm"></p><div class="dialog-actions"><button class="secondary-button" data-close data-i18n="cancel" type="button"></button><button class="secondary-button filled" id="confirm-new-game" data-i18n="confirm" data-ncq-main="new game" type="button"></button></div></div>
  </dialog>
  <dialog id="quit-dialog" aria-labelledby="quit-title" aria-describedby="quit-detail">
    <header class="dialog-header"><h2 id="quit-title" data-i18n="quitTitle"></h2><button class="close-button" data-close data-i18n-attr="aria-label:close" type="button">×</button></header>
    <div class="dialog-body"><p id="quit-detail" data-i18n="quitDetail"></p><div class="dialog-actions"><button class="secondary-button" id="cancel-quit" data-close data-i18n="keepPlaying" type="button" autofocus></button><button class="secondary-button filled" id="confirm-quit" data-i18n="quitGame" data-ncq-main="quit match" type="button"></button></div></div>
  </dialog>
  <dialog id="winner-dialog" aria-labelledby="winner-title">
    <header class="dialog-header"><h2 id="winner-title"></h2><button class="close-button" data-close data-i18n-attr="aria-label:close" type="button">×</button></header>
    <div class="dialog-body"><div class="winner-medal" aria-hidden="true">✦</div><p class="economy-result" id="economy-result" aria-live="polite" hidden></p><button class="secondary-button filled" id="play-again-button" data-i18n="newGame" data-ncq-main="play again" type="button"></button></div>
  </dialog>
</body>
</html>
