    </div>
    <footer class="daily-dialog-footer" id="daily-footer" hidden><p id="daily-error" role="alert" hidden></p><button class="secondary-button filled" id="daily-retry" type="button" data-i18n="dailyRetry" hidden></button></footer>
  </dialog>
  <div id="daily-mission-announcement" class="mission-announcement" aria-live="polite"></div>
</body>
