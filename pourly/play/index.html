<!doctype html>
<html>
<head>
  <meta charset="utf-8" /><style id="ncq-text-scale">:where(html){font-size:16px}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}</style><style id="ncq-no-zoom">*{touch-action:manipulation}</style><script src="ncq-flags.js"></script><script src="ncq-ads.js"></script><script src="ncq-iap.js"></script><script src="ncq-feedback.js"></script><script src="ncq-auth.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0a2238" />
  <title>Pourly</title>
  <script type="module" crossorigin src="./assets/index-DNmauqO1.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CoB5aHOH.css">
</head>
<body>
  <!-- 바탕: 깊은 물빛 + 천천히 움직이는 빛 + 작은 기포 (이야기 없는 꾸밈) -->
  <div id="bg" aria-hidden="true">
    <i class="glow g1"></i><i class="glow g2"></i><i class="glow g3"></i>
    <i class="ray r1"></i><i class="ray r2"></i>
    <i class="bub" style="left:8%;--d:17s;--s:4px;--o:0s"></i>
    <i class="bub" style="left:21%;--d:23s;--s:3px;--o:-6s"></i>
    <i class="bub" style="left:37%;--d:19s;--s:5px;--o:-11s"></i>
    <i class="bub" style="left:52%;--d:26s;--s:3px;--o:-3s"></i>
    <i class="bub" style="left:66%;--d:21s;--s:4px;--o:-14s"></i>
    <i class="bub" style="left:79%;--d:18s;--s:6px;--o:-8s"></i>
    <i class="bub" style="left:91%;--d:24s;--s:3px;--o:-17s"></i>
  </div>

  <div id="app">
    <header class="top">
      <button class="icon-btn" id="btn-restart" data-i18n-attr="aria-label:restart; title:restart">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v4h4"/></svg>
      </button>
      <div class="level-box">
        <div class="level" id="level-label"></div>
        <div class="tough" id="tough-label" hidden></div>
        <div class="level-info" id="level-info" hidden></div>
      </div>
      <div class="top-right">
        <button class="coins" id="coins" data-i18n-attr="aria-label:shop; title:shop"><span class="coin-dot"></span><span id="coin-count">0</span><i class="coin-plus" aria-hidden="true">+</i><em class="dot" id="shop-dot" hidden></em></button>
        <button class="icon-btn" id="btn-settings" data-i18n-attr="aria-label:settings; title:settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
        </button>
      </div>
    </header>

    <!-- '오늘' 줄: 오늘의 퍼즐 · 보물 상자까지 진행 막대 · 매일 선물 (4판부터) -->
    <div class="meta" id="meta" hidden>
      <button class="chip" id="btn-puzzle">
        <svg class="ico-cal" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14.5" rx="3"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>
        <svg class="ico-back" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M14.5 6 8.5 12l6 6"/></svg>
        <span id="puzzle-label"></span>
        <span class="streak" id="puzzle-streak" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c1.2 3.2 4.5 4.8 4.5 9a4.5 4.5 0 0 1-9 0c0-2.2 1.1-3.4 2.2-4.4 0 2 1 3.2 2.2 3.2 0-3.2-1.2-5.2.1-7.8z"/></svg><b id="streak-n"></b></span>
        <svg class="done" id="puzzle-done" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </button>
      <div class="chest-bar" id="chest-bar" role="img">
        <i></i><i></i><i></i><i></i><i></i>
        <svg class="chest-mini" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5h16v8.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19z"/><path d="M4 10.5C4 6 20 6 20 10.5"/><path d="M10.5 12.5h3v3.5h-3z"/></svg>
      </div>
      <button class="chip" id="btn-gift">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10" width="15" height="10" rx="2"/><path d="M3.5 7.5h17V10h-17zM12 7.5V20"/><path d="M12 7.5C10.5 4 6.5 4 7 6.2c.4 1.6 3.4 1.3 5 1.3 1.6 0 4.6.3 5-1.3.5-2.2-3.5-2.2-5 1.3z"/></svg>
        <span data-i18n="gift"></span><em class="dot" id="gift-dot" hidden></em>
      </button>
    </div>

    <main id="board-wrap" data-ncq-no-main>
      <div class="tip" id="tip" hidden></div>
      <div class="guide" id="guide" aria-hidden="true" hidden>👆</div>
      <div id="toast" role="status" aria-live="polite"></div>
      <div class="banner" id="banner" aria-live="polite" hidden><b id="banner-title"></b><span id="banner-reward"></span><em id="banner-bonus"></em></div>
    </main>

    <footer class="tools">
      <button class="tool" id="btn-undo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4.5 9.5 9 5"/><path d="M4.5 9.5H14a5.5 5.5 0 0 1 0 11h-3"/></svg>
        <span data-i18n="undo"></span><span class="badge" id="undo-count"></span>
      </button>
      <button class="tool" id="btn-hint">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 18h5M10.5 21h3"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
        <span data-i18n="hint"></span><span class="badge" id="hint-count"></span>
      </button>
      <button class="tool" id="btn-add">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h5M9 3v4.5L7 10v9.5A1.5 1.5 0 0 0 8.5 21h4A1.5 1.5 0 0 0 14 19.5V10l-2-2.5V3"/><path d="M19 8v6M16 11h6"/></svg>
        <span data-i18n="add_bottle"></span><span class="badge coin-badge" id="add-cost"></span>
      </button>
      <!-- 상점: 코인 칸만으로는 상점인 줄 몰라서 도구 줄에도 둬요 (6판부터, 살 게 있으면 빨간 점) -->
      <button class="tool shop-tool" id="btn-shop">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 11a1.5 1.5 0 0 1-1.5 1.3H7.7a1.5 1.5 0 0 1-1.5-1.3z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
        <span data-i18n="shop"></span><em class="dot" id="shop-tool-dot" hidden></em>
      </button>
    </footer>
    <div class="version" id="app-version"></div>
  </div>

  <canvas id="board-canvas" aria-hidden="true"></canvas>

  <!-- 제안 창: 막혔을 때·코인이 모자랄 때·같은 판을 여러 번 다시 할 때·새 병 소개 (버튼은 src/main.js가 채워요) -->
  <div class="overlay sheet" id="offer" hidden>
    <div class="card" role="dialog" aria-labelledby="offer-title">
      <div class="card-title" id="offer-title"></div>
      <p class="offer-msg" id="offer-msg"></p>
      <div class="offer-body" id="offer-body"></div>
      <div class="offer-actions" id="offer-actions"></div>
    </div>
  </div>

  <!-- 보물 상자: 5판마다 (10판마다는 큰 상자). 열면 코인이 코인 칸으로 날아가요 -->
  <div class="overlay chest-overlay" id="chest" hidden>
    <div class="chest-box">
      <div class="chest-title" id="chest-title"></div>
      <div class="chest-stage">
        <div class="chest-rays" aria-hidden="true"></div>
        <svg class="chest" id="chest-svg" viewBox="0 0 160 140" aria-hidden="true">
          <defs>
            <linearGradient id="chest-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a8dff"/><stop offset="1" stop-color="#1c3f9c"/></linearGradient>
            <linearGradient id="chest-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0b8"/><stop offset="0.45" stop-color="#ffc93d"/><stop offset="1" stop-color="#cf8410"/></linearGradient>
            <radialGradient id="chest-glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff7cf"/><stop offset="1" stop-color="#ffd24d" stop-opacity="0"/></radialGradient>
          </defs>
          <ellipse cx="80" cy="129" rx="58" ry="8" fill="rgba(0,0,0,0.35)"/>
          <ellipse class="chest-light" cx="80" cy="58" rx="62" ry="34" fill="url(#chest-glow)"/>
          <rect x="22" y="60" width="116" height="62" rx="10" fill="url(#chest-body)" stroke="url(#chest-gold)" stroke-width="5"/>
          <rect x="72" y="60" width="16" height="62" fill="url(#chest-gold)"/>
          <path d="M30 70h100" stroke="rgba(255,255,255,0.18)" stroke-width="3" stroke-linecap="round"/>
          <g class="chest-lid">
            <path d="M22 62C22 28 138 28 138 62Z" fill="url(#chest-body)" stroke="url(#chest-gold)" stroke-width="5" stroke-linejoin="round"/>
            <rect x="72" y="34" width="16" height="28" fill="url(#chest-gold)"/>
            <path d="M38 50c10-10 30-14 42-14" stroke="rgba(255,255,255,0.28)" stroke-width="4" stroke-linecap="round" fill="none"/>
          </g>
          <g class="chest-lock">
            <rect x="68" y="55" width="24" height="22" rx="5" fill="url(#chest-gold)" stroke="#a86c12" stroke-width="2"/>
            <circle cx="80" cy="65" r="3.5" fill="#7a4d0a"/>
          </g>
        </svg>
      </div>
      <div class="chest-reward" id="chest-reward" hidden></div>
      <button class="primary" id="btn-chest" data-ncq-main="보물 상자 열기·계속 버튼"></button>
    </div>
  </div>

  <!-- 상점: 코인으로 배경·병 모습을 사고 바꿔요. 고르면 바로 미리 보이고, 안 사고 닫으면 원래대로 -->
  <div class="overlay sheet shop" id="shop" hidden>
    <div class="card" role="dialog" aria-labelledby="shop-title">
      <div class="shop-head">
        <div class="card-title" id="shop-title" data-i18n="shop"></div>
        <div class="coins"><span class="coin-dot"></span><span id="shop-coins">0</span></div>
      </div>
      <div class="seg shop-tabs" id="shop-tabs"><button data-tab="bg" data-i18n="tab_bg"></button><button data-tab="bottle" data-i18n="tab_bottle"></button><button data-tab="item" data-i18n="tab_item"></button></div>
      <p class="shop-have" id="shop-have" hidden></p>
      <div class="shop-grid" id="shop-grid"></div>
      <button class="primary" id="btn-shop-act" data-ncq-main="상점 사기·쓰기 버튼"></button>
      <button class="secondary" id="btn-shop-close" data-i18n="close"></button>
    </div>
  </div>

  <div class="overlay" id="settings" hidden>
    <div class="card">
      <div class="card-title" id="settings-title" data-i18n="settings"></div>
      <div class="row"><span id="lang-label"></span><div class="seg" id="lang-seg"></div></div>
      <div class="row"><span data-i18n="music"></span><button class="switch" id="sw-music" role="switch"></button></div>
      <div class="row"><span data-i18n="sfx"></span><button class="switch" id="sw-sfx" role="switch"></button></div>
      <div class="row" id="row-vib"><span data-i18n="vibration"></span><button class="switch" id="sw-vib" role="switch"></button></div>
      <div class="row test-row" id="test-row" hidden><span data-i18n="test_level"></span><span class="test-go"><input id="test-level" type="number" min="1" inputmode="numeric" /><button class="secondary" id="btn-test-go" data-i18n="test_go"></button></span></div>
      <button class="secondary" id="btn-feedback" data-i18n="feedback" hidden></button>
      <button class="primary" id="btn-close" data-ncq-main="설정 닫기 버튼" data-i18n="close"></button>
      <div class="version" id="settings-version"></div>
    </div>
  </div>

</body>
</html>
