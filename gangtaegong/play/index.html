<!doctype html>
<html>
  <head><script id="ncq-authored-motion" src="ncq-motion.js?v=10dd8b3eaad1"></script>
    <meta charset="utf-8" /><style id="ncq-text-scale">:where(html){font-size:16px}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}</style><style id="ncq-no-zoom">*{touch-action:manipulation}</style><script src="ncq-flags.js"></script><script src="ncq-ads.js"></script><script src="ncq-iap.js"></script><script src="ncq-feedback.js"></script><script src="ncq-share.js"></script><script src="ncq-auth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#16233f" />
    <title>강태공: 한 줄의 승부</title>
    <script type="module" crossorigin src="./assets/index-C57tFtff.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Iir6Ba-T.css">
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <!-- 항구 그림: 항구 화면 뒤에 깔려요 (창이 올라와도 그대로 보여요) -->
      <div id="port-bg" class="port-bg" hidden></div>

      <!-- 항구: 돌아오는 곳. 그림 속 장소를 누르면 창이 올라오고, '출항'으로 떠났던 바다 자리로 돌아가요 -->
      <section id="port" class="layer port" hidden>
        <header class="topbar">
          <div class="top-left">
            <div class="chip"><i class="coin"></i><span id="lb-gold">0</span></div>
            <button id="lb-pearl" class="chip pearl-chip"><i class="pearl"></i><span id="lb-pearl-n">0</span><b class="plus">+</b></button>
          </div>
          <button id="lb-menu" class="icon-btn menu-btn" data-i18n-attr="aria-label:menu"><i class="ti ti-menu"></i><i id="lb-menu-dot" class="dot" hidden></i></button>
          <button id="lb-settings" class="icon-btn top-right" data-i18n-attr="aria-label:settings">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.3 7.3 0 0 0-1.7-1L15 3.5h-4L10.7 6a7.3 7.3 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.3 7.3 0 0 0 1.7 1l.3 2.5h4l.3-2.5a7.3 7.3 0 0 0 1.7 1l2.4 1 2-3.4-2-1.6ZM13 15.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4Z" transform="translate(-1 0)" />
            </svg>
          </button>
        </header>
        <div class="port-offer">
          <button id="lb-event" class="lobby-card event" hidden><span id="lb-event-t" class="t"></span><span id="lb-event-s" class="s"></span></button>
          <button id="lb-merchant" class="lobby-card merchant" hidden><span class="t" data-i18n="merchant"></span><span id="lb-merchant-s" class="s"></span></button>
          <button id="lb-offer" class="lobby-card offer" hidden><span class="t" data-i18n="memo"></span><span id="lb-offer-s" class="s"></span></button>
        </div>
        <!-- 그림 속 장소: 게시판(의뢰) · 기록실 · 선구점(낚싯대·줄) · 조선소(배) · 어시장(상점) · 탐사소(파견·연구) · 수족관 -->
        <div class="port-places">
          <button class="place" data-place="board" style="--x: 4%; --y: 2%"><i class="ti ti-board"></i><span class="p-t" data-i18n="place_board"></span><span id="pl-board-s" class="p-s"></span><i id="pl-board-dot" class="dot" hidden></i></button>
          <button class="place r" data-place="records" style="--x: 4%; --y: 2%"><i class="ti ti-records"></i><span class="p-t" data-i18n="records"></span><span id="pl-records-s" class="p-s"></span></button>
          <button class="place" data-place="tackle" style="--x: 4%; --y: 44%"><i class="ti ti-gear"></i><span class="p-t" data-i18n="place_tackle"></span><span id="pl-tackle-s" class="p-s"></span><i id="pl-tackle-dot" class="dot" hidden></i></button>
          <button class="place r" data-place="yard" style="--x: 4%; --y: 30%"><i class="ti ti-boat"></i><span class="p-t" data-i18n="place_yard"></span><span id="pl-yard-s" class="p-s"></span><i id="pl-yard-dot" class="dot" hidden></i></button>
          <button class="place" data-place="lab" style="--x: 4%; --y: 23%"><i class="ti ti-lab"></i><span class="p-t" data-i18n="place_lab"></span><span id="pl-lab-s" class="p-s"></span><i id="pl-lab-dot" class="dot" hidden></i></button>
          <button class="place r" data-place="aqua" style="--x: 4%; --y: 52%"><i class="ti ti-aqua"></i><span class="p-t" data-i18n="place_aqua"></span><span id="pl-aqua-s" class="p-s"></span><i id="pl-aqua-dot" class="dot" hidden></i></button>
          <button class="place" data-place="market" style="--x: 30%; --y: 72%"><i class="ti ti-shop"></i><span class="p-t" data-i18n="place_market"></span><span id="pl-market-s" class="p-s"></span></button>
        </div>
        <div class="port-go">
          <button id="btn-depart" class="main-btn" data-ncq-main="출항 버튼" data-i18n="depart"></button>
        </div>
      </section>

      <!-- 지역 지도: 바다의 작은 지도를 누르면 열려요. 지역을 눌러 그곳으로 가요 (메인 버튼 없음) -->
      <section id="map" class="layer map" data-ncq-no-main hidden>
        <header class="topbar">
          <button id="btn-map-close" class="chip map-btn" data-i18n="close"></button>
        </header>
        <div class="map-area">
          <!-- 지도 그림은 파일(src/assets/art/region-map.webp)이고, 그 위에 지역마다 누르는 자리와 이름을 얹어요 -->
          <svg id="map-art" viewBox="0 0 360 480" preserveAspectRatio="xMidYMid meet">
            <defs><clipPath id="map-clip"><rect x="3" y="3" width="354" height="474" rx="22" /></clipPath></defs>
            <image id="map-img" x="0" y="0" width="360" height="480" preserveAspectRatio="xMidYMid slice" clip-path="url(#map-clip)" />
            <rect x="3" y="3" width="354" height="474" rx="22" fill="none" stroke="rgba(226,238,248,0.4)" stroke-width="2" />
            <g id="map-regions"></g>
          </svg>
        </div>
      </section>

      <!-- 바다: 앱을 열면 여기예요. 물을 누르고 있으면 배가 가고, 배가 서 있으면 '던지기' (뒤로가기로 항구에 돌아가요) -->
      <section id="home" class="layer sea">
        <header class="topbar">
          <div class="top-left">
            <div class="chip"><i class="coin"></i><span id="gold">0</span></div>
            <button id="sea-pearl" class="chip pearl-chip"><i class="pearl"></i><span id="pearl">0</span><b class="plus">+</b></button>
          </div>
        </header>
        <!-- 오른쪽 위 작은 지도는 캔버스에 그리고, 그 위에 지역 지도를 여는 버튼을 겹쳐요 -->
        <button id="btn-map" class="map-hit" data-i18n-attr="aria-label:map"></button>
        <!-- 상태: 지역·구역과 날씨 예보 한 줄, 켜져 있을 때만 직감·물길·생미끼. 누르면 '바다 상황' 창 -->
        <div id="status" class="status">
          <button id="st-line" class="pill st-line"><i id="st-zone-dot" class="zone-dot"></i><span id="st-zone-text"></span><i id="st-wx-icon" class="wx"></i><span id="st-wx-text"></span></button>
          <button id="st-intu" class="pill" hidden><span id="st-intu-text"></span></button>
          <button id="st-cur" class="pill rainbow" hidden><span id="st-cur-text"></span></button>
          <div id="st-bait" class="pill" hidden><span id="st-bait-text"></span></div>
          <button id="st-deep" class="pill deep" hidden><span id="st-deep-text"></span></button>
        </div>
        <!-- 왼쪽 열: 채비 (2026-11-18, 낚시의 신의 낚시터 준비 화면처럼 장착한 장비를 바다에서 보고 그 자리에서 바꿔요): 낚싯대 · 낚싯줄 · 준비(부스터·깊은 물) -->
        <div class="side-col left kit">
          <button id="kit-rod" class="kit-slot"></button>
          <button id="kit-line" class="kit-slot"></button>
          <button id="sd-prep" class="kit-slot"></button>
        </div>
        <!-- 오른쪽 열 (작은 지도 아래): 항구 · 도감 · 의뢰 · 패스 · 전체 메뉴 -->
        <div class="side-col right">
          <button id="sd-port" class="side-icon"><i class="ti ti-harbor"></i><span class="t" data-i18n="harbor"></span><i id="sd-port-dot" class="dot" hidden></i></button>
          <button id="sd-dex" class="side-icon"><i class="ti ti-dex"></i><span class="t" data-i18n="dex"></span><span id="sd-dex-s" class="s"></span></button>
          <button id="sd-quest" class="side-icon"><i class="ti ti-board"></i><span class="t" data-i18n="quests"></span><span id="sd-quest-s" class="s"></span><i id="sd-quest-dot" class="dot" hidden></i></button>
          <button id="sd-pass" class="side-icon"><i class="ti ti-pass"></i><span class="t" data-i18n="pass_short"></span><span id="sd-pass-s" class="s"></span><i id="sd-pass-dot" class="dot" hidden></i></button>
          <button id="btn-menu" class="side-icon"><i class="ti ti-menu"></i><span class="t" data-i18n="menu"></span><i id="sd-menu-dot" class="dot" hidden></i></button>
        </div>
        <div class="grow"></div>
        <!-- 배가 물고기 자리 안에 있으면 그 자리의 이름과 자리를 옮기기까지 남은 시간 -->
        <p id="spot-tag" class="spot-tag" hidden><i id="spot-tag-dot" class="spot-dot"></i><span id="spot-tag-text"></span></p>
        <!-- 안내 문구 (처음 몇 판): 배 모는 법, 물고기 자리 -->
        <p id="sea-guide" class="sea-guide" hidden></p>
        <nav class="bottom">
          <button id="btn-cast" class="main-btn" data-ncq-main="던지기 버튼" data-i18n="cast"></button>
        </nav>
        <span id="app-version" class="version"></span>
      </section>

      <!-- 낚시 중: 화면 어디든 누르면 감아요 (메인 버튼 없음) -->
      <section id="play" class="layer" data-ncq-no-main hidden></section>

      <!-- 한 판 결과 -->
      <!-- 결과 (2026-11-18, 낚시의 신처럼): 낚은 물고기가 장면 위에 매달려 보이고, 아래 판에 이름·크기·등급·보상과 버튼. 위에 재화 (동전이 날아가 모여요) -->
      <section id="result" class="result-layer" hidden>
        <div class="res-top">
          <div id="res-gold-chip" class="chip"><i class="coin" data-ncq-collect-icon></i><span id="res-gold">0</span></div>
          <div class="chip"><i class="pearl"></i><span id="res-pearl">0</span></div>
        </div>
        <div id="result-art" class="res-fish"><i class="res-line"></i><canvas id="result-fish"></canvas><div id="result-grade" class="stamp"></div></div>
        <div class="card res-card">
          <button id="result-close" class="x" data-i18n-attr="aria-label:close">×</button>
          <p id="result-kicker" class="kicker"></p>
          <div id="result-catch">
            <div class="name-row"><div id="result-stars" class="stars"></div><h2 id="result-name"></h2></div>
            <div id="result-size" class="size"></div>
            <div id="result-badges" class="badges"></div>
            <p id="result-intu" class="intu-line" hidden></p>
            <p id="result-cur" class="intu-line cur" hidden></p>
            <p id="result-clue" class="intu-line clue" hidden></p>
            <div class="reward"><i class="coin"></i><span id="result-gold"></span></div>
            <div id="result-pass" class="res-pass" hidden><span id="result-pass-t"></span><i class="bar"><b id="result-pass-b"></b></i></div>
          </div>
          <p id="result-tip" class="tip"></p>
          <p id="result-quest" class="intu-line quest" hidden></p>
          <!-- 줄이 끊어졌을 때: 광고나 진주로 그 자리에서 이어서 해요 (한 판에 한 번) -->
          <button id="result-revive" class="main-btn" hidden></button>
          <button id="result-revive-pearl" class="sub-btn" hidden></button>
          <div class="result-row">
            <button id="result-continue" class="main-btn" data-ncq-main="계속 낚시 버튼"></button>
            <button id="result-upgrade" class="main-btn alt" data-i18n="upgrade" hidden></button>
          </div>
          <button id="result-bait" class="sub-btn" hidden></button>
          <button id="result-tank" class="sub-btn" hidden></button>
          <button id="result-share" class="share-btn" data-i18n-attr="aria-label:share" hidden>
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M18 16a3 3 0 0 0-2.2.9l-6.9-4a3 3 0 0 0 0-1.8l6.9-4A3 3 0 1 0 15 5a3 3 0 0 0 .1.9l-6.9 4a3 3 0 1 0 0 4.2l6.9 4A3 3 0 1 0 18 16Z" /></svg>
          </button>
        </div>
      </section>

      <!-- 창은 아래에서 올라와요. 뒤는 어둡게 비치고, 누르면 닫혀요 -->
      <div id="sheet-dim" class="sheet-dim" hidden></div>

      <!-- 장비: 낚싯대·낚싯줄(아이템: 장착·강화·진화·각인·사기)과 배(단계). 항구의 선구점·조선소, 결과 화면의 '강화' -->
      <section id="sheet-gear" class="sheet tall" data-ncq-no-main hidden>
        <header class="sheet-head">
          <h2 id="gear-title"></h2>
          <div class="chip sheet-sub"><i class="coin"></i><span id="gear-gold">0</span></div>
          <button class="x sheet-close top-right" data-i18n-attr="aria-label:close">×</button>
        </header>
        <div id="gear-list" class="sheet-body"></div>
      </section>

      <!-- 수족관: 키우는 물고기(남은 시간·팔기·진주로 끝내기·광고로 줄이기), 칸 늘리기 -->
      <section id="sheet-aqua" class="sheet tall" data-ncq-no-main hidden>
        <header class="sheet-head">
          <h2 data-i18n="place_aqua"></h2>
          <div class="chip sheet-sub"><i class="pearl"></i><span id="aqua-pearl">0</span></div>
          <button class="x sheet-close top-right" data-i18n-attr="aria-label:close">×</button>
        </header>
        <div id="aqua-body" class="sheet-body"></div>
      </section>

      <!-- 탐사소: 파견(항해 보내기·받기)과 연구(해도·골드로 영구 능력치) -->
      <section id="sheet-lab" class="sheet tall" data-ncq-no-main hidden>
        <header class="sheet-head">
          <h2 data-i18n="place_lab"></h2>
          <div class="chip sheet-sub"><i class="coin"></i><span id="lab-gold">0</span></div>
          <button class="x sheet-close top-right" data-i18n-attr="aria-label:close">×</button>
        </header>
        <div id="lab-body" class="sheet-body"></div>
      </section>

      <!-- 준비: 깊은 물(하루 무료·입장권·진주)과 부스터(켜고 끄기, 골드로 하나·진주로 묶음 사기) -->
      <section id="sheet-prep" class="sheet tall" data-ncq-no-main hidden>
        <header class="sheet-head">
          <h2 data-i18n="prep"></h2>
          <div class="chip sheet-sub"><i class="pearl"></i><span id="prep-pearl">0</span></div>
          <button class="x sheet-close top-right" data-i18n-attr="aria-label:close">×</button>
        </header>
        <div id="prep-body" class="sheet-body"></div>
      </section>

      <!-- 상자·상인에게서 받은 장비 (2026-11-18): 상자가 열리고 장비 칸이 하나씩 나와요 -->
      <section id="got" class="modal got-layer" hidden>
        <div class="got-box">
          <img id="got-chest" class="got-chest" alt="" />
          <div id="got-grid" class="got-grid"></div>
          <button id="got-ok" class="main-btn" data-ncq-main="확인 버튼" data-i18n="got_ok"></button>
        </div>
      </section>

      <!-- 새소식 (2026-11-18, 낚시의 신의 접속 화면처럼): 하루 한 번, 이벤트·상인·팩·패스를 타일로 -->
      <section id="sheet-news" class="sheet" data-ncq-no-main hidden>
        <header class="sheet-head">
          <h2 data-i18n="news"></h2>
          <button class="x sheet-close top-right" data-i18n-attr="aria-label:close">×</button>
        </header>
        <div id="news-body" class="sheet-body"></div>
      </section>

      <!-- 전체 메뉴 (2026-11-18, 낚시의 신의 전체 메뉴처럼 모든 기능을 아이콘 격자로) -->
      <section id="sheet-menu" class="sheet" data-ncq-no-main hidden>
        <header class="sheet-head">
          <h2 data-i18n="menu"></h2>
          <button class="x sheet-close top-right" data-i18n-attr="aria-label:close">×</button>
        </header>
        <div id="menu-body" class="sheet-body"></div>
      </section>

      <!-- 채비 바꾸기: 바다의 낚싯대·낚싯줄 칸을 누르면 가방의 같은 종류를 격자로 보여 주고 누르면 바로 장착 -->
      <section id="sheet-swap" class="sheet" data-ncq-no-main hidden>
        <header class="sheet-head">
          <h2 id="swap-title"></h2>
          <button class="x sheet-close top-right" data-i18n-attr="aria-label:close">×</button>
        </header>
        <div id="swap-body" class="sheet-body"></div>
      </section>

      <!-- 바다 상황: 구역, 날씨와 예보, 직감, 무지개 물길 (보상형 광고 버튼이 여기 있어요) -->
      <section id="sheet-sea" class="sheet" data-ncq-no-main hidden>
        <header class="sheet-head">
          <h2 data-i18n="sea_title"></h2>
          <button class="x sheet-close top-right" data-i18n-attr="aria-label:close">×</button>
        </header>
        <div class="sheet-body">
          <div class="sea-row"><i id="sea-zone-dot" class="zone-dot"></i><div class="sea-t"><b id="sea-zone"></b></div></div>
          <div class="sea-row"><i id="sea-wx-icon" class="wx"></i><div class="sea-t"><b id="sea-wx"></b><span id="sea-wx-s"></span></div><button id="ad-wx" class="ad-btn" hidden></button></div>
          <div id="sea-intu" class="sea-row" hidden><i class="sea-ico intu"></i><div class="sea-t"><b data-i18n="intu_name"></b><span id="sea-intu-s"></span></div><button id="ad-intu" class="ad-btn" hidden></button></div>
          <div id="sea-cur" class="sea-row" hidden><i class="sea-ico cur"></i><div class="sea-t"><b data-i18n="cur_name"></b><span id="sea-cur-s"></span></div><button id="ad-cur" class="ad-btn" hidden></button></div>
        </div>
      </section>

      <!-- 도감 -->
      <section id="sheet-dex" class="sheet tall" data-ncq-no-main hidden>
        <header class="sheet-head">
          <h2 data-i18n="dex"></h2>
          <span id="dex-count" class="sheet-sub"></span>
          <button class="x sheet-close top-right" data-i18n-attr="aria-label:close">×</button>
        </header>
        <div class="sheet-body">
          <div id="dex-reward" class="reward-bar"><span id="dex-reward-t"></span><i><b id="dex-reward-fill"></b></i></div>
          <div id="dex-list" class="grid"></div>
        </div>
      </section>

      <!-- 상점 (항구의 어시장, 진주의 +) -->
      <section id="sheet-shop" class="sheet tall" data-ncq-no-main hidden>
        <header class="sheet-head">
          <h2 data-i18n="place_market"></h2>
          <button class="x sheet-close top-right" data-i18n-attr="aria-label:close">×</button>
        </header>
        <div id="shop-body" class="sheet-body"></div>
      </section>

      <!-- 기록실 -->
      <section id="sheet-records" class="sheet tall" data-ncq-no-main hidden>
        <header class="sheet-head">
          <h2 data-i18n="records"></h2>
          <button class="x sheet-close top-right" data-i18n-attr="aria-label:close">×</button>
        </header>
        <div id="records-body" class="sheet-body"></div>
      </section>

      <!-- 의뢰 (항구의 게시판, 바다의 왼쪽 열) -->
      <section id="sheet-quest" class="sheet" data-ncq-no-main hidden>
        <header class="sheet-head">
          <h2 data-i18n="quests"></h2>
          <span id="quest-left" class="sheet-sub"></span>
          <button class="x sheet-close top-right" data-i18n-attr="aria-label:close">×</button>
        </header>
        <div id="quest-list" class="sheet-body"></div>
      </section>

      <!-- 낚시 패스 -->
      <section id="sheet-pass" class="sheet tall" data-ncq-no-main hidden>
        <header class="sheet-head">
          <h2 data-i18n="pass"></h2>
          <span id="pass-left" class="sheet-sub"></span>
          <button class="x sheet-close top-right" data-i18n-attr="aria-label:close">×</button>
        </header>
        <div class="sheet-body">
          <div id="pass-head" class="pass-head"></div>
          <div id="pass-list"></div>
        </div>
      </section>

      <!-- 설정 -->
      <section id="sheet-settings" class="sheet" data-ncq-no-main hidden>
        <header class="sheet-head">
          <h2 data-i18n="settings"></h2>
          <button class="x sheet-close top-right" data-i18n-attr="aria-label:close">×</button>
        </header>
        <div class="sheet-body">
          <div class="row">
            <label id="lang-label" for="lang-select"></label>
            <select id="lang-select"></select>
          </div>
          <div class="row">
            <label for="bgm-on" data-i18n="bgm"></label>
            <input id="bgm-vol" type="range" min="0" max="100" />
            <input id="bgm-on" type="checkbox" class="switch" />
          </div>
          <div class="row">
            <label for="sfx-on" data-i18n="sfx"></label>
            <input id="sfx-vol" type="range" min="0" max="100" />
            <input id="sfx-on" type="checkbox" class="switch" />
          </div>
          <div class="row" id="vib-row">
            <label for="vib-on" data-i18n="vibration"></label>
            <input id="vib-on" type="checkbox" class="switch" />
          </div>
          <button id="btn-feedback" class="wide-btn" data-i18n="feedback" hidden></button>
          <button id="btn-restore" class="wide-btn" data-i18n="restore" hidden></button>
          <button id="btn-privacy" class="wide-btn" data-i18n="privacy" hidden></button>
          <div id="test-menu" class="test" hidden>
            <p data-i18n="test_menu"></p>
            <div class="test-row">
              <button id="test-gold" data-i18n="test_gold"></button>
              <button id="test-pearl" data-i18n="test_pearl"></button>
              <button id="test-scale" data-i18n="test_scale"></button>
              <button id="test-gear" data-i18n="test_gear"></button>
              <button id="test-pass" data-i18n="test_pass"></button>
              <button id="test-fill" data-i18n="test_fill"></button>
              <button id="test-bot" data-i18n="test_bot"></button>
              <button id="test-place" data-i18n="test_place"></button>
              <button id="test-intu" data-i18n="test_intu"></button>
              <button id="test-cur" data-i18n="test_cur"></button>
              <button id="test-reset" data-i18n="test_reset"></button>
            </div>
          </div>
          <span id="settings-version" class="version inline"></span>
        </div>
      </section>

      <!-- 알림 (도감 완성, 보스 포획) -->
      <section id="notice" class="modal" hidden>
        <div class="card">
          <h2 id="notice-title"></h2>
          <p id="notice-body" class="tip"></p>
          <button id="notice-ok" class="main-btn" data-ncq-main="확인 버튼" data-i18n="close"></button>
        </div>
      </section>

      <div id="toast" hidden></div>
    </div>
  </body>
</html>
