<!doctype html>
<html>
<head><script id="ncq-authored-motion" src="ncq-motion.js?v=10dd8b3eaad1"></script>
  <script src="./ncq/safe.js"></script>
  <script src="./ncq/motion.js"></script>
  <script src="./ncq/viewport.js"></script>
  <script src="./ncq/sound.js"></script>
  <script src="./ncq/save.js"></script>
  <script src="./ncq/popup.js"></script>
  <meta charset="UTF-8"><style id="ncq-text-scale">:where(html){font-size:16px}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}</style><style id="ncq-no-zoom">*{touch-action:manipulation}</style><script src="ncq-flags.js"></script><script src="ncq-popup.js"></script><script src="ncq-ads.js"></script><script src="ncq-iap.js"></script><script src="ncq-feedback.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#faf3e6">
  <meta name="description" content="A tactile local two-player Yutnori game. Gather, throw, and race your pieces home.">
  <title>맞짱 윷놀이 · Yut Duel</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./src/styles.css">
  <script type="module" src="./src/app.mjs"></script>
</head>
<body>
  <main class="lobby-shell" id="lobby" aria-labelledby="lobby-title">
    <div class="lobby-toolbar header-actions">
      <button class="icon-button" id="lobby-sound-button" data-sound-toggle data-i18n-attr="aria-label:sound" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path class="sound-waves" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg></button>
      <button class="icon-button" id="lobby-settings-button" data-settings-open data-i18n-attr="aria-label:settings" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m9 3-1 3-3 1-2 3 2 2-1 3 2 3 3-1 2 3h3l1-3 3-1 2-3-2-2 1-3-2-3-3 1-2-3H9Z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <h1 class="lobby-title" id="lobby-title" data-i18n-attr="aria-label:title"><span data-i18n="lobbyTitleTop"></span><span data-i18n="lobbyTitleBottom"></span></h1>
    <div class="lobby-illustration" aria-hidden="true"><img src="./assets/lobby-background.png" alt="" fetchpriority="high" draggable="false"></div>
    <div class="lobby-modes" role="group" data-i18n-attr="aria-label:gameModes">
      <button class="mode-button" type="button" disabled data-i18n="modeDuel"></button>
      <button class="mode-button" type="button" disabled data-i18n="modeTeams"></button>
      <button class="mode-button" type="button" disabled data-i18n="modeThree"></button>
      <button class="mode-button" id="together-button" type="button" data-i18n="playTogether" data-ncq-main="play together"></button>
    </div>
  </main>
  <main class="game-shell" id="app" hidden>
    <div class="game-top">
      <header class="game-header">
        <div class="brand"><button class="icon-button back-button" id="back-to-lobby" data-i18n-attr="aria-label:lobby" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></button><h1 data-i18n="title"></h1><span class="mode" data-i18n="mode"></span></div>
        <div class="header-actions"><button class="icon-button" id="sound-button" data-i18n-attr="aria-label:sound" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path class="sound-waves" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg></button><button class="icon-button" id="settings-button" data-i18n-attr="aria-label:settings" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m9 3-1 3-3 1-2 3 2 2-1 3 2 3 3-1 2 3h3l1-3 3-1 2-3-2-2 1-3-2-3-3 1-2-3H9Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      </header>
      <div class="pending-results" id="pending-results" role="group" data-i18n-attr="aria-label:chooseResult"></div>
    </div>
    <div class="game-stage">
      <section class="player-card opponent" id="opponent-card" data-player="1">
        <span class="avatar" aria-hidden="true"><span class="hair"></span><span class="face"></span><span class="robe"></span></span>
        <h2 data-i18n="opponent"></h2><div class="piece-rack" id="opponent-pieces"></div>
      </section>
      <section class="play-area" id="play-area" aria-label="Yutnori board">
        <canvas id="board" role="img"></canvas>
        <div class="throw-result" id="throw-result" aria-hidden="true"><span class="result-eyebrow"></span><strong class="result-name"></strong><span class="result-detail"></span></div>
      </section>
      <section class="player-card me is-active" id="my-card" data-player="0" aria-current="true">
        <span class="avatar" aria-hidden="true"><span class="hair"></span><span class="face"></span><span class="robe"></span></span>
        <h2 data-i18n="you"></h2><div class="piece-rack" id="my-pieces"></div>
      </section>
    </div>
    <footer class="game-controls">
      <p class="game-status" id="game-status" aria-live="polite"></p>
      <button type="button" class="main-button" id="main-button" data-ncq-main="game action"><span class="button-sticks" aria-hidden="true"><i></i><i></i></span><span id="main-label" data-i18n="throw"></span></button>
    </footer>
  </main>
  <dialog id="settings-dialog" aria-labelledby="settings-title" data-ncq-no-main>
    <header class="dialog-header"><h2 id="settings-title" data-i18n="settings"></h2><button class="close-button" data-close data-i18n-attr="aria-label:close" type="button">×</button></header>
    <div class="dialog-body">
      <p class="local-note" data-i18n="localNote"></p>
      <label class="setting-row"><span data-i18n="sound"></span><input id="sound-setting" type="checkbox" role="switch"></label>
      <label class="language-row"><span id="language-label"></span><select id="language-select"></select></label>
      <details><summary data-i18n="rules"></summary><ol class="rules-list"><li data-i18n="rule1"></li><li data-i18n="rule2"></li><li data-i18n="rule3"></li><li data-i18n="rule4"></li></ol></details>
      <button class="secondary-button" id="new-game-button" data-i18n="newGame" type="button"></button>
      <button class="secondary-button" id="feedback-button" data-i18n="feedback" type="button" hidden></button>
      <p class="save-note" data-i18n="saved"></p><span class="app-version" id="app-version"></span>
    </div>
  </dialog>
  <dialog id="restart-dialog" aria-labelledby="restart-title">
    <header class="dialog-header"><h2 id="restart-title" data-i18n="newGame"></h2><button class="close-button" data-close data-i18n-attr="aria-label:close" type="button">×</button></header>
    <div class="dialog-body"><p data-i18n="newConfirm"></p><div class="dialog-actions"><button class="secondary-button" data-close data-i18n="cancel" type="button"></button><button class="secondary-button filled" id="confirm-new-game" data-i18n="confirm" data-ncq-main="new game" type="button"></button></div></div>
  </dialog>
  <dialog id="winner-dialog" aria-labelledby="winner-title">
    <header class="dialog-header"><h2 id="winner-title"></h2><button class="close-button" data-close data-i18n-attr="aria-label:close" type="button">×</button></header>
    <div class="dialog-body"><div class="winner-medal" aria-hidden="true">✦</div><button class="secondary-button filled" id="play-again-button" data-i18n="newGame" data-ncq-main="play again" type="button"></button></div>
  </dialog>
</body>
</html>
