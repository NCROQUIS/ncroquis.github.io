<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>맞짱 오목 (엔크로키)</title>
<meta name="description" content="친구와 방 링크로 바로 만나는 실시간 1대1 오목">
<meta property="og:type" content="website">
<meta property="og:title" content="맞짱 오목">
<meta property="og:description" content="친구와 방 링크로 바로 만나는 실시간 1대1 오목">
<meta property="og:url" content="https://ncroquis.github.io/matjjangomok/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&family=Nanum+Pen+Script&display=swap">
<style>
:root {
  --mat: #2f5d50;
  --mat-line: rgba(236, 214, 120, 0.13);
  --mat-line-major: rgba(236, 214, 120, 0.28);
  --paper: #fdfdfb;
  --ink: #1f2623;
  --graphite: #57605b;
  --on-mat: #f3f7f4;
  --on-mat-soft: #c4dace;
  --tape-dev: #f1c94f;
  --tape-test: #93c4ec;
  --tape-live: #e9664c;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --mat: #213f36;
    --paper: #eceee9;
    --mat-line: rgba(236, 214, 120, 0.1);
    --mat-line-major: rgba(236, 214, 120, 0.2);
  }
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--on-mat);
  font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.65;
  word-break: keep-all;
  overflow-wrap: break-word;
  background-color: var(--mat);
  background-image:
    linear-gradient(var(--mat-line-major) 1px, transparent 1px),
    linear-gradient(90deg, var(--mat-line-major) 1px, transparent 1px),
    linear-gradient(var(--mat-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--mat-line) 1px, transparent 1px);
  background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
  background-position: -1px -1px;
}

.wrap { max-width: 1080px; margin: 0 auto; padding: 64px 20px 72px; }

.masthead h1 {
  margin: 0;
  font-family: "Black Han Sans", "IBM Plex Sans KR", sans-serif;
  font-weight: 400;
  font-size: clamp(48px, 10vw, 96px);
  line-height: 1;
}

.masthead p { margin: 16px 0 0; max-width: 34em; color: var(--on-mat-soft); font-size: 18px; }

.board {
  list-style: none;
  margin: 64px 0 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 44px 28px;
}

.sheet {
  position: relative;
  background: var(--paper);
  color: var(--ink);
  padding: 34px 22px 18px;
  box-shadow: 0 1px 1px rgba(0, 0, 0, 0.2), 0 12px 20px -12px rgba(0, 0, 0, 0.55);
}

.board li:nth-child(3n + 1) .sheet { transform: rotate(-0.7deg); }
.board li:nth-child(3n + 2) .sheet { transform: rotate(0.5deg); }
.board li:nth-child(3n) .sheet { transform: rotate(-0.25deg); }

.board .sheet h2 a { color: inherit; text-decoration: none; }
.board .sheet h2 a::after { content: ""; position: absolute; inset: 0; }
.board .sheet h2 a:focus-visible { outline: none; }
.board .sheet:focus-within { outline: 3px solid var(--tape-dev); outline-offset: 5px; }

.tape {
  position: absolute;
  top: -12px;
  left: 18px;
  padding: 3px 12px 4px;
  background: var(--tape-dev);
  color: #2b2a20;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.5;
  transform: rotate(-2.5deg);
  opacity: 0.95;
}

.tape[data-status="테스트 중"] { background: var(--tape-test); }
.tape[data-status="출시"] { background: var(--tape-live); color: #fff; }

.sheet h2 {
  margin: 0;
  font-family: "Black Han Sans", "IBM Plex Sans KR", sans-serif;
  font-weight: 400;
  font-size: 30px;
  line-height: 1.15;
}

.summary { margin: 10px 0 0; }

/* 앱 아이콘·카테고리 (출시 서버가 프로젝트 레포의 스토어 정보로 채워요). 아이콘이 없으면 이름 첫 글자 자리표시 */
.head { display: flex; align-items: center; gap: 14px; }
.head .title { min-width: 0; }
.app-icon {
  flex: none;
  width: 64px;
  height: 64px;
  border-radius: 22%;
  object-fit: cover;
  background: #e9ece7;
  box-shadow: 0 0 0 1px rgba(31, 38, 35, 0.14);
}
.app-icon.none {
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  box-shadow: none;
  border: 2px dashed rgba(31, 38, 35, 0.28);
  color: var(--graphite);
  font-family: "Black Han Sans", "IBM Plex Sans KR", sans-serif;
  font-size: 28px;
  line-height: 1;
}
.page .app-icon { width: 88px; height: 88px; }
.page .app-icon.none { font-size: 40px; }
.cat { margin: 6px 0 0; color: var(--graphite); font-size: 14px; font-weight: 600; line-height: 1.3; }

.quick { margin: 16px 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
.quick .ver { margin-left: -4px; }

.quick-play {
  position: relative;
  z-index: 1; /* 카드 전체가 소개 페이지 링크(h2 a::after)라 그 위에서 따로 눌려요 */
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 9px 18px 10px 15px;
  background: var(--ink);
  color: var(--paper);
  font-weight: 600;
  line-height: 1.3;
  text-decoration: none;
}

.quick-play::before {
  content: "";
  border-style: solid;
  border-width: 6px 0 6px 10px;
  border-color: transparent transparent transparent currentColor;
}

.quick-play:hover { background: #34433c; }

/* 피드백 게시판 링크 (카드·소개 페이지) */
/* 구글플레이 스토어 버튼 (스토어 페이지가 열리는 앱만) */
.quick-store,
.store {
  position: relative;
  z-index: 1;
  display: inline-block;
  padding: 9px 16px 10px;
  background: var(--mat);
  color: var(--on-mat);
  font-weight: 600;
  line-height: 1.3;
  text-decoration: none;
}
.quick-store:hover,
.store:hover { background: #3a6e60; }
.quick-store:focus-visible,
.store:focus-visible { outline: 3px solid var(--tape-dev); outline-offset: 3px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 14px; margin: 24px 0 0; }
.actions .play { margin-top: 0; }
.actions .store { padding: 12px 22px; }
.actions .ver { margin-left: -6px; }

.quick-board {
  position: relative;
  z-index: 1;
  display: inline-block;
  padding: 7px 14px 8px;
  border: 2px solid var(--ink);
  color: var(--ink);
  font-weight: 600;
  line-height: 1.3;
  text-decoration: none;
}
.quick-board:hover { background: rgba(31, 38, 35, 0.08); }
.quick-board:focus-visible { outline: 3px solid var(--tape-dev); outline-offset: 3px; }
.board-link { margin: 14px 0 0; }
.board-link a { color: var(--ink); font-weight: 600; text-underline-offset: 3px; }

.ver {
  margin-left: 10px;
  color: var(--graphite);
  font-size: 14px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.note {
  margin: 18px 0 0;
  color: var(--graphite);
  font-family: "Nanum Pen Script", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-size: 24px;
  line-height: 1.2;
}

/* 만든 사람: 개발자 GitHub 아이디 (카드 전체 링크 위에서 따로 눌려요) */
.by { margin: 4px 0 0; color: var(--graphite); font-size: 14px; }
.dev {
  position: relative;
  z-index: 1;
  color: var(--ink);
  font-weight: 600;
  text-decoration: underline;
  text-underline-offset: 3px;
  overflow-wrap: anywhere;
}
.dev:hover { color: #34433c; }
.dev:focus-visible { outline: 3px solid var(--tape-dev); outline-offset: 2px; }

.empty {
  margin: 64px 0 0;
  max-width: 30em;
  padding: 24px;
  border: 2px dashed var(--on-mat-soft);
  color: var(--on-mat-soft);
}

.back {
  color: var(--on-mat);
  font-weight: 600;
  text-decoration: underline;
  text-underline-offset: 4px;
}

.page { max-width: 760px; margin: 0 auto; padding: 32px 20px 72px; }

.page .sheet {
  margin-top: 44px;
  padding: 52px clamp(22px, 6vw, 60px) 40px;
  transform: rotate(-0.35deg);
}

.page .sheet h1 {
  margin: 0;
  font-family: "Black Han Sans", "IBM Plex Sans KR", sans-serif;
  font-weight: 400;
  font-size: clamp(40px, 8vw, 64px);
  line-height: 1.05;
}

.lead { margin: 16px 0 0; font-size: 20px; line-height: 1.5; }

.pitch { margin: 24px 0 0; max-width: 34em; }

.play {
  display: inline-block;
  margin-top: 12px;
  padding: 12px 22px;
  background: var(--ink);
  color: var(--paper);
  font-weight: 600;
  text-decoration: none;
}

.pending { margin: 24px 0 0; color: var(--graphite); }

.back:focus-visible,
.play:focus-visible,
.quick-play:focus-visible { outline: 3px solid var(--tape-dev); outline-offset: 3px; }

footer { margin-top: 72px; color: var(--on-mat-soft); font-size: 14px; }

.masthead .start-link { margin: 28px 0 0; }

.start-link a {
  display: inline-block;
  padding: 8px 16px 9px;
  background: var(--tape-dev);
  color: #2b2a20;
  font-weight: 600;
  text-decoration: none;
  transform: rotate(-1.5deg);
}

.start-link a:focus-visible { outline: 3px solid var(--on-mat); outline-offset: 3px; }
</style>
</head>
<body>
<main class="page">
  <a class="back" href="../">전체 프로젝트 보기</a>
  <article class="sheet">
    <span class="tape" data-status="개발 중">개발 중</span>
    <div class="head"><img class="app-icon" src="icon.png?v=bbd8bbd50fcf" alt="" width="64" height="64" loading="lazy" decoding="async"><div class="title"><h1>맞짱 오목</h1><p class="cat">보드</p></div></div>
    <p class="lead">친구와 방 링크로 바로 만나는 실시간 1대1 오목</p>
    <p class="pitch">방을 만들고 링크나 코드를 보내면 친구와 바로 오목을 둘 수 있어요. 흑돌과 백돌을 번갈아 놓아 다섯 알을 먼저 잇고, 같은 방에서 다시 맞붙어 보세요.</p>
    <p class="actions"><a class="play" href="play/">플레이해 보기</a> <span class="ver">v1.12.0</span><a class="store" href="https://play.google.com/store/apps/details?id=com.ncroquis.matjjangomok" rel="noopener" aria-label="맞짱 오목 구글플레이에서 받기">구글플레이</a></p>
    <p class="board-link"><a href="feedback/">피드백 남기기 · 다른 사람 의견 보기</a></p>
    <p class="note">matjjangomok, 2026.11.7 시작 · <time class="updated" datetime="2026-11-13">2026.11.13 업데이트</time></p>
    <p class="by">만든 사람 <a class="dev" href="https://github.com/ncroquis-dev" rel="noopener" aria-label="개발자 GitHub ncroquis-dev">@ncroquis-dev</a></p>
  </article>
  <footer>© 2026 엔크로키</footer>
</main>
</body>
</html>
