<!doctype html>
<html>
<head>
<meta charset="utf-8"><script src="ncq-flags.js"></script><script src="ncq-ads.js"></script><script src="ncq-iap.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<script src="ncq/safe.js"></script>
<script src="ncq/device.js"></script>
<title>Jellyblock - Puzzle Blast</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  /* Layout: one-screen candy board — score strip, jelly well, piece tray, tuning sheet */
  --bg:#efe8fb; --bg-glow:#d3f2ea; --bg-glow2:#ffe0ec;
  --ink:#3a2f52; --ink-soft:#7b6f96;
  --board:#ddd3f2; --board-edge:#c7b9e8; --well:#cdbfea;
  --accent:#ff5d8f; --accent-top:#ff9bbb; --accent-rim:#d93f72; --on-accent:#ffffff;
  --btn-top:#ffffff; --btn-bot:#efe7ff; --btn-rim:#cbbbec;
  --crown:#ffc93c; --crown-rim:#d98a12; --crown-ink:#e29a14;
  --splash:#8f6be0; --logo-rim:#5b3fa8;
  --play-top:#7fe3b4; --play-bot:#2fc48a; --play-rim:#1e9465;
  --j-straw:#ff7aa2; --j-straw-rim:#c23e6c; --j-soda:#4fbdf0; --j-soda-rim:#1f7fb3;
  --j-lime:#8ad86a; --j-lime-rim:#4c9a2e; --j-lemon:#ffd447; --j-lemon-rim:#c99512;
  --j-peach:#ffa36a; --j-peach-rim:#cc6a2a; --j-grape:#a98bf0; --j-grape-rim:#6a4cc0;
  --j-mint:#4fd6b5; --j-mint-rim:#21977a;
  --sheet:#fbf9ff; --veil:rgba(58,47,82,.28); --shadow:rgba(80,60,130,.18);
  --f-display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;height:100dvh;margin:0}
html{-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{font-size:14px;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html:not([lang]) [data-i18n]{visibility:hidden}
body{
  background:var(--bg);
  background-image:
    radial-gradient(120% 70% at 50% -10%,var(--bg-glow) 0%,transparent 60%),
    radial-gradient(90% 55% at 50% 115%,var(--bg-glow2) 0%,transparent 65%);
  color:var(--ink);font-family:var(--f-body);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;
}
.app{
  height:100%;max-width:540px;margin:0 auto;box-sizing:border-box;
  display:flex;flex-direction:column;gap:6px;
  padding-left:max(16px,var(--ncq-left,0px));
  padding-right:max(16px,var(--ncq-right,0px));
  padding-block:calc(var(--ncq-top,0px) + 10px) calc(var(--ncq-bottom,0px) + 10px);
}
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat.right{align-items:flex-end}
.lbl{font-size:12px;letter-spacing:.14em;color:var(--ink-soft)}
.num{font-family:var(--f-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums;display:inline-block;transform-origin:50% 100%}
.num.best{font-size:24px;color:var(--ink-soft)}
.num.bump{animation:bump .42s}
.num.big-hit.bump{animation:bumpBig .55s}
@keyframes bumpBig{0%{transform:scale(1,1)}18%{transform:scale(1.45,.7)}45%{transform:scale(.88,1.18)}70%{transform:scale(1.06,.96)}100%{transform:scale(1)}}
.combo{font-family:var(--f-display);font-size:21px;color:var(--accent);min-height:1.3em;text-align:center;transform-origin:50% 100%}
.combo.bump{animation:bump .5s}
@keyframes bump{0%{transform:scale(1,1)}25%{transform:scale(1.22,.82)}55%{transform:scale(.92,1.1)}80%{transform:scale(1.03,.98)}100%{transform:scale(1)}}
.stage{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.hud{display:flex;flex-direction:column;gap:0;align-items:stretch}
.topbar{display:flex;justify-content:space-between;align-items:center}
.bestbox{display:flex;align-items:center;gap:6px}
.crown{width:30px;height:23px;fill:var(--crown);filter:drop-shadow(0 2px 0 var(--crown-rim))}
.bestbox .num.best{font-size:24px;color:var(--crown-ink)}
.gear{margin-right:var(--ncq-toss-right,0px);border:0;background:linear-gradient(var(--btn-top),var(--btn-bot));width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 -3px 0 var(--btn-rim),0 3px 8px var(--shadow);transition:transform .22s cubic-bezier(.3,1.8,.5,1)}
.gear svg{width:24px;height:24px;fill:var(--ink-soft)}
.gear:active{transform:scale(1.1,.86) rotate(30deg)}
.gear:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.scorebox{text-align:center;margin-top:-6px}
.scorebox .num{font-size:46px}
.card.settings{gap:12px;min-width:min(270px,84%)}
.toggles{display:flex;gap:10px;justify-content:center}
.tog{border:0;background:linear-gradient(var(--btn-top),var(--btn-bot));border-radius:18px;width:74px;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--ink);font-family:var(--f-body);font-size:13px;box-shadow:inset 0 -3px 0 var(--btn-rim),0 3px 8px var(--shadow);transition:transform .22s cubic-bezier(.3,1.8,.5,1)}
.tog svg{width:30px;height:30px;fill:var(--accent);stroke:var(--accent)}
.tog svg path[fill="none"]{fill:none}
.tog:active{transform:scale(1.08,.88)}
.tog:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tog[aria-pressed="false"]{opacity:.45}
.tog[aria-pressed="false"] svg{fill:var(--ink-soft);stroke:var(--ink-soft)}
.tog[aria-pressed="false"] .wave{opacity:0}
.card .row.lang{width:100%;display:flex;flex-direction:column;align-items:stretch;gap:6px}
.lang-title{font-size:13px;color:var(--ink-soft);text-align:left}
.lang-list{display:flex;gap:8px;flex-wrap:wrap}
.lang-list button{flex:1 1 auto;min-width:0;border:0;border-radius:14px;padding:9px 12px;font:15px var(--f-body);color:var(--ink);cursor:pointer;
  background:linear-gradient(var(--btn-top),var(--btn-bot));box-shadow:inset 0 -3px 0 var(--btn-rim);overflow-wrap:anywhere}
.lang-list button[aria-pressed="true"]{background:linear-gradient(var(--accent-top),var(--accent));color:var(--on-accent);box-shadow:inset 0 -3px 0 var(--accent-rim)}
.lang-list button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card .row.vib{width:100%;grid-template-columns:auto minmax(64px,1fr) auto}
.card .row.vib label{white-space:normal;text-align:left}
.card .row.vib output{min-width:2em}
#settings{position:fixed;inset:0;z-index:30;border-radius:0}

/* lobby + splash */
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  background:var(--bg);background-image:radial-gradient(120% 70% at 50% -10%,var(--bg-glow) 0%,transparent 60%),radial-gradient(90% 55% at 50% 115%,var(--bg-glow2) 0%,transparent 65%);
  padding-left:max(16px,var(--ncq-left,0px));padding-right:max(16px,var(--ncq-right,0px));
  padding-block:calc(var(--ncq-top,0px) + 18px) calc(var(--ncq-bottom,0px) + 40px);box-sizing:border-box}
.screen.leaving{animation:screenOut .45s cubic-bezier(.5,0,.75,0) forwards}
@keyframes screenOut{to{opacity:0;transform:scale(1.06,.94)}}
.splash{justify-content:center;background:var(--splash);z-index:25}
.studio{font-family:"Lilita One",var(--f-display);font-size:clamp(34px,10vw,52px);letter-spacing:.08em;color:var(--on-accent);animation:jellyIn .8s both}
.lobby-gear{position:absolute;top:calc(var(--ncq-top,0px) + 16px);right:max(16px,var(--ncq-right,0px))}
.logo{margin:0;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:jellyIn .9s both}
.logo{font-weight:400}
.logo-top{display:flex;gap:1px;font-family:"Lilita One",var(--f-display);font-size:clamp(40px,min(15.5vw,9vh),84px);line-height:1}
.lj,.le{display:inline-block;-webkit-text-stroke:var(--sw) var(--rim);paint-order:stroke fill;text-shadow:0 .07em 0 var(--rim);animation:bob 2.4s ease-in-out infinite;transform-origin:50% 100%}
.lj{--sw:10px}
.l1{color:var(--j-straw);--rim:var(--j-straw-rim)}
.l2{color:var(--j-soda);--rim:var(--j-soda-rim);animation-delay:-.45s}
.l3{color:var(--j-lemon);--rim:var(--j-lemon-rim);animation-delay:-.9s}
.l4{color:var(--j-lime);--rim:var(--j-lime-rim);animation-delay:-1.35s}
.l5{color:var(--j-grape);--rim:var(--j-grape-rim);animation-delay:-1.8s}
.logo-en{display:flex;gap:1px;margin-top:-2px;font-family:"Lilita One",var(--f-display);font-size:clamp(22px,min(8.2vw,4.6vh),46px);line-height:1}
.lgap{width:.32em}
.le{--sw:9px;--rim:var(--logo-rim);color:var(--on-accent)}
.e1{color:var(--j-lime);--rim:var(--j-lime-rim)}.e2{color:var(--j-lemon);--rim:var(--j-lemon-rim);animation-delay:-.3s}
.e3{color:var(--j-peach);--rim:var(--j-peach-rim);animation-delay:-.6s}.e4{color:var(--j-grape);--rim:var(--j-grape-rim);animation-delay:-.9s}
.e5{color:var(--j-mint);--rim:var(--j-mint-rim);animation-delay:-1.2s}
.w1,.w2,.w3,.w4,.w5{color:var(--on-accent);--rim:var(--logo-rim)}
.w1{animation-delay:-.2s}.w2{animation-delay:-.5s}.w3{animation-delay:-.8s}.w4{animation-delay:-1.1s}.w5{animation-delay:-1.4s}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}40%{transform:translateY(-6px) scale(.96,1.05)}70%{transform:translateY(1px) scale(1.05,.95)}}
.lobby-bottom{flex:none;width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:14px;min-height:120px;justify-content:flex-end}
.loading{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.dots{display:flex;gap:8px}
.dots i{width:16px;height:16px;border-radius:5px;background:var(--j-straw);box-shadow:inset 0 -3px 0 var(--j-straw-rim);animation:hop .9s ease-in-out infinite}
.dots i:nth-child(2){background:var(--j-lemon);box-shadow:inset 0 -3px 0 var(--j-lemon-rim);animation-delay:.15s}
.dots i:nth-child(3){background:var(--j-soda);box-shadow:inset 0 -3px 0 var(--j-soda-rim);animation-delay:.3s}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.1,.85)}45%{transform:translateY(-12px) scale(.9,1.1)}}
.bar{width:70%;height:12px;border-radius:99px;background:var(--well);overflow:hidden;box-shadow:inset 0 2px 3px var(--shadow)}
.bar .fill{height:100%;width:0;border-radius:99px;background:linear-gradient(var(--accent-top),var(--accent))}
.loadtxt{font-size:13px;color:var(--ink-soft);letter-spacing:.1em}
.playbtn{width:100%;border:0;border-radius:28px;padding:18px 0 20px;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;
  background:linear-gradient(var(--play-top),var(--play-bot));color:var(--on-accent);font-family:"Lilita One",var(--f-display);font-size:40px;letter-spacing:.06em;
  box-shadow:inset 0 -7px 0 var(--play-rim),0 10px 24px var(--shadow);-webkit-text-stroke:6px var(--play-rim);paint-order:stroke fill;
  animation:jellyIn .7s both, breathe 2.2s 0.7s ease-in-out infinite;transition:transform .25s cubic-bezier(.3,1.8,.5,1)}
.playbtn svg{width:40px;height:40px;fill:var(--on-accent);filter:drop-shadow(0 3px 0 var(--play-rim))}
.playbtn:active{transform:scale(1.1,.84)}
.playbtn:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
.ver{position:absolute;right:calc(var(--ncq-right,0px) + 12px);bottom:calc(var(--ncq-bottom,0px) + 8px);font-size:11px;color:var(--ink-soft);opacity:.6;font-variant-numeric:tabular-nums}
.ver.in-card{position:static;align-self:flex-end;margin-top:-4px}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.035,.965)}}
.btn.wide{width:100%}
.btn[aria-pressed="false"]{opacity:.6}
.btn{
  font-family:var(--f-display);font-size:16px;border:0;border-radius:999px;padding:10px 18px;
  background:linear-gradient(var(--btn-top),var(--btn-bot));color:var(--ink);
  box-shadow:inset 0 -3px 0 var(--btn-rim),0 4px 10px var(--shadow);cursor:pointer;
  transition:transform .22s cubic-bezier(.3,1.8,.5,1);
}
.btn:active{transform:scale(1.08,.86)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{--btn-top:var(--accent-top);--btn-bot:var(--accent);--btn-rim:var(--accent-rim);color:var(--on-accent)}
.over{position:absolute;inset:0;display:grid;place-items:center;background:var(--veil);border-radius:24px}
.card{
  background:var(--sheet);border-radius:30px;padding:26px 30px;text-align:center;
  box-shadow:0 14px 40px var(--shadow);display:flex;flex-direction:column;gap:10px;align-items:center;
  animation:jellyIn .7s both;max-width:min(320px,90%);
}
.card h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0;text-wrap:balance}
.card p{margin:0;color:var(--ink-soft)}
.card .big{font-family:var(--f-display);font-size:48px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
@keyframes jellyIn{0%{transform:scale(.6,.4);opacity:0}45%{transform:scale(1.1,.92);opacity:1}70%{transform:scale(.96,1.04)}100%{transform:scale(1)}}
.sheet{
  position:absolute;left:0;right:0;bottom:0;background:var(--sheet);border-radius:24px;
  box-shadow:0 -6px 30px var(--shadow);padding:16px 18px 14px;display:flex;flex-direction:column;gap:10px;
  animation:jellyIn .5s both;z-index:2;
}
.sheet h3{font-family:var(--f-display);font-weight:400;font-size:19px;margin:0}
.row{display:grid;grid-template-columns:7.5em 1fr 3.2em;align-items:center;gap:10px}
.row label{font-size:14px}
.row output{font-family:var(--f-display);text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.row input[type=range]{width:100%;accent-color:var(--accent);min-width:0}
.hint{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin:0}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{accent-color:var(--accent);width:18px;height:18px}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end}
@media (prefers-reduced-motion:reduce){
  .lj,.le,.dots i,.playbtn,.logo,.studio{animation:none}
  .num.bump,.combo.bump,.card{animation:none}
  .btn{transition:none}
}
</style>
</head>
<body>
<div class="app" data-ncq-no-main>
  <header class="hud">
    <div class="topbar">
      <div class="bestbox" aria-label="Best score" data-i18n-attr="aria-label:best_score">
        <svg class="crown" viewBox="0 0 32 24" aria-hidden="true"><path d="M3 20 L1 6 L9 12 L16 2 L23 12 L31 6 L29 20 Z" /><rect x="3" y="20" width="26" height="3" rx="1.5" /></svg>
        <span class="num best" id="best">0</span>
      </div>
      <button class="gear" id="gear" type="button" aria-label="Settings" data-i18n-attr="aria-label:settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm8.6 4.9-1.9 1.1.2 2.2-2.1.9-1 2-2.2-.4-1.6 1.6-1.6-1.6-2.2.4-1-2-2.1-.9.2-2.2-1.9-1.1.7-2.1-.7-2.1 1.9-1.1-.2-2.2 2.1-.9 1-2 2.2.4L12 1.5l1.6 1.6 2.2-.4 1 2 2.1.9-.2 2.2 1.9 1.1-.7 2.1Z"/></svg>
      </button>
    </div>
    <div class="scorebox"><span class="num" id="score" aria-live="polite">0</span></div>
    <div class="combo" id="combo" hidden></div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Jellyblock board" data-i18n-attr="aria-label:board_label"></canvas>

    <div class="over" id="over" hidden>
      <div class="card">
        <h2 data-i18n="no_room">No more room!</h2>
        <p data-i18n="this_score">Score</p>
        <div class="big" id="finalScore">0</div>
        <p id="finalBest"></p>
        <button class="btn primary" id="again" type="button" data-ncq-main="다시 하기 버튼" data-i18n="play_again">Play again</button>
      </div>
    </div>

    <div class="over" id="settings" hidden>
      <div class="card settings">
        <h2 data-i18n="settings">Settings</h2>
        <div class="toggles">
          <button class="tog" id="sound" type="button" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
            <span data-i18n="sound">Sound</span>
          </button>
          <button class="tog" id="bgm" type="button" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5V5l11-2v12.5"/><circle cx="6.5" cy="17.5" r="2.8"/><circle cx="17.5" cy="15.5" r="2.8"/><path d="M9 5l11-2v3L9 8z"/></svg>
            <span data-i18n="music">Music</span>
          </button>
          <button class="tog" id="vibe" type="button" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="8" height="18" rx="2"/><path class="wave" d="M4.5 8v8M2 10v4M19.5 8v8M22 10v4" fill="none" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span data-i18n="vibration">Vibration</span>
          </button>
        </div>
        <div class="row lang"><span class="lang-title" id="langTitle">Language</span><div class="lang-list" id="langList" role="group" aria-labelledby="langTitle"></div></div>
        <div class="row vib"><label for="vibeLv" data-i18n="vibration_level">Vibration level</label><input id="vibeLv" type="range" min="1" max="3" step="1"><output id="vibeLvOut"></output></div>
        <button class="btn primary wide" id="restart" type="button" data-i18n="restart">Restart</button>
        <button class="btn wide" id="home" type="button" data-i18n="home">Home</button>
        <button class="btn wide" id="closeSettings" type="button" data-i18n="close">Close</button>
        <span class="ver in-card" id="verSettings"></span>
      </div>
    </div>
  </div>
</div>

<!-- loading -> lobby, like the original's flow (studio splash, title with loading, then the lobby) -->
<div class="screen" id="lobby">
  <button class="gear lobby-gear" id="lobbyGear" type="button" aria-label="Settings" data-i18n-attr="aria-label:settings" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm8.6 4.9-1.9 1.1.2 2.2-2.1.9-1 2-2.2-.4-1.6 1.6-1.6-1.6-2.2.4-1-2-2.1-.9.2-2.2-1.9-1.1.7-2.1-.7-2.1 1.9-1.1-.2-2.2 2.1-.9 1-2 2.2.4L12 1.5l1.6 1.6 2.2-.4 1 2 2.1.9-.2 2.2 1.9 1.1-.7 2.1Z"/></svg>
  </button>
  <h1 class="logo" aria-label="Jellyblock - Puzzle Blast">
    <span class="logo-top" aria-hidden="true"><span class="lj l1">J</span><span class="lj l2">e</span><span class="lj l3">l</span><span class="lj l4">l</span><span class="lj l5">y</span><span class="lj l1">b</span><span class="lj l2">l</span><span class="lj l3">o</span><span class="lj l4">c</span><span class="lj l5">k</span></span>
    <span class="logo-en" aria-hidden="true"><span class="le e1">P</span><span class="le e2">U</span><span class="le e3">Z</span><span class="le e4">Z</span><span class="le e5">L</span><span class="le e1">E</span><span class="lgap"></span><span class="le w1">B</span><span class="le w2">L</span><span class="le w3">A</span><span class="le w4">S</span><span class="le w5">T</span></span>
  </h1>
  <div class="lobby-bottom">
    <div class="loading" id="loading" aria-live="polite">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="bar"><div class="fill" id="loadFill"></div></div>
      <span class="loadtxt" data-i18n="loading">Loading</span>
    </div>
    <button class="playbtn" id="play" type="button" data-ncq-main="PLAY 버튼" hidden>

  bumpScore(lines > 0);
  SFX.place(shape.cells.length);
  if (combo >= 2 && lines && !label) SFX.cheer(Math.min(5, combo));
  rings.push({ x: px, y: py, t: 0, ci: t.ci, big: lines > 0, lines });
  if (lines) sparks(px, py, 10 + lines * 6, t.ci);
  // every placement gives a light tap; clears shake the screen harder with more lines
  if (!lines) buzz("light");
  else shake(cell * (0.05 + 0.035 * lines + Math.min(0.06, combo * 0.008)));

  tray[slotIndex] = null;
  if (tray.every(x => !x)) deal();
  checkOver();
}

function checkOver() {
  const left = tray.filter(Boolean);
  if (left.length && !left.some(t => canPlaceAnywhere(t.shape))) {
    gameOver = true;
    roundEnd();
    if (score > best) { best = score; try { localStorage.setItem("jelly-best", String(best)); } catch (e) {} }
    setTimeout(() => {
      if (!gameOver) return;
      $("finalScore").textContent = fmtNum(score);
      $("finalBest").textContent = score >= best && score > 0 ? t("new_best") : t("best_n", { n: fmtNum(best) });
      $("over").hidden = false;
      $("best").textContent = fmtNum(best);
      SFX.over(); buzz("error");
    }, 700);
  }
}

/* ---------- HUD ---------- */
function bump(el) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
function bumpScore(big) { const el = $("score"); el.classList.toggle("big-hit", !!big); bump(el); if (score > best) $("best").textContent = fmtNum(score); }
function setCombo(pulse) {
  const el = $("combo");
  el.textContent = combo >= 2 ? t("combo_n", { n: combo }) : "";
  if (pulse && combo >= 2) bump(el);
}

/* ---------- input ---------- */
const DRAG_GAIN_Y = 0.53; // extra vertical travel: piece moves (1 + gain) x finger distance
function pt(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function updateSnap() {
  const s = drag.shape;
  const tlx = drag.tx - s.w * cell / 2, tly = drag.ty - s.h * cell / 2;
  const c0 = Math.round((tlx - bx) / cell), r0 = Math.round((tly - by) / cell);
  drag.r0 = r0; drag.c0 = c0;
  drag.valid = fits(s, r0, c0);
  drag.lines = drag.valid ? linesIf(s, r0, c0) : null;
}
cv.addEventListener("pointerdown", e => {
  ensureAudio();
  if (gameOver || drag || screen !== "game") return;
  const p = pt(e);
  for (let i = 0; i < 3; i++) {
    if (!tray[i]) continue;
    const h = slotHome(i);
    if (Math.abs(p.x - h.x) < bw / 6 + 4 && p.y > trayTop - cell * 0.4) {
      const s = tray[i].shape, sl = slots[i];
      // like the original: the piece pops up so its bottom edge floats just above the finger/cursor
      // measured from the original's footage: on grab the piece's bottom edge jumps ~0.9 cell
      // above the finger, then the piece moves 1.53x as far as the finger vertically
      const lift = s.h * cell / 2 + cell * 0.9;
      drag = {
        i, shape: s, ci: tray[i].ci, lift,
        x: sl.x, y: sl.y, vx: 0, vy: 0, tx: p.x, ty: p.y - lift, y0: p.y,
        sc: trayCell(s) / cell, vsc: 0, st: 0, ang: 0,
        jelly: { q: -0.3, vq: 0, ox: 0, oy: 0 },
        r0: 0, c0: 0, valid: false, lines: null, id: e.pointerId,
      };
      updateSnap();
      try { cv.setPointerCapture(e.pointerId); } catch (err) {}
      SFX.pick(); buzz("tap");
      e.preventDefault();
      return;
    }
  }
});
cv.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  const p = pt(e);
  drag.tx = p.x; drag.ty = p.y + (p.y - drag.y0) * DRAG_GAIN_Y - drag.lift;
  updateSnap();
});
function endDrag(e, cancel) {
  if (!drag || (e && e.pointerId !== drag.id)) return;
  const d = drag; drag = null;
  if (!cancel && d.valid) { place(d.i, d.r0, d.c0); return; }
  const sl = slots[d.i];
  sl.x = d.x; sl.y = d.y; sl.vx = d.vx * 0.3; sl.vy = d.vy * 0.3;
  sl.s = d.sc * cell / trayCell(d.shape); sl.vs = 0; sl.delay = 0;
  if (!cancel) SFX.bounce();
}
cv.addEventListener("pointerup", e => endDrag(e, false));
cv.addEventListener("pointercancel", e => endDrag(e, true));

/* ---------- physics ---------- */
function spring(o, key, vkey, target, k, d, h) {
  const a = -k * (o[key] - target) - d * o[vkey];
  o[vkey] += a * h; o[key] += o[vkey] * h;
}
function step(h) {
  const k = P.k, d = P.d;
  for (const p of pieces.values()) {
    spring(p, "q", "vq", 0, k, d, h);
    spring(p, "ox", "vox", 0, k * 0.8, d, h);
    spring(p, "oy", "voy", 0, k * 0.8, d, h);
  }
  slots.forEach((sl, i) => {
    if (sl.delay > 0) { sl.delay -= h; return; }
    const hm = slotHome(i);
    spring(sl, "s", "vs", 1, 260, 11, h);
    spring(sl, "x", "vx", hm.x, 240, 20, h);
    spring(sl, "y", "vy", hm.y, 240, 20, h);
  });
  spring(board, "oy", "vy", 0, 260, 13, h);
  spring(board, "q", "vq", 0, 220, 12, h);
  if (drag) {
    const f = P.follow;
    const kf = 1400 - f * 1100, df = 2 * Math.sqrt(kf) * (0.95 - f * 0.45);
    drag.vx += (-kf * (drag.x - drag.tx) - df * drag.vx) * h;
    drag.vy += (-kf * (drag.y - drag.ty) - df * drag.vy) * h;
    drag.x += drag.vx * h; drag.y += drag.vy * h;
    spring(drag, "sc", "vsc", 1, 300, 14, h);
    spring(drag.jelly, "q", "vq", 0, k, d, h);
    const sp = Math.hypot(drag.vx, drag.vy);
    const target = Math.min(0.26, sp * 0.00028 * (0.4 + f));
    drag.st += (target - drag.st) * Math.min(1, h * 12);
    if (sp > 40) drag.ang = Math.atan2(drag.vy, drag.vx);
  }
  for (const dd of dying) dd.t += h;
  for (const p of drops) {
    p.vy += cell * 24 * h; p.x += p.vx * h; p.y += p.vy * h; p.life -= h;
    if (p.y > H - p.r) { p.y = H - p.r; p.vy *= -0.35; p.vx *= 0.7; p.sq = 0.5; }
    p.sq *= Math.pow(0.002, h);
  }
  for (const p of pops) p.t += h;
  for (const b of beams) b.t += h;
  for (const r of rings) r.t += h;
  for (const p of drops) if (p.star) p.rot += h * 8;
  if (flashT > 0) flashT = Math.max(0, flashT - h);
  if (shakeT > 0) { shakeT = Math.max(0, shakeT - h); if (!shakeT) shakeAmp = 0; }
}

/* ---------- drawing ---------- */
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}
function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (shakeT > 0 && !reduceMotion) {
    const a = shakeAmp * (shakeT / 0.32);
    ctx.translate((Math.random() * 2 - 1) * a, (Math.random() * 2 - 1) * a * 0.7);
  }

  // board (it breathes when lines pop)
  ctx.save();
  const bq = board.q * 0.012;
  ctx.translate(bx + bw / 2, by + bw / 2 + board.oy * 0.15);
  ctx.scale(1 + bq, 1 - bq);
  ctx.translate(-(bx + bw / 2), -(by + bw / 2));
  const pad = cell * 0.28, br = cell * 0.7;
  rrect(bx - pad, by - pad + cell * 0.1, bw + pad * 2, bw + pad * 2, br);
  ctx.fillStyle = C.edge; ctx.fill();
  rrect(bx - pad, by - pad, bw + pad * 2, bw + pad * 2, br);
  ctx.fillStyle = C.board; ctx.fill();
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (grid[r][c]) continue;
    const s = cell * 0.83;
    rrect(bx + c * cell + (cell - s) / 2, by + r * cell + (cell - s) / 2, s, s, s * 0.3);
    ctx.fillStyle = C.well; ctx.fill();
  }

  // which lines would pop with the current drag
  const hot = new Set();
  if (drag && drag.valid && drag.lines) {
    drag.lines.rows.forEach(r => { for (let c = 0; c < N; c++) hot.add(r * N + c); });
    drag.lines.cols.forEach(c => { for (let r = 0; r < N; r++) hot.add(r * N + c); });
  }
  const pulse = 0.18 + 0.14 * Math.sin(T * 11);
  const hotTest = hot.size ? (r, c) => hot.has(r * N + c) : null;

  // placed jelly, one silhouette per connected part of each piece
  const items = [];
  for (const [pid, info] of cellsByPiece()) {
    for (const comp of comps(info.cells)) {
      const bb = bboxOf(comp);
      items.push({ comp, ci: info.ci, p: pieces.get(pid), ax: bx + (bb.c0 + bb.c1 + 1) / 2 * cell, ay: by + (bb.r1 + 1) * cell });
    }
  }
  for (const mode of ["shadow", "face"]) for (const it of items) {
    ctx.save();
    squash(it.ax, it.ay, it.p);
    drawPiece(mode, it.comp, it.ci, bx, by, cell, hotTest, pulse, drag && drag.ci);
    ctx.restore();
  }

  // ghost
  if (drag && drag.valid) {
    const s = drag.shape;
    for (const comp of s.comps) {
      const moved = comp.map(([r, c]) => [r + drag.r0, c + drag.c0]);
      drawPiece("face", moved, pale(drag.ci), bx, by, cell, hotTest, pulse, drag.ci);
    }
  }

  // lines that would clear get a glowing outline, as in the original
  if (drag && drag.valid && drag.lines && (drag.lines.rows.length || drag.lines.cols.length)) {
    const col = FLAVOURS[drag.ci];
    ctx.save();
    ctx.lineWidth = cell * 0.07;
    ctx.strokeStyle = `hsla(${col.h},${col.s}%,${Math.min(88, col.l + 14)}%,${0.65 + 0.3 * Math.sin(T * 9)})`;
    ctx.shadowColor = `hsl(${col.h},${col.s}%,${col.l}%)`;
    ctx.shadowBlur = cell * 0.4;
    for (const r of drag.lines.rows) { rrect(bx - 2, by + r * cell - 1, bw + 4, cell + 2, cell * 0.32); ctx.stroke(); }
    for (const c of drag.lines.cols) { rrect(bx + c * cell - 1, by - 2, cell + 2, bw + 4, cell * 0.32); ctx.stroke(); }
    ctx.restore();
  }

  // popping jelly
  for (const d of dying) {
    const cx = bx + (d.c + 0.5) * cell, cy = by + (d.r + 0.5) * cell;
    let sc = 1, fl = 0;
    if (d.t < 0) fl = 0.25;
    else if (d.t < 0.12) { const k = d.t / 0.12; sc = 1 + 0.24 * Math.sin(k * Math.PI / 2); fl = 0.25 + k * 0.45; }
    else { const k = Math.min(1, (d.t - 0.12) / 0.16); sc = 1.24 * (1 - k * k); fl = 0.7 * (1 - k); }
    if (d.t >= 0.12 && !d.burst) {
      d.burst = true;
      const n = reduceMotion ? 1 : 5;
      for (let i = 0; i < n; i++) {
        const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4;
        const sp = cell * (2.5 + Math.random() * 4.5);
        drops.push({ x: cx, y: cy + board.oy * 0.15, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: cell * (0.07 + Math.random() * 0.09), life: 0.7 + Math.random() * 0.35, ci: d.ci, sq: 0 });
      }
    }
    if (sc > 0.02) {
      ctx.save();
      ctx.translate(cx, cy); ctx.scale(sc * (1 + d.q * 0.7), sc * (1 - d.q)); ctx.translate(-cx, -cy);
      drawPiece("face", [[d.r, d.c]], d.ci, bx, by, cell, null, 0, null, fl);
      ctx.restore();
    }
  }
  ctx.restore();

  // light sweeping along each cleared line (rainbow on long streaks)
  for (const b of beams) {
    const k = b.t / 0.5, a = (1 - k) * (1 - k);
    const thick = cell * (0.7 + 0.6 * Math.sin(Math.min(1, k * 3) * Math.PI / 2));
    let x, y, w, h;
    if (b.k === "r") { x = bx - cell * 0.15; w = bw + cell * 0.3; h = thick; y = by + (b.i + 0.5) * cell - h / 2; }
    else { y = by - cell * 0.15; h = bw + cell * 0.3; w = thick; x = bx + (b.i + 0.5) * cell - w / 2; }
    const across = b.k === "r" ? ctx.createLinearGradient(0, y, 0, y + h) : ctx.createLinearGradient(x, 0, x + w, 0);
    if (b.rainbow) {
      const along = b.k === "r" ? ctx.createLinearGradient(x, 0, x + w, 0) : ctx.createLinearGradient(0, y, 0, y + h);
      for (let j = 0; j <= 6; j++) along.addColorStop(j / 6, `hsla(${(j * 55 + T * 240) % 360},95%,66%,${a * 0.8})`);
      rrect(x, y, w, h, Math.min(w, h) / 2); ctx.fillStyle = along; ctx.fill();
    }
    const col = FLAVOURS[b.ci];
    across.addColorStop(0, `hsla(${col.h},${col.s}%,${col.l}%,0)`);
    across.addColorStop(0.5, `rgba(255,255,255,${a * 0.9})`);
    across.addColorStop(1, `hsla(${col.h},${col.s}%,${col.l}%,0)`);
    rrect(x, y, w, h, Math.min(w, h) / 2); ctx.fillStyle = across; ctx.fill();
  }

  // tray
  for (let i = 0; i < 3; i++) {
    const t = tray[i]; if (!t || (drag && drag.i === i)) continue;
    const sl = slots[i]; if (sl.s <= 0.01) continue;
    const unit = trayCell(t.shape) * sl.s;
    const ci = canPlaceAnywhere(t.shape) ? t.ci : muted(t.ci);
    for (const mode of ["shadow", "face"]) drawShapeAt(mode, t.shape, ci, sl.x, sl.y, unit);
  }

  // droplets
  for (const p of drops) {
    if (p.life <= 0) continue;
    const col = FLAVOURS[p.ci];
    if (p.star) {
      ctx.save(); ctx.globalAlpha = Math.min(1, p.life * 3);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      const R = p.r * 1.6;
      ctx.beginPath();
      for (let j = 0; j < 8; j++) { const rr = j % 2 ? R * 0.35 : R; ctx.lineTo(Math.cos(j * Math.PI / 4) * rr, Math.sin(j * Math.PI / 4) * rr); }
      ctx.closePath();
      ctx.fillStyle = `hsl(${col.h},100%,${Math.min(95, col.l + 25)}%)`; ctx.fill();
      ctx.restore();
      continue;
    }
    ctx.save(); ctx.globalAlpha = Math.min(1, p.life * 2.2);
    ctx.translate(p.x, p.y); ctx.scale(1 + p.sq, 1 - p.sq * 0.6);
    const g = ctx.createRadialGradient(-p.r * 0.3, -p.r * 0.3, 0, 0, 0, p.r);
    g.addColorStop(0, `hsl(${col.h},${col.s}%,${Math.min(94, col.l + 18)}%)`);
    g.addColorStop(1, `hsl(${col.h},${col.s}%,${col.l - 8}%)`);
    ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
    ctx.beginPath(); ctx.arc(-p.r * 0.35, -p.r * 0.35, p.r * 0.28, 0, Math.PI * 2); ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.fill();
    ctx.restore();
  }

  // dragged piece: lags behind the finger and stretches along its motion
  if (drag) {
    const s = drag.shape, unit = cell * drag.sc;
    ctx.save();
    ctx.translate(drag.x, drag.y);
    ctx.rotate(drag.ang); ctx.scale(1 + drag.st, 1 - drag.st * 0.55); ctx.rotate(-drag.ang);
    ctx.save(); ctx.translate(0, cell * 0.2);
    drawShapeAt("shadow", s, drag.ci, 0, 0, unit);
    ctx.restore();
    drawShapeAt("face", s, drag.ci, 0, 0, unit, drag.jelly);
    ctx.restore();
  }

  // NCQ_TEST_DIFFICULTY: 난이도 표시 (테스트 빌드에서 지금 난이도를 화면 왼쪽 아래에 보여 줘요)
  if (window.NCQ_TEST_DIFFICULTY || DEBUG_DIFF) {
    ctx.save();
    ctx.font = `12px "Gowun Dodum", sans-serif`; ctx.fillStyle = "rgba(58,47,82,.65)";
    ctx.fillText(t("debug_difficulty", { d: (lastDifficulty * 100).toFixed(0), n: dealNo }), bx, H - 6);
    ctx.restore();
  }

  // theme change wash
  if (flashT > 0) {
    const fc = FLAVOURS[flashCi];
    ctx.fillStyle = `hsla(${fc.h},${fc.s}%,${Math.min(90, fc.l + 12)}%,${Math.min(0.45, flashT * 0.6)})`;
    ctx.fillRect(0, 0, W, H);
  }

  // shockwave rings from where the piece landed
  for (const r of rings) {
    const life = r.big ? 0.55 : 0.32, k = r.t / life, col = FLAVOURS[r.ci];
    const R = cell * (r.big ? 0.6 + k * (3 + r.lines) : 0.5 + k * 1.4);
    ctx.save();
    ctx.globalAlpha = (1 - k) * (r.big ? 0.9 : 0.55);
    ctx.lineWidth = cell * (r.big ? 0.28 : 0.14) * (1 - k) + 1;
    ctx.strokeStyle = r.big ? "#ffffff" : `hsl(${col.h},${col.s}%,${Math.min(92, col.l + 18)}%)`;
    ctx.beginPath(); ctx.arc(r.x, r.y, R, 0, Math.PI * 2); ctx.stroke();
    if (r.big) {
      ctx.lineWidth = cell * 0.1 * (1 - k) + 0.5;
      ctx.strokeStyle = `hsl(${col.h},${col.s}%,${col.l}%)`;
      ctx.beginPath(); ctx.arc(r.x, r.y, R * 0.72, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }

  // popups
  for (const p of pops) {
    if (p.t < 0) continue;
    const k = Math.min(1, p.t / 1.05);
    const rise = 1 - Math.pow(1 - k, 3);
    const sc = p.t < 0.3 ? 0.55 + 0.6 * Math.sin((p.t / 0.3) * Math.PI * 0.75) : 1;
    const col = FLAVOURS[p.ci];
    ctx.save();
    ctx.globalAlpha = k > 0.7 ? 1 - (k - 0.7) / 0.3 : 1;
    ctx.translate(p.x, p.y - rise * cell * 1.3);
    ctx.scale(sc * 1.08, sc * 0.94);
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
    if (p.big) {
      // candy lettering: chunky face, deep outline, white inner rim, glossy gradient fill
      ctx.font = `${Math.round(p.size)}px "Lilita One", Jua, sans-serif`;
      const w = ctx.measureText(p.text).width;
      const fit = Math.min(1, (bw * 0.92) / (w + p.size * 0.4));
      ctx.rotate(p.rot || 0);
      ctx.scale(fit, fit);
      const hh = p.size * 0.5;
      ctx.lineWidth = p.size * 0.3; ctx.strokeStyle = `hsl(${col.h},${col.s}%,${col.l - 38}%)`;
      ctx.strokeText(p.text, 0, p.size * 0.06);
      ctx.strokeText(p.text, 0, 0);
      ctx.lineWidth = p.size * 0.13; ctx.strokeStyle = "#ffffff";
      ctx.strokeText(p.text, 0, 0);
      const g = ctx.createLinearGradient(0, -hh, 0, hh);
      g.addColorStop(0, `hsl(${col.h},${col.s}%,${Math.min(90, col.l + 18)}%)`);
      g.addColorStop(0.5, `hsl(${col.h},${col.s}%,${col.l}%)`);
      g.addColorStop(1, `hsl(${col.h},${col.s}%,${col.l - 16}%)`);
      ctx.fillStyle = g;
      ctx.fillText(p.text, 0, 0);
      ctx.save();
      ctx.beginPath(); ctx.rect(-w, -hh, w * 2, hh * 0.8); ctx.clip();
      ctx.fillStyle = "rgba(255,255,255,0.35)";
      ctx.fillText(p.text, 0, 0);
      ctx.restore();
    } else {
      ctx.font = `${Math.round(p.size)}px Jua, "Gowun Dodum", sans-serif`;
      ctx.lineWidth = p.size * 0.2; ctx.strokeStyle = "#ffffff";
      ctx.strokeText(p.text, 0, 0);
      ctx.fillStyle = `hsl(${col.h},${col.s}%,${col.l - 22}%)`;
      ctx.fillText(p.text, 0, 0);
    }
    ctx.restore();
  }
}

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  const sub = 4, h = dt / sub;
  // hit-stop: freeze the simulation for a few frames on a clear so the hit lands
  if (hitStop > 0) hitStop = Math.max(0, hitStop - dt);
  else for (let i = 0; i < sub; i++) { T += h; step(h); }
  for (let i = impulses.length - 1; i >= 0; i--) {
    const im = impulses[i];
    if (im.at <= T) {
      if (im.piece) {
        im.piece.vq += im.v;
        im.piece.vox += im.dx * im.v * cell * 0.25;
        im.piece.voy += im.dy * im.v * cell * 0.25;
      }
      impulses.splice(i, 1);
    }
  }
  dying = dying.filter(d => d.t < 0.3);
  drops = drops.filter(p => p.life > 0);
  pops = pops.filter(p => p.t < 1.05);
  beams = beams.filter(b => b.t < 0.5);
  rings = rings.filter(r => r.t < (r.big ? 0.55 : 0.32));
  if (shownScore !== score) {
    shownScore += Math.max(1, Math.ceil((score - shownScore) * 0.18));
    if (shownScore > score) shownScore = score;
    $("score").textContent = fmtNum(shownScore);
  }
  render();
  requestAnimationFrame(frame);
}

/* ---------- controls ---------- */
function syncTuneUI() {
  for (const id of ["sound", "bgm"]) $(id).setAttribute("aria-pressed", String(!!P[id]));
  $("vibe").setAttribute("aria-pressed", String(vibrationOn()));
  // where there is no vibration motor (iPhone browser, computers) the vibration controls are hidden
  const canVib = !!(window.NcqDevice && NcqDevice.canVibrate());
  $("vibe").hidden = !canVib;
  document.querySelector(".row.vib").hidden = !canVib;
  $("vibeLv").value = P.vibeLv || 2;
  $("vibeLvOut").textContent = t(["", "vib_low", "vib_mid", "vib_high"][P.vibeLv || 2]);
  $("vibeLv").disabled = !vibrationOn();
}
$("gear").addEventListener("click", () => { ensureAudio(); openSettings(); });
$("closeSettings").addEventListener("click", () => { $("settings").hidden = true; });
$("vibe").addEventListener("click", () => { if (window.NcqDevice) NcqDevice.vibration(!vibrationOn()); syncTuneUI(); buzz("tap"); });
$("bgm").addEventListener("click", () => { P.bgm = !P.bgm; saveTune(); syncTuneUI(); if (P.bgm) { ensureAudio(); startBgm(); } else stopBgm(); });
$("vibeLv").addEventListener("input", e => { P.vibeLv = +e.target.value; saveTune(); syncTuneUI(); buzz("medium"); });
$("home").addEventListener("click", () => { $("settings").hidden = true; showLobby(false); });
$("lobbyGear").addEventListener("click", () => { ensureAudio(); openSettings(); });
$("play").addEventListener("click", () => {
  ensureAudio(); startBgm(); buzz("tap");
  SFX.start();
  if (gameOver) newGame(false);
  screen = "game";
  roundStart();
  const lob = $("lobby");
  lob.classList.add("leaving");
  setTimeout(() => { lob.hidden = true; lob.classList.remove("leaving"); }, 450);
});

/* ---------- app version: the build puts it in window.NCQ, during development it is "dev" ---------- */
{
  const version = window.NCQ?.NCQ_VERSION;
  $("verLobby").textContent = $("verSettings").textContent = version ? "v" + version : "dev";
}

/* ---------- round metrics: one endless round per game ---------- */
const NcqMetrics = window.NcqMetrics || { levelStart() {}, levelEnd() {} };
let roundOpen = false;
function roundStart() { if (roundOpen) return; roundOpen = true; NcqMetrics.levelStart("endless"); }
function roundEnd() { if (!roundOpen) return; roundOpen = false; NcqMetrics.levelEnd("endless", undefined, { score }); }

/* ---------- screens ---------- */
function renderLanguages() {
  // menu title also says "Language" in English when another language is on, so anyone can find their way back
  $("langTitle").textContent = NcqLang.lang === "en" ? t("language") : t("language") + " · Language";
  const box = $("langList");
  box.textContent = "";
  for (const l of NcqLang.list()) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = l.name; b.lang = l.code;
    b.setAttribute("aria-pressed", String(l.current));
    b.addEventListener("click", () => { if (!l.current) { NcqLang.set(l.code); SFX.tap(); buzz("tap"); } });
    box.appendChild(b);
  }
}
NcqLang.onChange(() => {
  renderLanguages(); syncTuneUI(); setCombo(false);
  if (!$("over").hidden) $("finalBest").textContent = score >= best && score > 0 ? t("new_best") : t("best_n", { n: fmtNum(best) });
  $("score").textContent = fmtNum(shownScore); $("best").textContent = fmtNum(Math.max(best, score));
});
function openSettings() {
  renderLanguages();
  const inGame = screen === "game";
  $("restart").hidden = !inGame; $("home").hidden = !inGame;
  $("settings").hidden = false;
}
function showLobby(loading, delay = 0) {
  screen = "lobby";
  const lob = $("lobby");
  lob.hidden = false; lob.classList.remove("leaving");
  $("lobbyGear").hidden = loading;
  $("loading").hidden = !loading;
  $("play").hidden = loading;
  if (loading) {
    const fill = $("loadFill"), t0 = performance.now() + delay, dur = reduceMotion ? 500 : 1500;
    fill.style.width = "0%";
    const tick = now => {
      const k = Math.max(0, Math.min(1, (now - t0) / dur));
      fill.style.width = (100 * (1 - Math.pow(1 - k, 2))).toFixed(1) + "%";
      if (k < 1) requestAnimationFrame(tick);
      else setTimeout(() => showLobby(false), 180);
    };
    requestAnimationFrame(tick);
  }
}
function boot(skipIntro) {
  if (skipIntro) { $("splash").hidden = true; $("lobby").hidden = true; screen = "game"; roundStart(); return; }
  // studio splash, then the title with a loading bar, then the lobby with PLAY
  const splashMs = reduceMotion ? 300 : 1100;
  showLobby(true, splashMs);
  const sp = $("splash");
  sp.hidden = false;
  setTimeout(() => { sp.classList.add("leaving"); setTimeout(() => { sp.hidden = true; sp.classList.remove("leaving"); }, 450); }, splashMs);
}

/* ---------- background music: a composed music-box loop ----------
   C - Am - F - G, two bars each, 112 BPM in eighth notes. Notes are booked ahead on the
   audio clock (not on timers), so the rhythm stays steady even while the game is busy. */
const BGM_STEP = 60 / 112 / 2;
const C3 = 130.81, C4 = 261.63, C5 = 523.25;
const _ = null;
const BGM_CHORDS = [ // bass root from C3, soft chord tones from C4
  { root: 0,  pad: [4, 7] },  // C
  { root: -3, pad: [0, 4] },  // Am
  { root: -7, pad: [5, 9] },  // F
  { root: -5, pad: [2, 7] },  // G
];
const BGM_A = [ // melody, semitones from C5, one entry per eighth note (8 per bar)
  4, _, 7, _, 12, _, 7, _,    9, 7, 4, _, 2, _, 4, _,
  9, _, 12, _, 16, _, 12, _,  14, 12, 9, _, 7, _, 9, _,
  5, _, 9, _, 12, _, 9, _,    14, 12, 9, _, 12, _, 14, _,
  11, _, 14, _, 19, _, 14, _, 12, 11, 9, _, 7, _, _, _,
];
const BGM_B = [
  4, _, 7, _, 12, _, 14, _,   16, 14, 12, _, 7, _, 9, _,
  12, _, 9, _, 4, _, 9, _,    12, 14, 12, _, 9, _, 7, _,
  9, _, 12, _, 17, _, 16, _,  14, _, 12, _, 9, _, 12, _,
  14, _, 11, _, 7, _, 11, _,  14, _, 12, _, 11, _, 7, _,
];
let bgm = null, bgmOut = null;
function bgmBus() {
  if (bgmOut) return bgmOut;
  // music bus: soft low-pass and a little echo so the box sounds like it is in a room
  bgmOut = ac.createGain(); bgmOut.gain.value = 0.0001;
  const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 4800;
  const dl = ac.createDelay(1); dl.delayTime.value = BGM_STEP * 3;
  const fb = ac.createGain(); fb.gain.value = 0.25;
  const wet = ac.createGain(); wet.gain.value = 0.2;
  bgmOut.connect(lp); lp.connect(ac.destination);
  lp.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(ac.destination);
  return bgmOut;
}
function voice(f, t, vol, dur, kind) {
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + (kind === "bass" ? 0.02 : 0.006));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  g.connect(bgmOut);
  // music box = pure tone + a quiet octave; bass = round tone + its 2nd harmonic
  for (const [mul, v] of kind === "bass" ? [[1, 1], [2, 0.35]] : [[1, 1], [2, 0.18], [3, 0.05]]) {
    const o = ac.createOscillator(), og = ac.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(f * mul, t); og.gain.value = v;
    o.connect(og); og.connect(g); o.start(t); o.stop(t + dur + 0.05);
  }
}
function bgmNoteAt(step, t) {
  const phrase = step < 64 ? BGM_A : BGM_B, i = step % 64, inBar = i % 8;
  const ch = BGM_CHORDS[i >> 4];
  const m = phrase[i];
  if (m !== null) voice(C5 * Math.pow(2, m / 12), t, 0.07, 0.75, "box");
  if (inBar === 2 || inBar === 6) for (const tn of ch.pad) voice(C4 * Math.pow(2, tn / 12), t, 0.02, 0.5, "box");
  if (inBar === 0 || inBar === 4) voice(C3 * Math.pow(2, ch.root / 12), t, inBar === 0 ? 0.11 : 0.07, 0.5, "bass");
}
function startBgm() {
  if (!P.bgm || !ac || bgm) return;
  const out = bgmBus(), now = ac.currentTime;
  out.gain.cancelScheduledValues(now);
  out.gain.setValueAtTime(Math.max(0.0001, out.gain.value), now);
  out.gain.setTargetAtTime(0.9, now, 0.4);   // fade in
  bgm = { step: 0, at: now + 0.12 };
  bgm.timer = setInterval(() => {
    if (!bgm || ac.state !== "running" || document.hidden) return;
    if (bgm.at < ac.currentTime) bgm.at = ac.currentTime + 0.05;   // came back from a pause: don't rush to catch up
    while (bgm.at < ac.currentTime + 0.2) {
      bgmNoteAt(bgm.step, bgm.at);
      bgm.at += BGM_STEP;
      bgm.step = (bgm.step + 1) % 128;
    }
  }, 30);
}
function stopBgm() {
  if (!bgm) return;
  clearInterval(bgm.timer); bgm = null;
  if (bgmOut) { const now = ac.currentTime; bgmOut.gain.cancelScheduledValues(now); bgmOut.gain.setTargetAtTime(0.0001, now, 0.12); }
}
// sound stops while the app is in the background and comes back with it
document.addEventListener("visibilitychange", () => {
  if (!ac) return;
  if (document.hidden) ac.suspend().catch(() => {});
  else if (P.sound || P.bgm) ac.resume().catch(() => {});
});
$("sound").addEventListener("click", () => { P.sound = !P.sound; saveTune(); syncTuneUI(); if (P.sound) { ensureAudio(); SFX.tap(); } });
$("restart").addEventListener("click", () => { ensureAudio(); $("settings").hidden = true; newGame(true); SFX.start(); });
$("again").addEventListener("click", () => { ensureAudio(); newGame(true); });

/* ---------- boot (keeps the game when the page is updated) ---------- */
function snapshot() {
  return {
    v: 2,
    grid: grid.map(row => row.map(c => (c ? [c.ci, c.pid] : 0))),
    tray: tray.map(t => (t ? [t.shape.i, t.ci] : 0)),
    score, best, combo, sinceClear, pidSeq, screen,
  };
}
function start(data) {
  layout();
  newGame(false);
  if (data && data.grid) {
    try {
      grid = data.grid.map(row => row.map(c => (c ? { ci: c[0], pid: c[1] } : null)));
      pieces = new Map();
      for (const row of grid) for (const c of row) if (c && !pieces.has(c.pid)) pieces.set(c.pid, newPiece(0.2));
      tray = data.tray.map(t => (t ? { shape: SHAPES[t[0]], ci: t[1] } : null));
      score = shownScore = data.score || 0; best = Math.max(best, data.best || 0);
      combo = data.combo || 0; sinceClear = data.sinceClear || 0; pidSeq = data.pidSeq || 0;
      let ti = 0;
      while (ti + 1 < THEMES.length && score >= THEMES[ti + 1].at) ti++;
      setTheme(ti, false);
      if (score > bestAtStart) bestCelebrated = true;
      $("score").textContent = fmtNum(score);
      if (tray.every(x => !x)) deal();
      setCombo(false); checkOver();
    } catch (e) { newGame(false); }
  }
  $("best").textContent = fmtNum(best);
  syncTuneUI();
  boot(!!(data && data.screen === "game"));
  window.claude?.hot?.snapshot?.(snapshot);
  new ResizeObserver(layout).observe(stage);
  requestAnimationFrame(t => { last = t; frame(t); });
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
