<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:#04512a;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:#fff}
body{background:radial-gradient(ellipse 75% 55% at 50% 45%,#0fb35a 0%,#079246 38%,#056b33 75%,#04512a 100%) fixed;display:flex;align-items:center;justify-content:center;padding:var(--ncq-top,0px) var(--ncq-right,0px) var(--ncq-bottom,0px) var(--ncq-left,0px)}
#app{position:relative;width:min(580px,calc(100vw - var(--ncq-left,0px) - var(--ncq-right,0px)),calc((100dvh - var(--ncq-top,0px) - var(--ncq-bottom,0px)) * 9 / 16));   /* 게임 영역 최대 가로 580px */
  aspect-ratio:9/16;container-type:size;overflow:visible;
  background:transparent}
/* 게임 영역 밖(화면 비율이 9:16과 다를 때)도 같은 천 질감 */
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;
  background-image:radial-gradient(rgba(0,0,0,.35) 1px,transparent 1px);background-size:3px 3px}
#app::before{content:none;position:absolute;inset:0;pointer-events:none;opacity:.18;
  background-image:radial-gradient(rgba(0,0,0,.35) 1px,transparent 1px);background-size:3px 3px}
.abs{position:absolute}
/* 화면 가로 끝까지 이어지는 띠 (상단 블록·메시지 바·손패 칸) — JS가 위치를 맞춰요 */
.band{position:fixed;left:0;right:0;pointer-events:none;z-index:0}
#bandTop{background:#065c2e;border-bottom:.3cqw solid rgba(255,255,255,.85);box-shadow:0 .6cqw 1.2cqw rgba(0,0,0,.25)}
#bandMsg{display:none}   /* 메시지 띠는 내 프로필과 이어져 내 정보처럼 보여서 없앰 */
#dimAll{position:fixed;z-index:1;pointer-events:none;background:transparent;opacity:0;transition:opacity .2s linear;box-shadow:0 0 0 200vmax #000}   /* 게임 영역(구멍) 밖만 */
#app{z-index:2}
#bandTitle{display:none;box-shadow:0 -.4cqw 0 rgba(255,255,255,.12);background:radial-gradient(ellipse 60% 70% at 50% 0%,#14bb60 0%,#0a9a4b 45%,#077a3a 100%);bottom:0}
body.on-title{background:linear-gradient(180deg,#0a6a35 0%,#05502a 100%)}
body.on-title #bandTop,body.on-title #bandMsg,body.on-title #bandHand{display:none}
body.on-title #bandTitle{display:block}
body.on-title::before{display:none}
body.on-title #app > :not(#title):not(.modal):not(.toast){visibility:hidden}
#bandHand{bottom:0;background:rgba(0,0,0,.14);border-top:.3cqw solid rgba(255,255,255,.85)}
/* 상단 */
#top{left:0;right:0;top:0;height:16cqw;z-index:14;background:#065c2e}   /* 상단 UI 블록: 패가 이 아래에서 나오고 들어감 */
.circBtn{position:absolute;top:2.5cqw;width:11cqw;height:11cqw;border-radius:50%;background:rgba(0,40,18,.55);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s}
.circBtn:active{transform:scale(.9)}
.circBtn svg{width:6.6cqw;height:6.6cqw;fill:#fff}
#btnHome{left:2.5cqw}#btnSet{right:2.5cqw}
.score{position:absolute;top:2cqw;width:20cqw;text-align:center;font-weight:700}
.score .lb{font-size:4cqw;opacity:.95;white-space:nowrap}.score .v{font-size:5.6cqw;line-height:1.15}
#scP{left:17.5cqw}#scA{right:17.5cqw}
#target{position:absolute;top:2cqw;left:50%;transform:translateX(-50%);text-align:center;font-weight:800}
#target .t{font-size:6.2cqw;color:#ffe94a;line-height:1.05;text-shadow:0 .3cqw .6cqw rgba(0,0,0,.25)}
#target .r{font-size:3.4cqw;font-weight:700}
/* 상대 자리 (위·왼쪽·오른쪽) */
.seat .backs{position:absolute;display:flex;z-index:4}
.seat .back{transition:width .35s ease,height .35s ease,margin .35s ease,opacity .25s;flex:0 0 auto;border-radius:1.6cqw;background:var(--skin-back);box-shadow:0 .4cqw .8cqw rgba(0,0,0,.3)}
.seat .avatar{position:absolute;z-index:4;width:10.8cqw;height:10.8cqw}   /* 상대 프로필은 내 것의 90% */
.seat .tag{position:absolute;z-index:5;width:20cqw;text-align:center;font-size:3.2cqw;font-weight:800;line-height:1.25;text-shadow:0 .3cqw .5cqw rgba(0,0,0,.4)}
.seat .tag .nm{display:block;white-space:nowrap;font-size:2.8cqw;letter-spacing:-.05cqw}
.seat .tag b{display:block;font-size:4.4cqw;color:#ffe94a;line-height:1.1}
/* 위 상대 패: 선 아래로 걸쳐 아랫부분(두께 포함)만 보이게 */
.seat-top .backs{left:10cqw;right:10cqw;top:16.3cqw;height:7.6cqw;justify-content:center;align-items:flex-end;gap:1cqw;overflow:hidden;padding-bottom:1.8cqw}
.seat-top .back{height:10.8cqw;box-shadow:0 .9cqw 0 var(--skin-back-side),0 1.3cqw 1cqw rgba(0,0,0,.28)}
.seat-top .backs.reveal{height:16cqw;overflow:visible;z-index:6;align-items:flex-start;padding-bottom:0}
.seat-top .avatar{right:3.4cqw;top:15.6cqw;z-index:15!important}
.seat-top .avatar.active{z-index:15!important}   /* 차례일 때도 블록 위 */   /* 상단 UI 블록 경계에 걸쳐 블록 위에 그려짐 */
.seat-top .tag{right:-1.2cqw;z-index:16;top:26.7cqw;width:20cqw}
.seat-top .tag b{font-size:4cqw}
.seat-left .avatar{left:3.4cqw;top:37.5cqw}.seat-right .avatar{right:3.4cqw;top:37.5cqw}   /* 커지고 타이머 고리가 붙어도 화면 안에 */
.seat-left .tag{left:-1.2cqw;top:48.9cqw}.seat-right .tag{right:-1.2cqw;top:48.9cqw}
.seat-left .backs,.seat-right .backs{top:59.5cqw;width:10.8cqw;flex-direction:column;gap:1cqw}
/* 양옆 상대 패: 화면 바깥쪽으로 절반쯤 잘려 보이게 */
.seat-left .backs{left:-2cqw}.seat-right .backs{right:-2cqw}   /* 패 안쪽 끝이 프로필 가운데에 오게 */
.seat-left .back,.seat-right .back{width:10.8cqw;height:5.4cqw;background:var(--skin-back-h);box-shadow:0 .9cqw 0 var(--skin-back-side),0 1.3cqw 1cqw rgba(0,0,0,.28)}
.seat .backs.reveal svg{flex:0 0 auto;filter:drop-shadow(0 .4cqw .6cqw rgba(0,0,0,.35))}
.seat-left .backs.reveal svg+svg,.seat-right .backs.reveal svg+svg{margin-top:-1.2cqw}
#topLine{left:0;right:0;top:16cqw;height:.3cqw;background:rgba(255,255,255,.85);z-index:14}
#cheat{position:absolute;right:2.4cqw;top:104cqw;z-index:6;display:flex;flex-direction:column;gap:1.4cqw}
#cheat[hidden],#app.resulting #cheat{display:none}
#cheat button{border:.4cqw dashed rgba(255,255,255,.6);border-radius:2cqw;padding:1cqw 2.2cqw;font-size:3cqw;font-weight:800;color:#fff;cursor:pointer;background:rgba(0,0,0,.35)}
#cheat button[data-r=win]{color:#ffe94a}#cheat button[data-r=lose]{color:#ff9a94}
#bone{left:2.8cqw;top:18cqw;width:9cqw;height:13cqw;border-radius:2cqw;background:rgba(0,40,18,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;z-index:4;transition:transform .15s}
#bone svg{width:6.4cqw;height:6cqw}
#bone b{font-size:4cqw;line-height:1.1}
#bone.pulse{box-shadow:0 0 0 .8cqw #ffe94a;animation:glow 1s infinite}
@keyframes glow{50%{box-shadow:0 0 0 .8cqw #ffe94a,0 0 3cqw 1cqw rgba(255,233,74,.6)}}
#bone.empty{opacity:.45}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.avatar{width:12cqw;height:12cqw;border-radius:50%;overflow:hidden;border:.6cqw solid rgba(255,255,255,.85);box-shadow:0 .5cqw 1cqw rgba(0,0,0,.35);background:#2bb7d6;transition:box-shadow .2s}
.avatar{transition:box-shadow .2s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.avatar.active{box-shadow:0 0 0 .8cqw #ffe94a,0 .5cqw 1cqw rgba(0,0,0,.35);transform:scale(1.2);z-index:6!important}
#avP{left:3.4cqw;top:121cqw;width:13cqw;height:13cqw;background:#2a3b46;z-index:3}
/* 보드 */
#board{left:2cqw;right:2cqw;top:32cqw;height:83cqw;z-index:1}   /* 패 z-index가 보드 안에서만 쓰이게 */
#app.sides #board{left:14cqw;right:14cqw}
.tile{position:absolute;transition:left .38s cubic-bezier(.2,.8,.3,1),top .38s cubic-bezier(.2,.8,.3,1),width .38s,height .38s;filter:drop-shadow(0 .35cqw .5cqw rgba(0,0,0,.35))}
.tile svg{width:100%;height:100%;display:block}
.tile.new{animation:land .5s cubic-bezier(.3,.7,.4,1)}
.tile.fly{z-index:950!important}   /* 날아오는 동안만 맨 위, 닿기 직전 제 순서로 */
/* 집어 든 상태(크고 그림자 멀리) → 내려와 살짝 눌리며 바닥에 닿음 */
/* 살짝 떠 있던 패가 부드럽게 내려앉음 (내 패·상대 패 동일) */
@keyframes land{0%{transform:scale(1.12);filter:drop-shadow(0 3.5cqw 2.6cqw rgba(0,0,0,.4))}
  72%{transform:scale(1.01);filter:drop-shadow(0 .6cqw .8cqw rgba(0,0,0,.42))}
  86%{transform:scale(.985);filter:drop-shadow(0 .2cqw .3cqw rgba(0,0,0,.5))}
  100%{transform:scale(1);filter:drop-shadow(0 .35cqw .5cqw rgba(0,0,0,.35))}}
.tile.new.lift{animation:lift .52s cubic-bezier(.3,.7,.4,1)}
@keyframes lift{0%{transform:scale(1);filter:drop-shadow(0 .5cqw .6cqw rgba(0,0,0,.35))}
  35%{transform:scale(1.16);filter:drop-shadow(0 4cqw 3cqw rgba(0,0,0,.4))}
  72%{transform:scale(1.04);filter:drop-shadow(0 1.2cqw 1.2cqw rgba(0,0,0,.42))}
  86%{transform:scale(.985);filter:drop-shadow(0 .2cqw .3cqw rgba(0,0,0,.5))}
  100%{transform:scale(1);filter:drop-shadow(0 .35cqw .5cqw rgba(0,0,0,.35))}}
.tile.new.soft{animation:soft .32s cubic-bezier(.3,.7,.4,1)}
@keyframes soft{0%{transform:scale(1.06);filter:drop-shadow(0 1.6cqw 1.4cqw rgba(0,0,0,.38))}
  75%{transform:scale(.99);filter:drop-shadow(0 .2cqw .3cqw rgba(0,0,0,.48))}
  100%{transform:scale(1);filter:drop-shadow(0 .35cqw .5cqw rgba(0,0,0,.35))}}
.ripple{position:absolute;border-radius:2cqw;border:.7cqw solid rgba(255,255,255,.55);pointer-events:none;animation:ripple .45s ease-out forwards;z-index:0}
@keyframes ripple{0%{opacity:.6;transform:scale(.97)}100%{opacity:0;transform:scale(1.18)}}
.ghost.hot{background:rgba(255,233,74,.5);border-style:solid;animation:none;opacity:1;transform:scale(1.06)}
.dragTile{position:absolute;left:0;top:0;width:0;height:0;z-index:20;pointer-events:none;will-change:transform}
.dragTile .dti{position:absolute;left:0;top:0;transform:translate(-50%,-50%);
  transition:transform .45s cubic-bezier(.33,.9,.4,1.08),width .45s cubic-bezier(.33,.9,.4,1),height .45s cubic-bezier(.33,.9,.4,1),filter .3s;
  filter:drop-shadow(0 4.5cqw 3cqw rgba(0,0,0,.42))}
.dragTile .dti.snap{filter:drop-shadow(0 2.4cqw 1.8cqw rgba(0,0,0,.4))}
.dragTile .dti svg{width:100%;height:100%;display:block}
.dragTile.back{transition:transform .26s cubic-bezier(.3,.7,.4,1)}
.dragTile.back .dti{filter:drop-shadow(0 .5cqw .6cqw rgba(0,0,0,.4))}
.htile.lifted{opacity:.22;transform:none!important}
.ghost{position:absolute;border:.6cqw dashed #ffe94a;border-radius:1.5cqw;background:rgba(255,233,74,.22);cursor:pointer;animation:gl 1s infinite;z-index:900}
@keyframes gl{0%,100%{opacity:.6}50%{opacity:1}}
/* 메시지 바 */
#msgBar{left:0;right:0;top:122cqw;height:11cqw;display:flex;align-items:center;justify-content:center;
  border-top:.25cqw solid transparent;border-bottom:.25cqw solid transparent}
#msg{font-size:4.6cqw;line-height:1.2;font-weight:600;text-align:center;padding:0 20cqw;width:100%;word-break:keep-all;   /* 화면 가운데 정렬 (양쪽을 같게 비워 왼쪽 프로필·타이머와 겹치지 않게) */text-shadow:0 .3cqw .6cqw rgba(0,0,0,.3)}
/* 더미 선택 팝업 */
#mDraw{background:rgba(0,0,0,.45);z-index:17}   /* 타이머(19)는 더미 팝업 위, 설정·결과 창(20) 아래 */
.drawBox{width:94cqw;animation:pop .28s ease-out}
.drawTitle{text-align:center;font-size:5.4cqw;font-weight:800;margin-bottom:2.6cqw;text-shadow:0 .4cqw .8cqw rgba(0,0,0,.5)}
.drawTitle small{display:block;font-size:3.6cqw;font-weight:600;opacity:.85;margin-top:.6cqw}
.wood{border-radius:6cqw;padding:2.4cqw;
  background:linear-gradient(135deg,#c97a45,#8a4522 30%,#b9693a 55%,#7a3a1c 80%,#a85a30);
  box-shadow:0 2cqw 5cqw rgba(0,0,0,.6),inset 0 .4cqw .4cqw rgba(255,210,170,.35)}
.slots{border-radius:4.4cqw;padding:4cqw 3cqw;display:grid;grid-template-columns:repeat(7,1fr);gap:3cqw 2cqw;
  background:repeating-linear-gradient(176deg,rgba(255,255,255,.025) 0 .5cqw,transparent .5cqw 2.2cqw),
    repeating-linear-gradient(181deg,rgba(0,0,0,.18) 0 .3cqw,transparent .3cqw 3.4cqw),
    linear-gradient(180deg,#2a1c15,#1a110c 60%,#22160f);
  box-shadow:inset 0 1cqw 2cqw rgba(0,0,0,.7),inset 0 0 0 .4cqw rgba(0,0,0,.4)}
.slot{aspect-ratio:1/2;perspective:60cqw}
.slots{--d:2.64cqw;--hw:5cqw;--hh:10cqw}
.slot{filter:drop-shadow(0 1.2cqw 1.2cqw rgba(0,0,0,.5))}
.hintBtn{display:flex;align-items:center;justify-content:center;gap:1.6cqw;margin:3.4cqw auto 0;padding:2.4cqw 6cqw;border:none;border-radius:6cqw;cursor:pointer;
  background:linear-gradient(180deg,#fff36a,#f2c21b);color:#3a2c00;font-size:4.4cqw;font-weight:900;box-shadow:0 1cqw 0 #b8901a,0 1.6cqw 2.4cqw rgba(0,0,0,.4)}
.hintBtn:active{transform:translateY(.6cqw);box-shadow:0 .4cqw 0 #b8901a}
.hintBtn small{font-size:3cqw;font-weight:800;padding:.3cqw 1.8cqw;border-radius:3cqw;background:#3a2c00;color:#ffe94a}
.hintBtn[disabled]{background:linear-gradient(180deg,#e9e3c0,#cfc59a);color:#6a5a20;box-shadow:0 1cqw 0 #9c8e5a,0 1.6cqw 2.4cqw rgba(0,0,0,.4);cursor:default}
.hintBtn .bulb{font-size:4.8cqw;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
/* 힌트: 낼 수 있는 패가 든 자리만 빛나게 (눈은 보여 주지 않음) */
.slot.hint{position:relative;z-index:3}
.slot.hint::after{content:"";position:absolute;inset:-1.3cqw;border-radius:2.6cqw;border:.9cqw solid #ffe94a;box-shadow:0 0 3.4cqw 1cqw #ffe94a,inset 0 0 1.6cqw rgba(255,233,74,.6);animation:hintGlow 1s ease-in-out infinite;pointer-events:none}
@keyframes hintGlow{50%{opacity:.45;transform:scale(1.04)}}
/* 3D 두께: 앞·뒷면과 같은 둥근 판을 두께 방향으로 여러 겹 쌓음 (--d = 두께) */
.ly{position:absolute;inset:.6% 1.4%;background:linear-gradient(180deg,var(--skin-side-a),var(--skin-side-b))}
.dt .ly{border-radius:1.6cqw}.aiTile .ly{border-radius:2cqw}
/* 옆으로 섰을 때 겹 사이가 비어 보이지 않게 좌우 옆면 판을 덧댐 */
.sd{position:absolute;left:50%;top:7%;height:86%;width:var(--d);margin-left:calc(var(--d) / -2);background:linear-gradient(90deg,var(--skin-side-b),var(--skin-side-a) 50%,var(--skin-side-b))}
.sd.r{transform:rotateY(90deg) translateZ(calc(var(--hw) * .972))}
.sd.l{transform:rotateY(-90deg) translateZ(calc(var(--hw) * .972))}
.dt{position:relative;width:100%;height:100%;cursor:pointer;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.1,.3,1),opacity .3s,translate .3s;
  transform:rotateX(16deg)}
.dt:hover{translate:0 -.8cqw}
.dt .f{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:1.6cqw;transform:translateZ(calc(var(--d) / 2))}
.dt .back{background:var(--skin-back)}
.dt .face{transform:rotateY(180deg) translateZ(calc(var(--d) / 2));overflow:hidden}
.dt .face svg{width:100%;height:100%;display:block}
.dt.flipped{transform:rotateX(16deg) rotateY(180deg)}
.dt.taken{opacity:0;translate:0 12cqw}
 /* 차례 타이머 (30초) */
/* 차례 타이머: 프로필 위에 겹쳐 — 바깥 고리가 줄어들고, 사진은 어둡게 + 가운데 큰 숫자 */
#timer{position:absolute;left:0;top:0;width:12cqw;height:12cqw;z-index:18;display:none;pointer-events:none;border-radius:50%}
#timer .pie{position:absolute;inset:-1.1cqw;border-radius:50%;background:conic-gradient(var(--tc,#3fd13f) 0 calc(360deg - var(--used,0deg)),rgba(0,0,0,.35) 0);
  -webkit-mask:radial-gradient(circle,transparent calc(50% - 1.2cqw),#000 calc(50% - 1.1cqw));mask:radial-gradient(circle,transparent calc(50% - 1.2cqw),#000 calc(50% - 1.1cqw));
  box-shadow:0 0 2.4cqw .4cqw rgba(255,255,200,.55)}
#timer .dim{position:absolute;inset:0;border-radius:50%;background:rgba(20,30,25,.55)}
#timer b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:var(--tf,5.6cqw);font-weight:900;color:#fff;text-shadow:0 .3cqw .5cqw rgba(0,0,0,.6)}
#timer.pop{animation:tpop .28s cubic-bezier(.3,1.4,.5,1)}
@keyframes tpop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#timer.warn{animation:tw .5s infinite alternate}
@keyframes tw{to{transform:scale(1.06)}}

  background:radial-gradient(circle at 50% 50%,#13a356 0,#0a6a35 45vh,#05401f 95vh)}
#match[hidden]{display:none}
.mtTitle{font-size:7cqw;font-weight:900;text-shadow:0 .8cqw 0 rgba(0,0,0,.2)}
.mtTitle .dots i{font-style:normal;animation:dotb 1s infinite}.mtTitle .dots i:nth-child(2){animation-delay:.15s}.mtTitle .dots i:nth-child(3){animation-delay:.3s}
@keyframes dotb{0%,60%,100%{opacity:.25}30%{opacity:1}}
#match.done .mtTitle .dots{display:none}
.mtSub{margin-top:2cqw;font-size:3.8cqw;font-weight:700;opacity:.85;padding:1cqw 3.4cqw;border-radius:5cqw;background:rgba(0,0,0,.22)}
.mtOpps{display:flex;justify-content:center;gap:5cqw;margin-top:16cqw}
.mtSlot.wait{visibility:hidden}
.mtSlot{display:flex;flex-direction:column;align-items:center;width:24cqw}
.mtAv{position:relative;width:22cqw;height:22cqw;border-radius:50%;overflow:hidden;background:#0b4f28;border:1cqw solid rgba(255,255,255,.35);box-shadow:0 1.4cqw 2.4cqw rgba(0,0,0,.35)}
.mtAv img{width:100%;height:100%;object-fit:cover;display:block}
.mtSlot.got .mtAv{border-color:#ffe94a;animation:gotPop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes gotPop{0%{transform:scale(.75)}100%{transform:scale(1)}}
.mtNm{margin-top:2cqw;font-size:4cqw;font-weight:800;white-space:nowrap;max-width:28cqw;overflow:hidden;text-overflow:ellipsis;min-height:5cqw}
.mtTag{margin-top:1cqw;font-size:2.8cqw;font-weight:800;padding:.4cqw 2cqw;border-radius:3cqw;background:#ffe94a;color:#3a2c00;opacity:0}
.mtSlot.got .mtTag{opacity:1;animation:gotPop .35s}
.mtTag.q{background:#2b3b33;color:#fff;box-shadow:inset 0 0 0 .4cqw rgba(255,255,255,.35)}
.mtMe{margin-top:22cqw;display:flex;flex-direction:column;align-items:center}
.mtMe .mtAv{width:26cqw;height:26cqw;border-color:#fff}
/* 타이틀 */
#title{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:7cqw;
  background:transparent}   /* 배경은 화면 전체에 body·띠가 그려요 */
#title h1{font-size:10cqw;font-weight:900;letter-spacing:-.3cqw;text-shadow:0 1.2cqw 0 rgba(0,0,0,.2);margin-top:0}
#title .sub{font-size:4.2cqw;opacity:.9;margin-top:1cqw}
#title .logo{display:flex;gap:3cqw;transform:rotate(-8deg);margin-top:5cqw;margin-bottom:2cqw}
#title .logo svg{width:7.5cqw;height:15cqw;filter:drop-shadow(0 1.2cqw 1cqw rgba(0,0,0,.35))}
#title .logo svg:nth-child(2){transform:translateY(-4cqw) rotate(12deg)}
#title .panel{position:relative;align-self:stretch;flex:none;margin-top:auto;padding:4cqw 9cqw 6cqw;display:flex;flex-direction:column;justify-content:center;
  background:transparent}
#title .notch{position:absolute;top:-3cqw;width:26cqw;height:3.2cqw;border-radius:50% 50% 0 0/100% 100% 0 0;background:#14bb60;transform:translateX(-50%);transition:left .25s cubic-bezier(.3,.8,.4,1)}
#title .lbl{margin-top:2.2cqw;font-size:3.4cqw}
#title .row{margin-top:1.2cqw}
.modes{display:flex;gap:1.6cqw;margin-top:5cqw;margin-bottom:6cqw}
.mode{position:relative;width:31cqw;border-radius:3.4cqw;cursor:pointer;padding:2cqw 0 0;overflow:hidden;
  background:linear-gradient(180deg,#1d7090,#123f55);border:.6cqw solid rgba(255,255,255,.25);box-shadow:0 1.2cqw 2cqw rgba(0,0,0,.35);transition:transform .18s,border-color .18s}
.mode.on{border-color:#ffe94a;transform:translateY(-1.2cqw) scale(1.02);box-shadow:0 0 0 .6cqw rgba(255,233,74,.35),0 1.6cqw 2.4cqw rgba(0,0,0,.4)}
.mode .art{height:28cqw;display:flex;align-items:center;justify-content:center}
.mode .art svg{height:100%;width:auto;overflow:visible}
.mode .rib{position:relative;margin:0 -1cqw;padding:1.6cqw 0 1.4cqw;text-align:center;font-weight:900;font-size:5cqw;color:#fff;
  background:linear-gradient(180deg,#e0453f,#b0201d);box-shadow:inset 0 -.6cqw 0 rgba(0,0,0,.2);text-shadow:0 .3cqw 0 rgba(0,0,0,.3)}
.mode .rib small{display:block;font-size:3.1cqw;font-weight:700;opacity:.85}
.mode .info{position:absolute;right:1.4cqw;top:1.4cqw;width:7cqw;height:7cqw;border-radius:50%;border:none;background:#2f8cf0;color:#fff;font:italic 900 3.8cqw Georgia,serif;cursor:pointer;box-shadow:0 .4cqw 0 #1a5fae;z-index:2}
#endSum{left:50%;top:32.5cqw;transform:translateX(-50%);display:none;padding:1cqw 3cqw;border-radius:4cqw;background:rgba(0,0,0,.35);font-size:3.4cqw;font-weight:800;z-index:3}
#endSum b{color:#ffe94a;font-size:4.2cqw}
#endSum.five{background:#ffe94a;color:#3a2c00}#endSum.five b{color:#b0201d}
.scorePop{position:absolute;left:50%;top:60cqw;transform:translate(-50%,0);font-size:11cqw;font-weight:900;color:#ffe94a;z-index:14;pointer-events:none;
  text-shadow:0 .6cqw 0 #8a5a00,0 1.2cqw 2cqw rgba(0,0,0,.5);animation:spop 1.3s ease-out forwards;text-align:center;line-height:1}
.scorePop small{display:block;font-size:4cqw;color:#fff;text-shadow:0 .3cqw .6cqw rgba(0,0,0,.6)}
@keyframes spop{0%{opacity:0;transform:translate(-50%,4cqw) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}30%{transform:translate(-50%,0) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-10cqw)}}
#title .lbl{color:#e6ffef}
#title .opt{padding:.8cqw 0;font-size:3.4cqw;border-width:.4cqw;border-radius:2cqw;background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.35)}
/* 방 종류는 크게 강조, 점수·인원은 작게 */
#title .lblRoom{font-size:4.2cqw;font-weight:900;color:#fff;margin-top:0}
#title .roomRow{gap:2.4cqw;margin-top:1.8cqw}
#title .roomRow .opt{padding:2.4cqw 0;font-size:4.8cqw;font-weight:900;border-width:.6cqw;border-radius:3cqw}
#title .roomRow .opt.on{box-shadow:0 0 0 .8cqw rgba(255,233,74,.55),0 1cqw 2cqw rgba(0,0,0,.25)}
#title .roomRow .opt.locked small{font-size:2.8cqw}
#title .subOpts{margin-top:1.2cqw}
#title .subOpts .lbl{font-size:3cqw;margin-top:1.8cqw;opacity:.9}
#title .subOpts .row{margin-top:1cqw}
#title .subOpts .opt{padding:.5cqw 0;font-size:3cqw;border-width:.35cqw;border-radius:1.8cqw}
#title .opt.on{background:#fff;color:#0b7a3b;border-color:#fff}
#title .btn{font-size:6cqw;padding:4.5cqw;background:#ffe94a;color:#3a2c00;box-shadow:0 1.2cqw 0 #b8a020;margin-top:5cqw;padding:3.8cqw}
.toast{position:absolute;left:50%;top:70cqw;width:max-content;max-width:88cqw;white-space:normal!important;text-align:center;line-height:1.35;word-break:keep-all;transform:translate(-50%,-50%);white-space:nowrap;background:rgba(0,0,0,.72);padding:3cqw 6cqw;border-radius:6cqw;font-size:4.6cqw;font-weight:700;z-index:50;pointer-events:none;opacity:0;transition:opacity .25s}

.opt.locked small{font-size:.8em;opacity:.85;margin-left:.6cqw}
