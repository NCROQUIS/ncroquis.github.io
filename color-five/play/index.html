<body>
  <div id="app">
    <header id="hud">

        <div id="pips" class="pips"></div>
      </div>
      <div class="hud-right">
        <div class="gold"><span class="coin"></span><span id="goldText">0</span></div>
        <button id="btnTest" class="icon-btn test hidden" aria-label="Test" data-i18n-attr="aria-label:test_title">TEST</button>

      </div>
    </header>

    <section id="stage">
      <canvas id="cv"></canvas>
      <div id="banner" class="banner"></div>
      <div class="controls">
        <button id="btnAuto" class="pill"></button>
        <div class="mid">
          <button id="btnBoss" class="pill boss hidden"></button>
          <button id="btnExtend" class="pill ad hidden"></button>
        </div>
        <button id="btnBurst" class="burst-btn" aria-label="Burst">
          <span class="ring"></span>
          <span id="burstLabel" class="burst-label"></span>
        </button>
      </div>
    </section>

    <section id="panel">
      <div id="rows"></div>
    </section>
  </div>

  <canvas id="fxTop" class="fx-top"></canvas>
  <div id="modal" class="modal hidden"><div id="modalBox" class="modal-box"></div></div>
  <div id="cut" class="cut hidden"></div>
