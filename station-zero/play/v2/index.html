<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><script src="../ncq-flags.js" onerror="void 0"></script></head><body><title>스테이션 제로 프로토타입 v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one-screen mobile game — HUD strip, orbital battle canvas, control deck; base screen is a tabbed station console. Single dark theme by choice (space). */
:root {
  --void: #060912;
  --panel: #0d1220;
  --panel-2: #131a2c;
  --line: #222c45;
  --ink: #e7ecf6;
  --ink-dim: #8b95ae;
  --signal: #6fd3ff;
  --signal-ink: #04121c;
  --energy: #ffd166;
  --data: #9b8cff;
  --good: #5fe39a;
  --bad: #ff6f7d;
  --font-display: "Oxanium", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--void); color: var(--ink); font-family: var(--font-body); font-size: 14px; overflow: hidden; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.app { position: relative; height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; }
.screen { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

/* battle */
.hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding-block: 10px 6px; }
.hud .wave { font-family: var(--font-display); font-weight: 700; font-size: 22px; text-align: center; line-height: 1; }
.hud .wave small { display: block; font-family: var(--font-body); font-size: 11px; color: var(--ink-dim); font-weight: 400; margin-top: 3px; }
.hud .l, .hud .r { display: grid; gap: 3px; font-size: 12px; }
.hud .r { text-align: right; }
.res-energy { color: var(--energy); } .res-data { color: var(--data); }
.hullbar { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin-block: 0 4px; }
.hullbar i { display: block; height: 100%; background: var(--good); width: 100%; transition: width .15s linear; }
.field { position: relative; flex: 1 1 auto; min-height: 200px; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
.weapons { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 12px; display: grid; gap: 10px; }
.wbtn { position: relative; width: 60px; height: 60px; border-radius: 50%; border: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 85%, transparent);
  display: grid; place-items: center; font-size: 11px; text-align: center; line-height: 1.15; cursor: pointer; }
.wbtn svg { position: absolute; inset: -1px; width: 62px; height: 62px; transform: rotate(-90deg); pointer-events: none; }
.wbtn.ready { border-color: var(--signal); box-shadow: 0 0 14px color-mix(in srgb, var(--signal) 45%, transparent); }
.wbtn[disabled] { opacity: .35; cursor: default; }
.topbtns { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); top: 8px; display: flex; gap: 6px; }
.chip { border: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 85%, transparent); border-radius: 999px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--signal); color: var(--signal); }
.deck { background: var(--panel); border-top: 1px solid var(--line); padding-block: 10px 12px; display: grid; gap: 8px; }
.upgrades { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.ubtn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 8px 4px; display: grid; gap: 3px; cursor: pointer; text-align: center; }
.ubtn b { font-size: 12.5px; font-weight: 600; }
.ubtn span { font-size: 11px; color: var(--energy); }
.ubtn em { font-style: normal; font-size: 10.5px; color: var(--ink-dim); }
.ubtn:disabled { opacity: .45; cursor: default; }
.ubtn.hint { border-color: var(--energy); box-shadow: 0 0 0 2px color-mix(in srgb, var(--energy) 35%, transparent); }
.deckrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-dim); }

/* overlays */
.overlay { position: absolute; inset: 0; display: grid; align-items: end; z-index: 5; }
.dialog { margin: 0 max(12px, env(safe-area-inset-left, 0px)) 12px; background: color-mix(in srgb, var(--panel) 95%, transparent); border: 1px solid var(--line);
  border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; cursor: pointer; }
.dialog .who { font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--signal); letter-spacing: .04em; }
.dialog p { margin: 0; font-size: 14.5px; line-height: 1.55; }
.dialog .tap { font-size: 11px; color: var(--ink-dim); text-align: right; }
.cards { align-items: center; background: color-mix(in srgb, var(--void) 70%, transparent); }
.cardbox { margin: 0 max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 10px; }
.cardbox h3 { margin: 0; text-align: center; font-family: var(--font-display); font-size: 16px; letter-spacing: .04em; }
.card { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 12px 14px; text-align: left; cursor: pointer; display: grid; gap: 3px; }
.card b { font-size: 15px; } .card span { color: var(--ink-dim); font-size: 13px; }
.card:hover { border-color: var(--signal); }
.toast { position: absolute; left: 50%; top: 64px; transform: translateX(-50%); z-index: 6; background: var(--panel-2); border: 1px solid var(--signal);
  border-radius: 8px; padding: 7px 12px; font-size: 13px; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }
.banner { position: absolute; left: 0; right: 0; top: 38%; text-align: center; z-index: 4; pointer-events: none; font-family: var(--font-display); font-weight: 700; font-size: 26px;
  letter-spacing: .06em; text-shadow: 0 0 18px var(--signal); white-space: nowrap; font-size: clamp(18px, 6.5vw, 26px); }

/* result + base */
.scroll { flex: 1 1 auto; overflow-y: auto; padding-block: 16px 24px; display: grid; align-content: start; gap: 14px; }
h1, h2 { margin: 0; font-family: var(--font-display); letter-spacing: .03em; text-wrap: balance; }
h1 { font-size: 22px; } h2 { font-size: 15px; color: var(--ink-dim); font-weight: 500; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.res-cell { color: var(--good); }
.lock { background: var(--panel-2); border: 1px dashed var(--line); border-radius: 10px; padding: 14px; font-size: 13px; color: var(--ink-dim); line-height: 1.5; }
.slot .cellbtn { border: 1px solid var(--good); background: color-mix(in srgb, var(--good) 12%, transparent); border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer; margin-left: 8px; }
.slot .cellbtn:disabled { opacity: .4; cursor: default; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 2px; }
.stat b { font-family: var(--font-data); font-size: 20px; font-weight: 600; }
.stat span { font-size: 11.5px; color: var(--ink-dim); }
.primary { background: var(--signal); color: var(--signal-ink); border: 0; border-radius: 10px; padding: 13px 16px; font-weight: 600; font-size: 15px; cursor: pointer; width: 100%; }
.primary:disabled { opacity: .5; }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 13px; }
.basehead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding-block: 12px 0; flex-wrap: wrap; }
.wallet { display: flex; gap: 12px; font-size: 13px; }
.titlerow { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; }
.resetchip { color: var(--ink-dim); }
.resetchip.armed, .ghost.armed { border-color: #ff6f7d; color: #ff6f7d; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); padding-block: 10px 0; }
.tabs button { background: transparent; border: 0; padding: 8px 10px; color: var(--ink-dim); cursor: pointer; border-bottom: 2px solid transparent; font-size: 14px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--signal); }
.sub { display: flex; gap: 6px; }
.list { display: grid; gap: 6px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.row .t { display: grid; gap: 2px; min-width: 0; }
.row .t b { font-size: 14px; font-weight: 600; }
.row .t span { font-size: 12px; color: var(--ink-dim); }
.list .row.slot { display: grid; grid-template-columns: minmax(0, 1fr) auto; row-gap: 8px; }
.row.slot .tiles { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; grid-row: 2; }
.row.slot .buy { grid-row: 1; grid-column: 2; }
.row.locked { opacity: .55; }
.chip.tile[aria-pressed="true"] { border-color: var(--tc); color: var(--tc); }
.framepv { display: block; width: 100%; height: 190px; border-radius: 10px; border: 1px solid var(--line); background: #05070f; }
.buy { min-width: 84px; border: 1px solid var(--data); color: var(--ink); background: color-mix(in srgb, var(--data) 14%, transparent); border-radius: 8px; padding: 8px 10px; cursor: pointer; font-size: 13px; }
.buy:disabled { opacity: .4; cursor: default; }
.buy.hint { box-shadow: 0 0 0 2px color-mix(in srgb, var(--data) 60%, transparent); }
.slot { background: var(--panel-2); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.slot.busy { border-style: solid; border-color: var(--signal); }
.note { font-size: 12px; color: var(--ink-dim); line-height: 1.5; margin: 0; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
th { color: var(--ink-dim); font-weight: 400; }
.tablewrap { overflow-x: auto; }
/* offline (idle) reward */
.idle { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; font-size: 12px; color: var(--ink-dim); margin-top: 6px; }
.idle b { color: var(--data); font-family: var(--font-data); font-weight: 600; }
.offline { align-items: center; background: color-mix(in srgb, var(--void) 78%, transparent); }
.offbox { margin: 0 max(16px, env(safe-area-inset-left, 0px)); background: var(--panel); border: 1px solid var(--data); border-radius: 14px; padding: 18px 16px 16px; display: grid; gap: 12px; text-align: center;
  box-shadow: 0 0 32px color-mix(in srgb, var(--data) 25%, transparent); }
.offbox .kick { font-size: 12px; color: var(--data); letter-spacing: .08em; font-family: var(--font-display); font-weight: 700; }
.offbox h3 { margin: 0; font-family: var(--font-display); font-size: 18px; }
.offbox .amt { font-family: var(--font-data); font-size: 34px; font-weight: 700; color: var(--data); text-shadow: 0 0 18px color-mix(in srgb, var(--data) 55%, transparent); }
.offbox .note { text-align: center; }
.offbox .btns { display: grid; gap: 8px; }
.adbtn { background: transparent; border: 1px solid var(--energy); color: var(--energy); border-radius: 10px; padding: 12px 16px; font-weight: 600; font-size: 15px; cursor: pointer; width: 100%; }
.adbtn:disabled { opacity: .5; }
.caption { position: absolute; left: 0; right: 0; top: 14px; text-align: center; z-index: 4; pointer-events: none; display: grid; gap: 4px; }
.caption b { font-family: var(--font-display); font-size: 13px; letter-spacing: .18em; color: var(--signal); }
.caption span { font-size: 15px; text-shadow: 0 0 10px var(--void); }
.caption small { font-size: 11.5px; color: var(--ink-dim); }
.rec #scr-battle .hud, .rec #scr-battle .deck, .rec #scr-battle .weapons, .rec #scr-battle .topbtns, .rec .caption, .rec .skip, .rec .toast { visibility: hidden !important; }
.skip { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 14px; z-index: 5; }
.flash { position: absolute; inset: 0; background: #fff; z-index: 6; pointer-events: none; opacity: 0; transition: opacity .9s ease-out; }
.flash.on { opacity: 1; transition: none; }
.story { position: absolute; inset: 0; z-index: 7; display: grid; place-items: center; background: var(--void); padding: 24px; text-align: center; font-size: 16px; line-height: 1.7; }
.story p { margin: 0; max-width: 28ch; }
#scr-battle.prologue .deck, #scr-battle.prologue .hud .wave, #scr-battle.prologue .hud .l, #scr-battle.prologue .hud .r, #scr-battle.prologue .weapons, #scr-battle.prologue .topbtns { visibility: hidden; }
.footer { padding-block: 10px 12px; border-top: 1px solid var(--line); background: var(--panel); }
@media (prefers-reduced-motion: reduce) { .hullbar i { transition: none; } }
</style>

<div class="app" id="app">
  <!-- BATTLE -->
  <section class="screen" id="scr-battle" hidden>
    <div class="hud pad">
      <div class="l">
        <div class="hullbar" aria-label="선체"><i id="hull-bar"></i></div>
        <div class="num" id="hull-txt">선체 100/100</div>
      </div>
      <div class="wave"><span id="wave-txt">1</span><small id="time-txt">웨이브 · 15:00</small></div>
      <div class="r">
        <div class="num res-energy" id="energy-txt">에너지 0</div>
        <div class="num res-data" id="data-txt">데이터 0</div>
      </div>
    </div>
    <div class="field">
      <canvas id="cv" aria-label="전투 화면"></canvas>
      <div class="topbtns">
        <button type="button" class="chip" id="btn-speed" aria-pressed="false">2x</button>
        <button type="button" class="chip" id="btn-autow" aria-pressed="false">병기 자동</button>
        <button type="button" class="chip" id="btn-sound" aria-pressed="true">소리 켬</button>
      </div>
      <div class="weapons">
        <button type="button" class="wbtn" id="w-emp" disabled><svg viewBox="0 0 62 62"><circle cx="31" cy="31" r="29" fill="none" stroke="var(--line)" stroke-width="3"/><circle id="w-emp-ring" cx="31" cy="31" r="29" fill="none" stroke="var(--signal)" stroke-width="3" stroke-dasharray="182.2" stroke-dashoffset="0"/></svg>EMP<br>링</button>
        <button type="button" class="wbtn" id="w-rail" disabled><svg viewBox="0 0 62 62"><circle cx="31" cy="31" r="29" fill="none" stroke="var(--line)" stroke-width="3"/><circle id="w-rail-ring" cx="31" cy="31" r="29" fill="none" stroke="var(--signal)" stroke-width="3" stroke-dasharray="182.2" stroke-dashoffset="0"/></svg>레일건</button>
      </div>
      <div class="banner" id="banner" hidden></div>
      <div class="caption" id="caption" hidden><b>ARC-7 · 최종 방어선</b><span id="caption-txt">스웜 본대 접근</span><small id="sound-hint">화면을 탭하면 소리가 켜집니다</small></div>
      <button type="button" class="chip skip" id="btn-skip" hidden>건너뛰기</button>
      <div class="flash" id="flash"></div>
      <div class="story" id="story" hidden><p id="story-txt"></p></div>
    </div>
    <div class="deck pad">
      <div class="upgrades" id="inrun"></div>
      <div class="deckrow"><span id="cards-txt">전술 카드: 없음</span><button type="button" class="chip" id="btn-autou" aria-pressed="false">자동 강화</button></div>
    </div>
  </section>

  <!-- RESULT -->
  <section class="screen" id="scr-result" hidden>
    <div class="scroll pad">
      <h2 id="res-sub">아크 파괴</h2>
      <h1 id="res-title">웨이브 12 도달</h1>
      <div class="stats">
        <div class="stat"><b class="num res-data" id="res-data">0</b><span>획득 데이터</span></div>
        <div class="stat"><b class="num res-cell" id="res-cells">0</b><span>에너지 셀</span></div>
        <div class="stat"><b class="num" id="res-kills">0</b><span>처치</span></div>
        <div class="stat"><b class="num" id="res-best">0</b><span>최고 웨이브</span></div>
      </div>
      <p class="note" id="res-note"></p>
    </div>
    <div class="footer pad"><button type="button" class="primary" id="btn-tobase">본부로 귀환</button></div>
  </section>

  <!-- BASE -->
  <section class="screen" id="scr-base" hidden>
    <div class="basehead pad">
      <div class="titlerow"><h1>STATION ZERO</h1><button type="button" class="chip resetchip" id="btn-reset-top" aria-label="진행 상황 초기화">초기화</button></div>
      <div class="wallet"><span class="num res-data" id="base-data">데이터 0</span><span class="num res-cell" id="base-cells">셀 0</span><span class="num" id="base-best">최고 0</span></div>
      <div class="idle" id="base-idle" hidden></div>
    </div>
    <div class="tabs pad" role="tablist">
      <button type="button" role="tab" id="tab-yard" aria-selected="true">조선소</button>
      <button type="button" role="tab" id="tab-lab" aria-selected="false">과학 데크</button>
      <button type="button" role="tab" id="tab-log" aria-selected="false">기록</button>
    </div>
    <div class="scroll pad" id="base-body"></div>
    <div class="footer pad"><button type="button" class="primary" id="btn-launch">출격 · 루나 기지</button></div>
  </section>

  <div class="overlay" id="ov-dialog" hidden><div class="dialog" id="dialog" role="button" tabindex="0"><div class="who" id="dlg-who"></div><p id="dlg-text"></p><div class="tap">탭해서 계속</div></div></div>
  <div class="overlay cards" id="ov-cards" hidden><div class="cardbox"><h3>전술 카드 선택</h3><div class="list" id="card-list"></div></div></div>
  <div class="overlay offline" id="ov-offline" hidden><div class="offbox" role="dialog" aria-labelledby="off-title">
    <div class="kick">자동 순찰 보고</div><h3 id="off-title">자리를 비운 동안</h3>
    <div class="amt" id="off-amt">+0</div><div class="note" id="off-note"></div>
    <div class="btns"><button type="button" class="adbtn" id="btn-off-ad" hidden>광고 보고 2배 받기</button><button type="button" class="primary" id="btn-off-claim">받기</button></div>
  </div></div>
  <div class="toast" id="toast" hidden></div>
</div>

<script>
/* Station Zero — battle engine v2 (growth restructure). Pure logic, fixed tick, seeded RNG. No DOM. */
(function (root) {
  const TICK = 1 / 30;
  const WAVE_SEC = 20;
  const RUN_CAP_GAME_SEC = 15 * 60 * 2; // 15 real minutes at the default 2x
  const STATION_R = 7, SPAWN_R = 108;
  const TUNE = { hpG: 1.05, hpG2: 1.04, atkG: 1.04, energyG: 1.0, late: 25, hpMul: 1.55, rateStep: 0.04, inrunG: 1.35, regenAbs: 0, polyK: 0.07, polyP: 1.3, swarm: 2.5, rush: 0.4, spdG: 0.005, spdMax: 1.6, rangedG: 0.002, hullBase: 80, regenPct: 0.0015, regenG: 0.4 }; // hull 80 + slow regen: chip damage sticks, so the hull drains from wave 2 instead of collapsing at wave 9-10 // rush + light speed/ranged growth (6-seed auto-play keeps ≈+1.8 waves per level over Lv0-30) // v2: polynomial shipyard effects — ≈+2 waves/level to Lv20, then flattening (6-seed auto-play)

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- shipyard (permanent): effects grow polynomially, like The Tower workshop ----
  const poly = L => Math.pow(1 + TUNE.polyK * L, TUNE.polyP);
  const STATS = [
    { id: 'dmg',    tab: 'atk', name: '피해',      base: 1.0, desc: L => `${(4 * poly(L)).toFixed(1)}` },
    { id: 'rate',   tab: 'atk', name: '연사 속도',  base: 1.2, desc: L => `${(1.2 * (1 + TUNE.rateStep * L)).toFixed(2)}/초` },
    { id: 'crit',   tab: 'atk', name: '치명타 확률', base: 1.5, desc: L => `${Math.round(Math.min(60, 5 + L))}%` },
    { id: 'range',  tab: 'atk', name: '사거리',     base: 1.2, desc: L => `${Math.round(40 + L)}` },
    { id: 'hull',   tab: 'def', name: '선체 내구도', base: 1.0, desc: L => `${Math.round(TUNE.hullBase * poly(L))}` },
    { id: 'regen',  tab: 'def', name: '선체 재생',  base: 1.2, desc: L => `${(TUNE.regenPct * 100 * (1 + TUNE.regenG * L)).toFixed(2)}%/초` },
    { id: 'armor',  tab: 'def', name: '피해 감소',  base: 1.5, desc: L => `${Math.min(50, L)}%` },
    { id: 'energy', tab: 'utl', name: '에너지 획득', base: 1.5, desc: L => `+${5 * L}%` },
    { id: 'datab',  tab: 'utl', name: '웨이브당 데이터', base: 2.0, desc: L => `+${3 * L}%` }
  ];

  const ENEMY = {

  }

  class Battle {
    constructor(save, opts) {

      this.opts = Object.assign({ seed: 1, tutorial: false, prologue: false, headless: false, autoUpgrade: false, autoWeapons: false }, opts);

      this.rng = mulberry32(this.opts.seed >>> 0);

      this.cardCount = {}; this.cardsTaken = [];
      this.module = null; // 'proto' during tutorial

      };

    }
    refresh() {

    }
    // build interceptors / batteries / orbitals from the current tiles; existing craft keep flying
    setupStation() {

      const want = [];
      st.tiles.forEach((t, k) => { if (t && t.type === 'hangar') for (let j = 0; j < 2; j++) want.push({ k, j, lv: t.lv }); });
      const old = this.craft;
      this.craft = want.map(w => {
        const o = old.find(c => c.k === w.k && c.j === w.j); if (o) { o.lv = w.lv; return o; }
        const p = slotPos(w.k); if (!this.opts.headless) this.events.push({ type: 'launch', x: p.x, y: p.y });
        return { k: w.k, j: w.j, lv: w.lv, x: p.x, y: p.y, vx: Math.cos(p.a) * 40, vy: Math.sin(p.a) * 40, ang: p.a, cd: 0.4 + 0.3 * w.j, tgt: null };
      });
      const oldB = this.batteries;
      this.batteries = []; st.tiles.forEach((t, k) => { if (t && t.type === 'battery') { const o = oldB.find(x => x.k === k); this.batteries.push({ k, lv: t.lv, fireT: o ? o.fireT : 0.15 * k, aim: o ? o.aim : slotPos(k).a }); } });
      this.orbitals = st.orbitals;
    }
    scale(w) { return Math.pow(TUNE.hpG, w - 1) * Math.pow(TUNE.hpG2, Math.max(0, w - TUNE.late)); }
    planWave() {

      else if (this.opts.tutorial) { // gentle first minutes, then a scripted first destruction

  // ---------- render ----------
  const cv = $('cv'), ctx = cv.getContext('2d');
  const COL = { drone: '#5fe39a', meteor: '#9aa3b8', charger: '#ff9f4d', shooter: '#c08bff', boss: '#ff6f9f' };
  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.round(cv.clientWidth * dpr), h = Math.round(cv.clientHeight * dpr);
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    return dpr;
  }
  function glowCircle(x, y, r, col, a) {
    ctx.globalAlpha = a * 0.25; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r * 2.2, 0, 6.283); ctx.fill();
    ctx.globalAlpha = a; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1;
  }

    ctx.closePath();
    if (fill) { ctx.globalAlpha = 0.22; ctx.fillStyle = col; ctx.fill(); ctx.globalAlpha = 1; }
    ctx.strokeStyle = col; ctx.lineWidth = 1.6; ctx.stroke();
  }
  // ---------- render: additive neon, cached glow sprites, layered background ----------
  const glowSprite = A.glowSprite;
  function glow(x, y, r, col, a) { A.glow(ctx, x, y, r, col, a); }
  const BG = A.makeBackground(); let lastBgT = null;
  function drawEnemy(e, time) { A.drawEnemy(ctx, art().en, e, time); }
  function burst(x, y, kind, n, spd) {
    for (let j = 0; j < n && particles < (lite ? 120 : 360) && fx.length < 700; j++) { const a = Math.random() * 6.283, v = spd * (0.3 + Math.random()); fx.push({ k: 'shard', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, c: kind, life: 0.35 + Math.random() * 0.35, t: 0 }); particles++; }
  }
  let particles = 0, dmgTexts = 0, slowmo = 0, lastHull = null, shieldT = 0, lastAim = 0;
  let lite = false, ftAvg = 16, liteSince = 0; // auto quality: drop to lite when frames run slow (planning doc 11-5)
  const combo = { n: 0, t: 0 };
  const COLX = Object.assign({ spark: '#ffe9a8' }, COL);

  function draw(time) {
    const dpr = resize(), W = cv.width, H = cv.height;
    if (W < 2 || H < 2 || $('scr-battle').hidden) return; // hidden battle screen: nothing to draw
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    const bdt = lastBgT == null ? 0 : time - lastBgT; lastBgT = time;
    A.drawBackground(ctx, BG, W, H, time, bdt, lite);
    const b = battle; if (!b) return;
    const att = fx.find(f => f.k === 'attach');
    const zoom = att ? 1 + 0.7 * Math.sin(Math.min(1, att.t / 1.3) * Math.PI) : 1;
    const s = Math.min(W, H) / 2 / 104 * zoom;
    const sx = shake ? (Math.random() - 0.5) * shake * 2 * dpr : 0, sy = shake ? (Math.random() - 0.5) * shake * 2 * dpr : 0;
    ctx.setTransform(s, 0, 0, s, W / 2 + sx, H / 2 + sy);
    // range ring
    ctx.strokeStyle = 'rgba(111,211,255,0.12)'; ctx.lineWidth = 0.5; ctx.setLineDash([1.5, 3]);
    ctx.beginPath(); ctx.arc(0, 0, b.d.range, time * 0.2, time * 0.2 + 6.283); ctx.stroke(); ctx.setLineDash([]);

    // ---- station: glow, endgame rings, hull design (art.js) ----
    ctx.globalCompositeOperation = 'lighter';
    const pulse = 1 + Math.sin(time * 2.2) * 0.05;
    if (!lite) glow(0, 0, E.STATION_R * (b.opts.prologue ? 3.4 : 2.4) * pulse, '#3fb8ff', 0.45);
    ctx.globalAlpha = 1;
    if (b.opts.prologue) {
      [2.9, 3.5].forEach((k, ri) => {
        ctx.save(); ctx.rotate(time * (ri % 2 ? -0.6 : 0.8)); ctx.strokeStyle = ri === 1 ? '#ffd166' : '#6fd3ff'; ctx.lineWidth = 1.6;
        for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.arc(0, 0, E.STATION_R * k, i * 1.047 + 0.15, i * 1.047 + 0.8); ctx.stroke(); }
        ctx.restore();
      });
    }
    const grow = att ? Math.min(1, att.t / 0.8) : 1;
    let newest = null; for (let i = b.projs.length - 1; i >= 0; i--) if (!b.projs[i].src) { newest = b.projs[i]; break; }
    if (newest && newest.tgt) lastAim = Math.atan2(newest.tgt.y, newest.tgt.x);
    const st = b.station, aims = {}; for (const bt of b.batteries) aims[bt.k] = bt.aim;
    const tiles = st.tiles.map(t => t && Object.assign({ isNew: !!t.proto }, t));
    A.drawStation(ctx, 'hex', time, { R: E.STATION_R * 1.3, tiles, openK: E.SLOT_ORDER.slice(0, st.open), orbitals: st.orbitals, ot: b.t, aims, outer: !!b.opts.prologue, aim: lastAim, grow });
    ctx.globalCompositeOperation = 'lighter';
    // shield flash when hit
    if (lastHull !== null && b.hull < lastHull - 0.01) shieldT = 0.25;
    lastHull = b.hull;
    if (shieldT > 0) {
      ctx.globalAlpha = shieldT * 3; ctx.strokeStyle = '#ff6f7d'; ctx.lineWidth = 1.2;
      ctx.beginPath(); for (let i = 0; i <= 6; i++) { const a = i / 6 * 6.283 + time; const px = Math.cos(a) * E.STATION_R * 2, py = Math.sin(a) * E.STATION_R * 2; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); } ctx.stroke(); ctx.globalAlpha = 1;
    }
    // ---- enemies (normal blend for crisp outlines, glow underneath) ----
    if (!lite) for (const e of b.enemies) { if (!e.dead && e.type === 'boss') glow(e.x, e.y, e.r * 3.4, COL[e.type], 0.5); }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    for (const e of b.enemies) {
      if (e.dead) continue;
      const col = COL[e.type];
      drawEnemy(e, time);
      if (e.stun > 0) { ctx.strokeStyle = '#6fd3ff'; ctx.lineWidth = 0.6; ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 1.8, time * 6, time * 6 + 4); ctx.stroke(); }
      if (e.type === 'boss' || e.type === 'meteor') {
        const w = e.r * 2.4, fr = Math.max(0, e.hp / e.maxhp);
        ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(e.x - w / 2, e.y - e.r - 3, w, 1);
        ctx.fillStyle = col; ctx.fillRect(e.x - w / 2, e.y - e.r - 3, w * fr, 1);
      }
    }

    // ---- interceptors: engine trails (additive) + hull sprites ----
    if (b.craft.length) {
      ctx.globalCompositeOperation = 'lighter';
      for (const c of b.craft) {
        const tr = c._tr || (c._tr = []); tr.push(c.x, c.y); if (tr.length > 16) tr.splice(0, 2);
        if (!lite && tr.length > 4) { ctx.globalAlpha = 0.45; ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 0.9; ctx.beginPath(); ctx.moveTo(tr[0], tr[1]); for (let i = 2; i < tr.length; i += 2) ctx.lineTo(tr[i], tr[i + 1]); ctx.stroke(); }
        glow(c.x - Math.cos(c.ang) * 1.8, c.y - Math.sin(c.ang) * 1.8, 2.2, '#9fe6ff', 0.6);
      }
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      for (const c of b.craft) A.drawCraft(ctx, c, b.station.proto ? '#ffd166' : '#ffd166');
    }
    // ---- additive: bullets, projectiles with trails, fx ----
    ctx.globalCompositeOperation = 'lighter';
    for (const bl of b.bullets) glow(bl.x, bl.y, 2.4, '#c08bff', 0.9);
    const PCOL = ['#6fd3ff', '#8fe0ff', '#b8ecff', '#ffffff', '#ffe9a8', '#ffd166'];
    const lv = b.opts.prologue ? 5 : Math.min(5, b.inrun.dmg + (b.module ? 2 : 0));
    const pr = b.opts.prologue ? 1.4 : Math.min(1.6, 0.8 + 0.08 * b.inrun.dmg + (b.module ? 0.2 : 0));
    for (const p of b.projs) {
      const col = p.crit ? '#ffd166' : PCOL[lv];
      if (!p._trail) { p._trail = []; if (!p.src && fx.length < 700) fx.push({ k: 'muzzle', a: Math.atan2(p.tgt.y, p.tgt.x), t: 0 }); }
      p._trail.push(p.x, p.y); if (p._trail.length > 10) p._trail.splice(0, 2);
      if (!lite) { ctx.strokeStyle = col; ctx.lineWidth = pr * 1.1; ctx.globalAlpha = 0.55;
      ctx.beginPath(); ctx.moveTo(p._trail[0], p._trail[1]); for (let i = 2; i < p._trail.length; i += 2) ctx.lineTo(p._trail[i], p._trail[i + 1]); ctx.stroke(); }
      glow(p.x, p.y, (p.crit ? 4.2 : 3) * pr, col, 1);
    }
    ctx.globalAlpha = 1;
    particles = 0; dmgTexts = 0;
    for (let i = fx.length - 1; i >= 0; i--) {
      const f = fx[i]; if (f.dead) continue;
      if (f.k === 'shard') {
        particles++; const k = f.t / f.life; const drag = 1 - 0.5 * k;
        if (lite) { ctx.globalAlpha = Math.max(0, 1 - k); ctx.fillStyle = COLX[f.c] || '#ffffff'; ctx.fillRect(f.x + f.vx * f.t * drag - 0.6, f.y + f.vy * f.t * drag - 0.6, 1.2, 1.2); }
        else glow(f.x + f.vx * f.t * drag, f.y + f.vy * f.t * drag, f.c === 'spark' ? 1.2 : 1.6, COLX[f.c] || '#ffffff', Math.max(0, 1 - k));
        if (k >= 1) (f.dead = true);
      } else if (f.k === 'boom') {
        const k = f.t / 0.45;
        glow(f.x, f.y, f.r * (1 + k), '#ffffff', Math.max(0, 0.9 - k * 1.5));
        glow(f.x, f.y, f.r * 1.6 * (0.6 + k), COL[f.c], Math.max(0, 0.7 - k));
        ctx.globalAlpha = Math.max(0, 1 - k); ctx.strokeStyle = COL[f.c]; ctx.lineWidth = 1.2 * (1 - k) + 0.2;
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.4 + 2 * k), 0, 6.283); ctx.stroke(); ctx.globalAlpha = 1;
        if (k >= 1) (f.dead = true);
      } else if (f.k === 'muzzle') {
        const k = f.t / 0.08; glow(Math.cos(f.a) * E.STATION_R * 1.3, Math.sin(f.a) * E.STATION_R * 1.3, 4, '#bfefff', Math.max(0, 1 - k)); if (k >= 1) (f.dead = true);
      } else if (f.k === 'rail') {
        const k = f.t / 0.5, len = 140, ux = Math.cos(f.a), uy = Math.sin(f.a);
        for (let d = 0; d < len; d += lite ? 20 : 10) glow(ux * d, uy * d, 7 * (1 - k) + 2, '#9fe6ff', Math.max(0, 0.7 - k));
        ctx.globalAlpha = Math.max(0, 1 - k); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3.5 * (1 - k) + 0.6;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(ux * len, uy * len); ctx.stroke(); ctx.globalAlpha = 1;
        if (k >= 1) (f.dead = true);
      } else if (f.k === 'emp') {
        const k = f.t / 0.6, R = 70 * Math.min(1, k * 1.3);
        ctx.globalAlpha = Math.max(0, 1 - k); ctx.strokeStyle = '#6fd3ff'; ctx.lineWidth = 3 * (1 - k) + 0.5;
        ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.283); ctx.stroke();
        ctx.strokeStyle = '#e7f8ff'; ctx.lineWidth = 0.7;
        for (let j = 0; j < 10; j++) { let a = j / 10 * 6.283 + f.seed, r = E.STATION_R; ctx.beginPath(); ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); while (r < R) { r += 6; a += (Math.sin(f.seed * 13 + j * 7 + r) * 0.25); ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.stroke(); }
        ctx.globalAlpha = 1; if (k >= 1) (f.dead = true);
      } else if (f.k === 'zap') {
        const k = f.t / 0.14; ctx.globalAlpha = Math.max(0, 1 - k); ctx.strokeStyle = '#fff2c4'; ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.moveTo(f.x1, f.y1); ctx.lineTo(f.x2, f.y2); ctx.stroke(); glow(f.x2, f.y2, 2.6, '#ffd166', Math.max(0, 1 - k)); ctx.globalAlpha = 1; if (k >= 1) (f.dead = true);
      } else if (f.k === 'block') {
        const k = f.t / 0.3; ctx.globalAlpha = Math.max(0, 1 - k); ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.arc(f.x, f.y, 3 + 5 * k, 0, 6.283); ctx.stroke(); ctx.globalAlpha = 1; if (k >= 1) (f.dead = true);
      } else if (f.k === 'chain') {
        const k = f.t / 0.25; ctx.globalAlpha = Math.max(0, 1 - k); ctx.strokeStyle = '#ffe9a8'; ctx.lineWidth = 0.9;
        const mx = (f.x1 + f.x2) / 2 + (Math.random() - 0.5) * 6, my = (f.y1 + f.y2) / 2 + (Math.random() - 0.5) * 6;
        ctx.beginPath(); ctx.moveTo(f.x1, f.y1); ctx.lineTo(mx, my); ctx.lineTo(f.x2, f.y2); ctx.stroke(); ctx.globalAlpha = 1; if (k >= 1) (f.dead = true);
      } else if (f.k === 'ring') {
        const k = f.t / 0.45; ctx.globalAlpha = Math.max(0, 1 - k); ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(0, 0, E.STATION_R * (1 + 3 * k), 0, 6.283); ctx.stroke(); ctx.globalAlpha = 1; if (k >= 1) (f.dead = true);
      } else if (f.k === 'beam') {
        const boss = b.enemies.find(e => e.type === 'boss' && !e.dead); const k = Math.min(1, f.t / 0.8);
        if (boss) { for (let d = 0; d <= 1; d += lite ? 0.25 : 0.12) glow(boss.x * (1 - d), boss.y * (1 - d), 5 + 8 * k, '#ff6f9f', 0.5 + 0.4 * Math.sin(f.t * 40)); ctx.globalAlpha = 1; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1 + 4 * k; ctx.beginPath(); ctx.moveTo(boss.x, boss.y); ctx.lineTo(0, 0); ctx.stroke(); }
        if (f.t > 1.2) (f.dead = true);
      } else if (f.k === 'attach') {
        if (f.cine && f.t > 1.3 && battle && !cardsOpen && $('ov-dialog').hidden) { f.cine = false; battle.paused = false; }
        if (f.t > 1.4) (f.dead = true);
      }
    }
    // ---- text layer (normal blend) ----
    ctx.globalCompositeOperation = 'source-over'; ctx.textAlign = 'center';
    for (let i = fx.length - 1; i >= 0; i--) {
      const f = fx[i]; if (f.dead) continue;
      if (f.k === 'num') {
        dmgTexts++; const k = f.t / 0.7;
        ctx.globalAlpha = Math.max(0, 1 - k * k);
        ctx.font = f.crit ? '700 6.5px "IBM Plex Mono", monospace' : '600 4px "IBM Plex Mono", monospace';
        ctx.fillStyle = f.crit ? '#ffd166' : '#e7ecf6';
        ctx.fillText(fmt(f.v) + (f.crit ? '!' : ''), f.x, f.y - 4 - k * 7);
        if (k >= 1) (f.dead = true);
      }
    }
    ctx.globalAlpha = 1;
    // screen-space overlays: flash, combo, wave
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    for (let i = fx.length - 1; i >= 0; i--) {
      const f = fx[i]; if (f.dead) continue;
      if (f.k === 'flash') { const k = f.t / 0.25; ctx.globalAlpha = Math.max(0, f.a * (1 - k)); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; if (k >= 1) (f.dead = true); }
      else if (f.k === 'combo') {
        const k = f.t / 1.2, pop = 1 + 0.4 * Math.max(0, 1 - f.t * 6);
        ctx.globalAlpha = Math.max(0, 1 - Math.max(0, k - 0.6) / 0.4); ctx.textAlign = 'center'; ctx.fillStyle = f.n >= 100 ? '#ff6f9f' : f.n >= 50 ? '#ffd166' : '#6fd3ff';
        ctx.font = `700 ${Math.round(26 * dpr * pop)}px "Oxanium", sans-serif`; ctx.fillText(`${f.n} 연속 처치!`, W / 2, H * 0.24);
        ctx.globalAlpha = 1; if (k >= 1) (f.dead = true);
      } else if (f.k === 'wave') {
        const k = f.t / 1.0; if (f.n > 1 && f.n % 5 === 0 || f.n % 10 === 0) { ctx.globalAlpha = Math.max(0, 0.5 * (1 - k)); ctx.fillStyle = '#e7ecf6'; ctx.textAlign = 'center'; ctx.font = `700 ${Math.round(44 * dpr)}px "Oxanium", sans-serif`; ctx.fillText(`WAVE ${f.n}`, W / 2, H * 0.62); ctx.globalAlpha = 1; }
        if (k >= 1) (f.dead = true);
      }
    }
      let j = 0; for (let i = 0; i < fx.length; i++) if (!fx[i].dead) fx[j++] = fx[i]; fx.length = j;
  }

  function hudUpdate() {
    const b = battle;
    $('wave-txt').textContent = b.wave;
    const remain = Math.max(0, 900 - (b.t / 2));
    $('time-txt').textContent = `웨이브 · ${Math.floor(remain / 60)}:${String(Math.floor(remain % 60)).padStart(2, '0')}`;
    $('hull-bar').style.width = (b.hull / b.d.hullMax * 100).toFixed(1) + '%';
    $('hull-bar').style.background = b.hull / b.d.hullMax < 0.3 ? 'var(--bad)' : 'var(--good)';
    $('hull-txt').textContent = `선체 ${fmt(b.hull)}/${fmt(b.d.hullMax)}`;
    $('energy-txt').textContent = `에너지 ${fmt(b.energy)}`;
    $('data-txt').textContent = `데이터 +${fmt(b.data)}`;
    for (const u of E.INRUN) {
      const el = $('iu-' + u.id), c = E.inrunCost(b.inrun[u.id]);
      el.querySelector('span').textContent = fmt(c); el.disabled = b.energy < c;
    }
    for (const k of ['rail', 'emp']) {
      const w = b.weapons[k], el = $('w-' + k), ring = $('w-' + k + '-ring');
      el.disabled = !w.unlocked; el.classList.toggle('ready', w.unlocked && w.cd <= 0);
      ring.setAttribute('stroke-dashoffset', String(w.unlocked ? 182.2 * (w.cd / (w.max * b.d.cdMul)) : 182.2));
    }
    const names = b.cardsTaken.map(id => E.CARDS.find(c => c.id === id).name);
    $('cards-txt').textContent = '전술 카드: ' + (names.length ? names.join(', ') : '없음');
  }

  function frame(t) {
    raf = requestAnimationFrame(frame);
    const rawDt = (t - last) / 1000, dt = Math.min(0.1, rawDt); last = t;
    ftAvg = ftAvg * 0.92 + Math.min(200, rawDt * 1000) * 0.08;
    if (!lite && ftAvg > 26) { if (!liteSince) liteSince = t; else if (t - liteSince > 800) { lite = true; save.settings.lite = true; persist(); } } else if (!lite) liteSince = 0;
    if (battle) {
      if (!battle.paused) {
        const tscale = slowmo > 0 ? 0.25 : 1; slowmo = Math.max(0, slowmo - dt);
        acc += dt * speed * tscale;
        let n = 0;
        const h0 = battle.hull;
        while (acc >= E.TICK && n < 24) { battle.step(); acc -= E.TICK; n++; if (battle.paused) { acc = 0; break; } }
        if (h0 - battle.hull > battle.d.hullMax * 0.08) addShake(1);
      }
      for (const f of fx) f.t += dt;
      shake = Math.max(0, shake - dt * 6); shieldT = Math.max(0, shieldT - dt);
      if (combo.t > 0) { combo.t -= dt; if (combo.t <= 0) combo.n = 0; }
      handleEvents();
      if (battle) hudUpdate();
    }
    draw(t / 1000);
  }

  // test hooks (used by automated tests only)
  window.SZP = {
    get battle() { return battle; }, get save() { return save; },
    setSpeed(v) { speed = v; }, fastForward(sec) { if (battle) { for (let i = 0; i < sec / E.TICK && battle && !battle.over && !battle.paused; i++) battle.step(); handleEvents(); } },
    persist, awayFor(ms) { save.lastSeen = now() - ms; accrueOffline(); maybeShowOffline(); }, skipPrologue() { endPrologue(true); }, get prologue() { return prologue; }, get recording() { return recording; }, testTools: NCQ_TEST_TOOLS
  };

  // boot
  syncSound(); if (save.settings.lite) lite = true;
  if (save.tutorial === 0 && !save.prologueDone) startPrologue(); else if (save.tutorial === 0) startRun(); else openBase('yard');
})();
</script>
