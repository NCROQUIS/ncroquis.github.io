<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><script src="ncq-flags.js"></script><script src="ncq-ads.js"></script><script src="ncq-iap.js"></script><script src="ncq-feedback.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f2">
<title>날씨냥</title>
  <script type="module" crossorigin src="./assets/index-D7gxgBJg.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-C5OgN8Rt.css">
</head>
<body>
<!-- 화면마다 메인 버튼에 data-ncq-main, 메인 버튼이 없는 화면에는 data-ncq-no-main (ncq/safe.js, 출시 빌드의 화면 확인) -->
<div id="lock" role="button" tabindex="0" aria-label="날씨냥 열기" data-ncq-no-main>
  <div class="l-date" id="lDate"></div>
  <div class="l-time" id="lTime"></div>
  <div class="widget">
    <div class="w-ico" id="wIco"></div>
    <div class="w-main">
      <div class="w-temp" id="wTemp">--°</div>
      <div class="w-meta" id="wMeta">날씨를 불러오는 중</div>
    </div>
    <div class="w-cat" id="wCat"></div>
    <div class="w-line"><span class="say-track" id="wLine">잠깐만 기다리라냥.</span></div>
  </div>
  <div class="l-hint">잠금화면 위젯 미리보기 · 탭해서 열기</div>
</div>

<main id="app" data-ncq-no-main>
  <header class="head">
    <div class="eyebrow">A LITTLE WEATHER, A LITTLE PURR</div>
    <h1 id="headline">오늘 하루도, 포근하냥.</h1>
    <p class="lede">나가기 전, 하늘도 보고 냥이도 보고.</p>
    <div class="head-actions">
      <button id="toLock" class="ghost" aria-label="잠금화면 위젯 미리보기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 18h4"/></svg></button>
      <button id="music" class="ghost" aria-label="배경음악 끄기" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/><path class="mute-line" d="M3 3l18 18"/></svg></button>
      <button id="refresh" class="ghost" aria-label="새로고침"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    </div>
  </header>

  <section class="hero" aria-label="현재 날씨">
    <div class="hero-top">
      <button id="placeBtn" class="place"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/></svg><span id="placeName">위치 확인 중</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
      <span class="pill" id="pill">불러오는 중</span>
    </div>
    <div class="hero-body">
      <div class="hero-text">
        <div class="now-temp" id="nTemp">--°</div>
        <div class="now-label" id="nLabel">-</div>
        <div class="now-sub" id="nSub"></div>
      </div>
      <div class="hero-art">
        <div id="art"></div>
        <button class="cat-btn" id="cat" aria-label="고양이를 톡 치면 농담을 해요"></button>
        <button class="dress" id="dressBtn">꾸미기</button>
      </div>
    </div>
    <div class="hero-foot">
      <div class="say-top"><span class="say-mark" id="catName">냥</span><span class="new-tag" id="newTag" hidden>NEW</span><span class="tip" id="tip"></span></div>
      <p class="say" id="say" aria-live="polite"><span class="say-track" id="joke">잠깐만 기다리라냥.</span></p>
    </div>
  </section>

  <div class="notice" id="notice" hidden></div>

  <button class="book-card" id="bookBtn" aria-label="대사 도감 열기">
    <span class="book-top"><span class="book-title">대사 도감</span><span class="book-count" id="bookCount">0 / 0</span></span>
    <span class="book-bar"><i id="bookBar"></i></span>
    <span class="book-sub" id="bookSub">시간과 날씨에 따라 고양이가 다른 말을 해요</span>
  </button>

  <section class="card">
    <div class="card-head"><h2>시간별 날씨</h2><span>오늘, 하늘의 흐름</span></div>
    <div class="hourly" id="hourly"></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>7일 예보</h2><span>이번 주 기온</span></div>
    <div class="week" id="week"></div>
  </section>

  <section class="grid" id="grid" aria-label="상세 정보"></section>

  <p class="credit">날씨 데이터 Open-Meteo · <span id="updated"></span></p>
  <div class="home-ad" id="homeAd" hidden></div>
  <div class="reset" id="resetBox" hidden>
    <button class="text-btn" id="resetBtn">처음부터 다시 하기 (초기화)</button>
    <div class="reset-confirm" id="resetConfirm" hidden role="alertdialog" aria-labelledby="resetQ">
      <p id="resetQ">입양한 고양이, 지역, 음악 설정을 모두 지우고 처음 화면으로 돌아갈까요?</p>
      <div class="reset-actions">
        <button class="btn-sub" id="resetNo">취소</button>
        <button class="btn-danger" id="resetYes" data-ncq-main="초기화">초기화</button>
      </div>
    </div>
  </div>
  <p class="app-version" id="appVersion"></p>
</main>

<section class="adopt" id="adopt" data-wx="sun" hidden aria-labelledby="adoptTitle">
  <div class="adopt-scroll" id="adoptScroll">
  <div class="adopt-inner">
    <div class="adopt-head">
      <div class="eyebrow" id="adoptEyebrow">날씨냥 입양하기</div>
      <h1 id="adoptTitle">나만의 날씨냥을 만들어요</h1>
      <p class="lede" id="adoptLede"></p>
    </div>
    <div class="adopt-stage">
      <svg class="adopt-bg" viewBox="0 0 400 300" aria-hidden="true"><circle cx="200" cy="150" r="128" class="h-halo1"/><circle cx="70" cy="66" r="34" class="h-sun"/><g class="h-cloud"><circle cx="120" cy="252" r="40"/><circle cx="188" cy="230" r="54"/><circle cx="262" cy="242" r="46"/><circle cx="308" cy="262" r="30"/><rect x="120" y="252" width="188" height="48"/></g></svg>
      <div class="adopt-cat" id="adoptCat"></div>
    </div>
    <div class="adopt-name">
      <label for="catNameInput">이름</label>
      <input id="catNameInput" maxlength="8" autocomplete="off" placeholder="예: 모카">
    </div>
    <div class="tabs" role="tablist" id="partTabs"></div>
    <div class="tiles" id="partTiles" role="tabpanel"></div>
    <button class="text-btn" id="adoptReset">기본 고양이로 되돌리기</button>
  </div>
  </div>
  <div class="adopt-bar">
    <button class="btn-sub" id="adoptRandom">랜덤으로 뽑기</button>
    <button class="btn-main" id="adoptDone" data-ncq-main="입양하기">입양하기</button>
  </div>
</section>

<section class="book" id="book" hidden aria-labelledby="bookTitle" data-ncq-no-main>
  <div class="book-inner">
    <div class="book-head">
      <div>
        <div class="eyebrow">COLLECTION</div>
        <h1 id="bookTitle">대사 도감</h1>
        <p class="lede" id="bookLede"></p>
      </div>
      <button class="ghost close" id="bookClose" aria-label="도감 닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="book-list" id="bookList"></div>
  </div>
</section>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet-card" role="dialog" aria-label="지역 선택" data-ncq-no-main>
    <h2>지역 선택</h2>
    <button class="loc-btn" id="useGps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/></svg>현재 위치 사용</button>
    <div class="cities" id="cities"></div>
  </div>
</div>

</body>
</html>
