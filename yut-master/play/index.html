<title>윷놀이 마스터</title>
<style>
@font-face{font-family:"KJCMyungjo";src:url("assets/KimjungchulMyungjo-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
:root{
  --fontThick:0px; /* 글자 두께 보강(외곽선), 0이면 끔 */
  --paper:#efe7d6; --paper2:#e4d8bf; --ink:#2a2420; --ink2:#4a3f36; --line:#3a2f28;
  --red:#b3261e; --gold:#c9a24a; --wood:#5a3d28; --wood2:#3e2a1b;
  --p0a:#5a5a5a; --p0b:#111; --p1a:#ff7a6c; --p1b:#b3261e;
  font-size:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html:not([lang]) [data-i18n]{visibility:hidden}
html,body{margin:0;height:100%;background:#d9cdb4;color:var(--ink);font-family:"KJCMyungjo","AppleMyungjo","Noto Serif KR",serif;line-height:1.35;-webkit-text-stroke:var(--fontThick) currentColor;word-break:keep-all;font-synthesis:none}
button{font:inherit;line-height:1.2;color:inherit}
.serif{font-family:"KJCMyungjo","AppleMyungjo","Noto Serif KR",serif}
#app{position:relative;width:100%;max-width:560px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(120% 80% at 20% 10%,#f7f1e4,var(--paper) 55%,var(--paper2));
  padding:var(--ncq-top) var(--ncq-right) var(--ncq-bottom) var(--ncq-left)}
#app.inGame{background:url("assets/board/lobby_bottom.png") center bottom/100% auto no-repeat,url("assets/board/lobby_top.jpg") center top/100% auto no-repeat,#ecdecd;isolation:isolate}   /* 게임 배경: 로비와 같은 그림·색 */
#app.inGame::before{display:none}
#app.inLobby{background:linear-gradient(#252018,#252018) center bottom/100% calc(min(100vw,560px)*.19 + var(--ncq-bottom,0px) + 4px) no-repeat,url("assets/board/lobby_top.jpg") center top/100% auto no-repeat,#ecdecd}   /* 로비 배경: 위쪽 그림 + 하단 메뉴 아래쪽 어두운 바닥(#252018) */   /* 로비 배경: 위쪽 그림(아래 끝 색이 #ecdecd라 이어져요) */
#app.inGame::before{content:"";position:absolute;inset:-8px;z-index:-1;pointer-events:none;
  background:url("assets/board/bg1.jpg") center top/cover no-repeat;filter:blur(3px) brightness(.85)}   /* 게임 안 배경 그림: 3px 흐림 + 85% 밝기 (show()가 inGame 클래스를 붙여요) */
/* 화면은 하나만 보여요 (타이틀 · 로비 · 인게임) */
.view{display:none;flex:1 1 auto;min-height:0;min-width:0;flex-direction:column}
.view.on{display:flex}

/* ===== 타이틀 ===== */
#vTitle{position:relative;align-items:center;justify-content:center;gap:28px;overflow:hidden}
#vTitle .mount{position:absolute;left:0;right:0;bottom:0;width:100%;height:46%;opacity:.55;pointer-events:none}
#vTitle .cloud{position:absolute;top:8%;left:-10%;width:120%;height:30%;opacity:.35;pointer-events:none}
.logo{position:relative;text-align:center;z-index:1}
.logo .ring{width:min(72vw,300px);aspect-ratio:1;border-radius:50%;border:10px solid rgba(42,36,32,.85);border-right-color:rgba(42,36,32,.25);
  display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg)}
.logo .ring>*{transform:rotate(8deg)}
.logo h1{margin:0;font-size:clamp(36px,11vw,54px);line-height:1.1;letter-spacing:4px;font-weight:900;color:var(--ink);white-space:pre-line;text-align:center}
.logo .seal{display:inline-block;margin-top:6px;background:var(--red);color:#fff;font-size:13px;padding:3px 8px;border-radius:3px;font-weight:700}
.sticks-logo{position:absolute;top:-34px;left:50%;transform:translateX(-50%);width:120px;height:70px}
.sticks-logo i{position:absolute;left:50%;top:0;width:22px;height:78px;margin-left:-11px;border-radius:11px;background:linear-gradient(90deg,#e8c98f,#d4a85e);border:2px solid #8b6a3a}
.sticks-logo i:first-child{transform:rotate(-38deg)} .sticks-logo i:last-child{transform:rotate(38deg)}
.btn-start{position:relative;z-index:1;flex:none;width:128px;height:128px;border-radius:50%;border:none;cursor:pointer;
  background:radial-gradient(ellipse 80% 30% at 50% 92%,rgba(42,36,32,.85) 0 55%,transparent 60%),#f6f0e3;
  box-shadow:inset 0 0 0 4px #f6f0e3,inset 0 0 0 6px var(--ink2),0 0 0 4px var(--ink),0 10px 20px rgba(0,0,0,.25);
  font-size:24px;font-weight:900;color:var(--ink);line-height:1.15;padding:0 12px 16px}
.btn-start:active{transform:scale(.96)}
.ver{position:absolute;bottom:6px;right:10px;font-size:11px;opacity:.45;z-index:1}

/* ===== 공통 프레임 ===== */
.scroll{background:linear-gradient(#f5eedf,#e9dec6);border:3px solid var(--ink2);border-radius:10px;box-shadow:inset 0 0 0 2px #f9f5ec,0 4px 10px rgba(0,0,0,.18);position:relative}
.scroll::before,.scroll::after{content:"";position:absolute;top:-6px;bottom:-6px;width:10px;background:linear-gradient(90deg,#2a2420,#5a4a3e,#2a2420);border-radius:4px}
.scroll::before{left:-8px} .scroll::after{right:-8px}
.avatar{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:900;color:#fff;border:3px solid var(--ink2);box-shadow:0 2px 4px rgba(0,0,0,.25)}
.av0{background:radial-gradient(circle at 35% 30%,#7a7a7a,#1a1a1a)}
.av1{background:radial-gradient(circle at 35% 30%,#ff8f80,#8d1c15)}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.coin{display:inline-block;width:24px;height:24px;background:url("assets/ui/image_gamemoney.png") center/contain no-repeat;position:relative;vertical-align:-6px}   /* 게임머니(엽전) 아이콘 */
.coin::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;background:#7a5a1a}

/* ===== 로비 ===== */
#vLobby{gap:12px;padding:10px 14px 0}
.profile{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:0 6px}
.profile .info{flex:1;min-width:0}
.profile .nick{font-size:22px;font-weight:800}
.profile .rec{font-size:14px;color:var(--ink2)}
.purse{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.pill{background:var(--ink);color:#f3e6c4;border-radius:16px;padding:3.5px 14px 3.5px 7px;font-weight:800;display:flex;gap:7px;align-items:center;font-size:18.4px}   /* 보유 재화: 이전보다 15% 크게 */
.pill .coin{width:27.6px;height:27.6px}
.iconbtn{width:38px;height:38px;border-radius:50%;border:2px solid var(--ink2);background:#f6f0e3;font-size:18px;cursor:pointer}
#btnSettings{width:44px;height:44px;padding:0;border:0;background:url("assets/ui/menu/option.png") center/contain no-repeat;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}   /* 설정 버튼 그림 */
#btnSettings:active{transform:translateY(1px)}
.lobby-main{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:12px;padding:2px 6px 10px}
.mode{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;background:linear-gradient(#f6efe0,#eadfc7);border:3px solid var(--ink);box-shadow:inset 0 0 0 3px #d9c79f,0 4px 0 rgba(0,0,0,.25)}
.mode .txt{flex:1;min-width:0;text-align:center}
.mode h3{margin:0;font-size:28px;font-weight:900}
.mode p{margin:2px 0 0;font-size:14px;color:var(--ink2);font-weight:700;overflow-wrap:anywhere}
.mode .badge{display:inline-block;background:var(--ink2);color:#f3e6c4;font-size:12px;border-radius:10px;padding:2px 8px;margin-bottom:4px}
.enter{flex:none;width:115px;height:auto;aspect-ratio:481/269;padding:0;border:0;border-radius:999px;cursor:pointer;color:#f6e7c1;font-size:24px;font-weight:400;
  background:url("assets/ui/button02.png") center/100% 100% no-repeat;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}   /* 입장 버튼 그림: assets/ui/button02.png */
.enter:active{transform:translateY(2px)}
.mode.off{opacity:.55}
.mode.off .enter{filter:grayscale(1) drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.mode.small{flex-direction:column;align-items:stretch;text-align:center;gap:6px;padding:10px 12px}
.mode.small h3{font-size:18px;overflow-wrap:anywhere}
.mode.small .enter{width:auto;height:44px;font-size:17px}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:linear-gradient(#3a2f28,#221c18);border-top:3px solid var(--gold);margin:0 -14px;padding:6px 4px}
.tab{background:none;border:none;color:#e9d7a8;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:18.5px;line-height:1.1;font-weight:700;cursor:pointer;padding:4px 0}
.tab .tabIco{display:block;width:83px;height:83px;margin:-8px 0 -6px;background:center/contain no-repeat;opacity:.7;filter:saturate(.75) brightness(.65);transition:transform .15s,opacity .15s}   /* 하단 메뉴 아이콘: assets/ui/menu (고르지 않은 메뉴는 35% 어둡게) */
.tab.on .tabIco{opacity:1;filter:none;transform:scale(1.1)}
.tab.on{color:#fff}

/* ===== 인게임 ===== */
#vGame{padding:8px 12px 10px;gap:8px}
.ghead{display:flex;align-items:center;gap:8px;padding:8px 12px;margin:0 6px}
.gp{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.gp.r{flex-direction:row-reverse;text-align:right}
.gp .avatar{width:48px;height:48px;font-size:20px}
.gp .nm{font-weight:800;font-size:16px}
.gp .sub{font-size:12px;color:var(--ink2)}
.gp.turn .avatar{box-shadow:0 0 0 3px var(--gold),0 0 12px var(--gold)}
.vs{flex:none;font-weight:900;color:var(--red);font-size:18px}
.trays{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.trayBox{display:flex;flex-direction:column;gap:4px}
.trayBox .cnt{font-size:13px;font-weight:700;padding:0 4px}
.trayBox.r .cnt{text-align:right}
.tray{display:flex;justify-content:center;align-items:center;gap:4%;padding:8px 6px;border-radius:8px;background:linear-gradient(#6b4a32,var(--wood2));border:3px solid #2a1c12;box-shadow:inset 0 2px 4px rgba(0,0,0,.5);transition:box-shadow .2s}
.tray.turn{box-shadow:inset 0 2px 4px rgba(0,0,0,.5),0 0 0 3px var(--gold)}
.stone{width:20%;aspect-ratio:1;border-radius:50%;box-shadow:0 2px 2px rgba(0,0,0,.5)}
/* 말 그림: 내 말(왼쪽) 검정, 상대(오른쪽) 빨강 — assets/pieces/ */
.stone.s0{background:url(assets/pieces/blue.png) center/100% no-repeat}
.stone.s1{background:url(assets/pieces/red.png) center/100% no-repeat}
.stone.empty{background:rgba(0,0,0,.25);box-shadow:inset 0 2px 3px rgba(0,0,0,.5);margin:0;padding:0;border:0;border-radius:50%}   /* 공통 .empty(점선 상자) 스타일이 섞이지 않게 */
.stone.done{background:url(assets/pieces/clear.png) center/contain no-repeat;box-shadow:none;border:0}   /* 골인한 말 표시 */
/* 고를 수 있는 말: 말은 그대로, 주변 금색 글로우만 커졌다 작아졌다 */
.stone.can{position:relative;cursor:pointer}
.stone.can::after,.tok.can .disc:last-child::after{content:"";position:absolute;inset:-1px;border-radius:50%;pointer-events:none;
  box-shadow:0 0 0 2px var(--gold),0 0 5px 2px rgba(242,182,50,.7);animation:glow .9s ease-in-out infinite alternate}   /* 말 크기에 딱 맞는 글로우 */
@keyframes glow{from{transform:scale(1);opacity:.55}to{transform:scale(1.05);opacity:1}}
.stone.sel{outline:3px solid #fff;outline-offset:1px;position:relative;z-index:1;cursor:pointer;
  box-shadow:0 10px 12px rgba(0,0,0,.55),0 3px 4px rgba(0,0,0,.35);animation:stoneSel .22s cubic-bezier(.3,1.6,.5,1) forwards}   /* 고른 대기 말: 1.15배로 떠 보이게 */
@keyframes stoneSel{from{transform:scale(1) translateY(0)}to{transform:scale(1.15) translateY(-3px)}}
.boardArea{flex:1 1 auto;min-height:0;display:flex;align-items:flex-start;justify-content:center}
#boardWrap{position:relative;aspect-ratio:1;touch-action:none}
#boardWrap::before{content:"";position:absolute;inset:-1.92%;background:url("assets/board/board.png") center/100% 100% no-repeat;filter:drop-shadow(0 4px 8px rgba(0,0,0,.22));pointer-events:none}   /* 판 배경 그림: 칸이 테두리 장식에 닿지 않게 조금 크게 */
#board,#layer,#targets{position:absolute;inset:0;width:100%;height:100%}
.tok{position:absolute;width:9.91%;height:9.91%;transform:translate(-50%,-50%);transition:left .17s ease,top .17s ease;z-index:5;cursor:pointer}
.tok .disc{transition:transform .08s ease-out, translate .4s cubic-bezier(.2,1.25,.4,1)}
.tok.hopping,.tok.flying{z-index:6}
/* 대기석 → 출발점: 크기가 곡선처럼 — 빨리 커져서 1.35배 근처를 유지하다가 끝에서 내려와요 */
.tok.flying .disc{animation:flyScale var(--hop,.38s) linear forwards;box-shadow:0 8px 10px rgba(0,0,0,.35)}
@keyframes flyScale{
  0%{transform:scale(1);animation-timing-function:cubic-bezier(.2,.7,.3,1)}
  45%{transform:scale(1.32);animation-timing-function:ease-in-out}
  72%{transform:scale(1.35);animation-timing-function:cubic-bezier(.5,0,.9,.6)}
  100%{transform:scale(1.03)}}
.tok.hopping .disc{transform:scale(var(--hopScale,1.05));box-shadow:0 6px 8px rgba(0,0,0,.35);transition:transform var(--hop,.17s) ease-in, translate .4s cubic-bezier(.2,1.25,.4,1)}
.tok.moving,.tok.grow{z-index:6}
.tok.caught{z-index:4}   /* 잡힌 말은 잡는 말 아래에 깔린 채 흔들리다 빠져나가요 */
.tok.caught .disc{transition:transform .2s ease-out;filter:brightness(1.2) saturate(1.2)}
@keyframes caughtShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px) rotate(-6deg)}40%{transform:translateX(4px) rotate(6deg)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.tok.caught.fly{transition-timing-function:cubic-bezier(.3,.1,.3,1)}
.tok.caught.fly .disc{animation:none;transform:scale(.8);transition:transform .5s ease-in;filter:none;opacity:.95}
.tok.grow .disc{transform:scale(1.05);box-shadow:0 6px 8px rgba(0,0,0,.35)}
#fxLayer{position:absolute;inset:0;pointer-events:none;z-index:4}
.fx-ring{position:absolute;width:9.91%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(.7);border:3px solid rgba(201,162,74,.8);animation:fxRing .5s ease-out forwards}
@keyframes fxRing{to{transform:translate(-50%,-50%) scale(1.7);opacity:0;border-width:1px}}
.fx-dot{position:absolute;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:rgba(120,95,60,.55);animation:fxDot .45s ease-out forwards}
@keyframes fxDot{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.tok .disc{position:absolute;inset:0;border-radius:50%;box-shadow:0 3px 3px rgba(0,0,0,.45)}
.tok.p0 .disc{background:url(assets/pieces/blue.png) center/100% no-repeat}
.tok.p1 .disc{background:url(assets/pieces/red.png) center/100% no-repeat}
/* 판 위 고를 수 있는 말도 대기석과 같은 글로우 (맨 앞 말에) */
.tok.sel{z-index:6}
.tok.sel .disc{outline:3px solid #fff;outline-offset:1px;box-shadow:0 10px 12px rgba(0,0,0,.5),0 3px 4px rgba(0,0,0,.35);animation:stoneSel .22s cubic-bezier(.3,1.6,.5,1) forwards}
.tgt{position:absolute;transform:translate(-50%,-50%);z-index:8;background:var(--gold);color:var(--ink);font-weight:800;font-size:13px;border-radius:10px;padding:4px 8px;border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.35);cursor:pointer;white-space:nowrap;animation:pop .2s}
.tgt.cap{background:var(--red);color:#fff}
.tgt.fin{background:#2f8f55;color:#fff}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.4)}to{transform:translate(-50%,-50%) scale(1)}}
#sticks{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:20;background:rgba(42,36,32,.35);border-radius:6px}
#sticks.show{display:flex}
.srow{display:flex;gap:10px;--h:100px}
@keyframes toss{0%{transform:translateY(40px) scale(.9)}45%{transform:translateY(calc(-1 * var(--h))) scale(1.18)}100%{transform:translateY(0) scale(1)}}
@keyframes land{0%{transform:translateY(0) scale(1.06,.94)}60%{transform:translateY(-6px)}100%{transform:none}}
#throwBtn{overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#throwBtn .gauge{position:absolute;left:4%;top:10%;bottom:10%;width:92%;border-radius:999px;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .15s}
#throwBtn .gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,rgba(242,182,50,.35),rgba(242,182,50,.9))}
#throwBtn.charging .gauge{opacity:1}
#throwBtn.full .gauge i{animation:gaugeFull .25s ease-in-out infinite alternate}
@keyframes gaugeFull{to{filter:brightness(1.35)}}
#throwBtn #throwLabel{position:relative;top:-.08em}   /* 글꼴이 아래로 쏠려 보여서 살짝 위로 */
#throwBtn #throwLabel::before{content:"";position:absolute;right:100%;top:50%;width:1.45em;height:1.3em;margin:calc(-.65em + .08em) .3em 0 0;background:url("assets/ui/button00_image%202.png") center/contain no-repeat}   /* 윷 아이콘: 가운데 글자 바로 왼쪽 */
#throwBtn #throwLabel.long{font-size:.8em;letter-spacing:-.02em}   /* 한 번 더 던지기: 버튼 그림 안에 들어가게 */
#throwBtn.charging{transform:scale(.97)}
.stick{width:24px;height:110px;border-radius:12px;position:relative}
.stick.flat{background:linear-gradient(90deg,#f8edd4,#e9d4a8);border:2px solid #9b6b42}
.stick.round{background:linear-gradient(90deg,#7a4a26,#b37a47 50%,#7a4a26);border:2px solid #5a3418}
.stick.mark.flat::after{content:"X";position:absolute;top:44%;left:0;right:0;text-align:center;font-weight:900;color:var(--red)}
.stick.spin{animation:spin .12s linear infinite}
@keyframes spin{0%{transform:rotateY(0) translateY(0)}50%{transform:rotateY(90deg) translateY(-14px)}100%{transform:rotateY(180deg) translateY(0)}}
#resText{font-size:84px;font-weight:400;line-height:1;color:#111;-webkit-text-stroke:3px #111;text-shadow:5px 0px 0 #fff,-5px 0px 0 #fff,0px 5px 0 #fff,0px -5px 0 #fff,4px 4px 0 #fff,-4px 4px 0 #fff,4px -4px 0 #fff,-4px -4px 0 #fff,5px 2px 0 #fff,-5px 2px 0 #fff,5px -2px 0 #fff,-5px -2px 0 #fff,2px 5px 0 #fff,-2px 5px 0 #fff,2px -5px 0 #fff,-2px -5px 0 #fff,0 6px 10px rgba(0,0,0,.25);min-height:90px}   /* 윷 결과: 굵은 검정 + 흰 외곽선 (이전의 1.5배) */

.vsBig{width:clamp(96px,30vw,140px);aspect-ratio:131/134;background:url("assets/ui/vs.png") center/contain no-repeat;font-size:0!important;color:transparent;text-shadow:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}   /* 대기 화면 VS: vs.png */
.btn-go{width:52%;height:auto;aspect-ratio:454/140;justify-content:center;gap:0;padding:0;border:0;border-radius:999px;box-shadow:none;

.pickVs{position:absolute;left:50%;top:20%;width:22%;aspect-ratio:131/134;translate:-50% -50%;background:url("assets/ui/vs.png") center/contain no-repeat;opacity:0;scale:2.2;pointer-events:none;z-index:2;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}

#pickOverlay,#vsOverlay{inset:.6% .5% 1.2% 1.1%;border-radius:5%}   /* 흰 막: 판 그림 안쪽 면과 같은 위치·둥근 모서리 */
.tabbar{background:none;border:32px solid transparent;border-image:url("assets/ui/menu/menubg.png") 45 45 45 45 fill / 32px stretch;margin:0 -10px 4px;padding:0}   /* 하단 메뉴 틀: 나인슬라이스 Top·Bottom·Left·Right 45 (모서리 고정, 가운데·변은 늘림) */
.tabbar{column-gap:16px}   /* 메뉴 사이 간격 */
.tabbar .tab{padding:0;position:relative;min-width:0}
.tabbar .tab .tabIco{width:min(70px,82%);height:auto;aspect-ratio:1}   /* 메뉴 높이 -10%: 아이콘을 칸 폭의 82%로 */
.tabbar .tab+.tab::before{content:"";position:absolute;left:-8.75px;top:14%;bottom:14%;width:1.5px;background:linear-gradient(transparent,rgba(201,162,90,.55) 20%,rgba(201,162,90,.55) 80%,transparent);pointer-events:none}   /* 메뉴 사이 구분선 */
/* 하단 메뉴 비율 맞춤: 메뉴 폭(--tw) 기준으로 틀 두께 4.5%, 아이콘 11.5%, 글자 3.1% */
.tabbar{--tw:min(100vw,560px);border-width:calc(var(--tw)*.026) calc(var(--tw)*.05) calc(var(--tw)*.033);border-image-width:calc(var(--tw)*.07)}   /* 틀 두께 .07(두껍게), 위아래 여백은 줄임 */
.tabbar .tab{gap:0;font-size:max(12px,calc(var(--tw)*.033))}
.tabbar .tab .tabIco{width:calc(var(--tw)*.13);margin:-2px 0 -3px}   /* 아이콘: 시안 크기 */
.tabbar .tab.on .tabIco{transform:scale(1.06)}
.tabbar .tab:not(.on):not(.locked) .tabIco{opacity:.9;filter:saturate(.85) brightness(.85)}   /* 열린 메뉴(규칙): 조금 더 밝게 */
.tabbar .tab.locked .tabIco{position:relative;opacity:.85}   /* 아직 열리지 않은 메뉴(상점·랭킹): 아이콘 위에 자물쇠 (자물쇠는 메뉴 칸에 붙여 아이콘의 어둡게 효과를 받지 않게) */
.tabbar .tab.locked::after{content:"";position:absolute;left:50%;top:calc(var(--tw)*.13*.68 - 2px);width:calc(var(--tw)*.13*.4);aspect-ratio:44/57;translate:-50% -50%;z-index:1;pointer-events:none;background:url("assets/ui/lock.png") center/contain no-repeat;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.tabbar .tab.locked>span{opacity:.5}   /* 잠긴 메뉴 글자: 50% 투명 */
.tabbar{position:relative}
#vLobby .tabbar::before{content:"";position:absolute;left:50%;translate:-50% 0;bottom:calc(100% + var(--tw)*.044 - 2px);width:var(--tw);aspect-ratio:717/177;background:url("assets/board/lobby_bottom.png") center bottom/100% 100% no-repeat;z-index:-1;pointer-events:none}   /* 로비 아래 배경: 메뉴 바로 위에 붙여요 */

<body>
<div id="app" class="inLobby">

  <!-- ===== 1. 타이틀 ===== -->
  <!-- 프로토타입: 타이틀은 숨기고 바로 로비로 시작해요 (SKIP_TITLE) -->
  <section class="view" id="vTitle">
    <svg class="cloud" viewBox="0 0 400 100" preserveAspectRatio="none"><path d="M0 70 Q40 30 80 55 Q110 20 160 50 Q200 10 250 45 Q300 15 340 50 Q370 35 400 60 L400 100 L0 100Z" fill="#cfc4ae"/></svg>
    <svg class="mount" viewBox="0 0 400 200" preserveAspectRatio="none">
      <path d="M0 200 L0 120 L50 70 L90 110 L140 40 L200 120 L240 90 L300 150 L340 80 L400 130 L400 200Z" fill="#9c917f" opacity=".6"/>
      <path d="M0 200 L0 160 L70 110 L120 150 L180 100 L250 170 L310 120 L400 170 L400 200Z" fill="#6d6458"/>
    </svg>
    <div class="logo serif">
      <div class="sticks-logo"><i></i><i></i></div>
      <div class="ring"><h1 data-i18n="title">윷놀이 마스터</h1><span class="seal" data-i18n="subtitle">1:1 윷놀이</span></div>
    </div>
    <button class="btn-start serif" id="btnStart" data-ncq-main="게임 시작"><span data-i18n="start">게임 시작</span></button>
    <div class="ver app-version">dev</div>
  </section>

  <!-- ===== 2. 로비 ===== -->
  <section class="view on" id="vLobby">
    <div class="profile">
      <button class="avatar av0 avbtn" id="lbAvatar" aria-label="profile"></button>
      <div class="info"><div class="nick ellip serif" id="lbNick"></div><div class="rec ellip" id="lbRec"></div><div class="rec ellip" id="lbRec2"></div></div>
      <div class="purse"><div class="pill"><span class="coin"></span><span id="lbCoin">0</span></div><button class="iconbtn" id="btnSettings" aria-label="settings"></button></div>
    </div>
    <div class="deco1" aria-hidden="true"></div>
    <div class="lobby-main">
      <!-- 로비 모드는 3개: 1vs1 · 2vs2 (방 목록) · AI 대전 -->
      <div class="mode">
        <i class="modeIco" style="background-image:url(assets/ui/mode/1v1.png)"></i>
        <div class="txt"><h3 class="serif" data-i18n="m_1v1">1vs1 대전</h3><p data-i18n="m_pvp_d">이기면 +8엽전 / 지면 -10엽전</p></div>
        <button class="enter" id="btn1v1" data-i18n="enter">입장</button>
      </div>
      <div class="mode">
        <i class="modeIco" style="background-image:url(assets/ui/mode/2v2.png)"></i>
        <div class="txt"><h3 class="serif" data-i18n="m_2v2">2vs2 대전</h3><p data-i18n="m_pvp_d">이기면 +8엽전 / 지면 -10엽전</p></div>
        <button class="enter" id="btn2v2" data-i18n="enter">입장</button>
      </div>
      <div class="mode">
        <i class="modeIco" style="background-image:url(assets/ui/mode/ai.png)"></i>
        <div class="txt"><span class="badge" id="lbAiCount"></span><h3 class="serif" data-i18n="m_ai">AI 대전</h3><p data-i18n="m_ai_d">승 +5엽전 / 패 0엽전</p></div>
        <button class="enter" id="btnAi" data-ncq-main="AI 대전 입장" data-i18n="enter">입장</button>
      </div>
    </div>
    <nav class="tabbar">
      <button class="tab on" data-tab="home"><i class="tabIco" style="background-image:url(assets/ui/menu/home.png)"></i><span data-i18n="t_home">홈</span></button>
      <button class="tab locked" data-tab="shop"><i class="tabIco" style="background-image:url(assets/ui/menu/shop.png)"></i><span data-i18n="t_shop">상점</span></button>
      <button class="tab locked" data-tab="rank"><i class="tabIco" style="background-image:url(assets/ui/menu/ranking.png)"></i><span data-i18n="t_rank">랭킹</span></button>
      <button class="tab" data-tab="rules"><i class="tabIco" style="background-image:url(assets/ui/menu/rules.png)"></i><span data-i18n="t_rules">규칙</span></button>
    </nav>
  </section>

  <!-- ===== 2-1. 1vs1 방 목록 ===== -->
  <section class="view" id="vRooms">
    <div class="subhead scroll">
      <button class="back" id="btnRoomsBack" aria-label="back"></button>
      <div class="ttl"><h2 class="serif" id="roomsTitle">1vs1 대전</h2><div class="onlineN" id="onlineN"></div></div>
      <div class="pill"><span class="coin"></span><span class="myCoin">0</span></div>
    </div>
    <div class="rooms-top">
      <button class="btn-red serif" id="btnCreate" data-ncq-main="방 만들기"><span data-i18n="create_room">방 만들기</span> <small data-i18n="host_win" style="font-size:13px;font-weight:700;opacity:.9">(방장으로 승리 시 +2엽전)</small></button>
      <button class="btn-red serif" id="btnSecret" data-i18n="secret_room">비밀방</button>
    </div>
    <div class="room-list" id="roomList"></div>
    <div class="net" id="netState"></div>
  </section>

  <!-- ===== 3. 인게임 ===== -->
  <section class="view" id="vGame">
    <!-- 상단 정보: 프레임 그림(infoframe) 안에 프로필 · 말 대기석 · 윷/모 횟수와 던진 결과 -->
    <div class="infoPanel">
    <div class="ghead" id="ghead">
      <div class="gp" id="gp0"></div><div class="vs"><span class="vsImg"></span><small id="watchN"></small></div><div class="gp r" id="gp1"></div>
    </div>
    <div class="trays">
      <div class="trayBox"><div class="tray" id="tray0"></div></div>
      <div class="trayBox r"><div class="tray" id="tray1"></div></div>
    </div>
    <div class="midrow"><div class="ym" id="ym0"></div><div id="results"></div><div class="ym r" id="ym1"></div></div>
    </div>
    <!-- 진행 안내 · 턴 시간: 판 바로 위 -->
    <div class="status serif"><span class="myTurnTag" id="myTurnTag" hidden data-i18n="my_turn">내 차례</span><div id="statusText"></div><div class="timer" id="timerBar"><i></i></div></div>
    <div class="boardArea" id="boardArea">
      <div id="boardWrap">
        <svg id="board" viewBox="0 0 100 100"></svg>
        <div id="layer"></div>
        <div id="fxLayer"></div>
        <div id="targets"></div>
        <!-- 윷 던지기: 판 아래쪽 가운데 (내 던지기 차례에만 보여요) -->
        <!-- 말을 고른 뒤 다른 말로 바꾸기 (판에 내 말이 하나라도 있을 때) -->
        <button id="btnReselect" class="serif" data-i18n="reselect" hidden>다른 말 선택하기</button>
        <button id="throwBtn" class="p0" data-ncq-main="윷 던지기"><span class="gauge"><i id="gaugeFill"></i></span><span id="throwLabel"></span></button>
        <div id="sticks"><div class="srow" id="srow"></div><div id="resText"></div></div>
        <div id="pickOverlay"><div class="pickVs" id="pickVs"></div><div class="pickFace l" id="pickFaceL"></div><div class="pickFace r" id="pickFaceR"></div><div class="pickText serif" id="pickText"></div><div class="pickStick" id="pickStick"><span>✕ ✕ ✕ ✕</span></div></div>
        <div id="vsOverlay"><div class="ovBtns" id="ovBtns" hidden><button class="btn-green serif" id="btnSwap" data-i18n="swap_team">팀바꾸기</button><button class="btn-green serif" id="btnInvite" data-i18n="invite">랜덤 초대</button></div><div class="vsBig serif">VS</div><div class="vsSub" id="vsSub"></div>
          <button class="btn-go serif" id="btnGo" data-ncq-main="시작하기"><span class="goLabel" data-i18n="start_game">시작하기</span></button></div>
      </div>
    </div>
    <div class="gfoot">
      <button class="btn-exit serif" id="btnExit" data-i18n="exit">나가기</button>
      <div class="testBtns" id="testBtns" hidden>
        <button class="btn-test" id="btnWin" data-i18n="win_test">승리</button>
        <button class="btn-test" id="btnLose" data-i18n="lose_test">패배</button>
        <button class="btn-test" id="btnNak" data-i18n="nak_test">낙 테스트</button>
      </div>
    </div>
  </section>

  <!-- ===== 팝업 ===== -->
  <div class="pop" id="popRules"><div class="card scroll">
    <h2 class="serif" data-i18n="m_rules">게임 규칙</h2>
    <div class="body" id="rulesBody"></div>
    <div class="btns"><button class="pri" data-close data-i18n="close">닫기</button></div>
  </div></div>
  <div class="pop" id="popExit"><div class="card scroll">
    <h2 class="serif" data-i18n="exit_q">대국을 나갈까요?</h2>
    <div data-i18n="exit_d">지금 나가면 패배로 기록돼요.</div>
    <div class="btns"><button data-close data-i18n="keep">계속하기</button><button class="pri" id="btnExitYes" data-i18n="exit">나가기</button></div>
  </div></div>
  <div class="pop" id="popResult"><div class="card scroll">
    <span class="resBadge" id="resBadge" hidden></span>
    <h2 class="serif" id="resTitle"></h2>
    <div id="resSub"></div>
    <div class="reward" id="resReward"></div>
    <div class="btns"><button id="btnToLobby" data-i18n="to_lobby">로비로</button><button class="pri" id="btnAgain" data-i18n="again">다시 하기</button></div>
  </div></div>
  <div class="pop" id="popSettings"><div class="card scroll">
    <h2 class="serif" data-i18n="settings">설정</h2>
    <div class="body">
      <label class="setrow"><span data-i18n="sfx">효과음</span><input type="checkbox" id="setSfx"></label>
      <label class="setrow" id="rowVib"><span data-i18n="vib">진동</span><input type="checkbox" id="setVib"></label>
      <label class="setrow" id="rowShake"><span data-i18n="shake_set">흔들어서 던지기</span><input type="checkbox" id="setShake"></label>
      <div class="setrow"><span data-i18n="version">버전</span><span class="app-version">dev</span></div>
    </div>
    <div class="btns"><button class="pri" data-close data-i18n="close">닫기</button></div>
  </div></div>
  <div class="pop" id="popSecret"><div class="card scroll">
    <h2 class="serif" data-i18n="secret_room">비밀방</h2>
    <div class="tabs2"><button class="on" data-st="make" data-i18n="secret_make">방 만들기</button><button data-st="join" data-i18n="secret_join">번호로 입장</button></div>
    <label class="field" id="fCode" hidden><span data-i18n="room_no">방 번호</span><input id="inCode" inputmode="numeric" maxlength="6" autocomplete="off"></label>
    <label class="field"><span data-i18n="password">비밀번호 (숫자 4자리)</span><input id="inPw" inputmode="numeric" maxlength="4" autocomplete="off"></label>
    <div class="btns"><button data-close data-i18n="cancel">취소</button><button class="pri" id="btnSecretGo" data-i18n="ok">확인</button></div>
  </div></div>
  <div class="pop" id="popProfile"><div class="card scroll pcard">
    <h2 class="serif" data-i18n="profile_title">프로필 선택</h2>
    <div class="body" id="profileBody"></div>
    <button class="xbtn" data-close aria-label="close">✕</button>
  </div></div>
  <!-- 윷 3D: 게임 화면 전체를 덮어 막대가 잘리지 않게 (팝업·알림보다는 아래) -->
  <div id="yut3dHost"></div>
  <div id="toast"></div>
</div>
