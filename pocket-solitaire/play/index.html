<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><script src="ncq-flags.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2f8a5b" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2f8a5b" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="언제 어디서나 가볍게 즐기는 정통 클론다이크 솔리테어. 탭 한 번 자동 이동, 무제한 되돌리기, 오늘의 도전.">
  <title>포켓 솔리테어 — 클래식 클론다이크 카드 게임</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a84ff'/%3E%3Crect x='17' y='11' width='30' height='42' rx='5' fill='%23fff'/%3E%3Ctext x='32' y='40' font-size='22' text-anchor='middle' fill='%23ff3b30' font-family='-apple-system,sans-serif'%3E%E2%99%A5%EF%B8%8E%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 아이콘 (SF Symbols 느낌의 선 아이콘) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.2" class="fill"/></symbol>
      <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3Z"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.6" class="fill"/><circle cx="12" cy="12" r="1.6" class="fill"/><circle cx="18.5" cy="12" r="1.6" class="fill"/></symbol>
      <symbol id="i-recycle" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.5h-4.5"/></symbol>
      <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3c.6 4.2 2.6 6.4 7 7-4.4.6-6.4 2.8-7 7-.6-4.2-2.6-6.4-7-7 4.4-.6 6.4-2.8 7-7Z" class="fill"/><path d="M19 15.5c.2 1.6 1 2.4 2.5 2.5-1.5.2-2.3 1-2.5 2.5-.2-1.5-1-2.3-2.5-2.5 1.5-.1 2.3-.9 2.5-2.5Z" class="fill"/></symbol>
      <symbol id="i-chevron-l" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
      <symbol id="i-chevron-r" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    </defs>
  </svg>

  <div id="app">
    <header class="topbar">
      <div class="stat"><span class="label">시간</span><span id="time">0:00</span></div>
      <div class="title" id="mode-title">클래식</div>
      <div class="stat right"><span class="label">이동</span><span id="moves">0</span></div>
    </header>

    <main id="board" aria-label="카드 테이블">
      <div class="slot stock-slot" id="stock-slot"><svg class="recycle"><use href="#i-recycle"/></svg></div>
      <div class="slot found-slot" data-f="0"><span>A</span></div>
      <div class="slot found-slot" data-f="1"><span>A</span></div>
      <div class="slot found-slot" data-f="2"><span>A</span></div>
      <div class="slot found-slot" data-f="3"><span>A</span></div>
      <div class="slot tab-slot" data-t="0"></div>
      <div class="slot tab-slot" data-t="1"></div>
      <div class="slot tab-slot" data-t="2"></div>
      <div class="slot tab-slot" data-t="3"></div>
      <div class="slot tab-slot" data-t="4"></div>
      <div class="slot tab-slot" data-t="5"></div>
      <div class="slot tab-slot" data-t="6"></div>
      <button class="auto-btn" id="auto-btn" hidden><svg><use href="#i-sparkle"/></svg>자동 완성</button>
    </main>

    <div class="ad-banner" id="ad-banner" aria-hidden="true"><span>광고</span></div>

    <nav class="toolbar">
      <button data-act="new"><svg><use href="#i-plus"/></svg><span>새 게임</span></button>
      <button data-act="daily"><svg><use href="#i-calendar"/></svg><span>오늘의 도전</span></button>
      <button data-act="hint"><svg><use href="#i-bulb"/></svg><span>힌트</span></button>
      <button data-act="undo"><svg><use href="#i-undo"/></svg><span>되돌리기</span></button>
      <button data-act="menu"><svg><use href="#i-more"/></svg><span>메뉴</span></button>
    </nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="modal" id="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="grabber" aria-hidden="true"></div>
      <div id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
